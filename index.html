c clove and chop all vegetables."}, {"t": "Poach chicken breast by placing into boiling water for 10 to 15 minutes or until cooked through. Drain then slice. Want to add flavour? Also add 1 garlic clove, salt, pepper and herb of choice (rosemary is great)."}, {"t": "Heat olive oil in fry pan on medium heat. Add minced garlic then cauliflower/mixed vegetable rice."}, {"t": "Cook for approximately 5-8 minutes or until tender (optional to add onion to the mix)."}, {"t": "Distribute cooked vegetable rice between two bowls and add rocket leaves."}, {"t": "Add tomato, capsicum and avocado to the bowl with pumpkin seeds."}, {"t": "Add sliced chicken breast and top chicken with mayonnaise, salt, pepper and herbs of your choice."}], "tips": [{"h": "Bec’s Tips", "t": "I used Birds eye frozen carrot, cauliflower and broccoli rice mix. Sub with cauliflower rice if you wish. Undivided Food Co or Gevity RX mayo are both great options. If you add the Mayo to the chicken while still warm, it melts into a delicious dressing for the salad. I love to add garlic and chilli powder to the chicken breast."}], "sources": ["Tribe recipe card – Week 37"], "kind": "card", "pesc_plan": false, "slots": [], "id": "low carb buddha bowl", "cats": ["Mains"], "tags": ["Chicken", "Tribe recipe card"]}, {"title": "Choc Mint Slice Biscuits", "serves": "12", "time": "35 min", "time_detail": "", "cal": "111", "fat": "9", "protein": "3", "netcarbs": "1", "fibre": "1", "ingredients": [{"t": "1 cup almond meal"}, {"t": "1/4 cup cacao powder"}, {"t": "1/3 cup stevia or sugar replacement"}, {"t": "1/8 tsp peppermint extract"}, {"t": "1/8 tsp salt"}, {"t": "2 tbsp almond milk"}, {"h": "Chocolate Coating"}, {"t": "80g dark chocolate"}, {"t": "2 tsp coconut oil"}, {"t": "1/4 tsp peppermint extract This recipe isn’t super high in protein and protein (eg 2 boiled eggs, 14 almonds, 1/2 cup greek yoghurt, 1 serve protein powder"}], "steps": [{"t": "Combine almond meal, cacao, stevia and salt in a mixing bowl."}, {"t": "Add mint extract and almond milk to the mixture, combine well into a dough. If the mix is too dry, add more almond milk, one teaspoon at a time until a dough forms."}, {"t": "Place dough in the freezer for 10 minutes and preheat oven to 180°C."}, {"t": "Remove dough from the freezer and roll out onto a clean bench or large, flat, chopping board. Use a cookie cutter or champagne glass to cut out round cookies from the dough. Place cookies on a baking tray and bake for 6-8 minutes and remove from"}, {"t": "the oven. The cookies will be very soft however they will harden as they cool."}, {"t": "Allow cookies to cool completely, transfer to a plate and into the freezer for 10 minutes."}], "tips": [{"h": "Bec’s Tips", "t": "While the cookies are in the freezer, prepare the chocolate coating by melting dark chocolate with 2 teaspoons of coconut oil and mint extract. only half the amount of calories that most Remove cookies from the freezer and use two forks to coat each cookie in of your snacks are. So, it’s more so a the chocolate topping. Place the coated cookies onto baking paper or a healthy after-dinner treat or a light snack cooling rack with baking paper or paper towels underneath (to catch the that you could also eat with another snack drips). that’s approx. 100 calories and higher in Place cookies in the fridge to set and serve once the chocolate coating has hardened. with some almond milk)."}], "sources": ["Tribe recipe card – Week 38"], "kind": "card", "pesc_plan": false, "slots": [], "id": "choc mint slice biscuits", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Keto Cauliflower Pizza", "serves": "2", "time": "50 min", "time_detail": "10 min 40 min 50 min", "cal": "375", "fat": "19", "protein": "28", "netcarbs": "10", "fibre": "5", "ingredients": [{"t": "3 cups cauliflower rice (350g)"}, {"t": "2 eggs"}, {"t": "1 cup parmesan cheese, divided into 2"}, {"t": "2 tsp ground flaxseed"}, {"t": "2 tbsp almond meal"}, {"t": "2 tbsp tomato paste"}, {"t": "10 olives (cut in half)"}, {"t": "1 tbsp red onion, finely sliced"}, {"t": "10 large basil leaves, torn into pieces"}, {"t": "½ tsp garlic powder"}, {"t": "½ tsp chili flakes (optional)"}, {"t": "Salt & pepper"}], "steps": [{"t": "Preheat oven to 190C."}, {"t": "Microwave cauliflower rice for 5 minutes and allow to cools lightly. Empty rice onto a cloth or inside nut milk bag and squeeze out as much liquid as possible - be careful as the water will be hot. Place drained cauliflower rice into a mixing bowl and add the eggs, almond meal, 1/2 cup parmesan cheese, flaxseed, salt, pepper, chili and garlic."}, {"t": "Divide the dough mixture evenly between two trays lined with baking paper."}, {"t": "Using a spatula or your hands, mold the dough into a circle shape pizza base and press down so that the base is less than 0.5cm thick. Bake for 15 minutes, until the edges have started to turn golden. Use another sheet of baking paper to help flip the base and bake for another 5-10 minutes."}, {"t": "Spread tomato paste evenly across both pizza bases, top with olives, red onion and parmesan cheese."}, {"t": "Return to the oven to bake for another 10 minutes or until cheese has melted."}, {"t": "Top with fresh basil leaves, slice and serve."}], "tips": [{"h": "Bec’s Tips", "t": "You can make the pizza bases ahead of time. Simply allow them to cool completely before wrapping in foil or baking paper and storing in the freezer. Allow to defrost or bake in the oven for 5 minutes before topping. Experiment with different toppings! Any of the veggies in the Eating Guidelines Table in the Tribe portal can be used."}], "sources": ["Tribe recipe card – Week 39"], "kind": "card", "pesc_plan": false, "slots": [], "id": "keto cauliflower pizza", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "10 Minute Garlic and Leek Pasta", "serves": "1", "time": "10 min", "time_detail": "", "cal": "367", "fat": "18", "protein": "19", "netcarbs": "27", "fibre": "12", "ingredients": [{"t": "½ pack Slendier edamame or black bean fettuccini"}, {"t": "1 bunch (approx. 6 spears) asparagus, chopped"}, {"t": "1 large clove garlic, crushed"}, {"t": "1 cup chopped leeks"}, {"t": "1 tbsp olive oil"}, {"t": "½ cup water"}, {"t": "½ large cube chicken or vegetable stock"}, {"t": "1 tbsp arrowroot flour"}], "steps": [{"t": "Boil kettle then dissolve stock cube in 1/2 cup water in a mug"}, {"t": "Boil a large saucepan ½ full with water to cook the pasta"}, {"t": "In the meantime, heat a medium sized pan or casserole dish on medium"}, {"t": "Add olive oil, leeks and garlic and sauté until soft, then turn to low. When pasta water is boiling, add the pasta, cook for about 2 minutes, then throw in the asparagus. Cook for a further 2 minutes or until the asparagus is cooked through when tested with a fork. Drain."}, {"t": "Stir arrowroot flour through the chicken stock, then pour it into the leeks and garlic. Stir until it thickens a bit, then add in the pasta and toss to all combine."}, {"t": "Drizzle over the remaining tbsp olive oil and taste. Add pepper, salt and garlic powder to your liking!"}, {"t": "Top with nutritional yeast flakes if desired!"}], "tips": [{"h": "Bec’s Tips", "t": "Swap asparagus to broccoli if preferred! Both works really well This meal is a little lower in calories than our other mains, so feel free to add a little chicken or meat OR enjoy some protein powder with yoghurt and berries for dessert!"}], "sources": ["Tribe recipe card – Week 40"], "kind": "card", "pesc_plan": false, "slots": [], "id": "10 minute garlic leek pasta", "cats": ["Mains"], "tags": ["Vegetarian", "15 min or less", "Tribe recipe card"]}, {"title": "Pumpkin and Sweet Cream Cheese Muffins", "serves": "12", "time": "45 min", "time_detail": "20 min 25 min 45 min", "cal": "209", "fat": "18", "protein": "7", "netcarbs": "2", "fibre": "2", "ingredients": [{"h": "Cream Cheese Filling"}, {"t": "170 g cream cheese, softened"}, {"t": "3 tbsp powdered Stevia or monkfruit (Natvia do a good baking one)"}, {"t": "1 tbsp heavy cream"}, {"t": "1/2 tsp vanilla extract"}, {"h": "Pumpkin Muffins"}, {"t": "2 cups almond flour"}, {"t": "1/2 cup powdered Stevia or monkfruit (Natvia do a good baking one)"}, {"t": "1/4 cup unflavoured or vanilla protein powder (not collagen)"}, {"t": "2 tsp baking powder"}, {"t": "2 tsp pumpkin pie spice OR 1 teaspoon cinnamon, ½ teaspoon ginger, ¼ teaspoon cloves"}, {"t": "1/2 tsp salt"}, {"t": "2 large eggs"}, {"t": "1/2 cup pumpkin puree"}, {"t": "1/4 cup butter melted"}, {"t": "1/4 cup unsweetened almond milk"}, {"t": "1/2 tsp vanilla extract"}], "steps": [{"t": "CREAM CHEESE FILLING Beat the cream cheese with the powdered sweetener, cream and vanilla extract until smooth. Set aside. MUFFINS Preheat the oven to 160°C and line a muffin tin with liners or spray well with coconut or olive oil spray."}, {"t": "In a medium bowl, whisk together the almond flour, sweetener, protein powder, baking powder, pumpkin pie spice (or 3 separate spices) and salt."}, {"t": "Add the eggs, pumpkin puree, melted butter, almond milk, and vanilla extract. Mix until well combined. Drop a spoonful of batter into the bottom of prepared muffin tins and use a spoon to make a well in the center. Drop a tablespoon of cream cheese filling into the well, then top with more batter to cover the cream cheese mixture."}, {"t": "Bake 22 to 24 minutes, or until tops are set and edges are just browned. Let cool in pan 15 minutes before transferring to a wire rack to cool completely."}], "tips": [{"h": "Bec’s Tips", "t": "Great breakfast or snack! Or, you might even want to save them for dessert! If having for breakfast, serve with 1/2 cup heated blueberries, a few spoonfuls of greek or coconut yoghurt and 1 tbsp chia seeds to bump up the fibre and be more in line with your other recipes! Can stay in fridge for 5 days. Freeze well! Can stay in freezer for up to 3 months If sensitive to dairy, omit the filling and just serve with 2 tbsp coconut yoghurt!"}], "sources": ["Tribe recipe card – Week 41"], "kind": "card", "pesc_plan": false, "slots": [], "id": "pumpkin sweet cream cheese muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Zucchini and Hazelnut Salad", "serves": "2", "time": "6 min", "time_detail": "2 min 4 min 6 min", "cal": "244", "fat": "23", "protein": "5", "netcarbs": "4", "fibre": "3", "ingredients": [{"t": "20 roasted hazelnuts, roughly chopped"}, {"t": "2 small zucchinis"}, {"t": "2 tbsp olive oil"}, {"t": "1 dash salt"}, {"t": "1 dash pepper"}, {"t": "½ tsp balsamic vinegar"}, {"t": "1 cup basil"}, {"t": "2 tbsp parmesan cheese"}], "steps": [{"t": "Heat a ridged / grill pan on a high heat until hot."}, {"t": "Meanwhile, trim the ends of the zucchini and cut them on an angle into slices that are about 1/2cm thick. Place them in a bowl and toss with 1 tbsp olive oil, salt and pepper."}, {"t": "Place the zucchini slices in the hot grill pan and char-grill for about 2 minutes on each side; using tongs to turn them over. Then, transfer to a mixing bowl, pour over the balsamic vinegar, toss together and set aside."}, {"t": "Once the zucchini has cooled down, add the remaining olive oil, basil and"}, {"t": "hazelnuts. Mix lightly and then taste and adjust the seasoning accordingly. Sprinkle over parmesan."}], "tips": [{"h": "Serve With Your Protein Of Choice!", "t": "i.e. approx 120g grilled chicken, 150g grilled white fish, 125g grilled salmon, or between 100-120g beef or lamb. Or, to keep it vegetarian but up the protein, grill or bake around 120-130g tofu or add 2 cups steamed broccoli and 2 tbsp hemp seeds."}], "sources": ["Tribe recipe card – Week 42"], "kind": "card", "pesc_plan": false, "slots": [], "id": "zucchini hazelnut salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "15 min or less", "Tribe recipe card"]}, {"title": "Sticky ‘Date’ Pudding", "serves": "6", "time": "50 min", "time_detail": "", "cal": "281", "fat": "25", "protein": "10", "netcarbs": "3", "fibre": "3", "ingredients": [{"t": "50g butter"}, {"t": "1 cup almond meal"}, {"t": "1/4 cup coconut flour"}, {"t": "1/2 cup golden monkfruit"}, {"t": "2 tsp baking powder"}, {"t": "1/4 tsp salt"}, {"t": "1/4 tsp cinnamon"}, {"t": "1/4 tsp allspice (optional)"}, {"t": "3 eggs"}, {"t": "1/3 cup almond milk"}, {"t": "1/3 cup high protein greek yoghurt"}, {"t": "1 tsp vanilla extract"}, {"h": "Toffee Sauce"}, {"t": "40g butter"}, {"t": "2.5 tbsp golden monk fruit"}, {"t": "1/4 cup coconut cream or cream"}], "steps": [{"t": "Preheat oven to 160°C and prepare six muffin moulds or paper liners."}, {"t": "Melt the butter and set aside to cool."}, {"t": "Combine almond meal, coconut flour, monkfruit, baking powder, salt, cinnamon and allspice (if using) in a bowl."}, {"t": "In a separate bowl, whisk together the eggs, almond milk, vanilla extract and yoghurt."}, {"t": "Pour wet ingredients into the dry and combine. Add butter while mixing and combine again."}, {"t": "Distribute evenly among six muffin moulds and bake for 25 minutes or until cooked through."}, {"t": "Remove from the oven and allow to cool for 20 minutes before removing from the pan. Transfer muffins to a wire cooling rack."}, {"t": "While the muffins cool, prepare the toffee sauce by combining butter,"}, {"t": "cream and monk fruit in a small saucepan over medium heat. The sauce will start to bubble, whisk occasionally and let simmer for approximately 10 minutes to thicken."}, {"t": "Remove the sauce from the heat and allow to cool and thicken further."}, {"t": "Spoon toffee sauce over each muffin to serve."}], "tips": [], "sources": ["Tribe recipe card – Week 43"], "kind": "card", "pesc_plan": false, "slots": [], "id": "sticky date pudding", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Mediterranean Cauliflower “Steak” Salad", "serves": "2", "time": "35 min", "time_detail": "5 min 30 min 35 min", "cal": "467", "fat": "33", "protein": "20", "netcarbs": "23", "fibre": "12", "ingredients": [{"t": "½ large cauliflower"}, {"t": "½ large red onion"}, {"t": "2 tbsp olive oil"}, {"t": "1 tsp garlic powder"}, {"t": "1 tbsp lemon juice"}, {"t": "4 cups spinach or mixed green leaves"}, {"t": "10 sun-dried tomatoes"}, {"t": "8-10 cherry tomatoes"}, {"t": "4 tbsp hummus (or 2 heaped tbsp nut cheese or feta)"}, {"t": "3 tbsp hemp seeds"}], "steps": [{"t": "Preheat over to 200 degrees C."}, {"t": "Slice cauliflower through the core into slices - if it breaks into smaller chunks, that’s ok! Also, slice the onion into wedges. Arrange on a baking tray lined with non-stick baking paper."}, {"t": "In a small bowl, whisk together the olive oil and lemon juice, then brush over 3/4 of the olive oil mixture (if you don’t have a brush, just pour over evenly)."}, {"t": "Generously sprinkle garlic powder all over the veggies and also a generous"}, {"t": "amount of salt (and any herbs you desire if you like!)."}, {"t": "Place in the oven and cook for about 15-20 minutes until it starts to brown. Remove from oven, flip the cauliflower over, pour over remaining oil and then cook for a further 10 minutes and remove."}, {"t": "Arrange the cauliflower and onions on top of a big bed of spinach or mixed leaves (fresh or wilted!), then top with chopped cherry tomatoes and sun-dried tomatoes, hemp seeds and hummus or nut cheese!"}], "tips": [{"h": "Bec’s Tips", "t": "Want this to be a side salad instead of a main meal? Leave off the hummus/nut cheese and hemp seeds and serve with your protein of choice. This recipe serves So, just reminding you that ontop of each salad - that’s 1.5 tbsp hemp seeds."}], "sources": ["Tribe recipe card – Week 44"], "kind": "card", "pesc_plan": false, "slots": [], "id": "mediterranean cauliflower steak salad", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Caprese Salad", "serves": "1", "time": "3 min", "time_detail": "", "cal": "403", "fat": "30", "protein": "25", "netcarbs": "8", "fibre": "3", "ingredients": [{"t": "1 punnet cherry tomatoes (approx 10-12 / 200g)"}, {"t": "100 g mozzarella, sliced"}, {"t": "0.5 tbsp olive oil"}, {"t": "5 leaves fresh basil, torn"}, {"t": "Sprinkle of salt"}], "steps": [{"t": "Assemble chopped tomatoes on a board or in a bowl"}, {"t": "Slice mozzarella"}, {"t": "Drizzle over olive oil"}, {"t": "Scatter over torn basil leaves and sprinkle with salt!"}], "tips": [{"h": "Bec’s Notes", "t": "Feel free to use this recipe in place of any of your lunches! If you’re dairy free, this is a high dairy meal. Leave out the mozzarella and buy a almond or macadamia vegan cheese and enjoy the equivalent amount calorie wise"}], "sources": ["Tribe recipe card – Week 45"], "kind": "card", "pesc_plan": false, "slots": [], "id": "caprese salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "15 min or less", "Tribe recipe card"]}, {"title": "Double Chocolate Craving Crushing Cookies", "serves": "8", "time": "25 min", "time_detail": "15 min 10 min 25 min", "cal": "140", "fat": "12", "protein": "4", "netcarbs": "1", "fibre": "2", "ingredients": [{"t": "3/4 cup almond meal"}, {"t": "1.5 tbsp (11g) ground flaxseed meal"}, {"t": "6 tbsp unsweetened cocoa powder or cacao"}, {"t": "1/3 cup powdered stevia (or 1/2 cup if you like very sweet)"}, {"t": "¼ tsp baking soda"}, {"t": "1/4 tsp salt"}, {"t": "1 egg, room temperature"}, {"t": "1/4 cup butter (56 g) or coconut oil, melted and cooled"}, {"t": "40 g 85% Lindt dark chocolate (4 squares) Be very careful not to add too much"}], "steps": [{"t": "Preheat oven to 175°C and line an oven tray with baking paper."}, {"t": "Melt your butter or coconut oil (read notes too) and set aside to cool. If it is too hot, it will cook the egg when added to the mix."}, {"t": "Combine almond meal, cocoa powder, stevia, flaxseed, baking soda and"}, {"t": "salt in a mixing bowl (read note about flaxseed meal)."}, {"t": "Add the egg and melted butter or coconut oil to the bowl."}, {"t": "Mix to combine everything into a dough and set aside. Allow the dough to rest for 5 to 10 minutes."}, {"t": "Spoon approximately one heaped tablespoon of dough onto the baking sheet. Repeat until the dough is used up (approximately 8 cookies)."}, {"t": "Use damp fingers to push down and smooth the dough into cookie shapes."}, {"t": "Roughly chop four squares of Lindt 85% chocolate and push the chocolate pieces down into the cookies."}], "tips": [{"h": "Bec’s Tips", "t": "Bake for approximately 10 minutes for a softer cookie and 12 minutes for a harder cookie. flaxseed to the mix as this will make the Remove from the oven and allow to cool completely. The cookies will seem dough a lot firmer/harder. I have included very soft, but they will continue cooking once removed from the oven. the measurement in grams so that you can use a scale to measure (just in case). You can use a mix of half/half butter and coconut oil to get a nice buttery cookie taste without too much dairy try 30 g coconut oil and 26 g butter."}], "sources": ["Tribe recipe card – Week 46"], "kind": "card", "pesc_plan": false, "slots": [], "id": "double chocolate craving crushing cookies", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "BBQ’ed Parmesan & Garlic Eggplant", "serves": "4", "time": "22 min", "time_detail": "", "cal": "206", "fat": "14", "protein": "4", "netcarbs": "10", "fibre": "10", "ingredients": [{"t": "2 eggplants (approx. 500 g each)"}, {"t": "1 tbsp Himalayan salt (used for removing water content from the eggplant)"}, {"t": "1/4 cup olive oil"}, {"t": "1 tsp salt"}, {"t": "1/2 tsp pepper"}, {"t": "1 tsp garlic powder (not garlic salt)"}, {"t": "1 tsp oregano"}, {"t": "2 tbsp parmesan freshly grated"}], "steps": [{"t": "Wash eggplant and cut into slices that are about 1/4 inch thick."}, {"t": "Lay on paper towels and sprinkle with the rock salt. Let sit for 10-15 minutes so that it extracts the water content from the eggplant."}, {"t": "Preheat a BBQ or grill on medium heat."}, {"t": "Dust off salt on eggplant slices."}, {"t": "In a large bowl, combine olive oil, salt, pepper, garlic powder, oregano and parmesan."}, {"t": "Dip the eggplant slices into the olive oil mixture and coat evenly on each side. Transfer to the grill or BBQ and grill 5-6 minutes per side or until browned nicely!"}, {"t": "Serve immediately or store in the fridge for up to four days. Enjoy!"}], "tips": [{"h": "Bec’s Notes", "t": "This would go perfectly with any protein of choice on the BBQ too - just marinated in some oil, salt and rosemary. Look at your Protein Conversions table inside your 3 Week Body Reset eBook for help with knowing the rough amount of calories / portion size! I personally think it goes best with lamb or chicken!"}], "sources": ["Tribe recipe card – Week 47"], "kind": "card", "pesc_plan": false, "slots": [], "id": "bbq ed parmesan garlic eggplant", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Strawberry and Chocolate Muffins", "serves": "12", "time": "35 min", "time_detail": "", "cal": "224", "fat": "19", "protein": "7", "netcarbs": "2", "fibre": "3", "ingredients": [{"t": "1/4 cup coconut flour"}, {"t": "3 tsp baking powder"}, {"t": "2 cups almond flour or meal"}, {"t": "1/4 cup powdered stevia"}, {"t": "1 punnet (250g strawberries, chopped)"}, {"t": "75g dark chocolate (85% cocoa), chopped"}, {"t": "3 eggs, lightly whisked"}, {"t": "2 tsp vanilla extract"}, {"t": "1/4 cup almond milk"}, {"t": "125g unsalted butter, melted"}], "steps": [{"t": "Preheat oven to 170°C/150°C fan forced. Line 12 holes of an 80ml (1/3 cup) capacity muffin pan with paper cases."}, {"t": "Sift the coconut flour and baking powder into a large bowl. Add the stevia, almond meal, strawberries and chocolate and stir to combine."}, {"t": "Whisk the eggs, vanilla and almond milk together in another bowl. Add the egg mixture and butter to the dry ingredients and stir until just combined."}, {"t": "Divide the mixture among the prepared muffin holes. Bake for 20-25 minutes or until golden and a skewer inserted into the centre comes out clean. Set aside for 5 minutes, to cool, before transferring to a wire rack to"}, {"t": "cool completely!"}], "tips": [{"h": "Bec’s Notes", "t": "These can be frozen for 6 months or kept, sealed in the fridge for about 5 days."}], "sources": ["Tribe recipe card – Week 48"], "kind": "card", "pesc_plan": false, "slots": [], "id": "strawberry chocolate muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Lazy Cheesy Beef Casserole", "serves": "5", "time": "30 min", "time_detail": "", "cal": "400", "fat": "24", "protein": "30", "netcarbs": "12", "fibre": "5", "ingredients": [{"t": "1 tbsp olive oil"}, {"t": "½ cup onion, chopped"}, {"t": "1 medium green capsicum, chopped"}, {"t": "450 g lean beef mince"}, {"t": "3 heaped cups frozen cauliflower, broccoli carrot mix"}, {"t": "3 cloves garlic, crushed"}, {"t": "1-2 tsp chilli powder"}, {"t": "2 tsp ground cumin"}, {"t": "1 tsp dried oregano"}, {"t": "½ tsp salt"}, {"t": "¼ tsp ground chipotle or paprika"}, {"t": "1 can no-salt-added crushed tomatoes (425 g)"}, {"t": "1.5 cups shredded cheddar cheese"}, {"t": "1/3 cup sliced pickled jalapeños"}], "steps": [{"t": "Position rack in upper third of oven. Preheat the grill setting to high."}, {"t": "Heat olive oil in a large, oven-safe pan over medium heat. Add onion and capsicum and cook, stirring, until softened for about 4 minutes."}, {"t": "Add the beef and veggies and cook, stirring and breaking the beef up into smaller pieces, until it is no longer pink. This should take around 5 to 7 minutes."}, {"t": "Stir in the in garlic, chilli powder, cumin, oregano, salt and chipotle and cook for a further minute."}, {"t": "Add can of tomatoes and bring to a simmer and cook, stirring occasionally, until liquid is reduced and the vegetables are tender, about 3 minutes more. Remove from heat."}, {"t": "Sprinkle the cheese over the beef mixture and top with sliced jalapeño."}, {"t": "Then, place in the oven until the cheese is melted and slightly browned in a few spots (around 3 mins)."}], "tips": [{"h": "Bec’s Notes", "t": "Great meal for the whole fam. For kids, serve with corn chips and sour cream. For you, enjoy with some fresh salad, cauliflower rice or extra veggies!"}], "sources": ["Tribe recipe card – Week 49"], "kind": "card", "pesc_plan": false, "slots": [], "id": "lazy cheesy beef casserole", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Tribe recipe card"]}, {"title": "Cheesecake Brownies", "serves": "18", "time": "60 min", "time_detail": "", "cal": "155", "fat": "10", "protein": "6", "netcarbs": "6", "fibre": "5", "ingredients": [{"h": "Brownie Layer"}, {"t": "4 eggs, at room temp"}, {"t": "1 cup unsweetened cocoa powder"}, {"t": "1 cup powdered sweetener"}, {"t": "6 tablespoons melted butter or coconut oil"}, {"t": "4 teaspoons vanilla extract"}, {"t": "Pinch of sea salt"}, {"h": "Cheesecake Layer"}, {"t": "1/3 cup light cream cheese, at room temp"}, {"t": "1/3 cup heavy cream"}, {"t": "1/3 cup light sour cream"}, {"t": "1/3 cup plus 2 tablespoons powdered sweetener"}, {"t": "1/2 tablespoon vanilla extract"}, {"t": "2 eggs, at room temp"}], "steps": [{"t": "BROWNIE LAYER Pre-heat the oven to 165°C."}, {"t": "Mix dry ingredients together."}, {"t": "Add eggs one at a time until combined."}, {"t": "Add the melted butter and vanilla."}, {"t": "Mix well and pour into a greased 20 cm x 20 cm tin"}, {"t": "Bake for 15-20 minutes or until a tooth pick inserted into the middle of the brownies comes out clean. Remove and set aside."}, {"t": "CHEESECAKE LAYER"}, {"t": "Beat all the ingredients together until smooth. Make sure the cream cheese is at room temp otherwise it will be chunky."}, {"t": "Pour cheesecake mix over the brownie layer (make sure it’s slightly cooled)"}, {"t": "Return to the oven and bake 25-30 minutes, or until the cheesecake layer is lightly brown!"}, {"t": "Allow to cool for several hours before serving. Cut into squares and serve!"}], "tips": [{"h": "Bec’s Notes", "t": "I use the Nativia baking sweetener. Any other powdered sweetener that contains stevia, monkfruit or erythritol is fine."}], "sources": ["Tribe recipe card – Week 50"], "kind": "card", "pesc_plan": false, "slots": [], "id": "cheesecake brownies", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Banana Choc Chip Muffins", "serves": "12", "time": "40 min", "time_detail": "", "cal": "232", "fat": "17", "protein": "6", "netcarbs": "15", "fibre": "4", "ingredients": [{"t": "1/3 cup olive oil"}, {"t": "1/2 cup sweetener"}, {"t": "2 eggs"}, {"t": "1 tsp vanilla extract"}, {"t": "3 ripe bananas, mashed"}, {"t": "1/4 cup almond milk"}, {"t": "1 1/4 cups almond flour"}, {"t": "1/2 cup tapioca flour"}, {"t": "2 tbsp coconut flour"}, {"t": "1 tsp baking soda"}, {"t": "1/2 tsp salt"}, {"t": "2/3 cup unsweetened cocoa powder"}, {"t": "2/3 cup dairy-free chocolate chips"}], "steps": [{"t": "Preheat oven to 175°C and grease a 12-hole muffin tin."}, {"t": "In a large bowl, mix the olive oil, sweetener, eggs, vanilla, mashed bananas and almond milk. Whisk until well mixed."}, {"t": "In another bowl, combine the almond flour, coconut flour, tapioca flour, baking soda, salt and cocoa powder together. Mix with a fork until combined."}, {"t": "Then, pour the bowl of dry ingredients into the bowl of wet ingredients and mix until just combined - don’t over mix as it can affect how much they"}, {"t": "will rise. Finally, fold through the chocolate gently."}, {"t": "Bake for approx. 23-25 minutes, or until a toothpick comes out clean!"}], "tips": [{"h": "Bec’s Notes", "t": "Remember, recommended sweeteners are stevia, erythritol, monk fruit, xylitol or a blend of these!"}], "sources": ["Tribe recipe card – Week 51"], "kind": "card", "pesc_plan": false, "slots": [], "id": "banana choc chip muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Capsicum, Chilli and Hoisin Chicken Stir-Fry", "serves": "4", "time": "90 min", "time_detail": "", "cal": "439", "fat": "11", "protein": "47", "netcarbs": "27", "fibre": "8", "ingredients": [{"t": "700 g chicken breast or tenders, chopped into bite-size pieces"}, {"t": "2 garlic cloves, crushed"}, {"t": "1.5 tsp 5 spice powder"}, {"t": "1 stalk fresh lemon grass, finely chopped"}, {"t": "1.5 tbsp fresh ginger, grated"}, {"t": "1 tbsp coconut oil"}, {"t": "1 tbsp sesame oil"}, {"t": "1 large brown onion, diced"}, {"t": "1 red chilli, chopped finely"}, {"t": "0.5 cup hoisin sauce"}, {"t": "1 large red capsicum, sliced into strips"}, {"t": "2 cups snow peas, sliced length ways"}, {"t": "1 lemon (you need 2 tsp zest & 1 tbsp juice)"}, {"t": "0.5 cup coriander, chopped"}], "steps": [{"t": "Combine chicken with half the garlic, 1 teaspoon of the five-spice and all of the lemon grass and ginger in a large bowl. Cover, refrigerate for 1 hour."}, {"t": "Heat half the oil in wok; stir-fry brown onion, chilli, capsicum, snow peas"}, {"t": "and remaining garlic until onion softens. Remove from wok."}, {"t": "Heat remaining oil in wok; stir-fry chicken until cooked."}, {"t": "Return onion mixture and chicken to wok with hoisin sauce, lemon zest, lemon juice and the remaining five spice."}, {"t": "Remove from heat, toss through coriander and serve."}], "tips": [], "sources": ["Tribe recipe card – Week 52"], "kind": "card", "pesc_plan": false, "slots": [], "id": "capsicum chilli hoisin chicken stir fry", "cats": ["Mains"], "tags": ["Chicken", "Tribe recipe card"]}, {"title": "Make My Gut Sing Patties", "serves": "7", "time": "35 min", "time_detail": "15 min (plus 10 min 10 min 35 min", "cal": "142", "fat": "8", "protein": "6", "netcarbs": "8", "fibre": "4", "ingredients": [{"t": "2 tbsp extra virgin olive oil*"}, {"t": "½ brown onion, diced"}, {"t": "125 g cauliflower rice*"}, {"t": "400 g canned chickpeas, drained and rinsed"}, {"t": "4 cloves garlic"}, {"t": "¼ cup fresh basil"}, {"t": "¼ cup fresh parsley"}, {"t": "¼ cup sun-dried tomato strips, drained"}, {"t": "2 tbsp hulled tahini*"}, {"t": "¾ tsp ground turmeric"}, {"t": "1½ tsp ground cumin"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "¼ tsp ground chilli (optional)"}, {"t": "1 tbsp coconut flour"}, {"t": "1 egg"}], "steps": [{"t": "Heat half the olive oil in a saucepan over medium heat. Add the onion and cauliflower rice and cook, stirring occasionally, for approximately 8 minutes, until tender."}, {"t": "Place the chickpeas, garlic, basil, parsley, sun-dried tomatoes, tahini, turmeric, cumin, salt, pepper, and ground chilli (if using) in a food processor and process until combined, pausing to scrape down the sides once or twice. Transfer the mixture to a large mixing bowl with the cauliflower rice and onion. Add the coconut flour and egg and mix well. Place in the fridge for at least 10–15 minutes to firm up. This helps the patties hold together when cooking."}, {"t": "Remove the patty mixture from the fridge. Using clean, damp hands gently roll the mixture into 6 balls."}, {"t": "Heat the remaining olive oil in a large frying-pan over medium heat."}, {"t": "Place the balls straight into the frying pan and gently press down slightly with a spatula to form patties. (Be careful not to press too hard, as patties will break). You may need to cook the patties in two batches. Cook each patty for about 5 minutes, then gently flip, and cook for a further 5 minutes."}, {"t": "Enjoy straight away."}], "tips": [{"h": "Bec’s Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Store in the fridge for up to 5 days or freeze individually for up to 3 months, then just reheat in a pan or air fryer for a few minutes!"}, {"h": "Serving Suggestions", "t": "Enjoy 1 patty as a small snack on it’s own. Or if you’re looking for a more substantial snack enjoy 1 patty topped with ¼ avocado and a sliced boiled egg (250 kcal) OR served with celery sticks and 2 tbsp hummus (214 kcal). Enjoy 2 patties for breakfast or lunch on a bed of fresh salad leaves or steamed veggies, with 1 poached, fried, or boiled egg and 1 tbsp extra virgin olive oil (480 kcal)."}], "sources": ["Tribe recipe card – Week 13"], "kind": "card", "pesc_plan": false, "slots": [], "id": "make my gut sing patties", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Nutty Paleo Protein Bars", "serves": "12", "time": "25 min", "time_detail": "13 min 12 min 25 min", "cal": "196", "fat": "16", "protein": "8", "netcarbs": "6", "fibre": "4", "ingredients": [{"t": "1/3 cup almonds"}, {"t": "1/3 cup hazelnuts"}, {"t": "1/4 cup macadamias"}, {"t": "1/3 cup shredded coconut"}, {"t": "1/4 cup chia seeds"}, {"t": "1/4 cup pumpkin seeds"}, {"t": "1/3 cup vanilla protein powder"}, {"t": "1/2 tsp ground cinnamon"}, {"t": "3 tbsp granulated stevia"}, {"t": "100 g almond butter"}, {"t": "2 tbsp coconut oil"}, {"t": "3 x squares Lindt 85% chocolate (30 g)"}, {"t": "1/3 tsp pink salt (optional)"}, {"t": "1/2 tsp vanilla extract"}], "steps": [{"t": "Preheat oven to 180C."}, {"t": "Roughly chop all nuts and add to a mixing bowl."}, {"t": "Add coconut, chia seeds, pumpkin seeds, protein powder, cinnamon, stevia and salt to the bowl."}, {"t": "Melt coconut oil with almond butter, combine until smooth then add vanilla extract."}, {"t": "Pour liquid mixture over the dry ingredients and use a spatula or mixing spoon to combine. If the mixture is too dry, try adding 1-2 tbsp almond milk to get it sticking together."}, {"t": "Once combined, transfer to a lined baking/brownie tin and spread evenly."}, {"t": "Press the mixture down into the tin so it is packed tightly."}, {"t": "Bake in the oven for approximately 12 minutes or until the edges are slightly golden."}, {"t": "Remove from the oven, allow to cool for 20-30 minutes - you can remove from the pan after 10 minutes."}, {"t": "Melt dark chocolate and drizzle over the top of the slice. Cut into 12 pieces and enjoy!"}], "tips": [{"h": "Bec’s Tips", "t": "Store in an air tight container at room temperature or in the fridge for up to one week. These are perfect for travel and squeezing into your handbag for an on-the-go snack."}], "sources": ["Tribe recipe card – Week 14"], "kind": "card", "pesc_plan": false, "slots": [], "id": "nutty paleo protein bars", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Baked Lemon & Garlic Chicken with Cauli Mash", "serves": "2", "time": "40 min", "time_detail": "", "cal": "445", "fat": "28", "protein": "35", "netcarbs": "6", "fibre": "4", "ingredients": [{"t": "350 g chicken thighs (bone-in with skin)"}, {"h": "Marinade"}, {"t": "30 ml olive oil"}, {"t": "30 ml lemon juice"}, {"t": "1 tbsp red wine vinegar"}, {"t": "1½ tbsp fresh oregano, finely chopped"}, {"t": "1 tsp fresh thyme, finely chopped"}, {"t": "1 garlic clove, minced"}, {"t": "1 tsp salt"}, {"t": "¼ tsp ground black pepper"}, {"h": "Cauli Mash"}, {"t": "220 g cauliflower"}, {"t": "2 tbsp grated parmesan cheese (optional)"}, {"t": "1 tbsp butter, melted"}, {"t": "¼ lemon, juice and zest"}, {"t": "Pinch salt"}, {"t": "Your greens of choice (I used spinach)"}], "steps": [{"h": "For The Chicken"}, {"t": "Combine the marinade ingredients in a mixing bowl or large ziplock bag. Add the chicken thighs and toss to fully coat."}, {"t": "Cover or seal, and place in the fridge for at least 3 hours (perfect to do in the morning before work)."}, {"t": "Pre-heat oven to 200°C. Line a large baking tray with baking paper."}, {"t": "Remove the chicken thighs from the marinade, and place them skin-side up, on the tray."}, {"t": "Bake for approx. 30-35 minutes, or until internal temperature is 74°C, and the skin is golden brown. Then, let rest for 5 minutes before serving."}, {"h": "For The Cauli Mash"}, {"t": "Cut the cauliflower into florets. Bring a pot of lightly salted water to a boil, over high heat. Add the cauliflower and boil for a couple of minutes – just enough so the florets are tender but retain a somewhat firm texture. Alternatively, steam in the microwave for about 3 minutes. Strain the cauliflower in a colander, and discard the water."}, {"t": "Add the cauliflower, along with the remaining ingredients into a food processor and pulse until a smooth and creamy consistency is reached."}, {"t": "Add salt and pepper to taste."}, {"t": "Steam your greens them assemble everything together!"}], "tips": [{"h": "Bec’s Tips", "t": "Perfect to prepare in the morning, marinate all day, and then bake at night. For the greens (leafy greens, broccolini, asparagus, spinach), don’t worry about the amount / calories, it’s negligible!"}], "sources": ["Tribe recipe card – Week 15"], "kind": "card", "pesc_plan": false, "slots": [], "id": "baked lemon garlic chicken cauli mash", "cats": ["Mains"], "tags": ["Chicken", "Tribe recipe card"]}, {"title": "Low Carb French Toast", "serves": "1", "time": "20 min", "time_detail": "", "cal": "381", "fat": "18", "protein": "30", "netcarbs": "9", "fibre": "13", "ingredients": [{"t": "2 pieces Venerdi Paleo Bread*"}, {"t": "1 egg"}, {"t": "3 tbsp unsweetened almond milk"}, {"t": "2 tbsp vegan vanilla protein powder*"}, {"t": "2 tsp powdered stevia/monk fruit"}, {"h": "Toppings"}, {"t": "1/4 cup berries of choice"}, {"t": "2 tbsp coconut yoghurt Powdered stevia/monk fruit (to dust on top)"}], "steps": [{"t": "Prepare the egg soak by combining egg, almond milk, protein powder and sweetener. Whisk until smooth."}, {"t": "Dip both pieces of bread into the mixture and allow to soak for 1-2 minutes."}, {"t": "Spray a large fry pan with coconut oil and heat on medium. Add dipped bread pieces to the hot fry pan and pour additional egg mixture on top. Allow to cook for approximately 2 minutes before flipping."}, {"t": "Once the toast is cooked on both sides, remove from the heat and slice diagonally into triangles."}, {"t": "Transfer French toast to a serving plate, top with coconut or Greek yoghurt, fresh berries and a dusting of powdered monk fruit or stevia to serve."}], "tips": [{"h": "Bec’s Tips", "t": "I use native stevia (available from most supermarkets) Morlife vanilla fudge protein is my favourite. Enter code healthwithbec at checkout for 15% off Venerdi stockists found at healthwithbec.com/venerdi-bread-stocklists"}], "sources": ["Tribe recipe card – Week 16"], "kind": "card", "pesc_plan": false, "slots": [], "id": "low carb french toast", "cats": ["Breakfast"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Hasselback Chicken with Green Beans", "serves": "2", "time": "45 min", "time_detail": "", "cal": "422", "fat": "23", "protein": "39", "netcarbs": "10", "fibre": "4", "ingredients": [{"t": "2 x chicken breasts (150g each)"}, {"t": "2 x garlic clove"}, {"t": "1 x small tomato"}, {"t": "1/2 green capsicum"}, {"t": "1/2 zucchini"}, {"t": "1/4 red onion"}, {"t": "2 tbsp olive oil"}, {"t": "1 tbsp lemon juice"}, {"t": "1/2 tsp oregano"}, {"t": "1/4 tsp chilli flakes (optional)"}, {"t": "1/4 tsp salt"}, {"t": "1/4 tsp pepper"}, {"t": "2 tbsp feta cheese"}, {"t": "2 cups green beans"}], "steps": [{"t": "Preheat oven to 170°C and line a baking tray with paper. Thinly slice the zucchini, tomato, capsicum and red onion. Mince 1 garlic clove, combine with 1 tbsp olive oil, 1 tbsp fresh lemon juice and set aside."}, {"t": "Trim chicken breast fillets and use knife to make cuts 3/4 deep into the breasts. Be careful not to slice the entire way through the chicken."}, {"t": "Brush garlic oil mixture all over the chicken breasts toss vegetables in the remaining garlic oil."}, {"t": "Insert vegetables into the cuts in the chicken breast and top with crumbled feta (optional)."}, {"t": "Bake for approximately 20 minutes or until chicken is cooked through."}, {"t": "While chicken is baking, mince remaining garlic clove, heat 1 tbsp olive oil in a fry pan and cook green beans with garlic, oregano, chilli flakes (optional), salt and pepper until tender."}, {"t": "Remove chicken from oven, plate with beans and serve straight away."}], "tips": [{"h": "Bec’s Tips", "t": "Option to add 1/2 tbsp of HWB approved mayonnaise to the chicken after cooking. Check the online glossary for this! (password healthwithbectribe). This will add approximately 50 calories to the meal."}], "sources": ["Tribe recipe card – Week 17"], "kind": "card", "pesc_plan": false, "slots": [], "id": "hasselback chicken green beans", "cats": ["Mains"], "tags": ["Chicken", "Tribe recipe card"]}, {"title": "Zucchini Slice", "serves": "6", "time": "55 min", "time_detail": "15 min 40 min 55 min", "cal": "381", "fat": "31", "protein": "15", "netcarbs": "8", "fibre": "4", "ingredients": [{"t": "3 large zucchinis, grated"}, {"t": "6 eggs"}, {"t": "¼ cup coconut flour"}, {"t": "1 medium carrot, grated"}, {"t": "250 g bacon, trimmed, diced"}, {"t": "1 medium brown onion, diced"}, {"t": "¼ cup extra virgin olive oil*"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Preheat the oven to 170°C fan-forced / 340°F. Line a 30 cm x 20 cm baking tin with baking paper and spray lightly with oil."}, {"t": "Wrap the grated zucchini in a clean tea towel and twist to squeeze out as much moisture as possible, discarding the liquid. The drier the zucchini, the better the slice will set."}, {"t": "In a large bowl, beat the eggs until combined. Add the coconut flour and whisk until smooth."}, {"t": "Add the zucchini, carrot, bacon, onion, and olive oil. Stir to combine and"}, {"t": "season with salt and pepper."}, {"t": "Pour the mixture into the prepared tin and bake for 35–40 minutes, until golden on top and set in the centre. A knife inserted into the middle should come out clean."}, {"t": "Allow to cool then slice into 6 portions. Enjoy with a side of steamed greens for lunch or breakfast."}], "tips": [{"h": "Bec’s Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Make into mini portions using a muffin tin and cook for approximately 35 minutes, until slightly golden on top. These freeze really well – perfect for a grab-and-go meal!"}], "sources": ["Tribe recipe card – Week 18"], "kind": "card", "pesc_plan": false, "slots": [], "id": "zucchini slice", "cats": ["Breakfast", "Mains"], "tags": ["Beef, pork & lamb", "Tribe recipe card"]}, {"title": "Chocolate Protein Balls", "serves": "7", "time": "40 min", "time_detail": "", "cal": "178", "fat": "3", "protein": "9", "netcarbs": "2", "fibre": "4", "ingredients": [{"t": "1/2 cup almond butter"}, {"t": "1 tbsp coconut oil"}, {"t": "1/4 cup chocolate protein powder"}, {"t": "1/4 cup coconut flour"}, {"t": "1/4 cup cacao"}, {"t": "2-3 tbsp stevia"}, {"t": "1/4 tsp salt"}, {"t": "2 tbsp desiccated coconut"}], "steps": [{"t": "Add almond butter and coconut oil to a mixing bowl. Heat in the microwave for 30 seconds to melt the coconut oil and combine well."}, {"t": "Add coconut flour, cacao, stevia, protein powder and salt to the bowl. Work into a thick dough and place in the fridge or freezer for 20-30 minutes to harden."}, {"t": "Use a spoon to scoop out even amounts of the dough and roll into 7 balls. Coat each ball in desiccated coconut and place on parchment paper inside a container. Return to the fridge to set."}], "tips": [{"h": "Bec’s Tips", "t": "Store in the fridge for up to one week. You can use chocolate or vanilla protein powder for this recipe!"}], "sources": ["Tribe recipe card – Week 19"], "kind": "card", "pesc_plan": false, "slots": [], "id": "chocolate protein balls", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Meatballs with Cauliflower Mash", "serves": "2", "time": "45 min", "time_detail": "", "cal": "432", "fat": "29", "protein": "32", "netcarbs": "6", "fibre": "3", "ingredients": [{"h": "Meatballs"}, {"t": "250g beef mince"}, {"t": "1/2 tbsp olive oil"}, {"t": "1 egg white"}, {"t": "1/2 tsp tamari"}, {"t": "1/2 tsp onion powder"}, {"t": "1/2 tsp garlic powder"}, {"t": "1/4 tsp salt"}, {"t": "1/4 tsp pepper"}, {"t": "1/2 tsp oregano"}, {"t": "1/4 tsp chilli flakes"}, {"h": "Cauliflower Mash"}, {"t": "1/2 small cauliflower head"}, {"t": "2 tbsp parmesan cheese"}, {"t": "1 tbsp butter or ghee"}, {"t": "1 tbsp almond milk"}, {"t": "1/2 tsp salt"}, {"h": "Gravy"}, {"t": "1/2 cup beef stock"}, {"t": "2 tbsp light coconut cream"}, {"t": "1 tbsp butter"}, {"t": "1/2 tsp garlic powder"}], "steps": [{"t": "Combine beef mince, egg white, tamari, salt, pepper, chilli flakes, oregano, onion and garlic powder. Form mixture in to 6 meat balls. Chop cauliflower into florets and steam for 10-15 minutes until tender. While cauliflower steams, heat 1/2 tbsp olive oil on medium heat and cook meatballs for 8-10 minutes. Rotate the meatballs ensuring they are evenly cooked on all sides."}, {"t": "Remove cauliflower from heat and add to blender with butter, parmesan, 1/2 tsp salt and milk. Blend until smooth, adding slightly more milk if required. Once meatballs are cooked, remove from the fry pan and place on a plate."}, {"t": "Add butter to the same fry pan you cooked the meatballs in and allow to melt. Add beef stock, coconut cream and garlic powder, bring to the boil then let simmer for approximately 10 minutes or until thickened."}, {"t": "Spread cauliflower mash onto a plate, add 3 meatballs to each plate and top with gravy. Serve straight away."}], "tips": [], "sources": ["Tribe recipe card – Week 20"], "kind": "card", "pesc_plan": false, "slots": [], "id": "meatballs cauliflower mash", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Tribe recipe card"]}, {"title": "Low Carb Lamingtons", "serves": "16", "time": "50 min", "time_detail": "", "cal": "225", "fat": "20", "protein": "6", "netcarbs": "8", "fibre": "5", "ingredients": [{"t": "1 cup almond meal"}, {"t": "1 cup coconut flour"}, {"t": "1 1/3 cup stevia or monk fruit powder"}, {"t": "2 tsp baking powder"}, {"t": "1/4 tsp salt"}, {"t": "1 1/2 cup almond milk"}, {"t": "1 tbsp apple cider vinegar"}, {"t": "4 tbsp coconut oil, melted or liquid"}, {"t": "1 tbsp vanilla extract"}, {"t": "6 eggs"}, {"t": "4 tbsp butter, melted"}, {"h": "Frosting"}, {"t": "200g monk fruit sweetener icing sugar"}, {"t": "1/2 tbsp coconut oil"}, {"t": "5 tbsp cocoa"}, {"t": "6 tbsp hot water"}, {"h": "At End"}, {"t": "200 g desiccated coconut"}], "steps": [{"t": "Preheat oven to 160°C fan forced or 180°C regular and line a baking pan. Combine almond meal, coconut flour, stevia, baking powder and salt. In a separate mixing bowl, combine almond milk with apple cider vinegar to create a buttermilk and allow to sit for 5 minutes. Add eggs, coconut oil and vanilla to the buttermilk mixture and whisk until combined."}, {"t": "Add wet ingredients to the dry mix and begin to stir."}, {"t": "Melt butter and add to the cake batter while mixing, until combined. Pour batter into baking pan and bake for approximately 25 minutes or until edges have just started to brown."}, {"t": "Remove from the oven and allow to sit for 10 minutes before transferring to a cooling rack."}, {"t": "Cut into 16 pieces, then chill."}, {"t": "To make the glaze, whisk together all of the frosting ingredients."}, {"t": "Dip each piece in the glaze, then roll in coconut!"}], "tips": [], "sources": ["Tribe recipe card – Week 21"], "kind": "card", "pesc_plan": false, "slots": [], "id": "low carb lamingtons", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Low Carb Lasagne", "serves": "4", "time": "45 min", "time_detail": "", "cal": "378", "fat": "19", "protein": "35", "netcarbs": "11", "fibre": "6", "ingredients": [{"t": "500 g beef mince"}, {"t": "2 medium zucchinis"}, {"t": "1 large eggplant"}, {"t": "1 tbsp ghee or olive oil"}, {"t": "250 g tomato passata (I use keep it cleaner brand)"}, {"t": "1/4 tsp chilli flakes (optional)"}, {"t": "1/4 tsp salt"}, {"t": "1/4 tsp pepper"}, {"t": "1/2 tsp dried oregano"}, {"t": "1/2 cup mozzarella cheese"}, {"t": "20 fresh basil leaves (to garnish)"}, {"h": "White Sauce"}, {"t": "2 tbsp butter or ghee"}, {"t": "1 tbsp tapioca/arrowroot starch"}, {"t": "1 cup almond milk"}, {"t": "1/4 tsp salt"}, {"t": "3 tbsp parmesan cheese"}], "steps": [{"t": "Preheat oven to 180°C and line two large baking trays with paper."}, {"t": "Slice zucchini and eggplant into strips, spray with olive oil and season with salt and pepper. Bake for 15-20 minutes or until cooked through."}, {"t": "While the vegetables bake, prepare the mince sauce by heating 1 tbsp olive oil in a fry pan. Add the mince, salt, pepper, oregano and chilli flakes if using. Once the mince has started to brown, add most but not all of the tomato passata and allow to simmer for 10 minutes to thicken."}, {"t": "While the meat sauce thickens, begin preparing the white sauce by melting butter or ghee in a saucepan on low heat. Whisk in tapioca starch, add salt"}, {"t": "then slowly pour in milk while whisking constantly. Bring to a low simmer and add parmesan cheese."}, {"t": "Once vegetables are cooked, pour remaining passata into the bottom of a greased dish and begin to assemble the lasagne. Start by making a layer of vegetables, cover with meat sauce and drizzle white sauce on top. Repeat until all ingredients have been used."}, {"t": "Top with mozzarella cheese, salt and pepper. Bake for 30 minutes at 180°C. Cover with foil and bake for a further 10-15 minutes."}], "tips": [{"h": "Bec’s Tips", "t": "There will not be enough white sauce to completely cover each layer. Use a spoon to drizzle the sauce for a hint of creaminess in each layer."}], "sources": ["Tribe recipe card – Week 22"], "kind": "card", "pesc_plan": false, "slots": [], "id": "low carb lasagne", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Tribe recipe card"]}, {"title": "Chocolate Lava Cake", "serves": "1", "time": "25 min", "time_detail": "12-15 min 10 min 25 min", "cal": "249", "fat": "17", "protein": "10", "netcarbs": "4", "fibre": "2", "ingredients": [{"t": "1 tbsp cacao powder"}, {"t": "1/2 tbsp powdered stevia"}, {"t": "1/2 tbsp almond flour"}, {"t": "1/4 tsp baking powder"}, {"t": "Pinch of salt"}, {"t": "1 x square Lindt 85% dark chocolate"}, {"t": "1 egg, room temperature"}, {"t": "1 tbsp butter, ghee or coconut oil"}, {"t": "1/2 tsp vanilla extract"}], "steps": [{"t": "Preheat oven to 170°C and grease a small ramekin or muffin mould with coconut oil or butter."}, {"t": "Melt chocolate and butter or coconut oil together."}, {"t": "In a separate bowl, whisk egg and vanilla then add to the chocolate mixture and combine well. Make sure the mixture is not to warm so that the eggs don’t scramble."}, {"t": "Add cacao, stevia, almond flour, baking powder and salt to the mixture, stir to combine."}, {"t": "Transfer cake batter to your greased ramekin and bake for 12-15 minutes."}, {"t": "The edges should be slightly firm, but the centre will have a slight jiggle to it."}, {"t": "Allow to cool for 10 minutes, dust with powdered stevia and serve."}], "tips": [{"h": "Bec’s Tips", "t": "Be careful not to overcook as this will remove the “lava” centre of the cake. You can add fresh or frozen berries to serve. Double the recipe to make two lava cakes."}], "sources": ["Tribe recipe card – Week 23"], "kind": "card", "pesc_plan": false, "slots": [], "id": "chocolate lava cake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Carrot Cake Muffins", "serves": "8", "time": "45 min", "time_detail": "", "cal": "191", "fat": "15", "protein": "8", "netcarbs": "1", "fibre": "3", "ingredients": [{"t": "1 cup almond meal"}, {"t": "1/4 cup coconut flour"}, {"t": "1 tsp baking powder"}, {"t": "1/4 tsp baking soda"}, {"t": "1/4 cup stevia"}, {"t": "1 tsp cinnamon"}, {"t": "1/4 tsp nutmeg"}, {"t": "1/4 tsp salt"}, {"t": "1 cup grated carrots"}, {"t": "30 g butter or coconut oil"}, {"t": "3 eggs"}, {"t": "1 tsp vanilla extract"}, {"t": "1/4 cup almond milk"}, {"h": "Frosting"}, {"t": "120 g light cream cheese"}, {"t": "40 g thick Greek yoghurt"}, {"t": "1/4 cup powdered stevia"}, {"t": "1 tsp vanilla extract"}], "steps": [{"t": "Preheat oven to 160°C fan forced or 180°C regular and prepare a muffin tin with paper liners."}, {"t": "Melt 30 g butter and set aside to cool to room temperature, while you grate the carrots."}, {"t": "Stir to combine almond meal, coconut flour, stevia, baking powder, baking soda, salt, cinnamon and nutmeg. Ensure there are no lumps."}, {"t": "In a separate bowl whisk the eggs and add in almond milk, vanilla extract and grated carrots. Mix well to combine. Pour the dry ingredients & melted butter into the bowl with the wet ingredients & use a spatula to combine. Don’t over-mix or the muffins will not rise."}, {"t": "Spread the batter between 8 muffin liners and bake for approximately 25 minutes, or until muffins are slightly golden brown. You can check that the muffins are cooked through by using a skewer or toothpick inserted in the centre, if it comes out clean, the muffins are ready."}, {"t": "Remove from the oven and allow to cool for 20 minutes before removing from the muffin pan. Transfer to a cooling rack to cool completely."}, {"t": "While the muffins cools, prepare the cream cheese frosting. Whisk together cream cheese, yoghurt, powdered stevia and vanilla extract until smooth. Refrigerate the frosting until the muffins are ready to frost."}, {"t": "Once muffins are completely cool, spread frosting evenly over each muffin."}], "tips": [{"h": "Bec’s Tips", "t": "Substitute cream cheese and yoghurt with vegan cream cheese and coconut yoghurt for a dairy free version. Iced muffins are best stored in the fridge for up to 4 days."}], "sources": ["Tribe recipe card – Week 24"], "kind": "card", "pesc_plan": false, "slots": [], "id": "carrot cake muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Cheesy Cauliflower Bake", "serves": "4", "time": "45 min", "time_detail": "30-40 min 45 min", "cal": "217", "fat": "12", "protein": "15", "netcarbs": "10", "fibre": "4", "ingredients": [{"t": "1 medium cauliflower head (approx. 580 g)"}, {"t": "200 g light ricotta cheese"}, {"t": "3/4 cup almond milk"}, {"t": "2 tbsp nutritional yeast"}, {"t": "1/2 cup shredded tasty/cheddar cheese"}, {"t": "1/2 tbsp olive oil"}, {"t": "1 small onion"}, {"t": "3 garlic cloves"}, {"t": "1/2 tsp salt"}, {"t": "1/2 tsp pepper"}], "steps": [{"t": "Preheat oven to 180°C and grease a baking dish."}, {"t": "Chop cauliflower into pieces and steam until tender."}, {"t": "While the cauliflower is steaming, finely slice onion and mince garlic cloves."}, {"t": "Sauté onion and garlic with 1/2 tbsp olive oil on medium heat until onions are translucent."}, {"t": "Add cauliflower, onion, and garlic to the base of your baking dish."}, {"t": "Whisk together the ricotta, almond milk, nutritional yeast, salt, and pepper until smooth. Pour the mixture evenly over the cauliflower."}, {"t": "Top with shredded cheese and bake for 35-40 minutes, until golden on top."}, {"t": "Remove from the oven and serve."}], "tips": [{"h": "Bec’s Tips", "t": "Add chicken and spinach to the baking dish for a complete meal or serve with a protein of your choice. Dairy free? Blend 75 g of nut cheese with the almond milk for the filling and top with 3 tbsp of hemp seeds blitzed with 1 tbsp of additional nutritional yeast to make a crispy cheese topping. Dairy free Macros: Calories: 213, Protein: 11g, Fat: 13g, Net carbs: 9g, Fibre: 5g."}], "sources": ["Tribe recipe card – Week 25"], "kind": "card", "pesc_plan": false, "slots": [], "id": "cheesy cauliflower bake", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Chocolate Truffles", "serves": "15", "time": "30 min", "time_detail": "", "cal": "126", "fat": "10", "protein": "5", "netcarbs": "2", "fibre": "1", "ingredients": [{"t": "8 x squares Lindt 85% chocolate (80g)"}, {"t": "1/2 cup light coconut cream"}, {"t": "1 tsp coconut oil"}, {"t": "1/2 tsp vanilla extract"}, {"t": "1 shot of coffee or 2 tsp coffee granules dissolved in 1 tbsp boiling water"}, {"t": "3/4 cup almond meal"}, {"t": "40 g vegan protein powder of choice"}, {"t": "1/4 cup hemp seeds"}, {"t": "2 tbsp coconut flour"}, {"t": "2 tbsp stevia"}, {"h": "Chocolate Coating"}, {"t": "5 x squares Lindt 85% dark chocolate (50g)"}, {"t": "1/3 tsp coconut oil"}], "steps": [{"t": "Melt 80g dark chocolate with 1 tsp coconut oil in a double boiler."}, {"t": "Add coconut cream, coffee and vanilla extract. Whisk gently until smooth."}, {"t": "Remove from the heat and stir through almond meal, protein powder, coconut flour, stevia and hemp seeds."}, {"t": "Once combined, place the mixture into the fridge for approximately 15 minutes to harden slightly."}, {"t": "Prepare a container lined with baking paper while you wait."}, {"t": "Remove chocolate mixture from the fridge, scoop into 15 even sized"}, {"t": "portions and roll into balls. Place truffles in the freezer while you prepare chocolate coating."}, {"t": "Melt 40g dark chocolate with 1/3 tsp coconut oil until smooth."}, {"t": "Remove truffles from the freezer, dip in chocolate coating and set in the fridge for at least 30 minutes."}, {"t": "Store chocolate truffles in the fridge. They can be left at room temperature for approximately 1 hour (on a hot day they may start to melt sooner)."}], "tips": [{"h": "Bec’s Tips", "t": "I use a small cookie scoop for perfectly symmetric sized balls. I use decaf coffee for this recipe to minimise caffeine intake. You can’t actually taste the coffee it just gives the chocolate a richer flavour."}], "sources": ["Tribe recipe card – Week 26"], "kind": "card", "pesc_plan": false, "slots": [], "id": "chocolate truffles", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Paleo, Sugar Free Granola", "serves": "8", "time": "20 min", "time_detail": "10 min 10 min 20 min", "cal": "296", "fat": "27", "protein": "9", "netcarbs": "3", "fibre": "5", "ingredients": [{"t": "1 cup almonds (140 g)"}, {"t": "¼ cup pepitas (30 g)"}, {"t": "¼ cup hazelnuts (35 g)"}, {"t": "½ cup macadamias (1/2 cup)"}, {"t": "6 tbsp desiccated coconut"}, {"t": "3 tbsp coconut oil"}, {"t": "½ tsp cinnamon"}, {"t": "¼ tsp vanilla extract"}, {"t": "1 tsp stevia"}, {"t": "30 g vanilla protein powder)"}], "steps": [{"t": "Preheat fan forced oven to 180 degrees Celsius"}, {"t": "Line a baking tray with baking paper"}, {"t": "Chop all nuts roughly and combine in a mixing bowl with coconut and protein powder."}, {"t": "In a small bowl combine the coconut oil, stevia, vanilla and cinnamon and melt in the microwave"}, {"t": "Pour the melted coconut mixture over the nuts and mix until evenly coated."}, {"t": "Pour nut mix onto the baking tray and place in the oven for around 10 minutes (watch carefully so that they don’t burn!) You just want them to be lightly roasted! Then remove from oven, allow to cool and place in a container of your choice!"}], "tips": [{"h": "Bec’s Tips", "t": "A serve is 1/4 cup. Serve with berries and 2 big spoonful’s of coconut yogurt or 1/3 cup plain Greek yogurt for breakfast. Or, just enjoy half a serve (approx. 2 tbsp) as a snack!"}], "sources": ["Tribe recipe card – Week 27"], "kind": "card", "pesc_plan": false, "slots": [], "id": "paleo sugar free granola", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Za’atar Salmon with Fennel, Carrot & Almonds", "serves": "2", "time": "15 min", "time_detail": "10 min 5 min 15 min", "cal": "474", "fat": "30", "protein": "31", "netcarbs": "15", "fibre": "9", "ingredients": [{"t": "2 salmon fillets (250g)"}, {"t": "1 tsp coconut oil"}, {"t": "1 tbsp za’atar"}, {"t": "1 fennel"}, {"t": "1 carrot"}, {"t": "2 cups fresh spinach"}, {"t": "14 almonds"}, {"t": "2 tbsp olive oil"}, {"t": "1 tsp cumin"}, {"t": "1 lime"}, {"t": "1 tbsp tomato paste"}, {"t": "1/4 tsp chilli powder"}, {"t": "½ tsp salt"}, {"t": "½ tsp pepper"}, {"t": "1 small bunch mint"}], "steps": [{"t": "Rub the salmon in the za’atar, a pinch of salt and a grind of pepper and leave to the side."}, {"t": "Grate fennel and carrots, pour over the juice of 1/2 a lime and leave to the side."}, {"t": "In a jam jar or glass mix the olive oil, cumin, chilli, 1/2 lime juice, tomato paste and a pinch of salt together. Mix well then pour over the grated veggies, together with the spinach in this dressing!"}, {"t": "Heat a pan on a medium heat and pop 1 tsp of coconut oil in the pan."}, {"t": "Once hot, place the salmon in and fry fillets for 3 minutes skin side down then flip to the left side for a minute, the top face down for a minute then the other side for a minute."}, {"t": "Crush the almonds slightly with a knife."}, {"t": "Serve salmon ontop of the salad with the crushed almonds and some fresh mint!"}], "tips": [{"h": "Bec’s Tips", "t": "Don’t like fennel? Swap this to celery (2 large stalks cut into fine slices) or bok choy stems (2-3 bulbs cut into fine slices!). If you use bok-choy, you could use the leaves in place of the spinach."}], "sources": ["Tribe recipe card – Week 28"], "kind": "card", "pesc_plan": false, "slots": [], "id": "za atar salmon fennel carrot almonds", "cats": ["Mains"], "tags": ["Fish & seafood", "15 min or less", "Tribe recipe card"]}, {"title": "Thai Chicken Meatballs", "serves": "24", "time": "40 min", "time_detail": "20 min 20 min 40 min", "cal": "36", "fat": "2", "protein": "4", "netcarbs": "1", "fibre": "1", "ingredients": [{"t": "500 g chicken mince"}, {"t": "1 garlic clove, crushed"}, {"t": "2 tbsp fresh ginger, grated"}, {"t": "3 kaffir lime leaves, chopped"}, {"t": "1 tbsp coriander leaves, chopped"}, {"t": "1 tbsp mint leaves, chopped"}, {"t": "1.5 tbsp fish sauce"}, {"t": "1 tbsp lime juice"}, {"t": "1 small chili, chopped"}, {"t": "1 tbsp sesame oil"}, {"t": "1 tsp stevia MACROS PER BALL (i.e. 24 BALLS)"}], "steps": [{"t": "Combine the chicken mince, crushed garlic, grated ginger, and chopped kaffir lime leaves, mint and coriander into a bowl."}, {"t": "Using clean hands, roll level tablespoons of mixture into balls and then place on a large plate. Refrigerate for 30 minutes."}, {"t": "Meanwhile, stir together the fish sauce, lime juice, stevia and chopped chili in a small bowl to create a dipping sauce."}, {"t": "Heat the sesame oil in a large, non-stick frying pan over medium heat. Cook meatballs in 2 batches, turning for 10 minutes or until they are lightly"}, {"t": "golden and cooked through."}], "tips": [{"h": "Bec’s Tips", "t": "Serving suggestion as snack / for a platter: serve as an entrée for your guests, or on a platter amongst other foods. Recommended serve for snack: 4 balls (144 kcal) Serving suggestion as a meal: Serve on top of a big bowl of steamed Asian greens with 1 tbsp olive oil, a heaped tbsp yoghurt and 10-12 chopped almonds. Recommended serve for a meal: 6 balls (216 kcal alone, approx. 450 kcal with greens, olive oil, yoghurt and almonds)"}], "sources": ["Tribe recipe card – Week 29"], "kind": "card", "pesc_plan": false, "slots": [], "id": "thai chicken meatballs", "cats": ["Mains"], "tags": ["Chicken", "Tribe recipe card"]}, {"title": "Mini Breakfast Frittatas", "serves": "4", "time": "30 min", "time_detail": "25 min 30 min", "cal": "244", "fat": "18", "protein": "17", "netcarbs": "5", "fibre": "3", "ingredients": [{"t": "10 eggs"}, {"t": "1/2 cup coconut milk"}, {"t": "1 tbsp fresh basil"}, {"t": "1/4 cup red capsicum"}, {"t": "1/4 onion"}, {"t": "2 cup broccoli"}, {"t": "1/4 cup cheese (optional)"}, {"t": "1/2 tsp salt"}, {"t": "1/2 tsp pepper"}], "steps": [{"t": "Preheat oven to 175°C."}, {"t": "Whisk eggs and coconut milk together in a large bowl."}, {"t": "Add in all the chopped vegetables and mix through the egg mixture. Season with salt and pepper."}, {"t": "Pour the batter into greased silicon muffin moulds or muffin cups, this makes 12 small muffins. If using, top with 1/4 cup of cheese."}, {"t": "Bake for 25-30 minutes until the middle of the muffins isn’t liquid anymore."}], "tips": [{"h": "Bec’s Tips", "t": "Add 1/4 cup mozzarella, feta, cheddar, or vegan cheese if desired. If you are not strictly dairy free - swap the coconut milk to regular milk or cream if desired. Feel free to sub in any low carb veggies you like or have on hand. The coconut milk used is canned coconut milk."}], "sources": ["Tribe recipe card – Week 30"], "kind": "card", "pesc_plan": false, "slots": [], "id": "mini breakfast frittatas", "cats": ["Breakfast"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Miso Sesame Greens", "serves": "2", "time": "10 min", "time_detail": "", "cal": "209", "fat": "12", "protein": "9", "netcarbs": "13", "fibre": "7", "ingredients": [{"t": "1/2 head broccoli"}, {"t": "2 cups sugar-snap peas"}, {"t": "1 tsp coconut oil"}, {"t": "1 tbsp white miso paste"}, {"t": "1 tbsp tamari"}, {"t": "2 tsp dijon mustard"}, {"t": "1 tbsp sesames oil"}, {"t": "1 tbsp sesame seeds"}, {"t": "1 tsp stevia"}, {"t": "1 tsp fresh ginger, grated"}, {"t": "1/2 cup water"}], "steps": [{"t": "Add all miso sauce ingredients into a bowl and whisk (miso paste, tamari, dijon mustard, sesame oil, sesame seeds, stevia, ginger and warm water). Set aside."}, {"t": "Chop broccoli into florets and top and tail the peas."}, {"t": "In a large pan or wok, heat 1 tbsp coconut oil on medium-high heat."}, {"t": "When the pan is hot, add the greens and stir-fry them until they start to soften."}, {"t": "When nearly cooked, add in 3/4 of the miso sauce (save the rest for the end)."}, {"t": "Serve with protein of choice, then drizzle with remaining miso sauce and sprinkle with sesame seeds!"}], "tips": [], "sources": ["Tribe recipe card – Week 31"], "kind": "card", "pesc_plan": false, "slots": [], "id": "miso sesame greens", "cats": ["Mains"], "tags": ["Vegetarian", "15 min or less", "Tribe recipe card"]}, {"title": "Thai Char-Grilled Lamb", "serves": "4", "time": "20 min", "time_detail": "10 min 10 min 20 min", "cal": "422", "fat": "29", "protein": "29", "netcarbs": "8", "fibre": "4", "ingredients": [{"t": "¼ cup coconut cream"}, {"t": "3 heaped tbsp red curry paste"}, {"t": "30 mL lime juice"}, {"t": "Dash salt"}, {"t": "Dash pepper"}, {"t": "1 tbsp olive oil"}, {"t": "8 lamb cutlets (approx. 700 g total)"}, {"t": "1 tsp stevia"}, {"t": "150 g sugar snap peas"}, {"t": "125 g green beans"}, {"t": "½ large red onion, diced"}, {"t": "1/2 cup thai basil leaves"}, {"t": "1 lime"}], "steps": [{"t": "Boil a pot to steam/blanch the peas and beans in."}, {"t": "Trim sugar snap peas and the green beans. slice the green beans lengthways into strips."}, {"t": "Place the coconut cream, 2 tbsp curry paste, a squeeze of the lime juice (about 1 tbsp), salt and pepper in a large bowl and mix to combine. Add the lamb and toss to coat. Set aside to marinate for 15 minutes."}, {"t": "When water is boiling, add peas and beans and cook until bright green and just lightly blanched (only 1 minute or so!) You still want the crunch."}, {"t": "While the lamb is marinating, place the olive oil, stevia, remaining curry"}, {"t": "paste and another big squeeze of lime juice in a large bowl and whisk to combine. Add the sugar snap peas, beans, diced onion and basil and gently toss to coat. Set aside."}, {"t": "Preheat a char-grill pan over medium heat. Cook the lamb for 4 minutes each side or until charred and just cooked through."}, {"t": "Serve the lamb with the salad and lime wedges!"}], "tips": [{"h": "Bec’s Tips", "t": "Add extra chili if desired (optional) A dash of tamari or coconut aminos on the salad is great also (optional) Swap red curry paste to green for a change if you like! Great for the whole family, perhaps add potatoes or steamed rice for kids and partner."}], "sources": ["Tribe recipe card – Week 32"], "kind": "card", "pesc_plan": false, "slots": [], "id": "thai char grilled lamb", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Tribe recipe card"]}, {"title": "Summer Berry Crumble", "serves": "9", "time": "50 min", "time_detail": "", "cal": "272", "fat": "24", "protein": "6", "netcarbs": "3", "fibre": "4", "ingredients": [{"h": "For The Crumble"}, {"t": "100g, butter, chilled"}, {"t": "2 cups superfine blanched almond flour"}, {"t": "2 tablespoons psyllium husk powder"}, {"t": "1/8 teaspoon salt"}, {"t": "2 tablespoons granulated monk fruit"}, {"t": "Pinch lemon zest"}, {"h": "For The Filling"}, {"t": "4 cups mixed berries"}, {"t": "1/4 cup granulated monk fruit"}, {"t": "1 teaspoon ground cinnamon"}, {"t": "1 teaspoon vanilla extract"}], "steps": [{"t": "Preheat the oven to 180 deg."}, {"t": "Combine the crumble ingredients in a medium sized bowl and use your fingers to rub the butter through the dry ingredients until it resembles wet sand. Set aside in the fridge."}, {"t": "Meanwhile, combine all of the filling ingredients in a large bowl and stir."}, {"t": "Tip the berries into an oven safe baking dish and spread them evenly."}, {"t": "Scatter over the crumble mixture evenly (you don’t have to use all the mixture either, save the rest in the freezer for another day)."}, {"t": "Bake in the oven for 30 – 35 minutes, turning half way or until the top is golden brown and the berries are softened. Depending on how thick your layer of crumble is, the cooking time may vary."}, {"t": "Remove and cool for 15 minutes before serving."}, {"t": "Store leftovers in an airtight container in the refrigerator for up to 1 week or in the freezer for up to 1 month."}], "tips": [], "sources": ["Tribe recipe card – Week 33"], "kind": "card", "pesc_plan": false, "slots": [], "id": "summer berry crumble", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Pan-Fried Veggies with Tahini & Hemp Seeds", "serves": "2", "time": "15 min", "time_detail": "5 min 10 min 15 min", "cal": "460", "fat": "31", "protein": "24", "netcarbs": "20", "fibre": "14", "ingredients": [{"t": "1 tsp coconut oil or ghee"}, {"t": "1 garlic glove, crushed"}, {"t": "8 spears asparagus"}, {"t": "½ head broccoli"}, {"t": "1 red capsicum"}, {"t": "1 medium zucchini"}, {"t": "3 tbsp tahini"}, {"t": "1 tbsp lemon juice"}, {"t": "1 tbsp water"}, {"t": "4 tbsp hemp seeds"}, {"t": "4 cups fresh spinach leaves"}, {"t": "1 tsp chili flakes (optional)"}, {"t": "10 almonds, chopped"}, {"t": "Salt & pepper to season"}], "steps": [{"t": "Rinse and chop all veggies into small pieces. The smaller you chop, the faster they will cook!"}, {"t": "Heat a pan over medium-high heat and spoon on the coconut oil or ghee to cover the pan evenly."}, {"t": "When hot, throw in veggies and crushed garlic."}, {"t": "Meanwhile, quickly whisk together the tahini, lemon juice and water! It just needs to be a nice smooth consistency to make it “drizzle-able”. Add more water if you need."}, {"t": "Return to the veggies and continue to stir them until cooked through."}, {"t": "Assemble spinach leaves in 2 bowls then remove veggies from pan and divide them ontop of the two bowls of spinach. Then, pour half of the tahini dressing over the top of each. Lastly, sprinkle each bowl with 2 tbsp hemp seeds, a generous amount of salt and pepper, 5 chopped almonds and chili if you like!"}], "tips": [{"h": "Bec’s Tips", "t": "This meal is so great to make for dinner and have for lunch the next day. Make your second bowl in a takeaway container! The vegetables can be changed to any other vegetable in the Eating Guidelines Table. If you were to make this for 1, halve everything (ie it would be 1.5 tbsp tahini etc)."}], "sources": ["Tribe recipe card – Week 34"], "kind": "card", "pesc_plan": false, "slots": [], "id": "pan fried veggies tahini hemp seeds", "cats": ["Mains"], "tags": ["Vegetarian", "15 min or less", "Tribe recipe card"]}, {"title": "Low Carb Blueberry Loaf", "serves": "8", "time": "50 min", "time_detail": "", "cal": "173", "fat": "14", "protein": "6", "netcarbs": "1", "fibre": "3", "ingredients": [{"t": "50 g butter or coconut oil"}, {"t": "3 eggs"}, {"t": "1/4 cup almond milk"}, {"t": "1 tsp vanilla extract"}, {"t": "1 cup almond meal"}, {"t": "1/4 cup coconut flour"}, {"t": "2 tsp baking powder"}, {"t": "1/2 tsp cinnamon"}, {"t": "1/4 tsp salt (if butter is unsalted)"}, {"t": "1/4 cup stevia or granulated sweetener"}, {"t": "3/4 cup blueberries"}], "steps": [{"t": "Preheat oven to 170°C and line a loaf tin with baking paper."}, {"t": "Melt the butter or coconut oil and set aside to cool."}, {"t": "In a mixing bowl, combine almond meal, coconut flour, stevia, baking"}, {"t": "powder, cinnamon and salt."}, {"t": "In a separate bowl, whisk together the eggs, almond milk and vanilla extract."}, {"t": "Pour the dry ingredients into the wet, then add melted coconut oil or butter. Gently fold through the blueberries."}, {"t": "Transfer the mixture to your lined loaf tin and use the back of a spoon to smooth the top."}, {"t": "Bake for 35-40 minutes or until cooked through."}, {"t": "Allow to cool for 20 minutes before transferring to a wire cooling rack."}, {"t": "Once completely cool, slice the loaf into 8 pieces and serve straight away or store in an airtight container for up to 5 days."}], "tips": [{"h": "Bec’s Tips", "t": "Feel free to add 1-2 scoops of collagen to the dry mixture to bump up protein. Freeze individual portions for a quick snack or breakfast! To enjoy as a breakfast or snack, serve with 1/2 cup extra berries, 1/4 cup yoghurt and 1 tbsp chia seeds to bump up the protein and fibre. This will give you a meal with these macros (Calories: 338, protein: 11 g, fibre: 11 g, fat: 22 g, net carbs: 13 g)"}], "sources": ["Tribe recipe card – Week 35"], "kind": "card", "pesc_plan": false, "slots": [], "id": "low carb blueberry loaf", "cats": ["Mains"], "tags": ["Vegetarian", "Tribe recipe card"]}, {"title": "Keto Spaghetti Carbonara", "serves": "2", "time": "15 min", "time_detail": "", "cal": "475", "fat": "34", "protein": "30", "netcarbs": "6", "fibre": "8", "ingredients": [{"t": "1 tsp butter"}, {"t": "4 slices bacon (approx. 100 g)"}, {"t": "1/3 cup parmesan cheese"}, {"t": "2 large egg yolks"}, {"t": "1 large clove garlic"}, {"t": "1/2 cup chopped parsley"}, {"t": "1 box Slendier Soy Bean Fettuccini or Spaghetti"}], "steps": [{"t": "Boil a large pot of water to cook pasta."}, {"t": "In the meantime, dice bacon, chop parsley and prepare garlic"}, {"t": "When water is boiling, add pasta and cook for 3 minutes. Drain and set aside"}, {"t": "In a deep pan over medium heat, melt the butter."}, {"t": "Throw in the bacon and cook until nice and crispy."}, {"t": "In the meantime, in a separate bowl, beat together your eggs and ¾ of your cheese."}, {"t": "Add in the minced garlic to the pan, then drop the pasta into the pan, turn it down to medium-low and stir well to combine."}, {"t": "Once the pasta is very hot, turn off the heat and immediately stir in the egg/cheese mixture. Make sure that the eggs do not scramble, but thicken into a velvety sauce."}, {"t": "Serve immediately, topping with parsley and the rest of your cheese, salt and pepper!"}], "tips": [{"h": "Bec’s Tips", "t": "Save egg whites to make a protein pancake or the one minute breakfast pudding in the morning!"}], "sources": ["Tribe recipe card – Week 36"], "kind": "card", "pesc_plan": false, "slots": [], "id": "keto spaghetti carbonara", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "15 min or less", "Tribe recipe card"]}, {"title": "Low Carb Chocolate Brownies", "serves": "9", "time": "30 min", "time_detail": "+ cooling time", "cal": "183", "fat": "16", "protein": "5", "netcarbs": "2", "fibre": "2", "ingredients": [{"t": "1 cup almond meal"}, {"t": "2⁄³ cup stevia or monk fruit"}, {"t": "¼ cup cacao or cocoa powder"}, {"t": "1 tsp baking powder"}, {"t": "¼ tsp salt"}, {"t": "1 sachet of BYS coffee"}, {"t": "75g butter or coconut oil"}, {"t": "2 eggs"}, {"t": "1 tsp vanilla extract"}, {"t": "3 tbsp water"}, {"t": "4 x squares Lindt 85% chocolate"}], "steps": [{"t": "Preheat the oven to 180C and line a baking tin with paper."}, {"t": "Melt butter or coconut oil and set aside."}, {"t": "Combine almond meal, stevia, cacao powder, baking powder, salt and BYS coffee (if using) in a medium sized mixing bowl."}, {"t": "Add eggs, vanilla extract, water and butter or coconut oil to the dry ingredients and mix well."}, {"t": "Transfer the batter to your lined brownie tin and use the back of a spoon to spread the batter to the edges and smooth the top."}, {"t": "Break chocolate into pieces and place on top of the brownie batter."}, {"t": "Bake for 20 minutes, remove from the oven and allow to cool completely at room temperature. The brownies will harden as they cool so you need to be patient."}, {"t": "Slice into 9 pieces and store in an airtight container at room temperature or in the fridge for up to 5 days."}], "tips": [{"h": "Bec’s Tips", "t": "I use a 20 x 20cm baking tin. BYS coffee is completely optional but really enhances the chocolate flavour. You can use regular or decaf. Feel free to add a scoop of unflavoured or vanilla/ chocolate collagen as it will dissolve straight into the batter. Brownie slices can be wrapped individually in glad wrap and put in the freezer for up to 3 months."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "low carb chocolate brownies", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Orange and Almond Cake", "serves": "9", "time": "50 min", "time_detail": "25 min cook, 10 min cool", "cal": "163", "fat": "13", "protein": "6", "netcarbs": "3", "fibre": "3", "ingredients": [{"t": "½ cup almond meal"}, {"t": "½ cup coconut flour"}, {"t": "2⁄³ cup stevia or monk fruit"}, {"t": "1 tsp baking powder"}, {"t": "¼ tsp baking soda"}, {"t": "¼ tsp salt"}, {"t": "¾ cup almond milk"}, {"t": "2 tsp apple cider vinegar"}, {"t": "2 tbsp coconut oil, melted or liquid"}, {"t": "3 eggs"}, {"t": "2 tbsp butter, melted"}, {"t": "2 tbsp fresh orange juice"}, {"t": "Zest from ½ orange"}, {"h": "Frosting"}, {"t": "115 g cream cheese, softened"}, {"t": "60 g thick Greek yoghurt"}, {"t": "¼ cup powdered stevia"}, {"t": "1 tsp vanilla extract"}, {"t": "Optional: Orange zest"}], "steps": [{"t": "Preheat the oven to 160C fan forced or 180C regular and line a baking pan."}, {"t": "Combine almond meal, coconut flour, stevia, baking powder and baking soda."}, {"t": "In a separate mixing bowl, combine almond milk with apple cider vinegar to create a buttermilk and allow to sit for 5 minutes."}, {"t": "While the buttermilk rests, zest, and juice half of an orange."}, {"t": "Add eggs, coconut oil, vanilla, orange juice and zest to the buttermilk mixture and whisk until combined."}, {"t": "Add wet ingredients to the dry mix and begin to stir."}, {"t": "Melt butter and add to the cake batter while mixing, until combined."}, {"t": "Pour batter into the baking pan and bake for approximately 25 minutes or until edges have just started to brown."}, {"t": "Remove from the oven and allow to sit for 10 minutes before transferring to a cooling rack."}, {"t": "While the cake cools, prepare the frosting. Add cream cheese, yoghurt, stevia, and vanilla extract to a small mixing bowl."}, {"t": "Whisk all ingredients until smooth and creamy. Refrigerate until the cake is ready to frost."}, {"t": "Spread frosting evenly over the cake and top with orange zest, if using. Slice into 9 pieces and serve or store in the fridge."}], "tips": [{"h": "Bec’s Tips", "t": "I used an 8 x 8 square baking pan, a round cake pan will work too. Substitute cream cheese and yoghurt with vegan cream cheese and coconut yoghurt for a dairy free version. If the frosting becomes too firm in the fridge whilst waiting for the cake to cool, take it out of the fridge and leave on the kitchen counter for 10 mins to soften a little."}], "sources": ["Eat Cake, L
