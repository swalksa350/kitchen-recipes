d Salmon with Rocket, Spinach, Walnut and Pomegranate Salad", "serves": "2", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "512", "fat": "35", "protein": "32", "netcarbs": "9", "fibre": "5", "ingredients": [{"h": "For The Salmon"}, {"t": "2 x 125 g salmon fillets, skinless"}, {"t": "Pinch salt"}, {"t": "4 tbsp Dijon mustard"}, {"h": "For The Salad"}, {"t": "1½ tbsp olive oil"}, {"t": "1½ tbsp white wine vinegar"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "100 g baby rocket"}, {"t": "100 g baby spinach"}, {"t": "45 g walnuts"}, {"t": "60 g pomegranate arils"}], "steps": [{"h": "For The Salmon"}, {"t": "Preheat the oven to 180°C fan-forced / 360°F. Prepare a baking tray with baking paper."}, {"t": "Pat your salmon fillets dry with a paper towel."}, {"t": "Place salmon on the baking tray. Season with salt, then spread the Dijon mustard evenly over the top of each fillet."}, {"t": "Bake for 12–15 minutes, or until cooked to your liking, and the salmon flakes easily with a fork."}, {"h": "For The Salad"}, {"t": "To make the dressing, whisk the olive oil, vinegar, salt, and pepper together."}, {"t": "In a medium bowl, combine all remaining salad ingredients. Add the dressing and toss well."}, {"t": "Divide the salad between serving plates, top with salmon fillets, and serve."}], "tips": [{"h": "Ingredient Tips", "t": "If you’re nut free, swap the walnuts for 4 tbsp pumpkin seeds."}, {"h": "Bec’s Tips", "t": "This dish is dinner party friendly, so double it for a night in with your favourite people. The pomegranate arils are a delicious addition, however if you can’t find them, feel free to leave them out!"}], "sources": ["Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "mustard crusted salmon rocket spinach walnut pomegranate salad", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Prawn & Pesto Pasta", "serves": "2", "time": "15 min", "time_detail": "10 min prep + 5 m 2", "ingredients": [{"t": "¼ small brown onion"}, {"t": "¼ red capsicum"}, {"t": "¼ green capsicum"}, {"t": "30 g cheddar cheese"}, {"t": "2 eggs"}, {"t": "1 egg white"}, {"t": "1 tsp butter"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Dice the onion, and both capsicums. Grate the cheese."}, {"t": "In a bowl, whisk together the eggs and egg whi te."}, {"t": "Heat butter in a small frying pan over medium heat. Add the onion and capsicums, sauté for 2 minutes until softened."}, {"t": "Pour the egg mixture into the pan and allow to slightly set. Lift up an edge, tilt the pan to allow the egg to run under the omelette. Repeat a few times around the edges of the omelette until no runny egg remains."}, {"t": "Sprinkle cheese over half of the omelette, then carefully fold it over."}, {"t": "Reduce heat to medium-low and cook for a few more minutes to melt the cheese and finish cooking the eggs."}, {"t": "Remove from the pan and season with salt and pepper."}], "tips": [{"h": "Ingredient Tips", "t": "This is a great fridge clear out recipe! Use any leftover vegetables you have (doesn't have to be capsicums). Mushrooms, spinach, and cherry tomatoes are great options. To make this dairy free, swap the butter for 1 tsp olive oil and the cheese to 1 tbsp nutritional yeast."}], "sources": ["Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "confetti omelette", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "10 Minute Cajun Cauliflower Tofu Rice", "serves": "1", "time": "10 min", "time_detail": "5 min prep + 5 min cook", "cal": "419", "fat": "25", "protein": "30", "netcarbs": "15", "fibre": "14", "ingredients": [{"t": "100 g firm organic tofu"}, {"t": "1 tbsp cashews"}, {"t": "285 g frozen spinach"}, {"t": "1 tbsp coconut oil"}, {"t": "1 tsp garlic powder"}, {"t": "½ tsp Cajun seasoning"}, {"t": "1 tbsp tamari"}, {"t": "1 cup cauliflower rice"}, {"t": "¼ tsp chilli flakes (optional)"}, {"t": "1 lime wedge"}], "steps": [{"t": "Dice the tofu into small cubes. Chop the cashews. Defrost the spinach in the microwave, then squeeze out excess liquid."}, {"t": "Heat a large frying pan over medium-high heat and add the coconut oil."}, {"t": "Add the tofu and cook, stirring occasionally, until lightly golden on all sides."}, {"t": "Add the garlic powder, Cajun seasoning, tamari, spinach, and cauliflower rice, then stir until well combined and heated through."}, {"t": "Transfer to a serving plate and top with cashews, chilli flakes (if using), and a squeeze of lime."}], "tips": [{"h": "Bec’s Tips", "t": "I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater."}], "sources": ["Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "10 minute cajun cauliflower tofu rice", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian", "15 min or less"]}, {"title": "Fragrant Tofu Laksa Curry", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "421", "fat": "24", "protein": "29", "netcarbs": "6", "fibre": "18", "ingredients": [{"t": "300 g firm organic tofu"}, {"t": "150 g pak choy"}, {"t": "100 g snow peas"}, {"t": "½ tsp extra virgin olive oil"}, {"t": "2 tbsp Laksa curry paste"}, {"t": "135 ml canned coconut milk"}, {"t": "1 cup vegetable stock"}, {"t": "½ tbsp fish sauce"}, {"t": "100 g bean sprouts"}, {"t": "250 g Slendier konjac spaghetti style (drained)"}, {"t": "½ cup fresh coriander"}, {"t": "1 tbsp fresh mint"}, {"t": "1 tbsp fresh basil"}, {"t": "1 tbsp lime juice"}, {"t": "½ fresh red chilli (optional)"}], "steps": [{"t": "Chop the tofu into 3 cm cubes. Trim the base of the pak choy then separate all the leaves. Trim the ends off the snow peas."}, {"t": "He g water for 1 minute, until just tender but still slightly crisp. Drain well."}, {"t": "Return the salmon to the pan and spoon over the sauce to coat."}, {"t": "Divide the zucchini noodles between bowls. Top with salmon and spoon over the creamy sauce. Sprinkle with fresh basil to serve."}], "tips": [{"h": "Bec’s Tips", "t": "This is a super simple dinner, yet it’s so delicious it deserves a spot on any fancy dinner table!"}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "creamy tuscan salmon", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Caramalised Miso Cabbage with Whipped Tofu", "serves": "2", "time": "45 min", "time_detail": "10 min prep + 35 min cook", "cal": "477", "fat": "30", "protein": "30", "netcarbs": "6", "fibre": "15", "ingredients": [{"t": "1 small green cabbage"}, {"t": "½ spring onion (dark green part only)"}, {"t": "4 tsp sesame oil"}, {"t": "2 tbsp white miso paste"}, {"t": "4 tsp tamari"}, {"t": "1 tsp monk fruit blend"}, {"t": "1 tsp onion powder"}, {"t": "½ tsp chilli flakes (optional)"}, {"t": "1 tsp salt"}, {"t": "250 g firm organic tofu"}, {"t": "2 tbsp hulled tahini"}, {"t": "3 tbsp lemon juice"}, {"t": "2 cloves garlic"}, {"t": "1 tbsp sesame seeds"}], "steps": [{"t": "Cut the cabbage into four wedges. Thinly slice the spring onion."}, {"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a roasting tray with baking paper."}, {"t": "Brush half the sesame oil all over the cabbage wedges. Arrange on the prepared tray, pointed side facing up, and roast for 15 minutes, until beginning to brown on the edges."}, {"t": "Mix miso, tamari, monk fruit, onion powder, chilli flakes (if using), half the salt, and remaining sesame oil. Reserve 1½ tablespoons and set aside. Brush the rest all over the cabbage and roast for another 15–20 minutes, until deeply browned and soft."}, {"t": "Meanwhile, mix the reserved miso mixture with 1 tablespoon of water to make a sauce."}, {"t": "Into a food processor, add the tofu, tahini, lemon juice, garlic, remaining salt, and 4 tablespoon water. Blend until smooth."}, {"t": "Spread the whipped tofu onto two serving dishes and top each with the roasted cabbage. Drizzle over any roasting juices from the pan and the reserved miso mixture. Sprinkle over the sesame seeds and spring onion. Serve hot."}], "tips": [], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "caramalised miso cabbage whipped tofu", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Banana Mug Cake", "serves": "1", "time": "3 min", "time_detail": "1 min prep + 2 min cook", "cal": "340", "fat": "27", "protein": "12", "netcarbs": "9", "fibre": "6", "ingredients": [{"t": "1 tbsp butter"}, {"t": "¼ medium banana"}, {"t": "2 tbsp almond meal"}, {"t": "1 tbsp almond butter"}, {"t": "1 egg white"}, {"t": "¼ tsp baking powder"}, {"t": "Pinch salt"}, {"t": "¼ tsp vanilla extract"}, {"t": "½ tbsp coconut flour"}, {"t": "¼ tsp cinnamon"}, {"t": "1 tsp monk fruit blend (optional)"}, {"h": "To Serve"}, {"t": "1 tbsp coconut yoghurt"}], "steps": [{"t": "Melt the butter in a large microwave-safe mug."}, {"t": "Slice a few pieces of the banana and set aside for serving. Mash the remaining banana."}, {"t": "Add the mashed banana and all remaining ingredients to the mug and mix well. The batter should be slightly thicker than pancake batter – add a splash of almond milk or water if needed."}, {"t": "Microwave for 90 seconds."}, {"t": "Serve warm topped with the coconut yoghurt and the banana slices."}], "tips": [{"h": "Ingredient Tips", "t": "Coconut yoghurt can be swapped to Greek yoghurt if tolerated. Sensitive or intolerant to eggs? Swap the egg white to a gluten-free egg replacer and follow the preparation instructions on the product label. The sweetness will depend on your banana’s ripeness, however you can add monk fruit blend to taste if you prefer it sweeter. Don't have almond butter, try this with peanut butter instead!"}, {"h": "Bec’s Tips", "t": "I love to use frozen banana pieces in this recipe – I always have some in my freezer!"}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "banana mug cake", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Roast Pumpkin Pasta", "serves": "2", "time": "45 min", "time_detail": "10 min prep + 35 min cook", "cal": "346", "fat": "19", "protein": "24", "netcarbs": "15", "fibre": "10", "ingredients": [{"t": "1 tbsp pine nuts"}, {"t": "250 g butternut pumpkin"}, {"t": "2 garlic cloves"}, {"t": "1½ tbsp extra virgin olive oil"}, {"t": "2 tbsp Greek yoghurt, plain, non-fat"}, {"t": "1 tbsp nutritional yeast"}, {"t": "¼ tsp smoked paprika"}, {"t": "½ tsp dried rosemary"}, {"t": "½ cup vegetable stock"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "200 g Slendier Legume Pasta"}, {"t": "200 g baby spinach"}], "steps": [{"t": "Preheat the oven to 180°C fan-forced / 350°F. Line a baking tray with baking paper."}, {"t": "Heat a pan over medium heat and lightly toast the pine nuts for a few minutes, stirring often, until golden."}, {"t": "Peel and chop the pumpkin into cubes. Cut the ends off the garlic cloves (leaving the skin on) and set aside."}, {"t": "Add the pumpkin to the tray, drizzle with ½ tbsp of olive oil. Bake for 15 minutes, then remove from the oven, add the garlic cloves, and bake for a further 20 minutes, or until tender and caramelised."}, {"t": "Into a food processor, add the pumpkin, yoghurt, nutritional yeast, paprika, rosemary, stock, remaining olive oil, salt, and pepper. Squeeze the garlic out of its skin, into the food processor, and discard the skin. Blend until smooth. Taste and adjust the seasoning if needed. Stir through the spinach leaves."}, {"t": "to packet instructions."}, {"t": "Add the sauce and the spinach to the drained pasta and toss until well coated."}, {"t": "Divide pasta between bowls and sprinkle with the pine nuts."}], "tips": [{"h": "Ingredient Tips", "t": "Any type of Slendier pasta is fine (spaghetti or fettuccine). Any variety is also fine, it comes in black soybean, soybean or edamame. If you’re shopping on the Slendier website, get 5% off with code ‘healthwithbec5’ at checkout. Click here to shop. To make this dairy free, swap the Greek yoghurt to an extra 1 tbsp of vegetable stock (per serve)."}, {"h": "Bec’s Tips", "t": "Make a double batch of the sauce and freeze the leftovers in single serves for a quick- and-easy weeknight meal. I like using silicone moulds to freeze leftover sauce – they make it so easy to pop out when you need it. This is a great recipe for the whole family to enjoy, swap legume pasta for regular pasta. For more ideas on how to add to this recipe to suit your family’s needs, please refer to the Adapt to your 31 partner and kids guide."}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "roast pumpkin pasta", "cats": ["Mains"], "tags": ["Vegetarian"]}, {"title": "One Minute Mug Bread with Egg & Garlic & Thyme Mushrooms", "serves": "1", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "356", "fat": "28", "protein": "19", "netcarbs": "6", "fibre": "4", "ingredients": [{"h": "For The Egg & Mushrooms"}, {"t": "100 g button mushrooms"}, {"t": "1 clove garlic"}, {"t": "2 tsp extra virgin olive oil"}, {"t": "1 tsp lemon zest"}, {"t": "1 tbsp fresh thyme"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 tbsp lemon juice"}, {"t": "1 egg"}, {"h": "For The Mug Bread"}, {"t": "1 tsp butter"}, {"t": "2 tbsp almond meal"}, {"t": "1 egg"}, {"t": "¼ tsp baking powder"}, {"t": "1 tsp water"}, {"t": "Pinch salt"}], "steps": [{"h": "For The Egg & Mushrooms"}, {"t": "Slice the mushrooms and finely dice the garlic."}, {"t": "Heat the olive oil in a large frying pan over medium- high heat."}, {"t": "Add the mushrooms and cook for 3–4 minutes until golden on one side. Stir and cook for a further 2 minutes, or until evenly browned."}, {"t": "Add the garlic, lemon zest, thyme, salt, and pepper. Cook for 1–2 minutes, stirring occasionally."}, {"t": "Drizzle with the lemon juice and toss to combine. Remove from heat."}, {"t": "Bring a saucepan of water to a simmer over medium heat. Gently crack the egg into the water and poach for 3–4 minutes, until cooked to your liking. Gently remove the egg."}, {"h": "For The Mug Bread"}, {"t": "Melt the butter in a microwave-safe cup or ramekin."}, {"t": "Add the remaining mug bread ingredients and whisk thoroughly until smooth."}, {"t": "Microwave for 1 minute, or until risen and cooked through."}, {"t": "Remove the mug bread from the cup, slice in half, top with the mushrooms, and finish with the poached egg."}], "tips": [{"h": "Ingredient Tips", "t": "To make this dairy free, butter can be swapped for coconut oil. If you’re nut free, swap almond meal to lupin flour."}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "one minute mug bread egg garlic thyme mushrooms", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Pumpkin, Feta & Pine Nut Pizza", "serves": "2", "time": "45 min", "time_detail": "20 min prep + 25 min cook", "cal": "522", "fat": "33", "protein": "20", "netcarbs": "17", "fibre": "13", "ingredients": [{"h": "For The Pizza Toppings"}, {"t": "250 g butternut pumpkin"}, {"t": "1 tsp extra virgin olive oil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "3 tbsp tomato paste"}, {"t": "50 g feta cheese, reduced fat"}, {"t": "2 tbsp green pesto"}, {"t": "1 tbsp pine nuts"}, {"t": "3 tbsp fresh basil leaves"}, {"h": "For The Pizza Dough"}, {"t": "½ cup coconut flour"}, {"t": "¼ cup almond meal"}, {"t": "6 tbsp psyllium husk"}, {"t": "2 tbsp flaxseed meal"}, {"t": "½ tsp salt"}, {"t": "1 cup + 2 tbsp warm water"}], "steps": [{"h": "For The Pizza Toppings"}, {"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a baking tray with baking paper."}, {"t": "Peel and dice the pumpkin. Place on the baking tray, drizzle or spray with olive oil and season with salt and pepper. Cook in the oven for 10 minutes, turn the pumpkin over and cook for another 10 minutes until softened and caramelised. Remove from the oven and set aside."}, {"h": "For The Pizza Dough"}, {"t": "Turn the oven up to 200°C fan-forced / 390°F. Line a baking tray with baking paper."}, {"t": "In a bowl, add all the dough ingredients and mix to combine. If the mixture is too dry, gradually add water, 1 tablespoon at a time until a dough consistency is reached."}, {"t": "Using clean hands, knead the dough for a few minutes, either in the mixing bowl or on a chopping board."}, {"t": "Set the dough aside for 10 minutes to allow the fibres to absorb the moisture. Then knead the dough again for 1 minute."}, {"t": "Separate the dough into two equal portions. Place one portion of dough between two sheets of baking paper and roll into a thin round pizza shape. If it breaks, pull a piece from the edge and press it into the gap, then smooth to bind."}, {"t": "Transfer the base to the lined baking tray. Repeat with the remaining dough."}, {"t": "Place the bases onto the prepared tray and bake for 8 minutes. Flip, then bake for another 5 minutes. Remove the bases from the oven."}, {"t": "Spread the tomato paste over each base. Top with the roasted pumpkin. Crumble over the feta, add small dollops of the pesto, and sprinkle over the pine nuts. Return to the oven and bake for about 10–12 minutes, or until the crust starts to turn a golden colour."}, {"t": "Garnish with the basil, slice into pieces, and serve."}], "tips": [{"h": "Ingredient Tips", "t": "For extra flavour, add herbs and/or nutritional yeast to the dough. This is a great fridge clear out recipe! Use any leftover vegetables you have on hand such as capsicum, spinach, or rocket."}, {"h": "Bec’s Tips", "t": "I like to buy pre-diced pumpkin to save time! The bases can be cooked earlier and stored in the fridge for 1–2 days or frozen for up to 3 months. After baking, allow them to cool completely, then wrap in a layer of cling wrap, followed by a layer of foil (to help stop moisture from getting in). I prefer a thin pizza base with a larger surface area. It's totally up to you how thick you’d like the base to be; however, I don't recommend making it too thick, as it can turn out quite doughy."}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "pumpkin feta pine nut pizza", "cats": ["Mains"], "tags": ["Vegetarian"]}, {"title": "Asian Scrambled Tofu", "serves": "1", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "282", "fat": "15", "protein": "27", "netcarbs": "3", "fibre": "10", "ingredients": [{"t": "150 g firm organic tofu"}, {"t": "½ small brown onion"}, {"t": "½ clove garlic"}, {"t": "1 head pak choy"}, {"t": "1 spring onion"}, {"t": "1 tbsp fresh coriander"}, {"t": "½ tbsp sesame oil"}, {"t": "½ tsp fresh grated ginger"}, {"t": "½ tsp rice wine vinegar"}, {"t": "1½ tsp tamari"}, {"t": "¼ tsp five spice powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "½ tsp sesame seeds"}], "steps": [{"t": "Drain the tofu and pat dry with paper towel to remove excess liquid. In a bowl, mash the tofu with a fork into chunky pieces and set aside."}, {"t": "Dice the onion and crush the garlic. Roughly chop the bok choy. Slice the spring onion and chop the coriander."}, {"t": "Heat the sesame oil in a large pan or wok over medium heat. Add the onion and sauté for 3 minutes or until softened. Add the garlic and ginger and sauté for 1 minute until fragrant."}, {"t": "Add the bok choy to the pan and cook for 5 minutes or until wilted."}, {"t": "Add tofu to the pan and cook for 5 minutes, stirring occasionally."}, {"t": "To the pan, add the rice wine vinegar, tamari, five spice powder, salt, and pepper and stir until well combined."}, {"t": "To serve, garnish with the spring onion, coriander, and sesame seeds."}], "tips": [{"h": "Ingredient Tips", "t": "Can’t find pak choy? You can use any Asian green vegetable like bok choy, baby bok choy, or simply use spinach."}, {"h": "Bec’s Tips", "t": "Leftovers keep well so make a double batch and store in an airtight container in the fridge for up to 2 days. Just reheat gently in a pan."}], "sources": ["Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "asian scrambled tofu", "cats": ["Breakfast"], "tags": ["Tofu", "Vegetarian", "15 min or less"]}, {"title": "Mushroom Spinach Scrambled Eggs", "serves": "1", "time": "10 min", "time_detail": "3 min prep + 7 min cook", "cal": "454", "fat": "35", "protein": "24", "netcarbs": "4", "fibre": "8", "ingredients": [{"t": "1 tbsp extra virgin olive oil*"}, {"t": "1 cup button mushrooms, sliced"}, {"t": "1 clove garlic, crushed"}, {"t": "1 cup baby spinach"}, {"t": "2 eggs"}, {"t": "1 egg white"}, {"t": "2 tbsp almond milk, unsweetened*"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 slice Bec’s Bread Loaf*"}], "steps": [{"t": "Heat the olive oil in a non-stick frying pan over medium heat. Add the mushrooms and cook for 3–4 minutes until soft and slightly golden."}, {"t": "Add the garlic and cook, stirring, for 30 seconds."}, {"t": "Add the spinach and cook until wilted, about 1–2 minutes."}, {"t": "In a bowl, whisk together the eggs, egg white, almond milk, salt, and pepper."}, {"t": "Reduce the heat to low. Pour the egg mixture into the pan over the vegetables and gently stir continuously until soft and fluffy, about 2–3 minutes. Remove from the heat while the eggs are still slightly creamy, as they will continue to cook."}, {"t": "Serve with a slice of Bec’s Bread Loaf toasted."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Click here for Bec’s Bread Loaf recipe, or feel free to swap to a slice of Venerdi Bread, for a list of stockists click here."}, {"h": "Bec’s Tips", "t": "The secret to perfect scrambled eggs is low and slow – take them off the heat just before they look done and let them finish cooking in their own heat."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "mushroom spinach scrambled eggs", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Fragrant Chicken Meatball & Noodle Soup", "serves": "2", "time": "30 min", "time_detail": "15 min prep + 15 min cook", "cal": "282", "fat": "9", "protein": "36", "netcarbs": "3", "fibre": "9", "ingredients": [{"t": "300 g chicken mince, lean (5% fat)"}, {"t": "¼ medium brown onion, finely diced"}, {"t": "½ tbsp fresh grated ginger"}, {"t": "1 clove garlic, crushed"}, {"t": "½ large spring onion, green part only, finely sliced (reserve a little for garnish)"}, {"t": "½ tbsp arrowroot flour"}, {"t": "1 tsp hoisin sauce"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 tbsp chicken bone broth concentrate*"}, {"t": "2 cups water"}, {"t": "50 g button mushrooms, sliced"}, {"t": "400 g box Slendier konjac pasta, spaghetti style*"}, {"t": "1 head bok choy, halved lengthways"}, {"t": "1 cup coriander leaves, finely chopped"}, {"t": "½ fresh chilli, thinly sliced (optional)"}], "steps": [{"t": "Add the chicken mince, onion, ginger, garlic, spring onion, arrowroot flour, and hoisin sauce to a large bowl. Season with salt and pepper, and mix until combined."}, {"t": "Using damp, clean hands, roll the mixture into small balls – they will expand slightly as they cook. (If the mixture is too wet, chill in the fridge until firm enough to handle.)"}, {"t": "Dissolve the bone broth concentrate in a small amount of the water, then pour with remaining water into a large pot over high heat. Bring to a boil, then add the meatballs. Reduce heat to medium and cook for 5–7 minutes until the meatballs float to the surface."}, {"t": "Add the mushrooms and cook for a further 5 minutes, until softened."}, {"t": "Rinse and drain the konjac pasta. Add to the pot along with the bok choy, coriander, and chilli (if using). Cook for 2–3 minutes, until the bok choy is tender and vibrant."}, {"t": "Check the meatballs are cooked all the way through by slicing one meatball open – it should be white in the centre, not pink."}, {"t": "Taste and adjust the seasoning of the broth with extra salt and pepper, if needed."}, {"t": "Divide the meatballs, konjac pasta, bok choy, and mushrooms between bowls. Ladle the broth over the top, garnish with the reserved spring onion, and serve hot."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password:"}, {"h": "Bec’s Tips", "t": "This is a great recipe for everyone in the family to enjoy. Please refer to the “Adapt to your partner and kids guide” for ideas on how to add to this recipe to suit your family’s needs."}], "sources": ["Plan 78 – August 2026"], "kind": "plan", "pesc_plan": false, "slots": ["lunch"], "id": "fragrant chicken meatball noodle soup", "cats": ["Mains"], "tags": ["Chicken"]}, {"title": "Caramelised Biscuit Dough Bars", "serves": "8", "time": "1 hr 15 min", "time_detail": "15 min prep + 1 hr chill", "cal": "170", "fat": "9", "protein": "16", "netcarbs": "3", "fibre": "3", "ingredients": [{"t": "150 g Morlife Caramelised Biscuit protein powder*"}, {"t": "50 g almond meal"}, {"t": "1 tbsp coconut flour"}, {"t": "1 tbsp powdered monk fruit blend*"}, {"t": "½ tsp ground cinnamon"}, {"t": "Pinch salt"}, {"t": "30 g almond butter*"}, {"t": "175 ml almond milk, unsweetened*"}, {"t": "30 g dark chocolate (85%)*, roughly chopped"}], "steps": [{"t": "Line a small loaf tin or container with baking paper."}, {"t": "Mix together the protein powder, almond meal, coconut flour, monk fruit, cinnamon, and salt."}, {"t": "Add the almond butter and milk, and mix until a thick dough is formed."}, {"t": "Let the mixture sit for 5–10 minutes so the coconut flour can absorb the liquid."}, {"t": "If it seems crumbly, add a splash more almond milk. If it seems too soft, add a little extra protein powder. Fold through the dark chocolate."}, {"t": "Press firmly into your prepared tin and smooth the top. Sprinkle over a little more salt, and refrigerate for 1–2 hours until firm."}, {"t": "Slice into 8 bars. Enjoy one bar per serving. Store in an airtight container in the fridge or freezer."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Feel free to swap the almond butter to cashew butter. Don't have Morlife Caramelised Biscuit flavour? Any caramel-flavoured protein powder would also work! Morlife Plantiful protein powders are my favourite. Get 15% off with code ‘HEALTHWITHBEC’ at checkout. Click here to shop. Large flakes of sea salt work well to sprinkle over the top."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "caramelised biscuit dough bars", "cats": ["Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Garlic Fish with Lemon-Roasted Leeks", "serves": "1", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "409", "fat": "21", "protein": "39", "netcarbs": "2", "fibre": "9", "ingredients": [{"t": "3 leeks, white and light green parts only, halved lengthwise"}, {"t": "1 tbsp extra virgin olive oil*"}, {"t": "½ tbsp lemon juice"}, {"t": "Pinch salt"}, {"t": "1½ tbsp Parmesan, finely grated"}, {"t": "Zest of ¼ lemon, finely grated"}, {"t": "150 g snapper fillet, skinless"}, {"t": "¼ tsp garlic powder"}, {"t": "Pinch pepper"}, {"t": "2 tbsp fresh basil leaves"}, {"t": "½ tbsp flaked almonds"}, {"t": "Pinch chilli flakes"}], "steps": [{"t": "Preheat the oven to 200°C / 390°F (180°C / 360°F fan-forced)."}, {"t": "Add the leeks to a medium baking tray and add half the olive oil, all the lemon juice, and season with salt. Toss well to coat, and arrange the leeks cut-side down on the tray."}, {"t": "Roast for 20 minutes. Flip the leeks over and sprinkle with the Parmesan and lemon zest. Continue roasting for 5–10 minutes, until the leeks are fork-tender and golden brown."}, {"t": "Meanwhile, pat both sides of the fish dry with paper towels. Sprinkle the garlic powder, season with salt and pepper on both sides, rubbing in to coat."}, {"t": "Heat the remaining oil in a frying pan over medium-high heat. Add the fish and fry for 1–2 minutes each side, until golden brown and just cooked through."}, {"t": "Serve the fish with the leeks on the side. Sprinkle over the basil, flaked almonds, and chilli flakes, and serve immediately."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Red emperor or pink snapper are my fish of choice for this dish but you can use any firm white fish you like."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "garlic fish lemon roasted leeks", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "High Protein Caramel Chia Pudding", "serves": "1", "time": "7 min", "time_detail": "5 min prep + 2 min cook", "cal": "424", "fat": "19", "protein": "34", "netcarbs": "16", "fibre": "19", "ingredients": [{"t": "3 tbsp chia seeds*"}, {"t": "35 g Morlife Caramelised Biscuit protein powder*"}, {"t": "¼ cup almond milk, unsweetened*"}, {"t": "¼–½ cup water"}, {"t": "¼ medium banana (fresh or frozen), sliced"}, {"t": "½ cup raspberries (fresh or frozen)"}, {"t": "2 tbsp coconut yoghurt*"}], "steps": [{"t": "In a small microwaveable bowl, stir together the chia seeds, protein powder, almond milk, and water. The mixture should be fairly runny, so start with ¼ cup water and add extra water if needed."}, {"t": "If you’re using frozen bananas and raspberries, stir them through the mixture. If using fresh, add them after microwaving."}, {"t": "Microwave for 60 seconds. Stir, and add more water if needed. Microwave for a further 30–60 seconds."}, {"t": "Top with coconut yoghurt and enjoy!"}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). Morlife Plantiful protein powders are my favourite. Get 15% off with code ‘HEALTHWITHBEC’ at checkout. Click here to shop. Don’t have the Caramelised Biscuit flavour? This recipe would be delicious with any caramel- flavoured protein powder!"}, {"h": "Bec’s Tips", "t": "To make an overnight chia pudding, at step 3 simply pop into the fridge instead of the microwave and allow it to soak overnight. This recipe is really high in fibre! If you're new to a high-fibre diet, start with 2 tablespoons of chia seeds and slightly less water, otherwise it might cause some bloating. To account for the fewer calories, top your pudding with 10 almonds. For recipes like this that only call for a small amount of banana, I love keeping frozen banana pieces in my freezer!"}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "high protein caramel chia pudding", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Satay Chicken", "serves": "4", "time": "35 min", "time_detail": "10 min prep + 25 min cook", "cal": "477", "fat": "20", "protein": "47", "netcarbs": "15", "fibre": "11", "ingredients": [{"t": "1 tbsp coconut oil*"}, {"t": "1 medium brown onion, diced"}, {"t": "1 packet Mingle Satay Recipe Base*"}, {"t": "600 g chicken breast, skinless, cut into chunks"}, {"t": "1 red capsicum, roughly chopped"}, {"t": "1 medium head broccoli, roughly chopped"}, {"t": "1 medium zucchini, roughly chopped"}, {"t": "2 tsp chicken bone broth concentrate*"}, {"t": "300 ml water"}, {"t": "2 tsp monk fruit blend*"}, {"t": "¼ cup peanut butter*"}, {"t": "150 ml canned coconut cream, light*"}, {"h": "To Serve"}, {"t": "600 g cauliflower rice*"}, {"t": "1 cup fresh coriander leaves"}, {"t": "1 lime, cut into wedges"}], "steps": [{"t": "Heat the coconut oil in a large pot or deep frying pan over medium heat. Add the onion and cook, stirring occasionally, until softened, about 3 minutes."}, {"t": "Add the Mingle Satay Recipe Base and chicken. Cook, stirring, until the chicken is lightly browned on all sides."}, {"t": "Add the capsicum, broccoli, and zucchini, and stir to combine. Cook for 2 minutes."}, {"t": "Dissolve the bone broth concentrate in the water, then add to the pot along with the monk fruit, peanut butter, and coconut cream. Cover, reduce the heat to low, and simmer until the chicken is cooked through and the sauce has thickened, about 20 minutes."}, {"t": "Meanwhile, steam or microwave the cauliflower rice according to packet directions."}, {"t": "Divide the cauliflower rice between bowls and spoon over the satay chicken. Serve with the fresh coriander and lime wedges on the side. *Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: You can find Mingle Satay Seasoning at most Woolworths. If you’re shopping on the Mingle website, get 10% off all products with code ‘HWB10’ at checkout. Click here to shop. Can't find the Mingle Satay Seasoning? You can whip up your own blend at home! Mix together: 1½ tsp coriander, 1 tsp fennel, ¾ tsp black pepper, 1 tsp cumin, ¾ tsp turmeric, ¾ tsp ginger, ½ tsp salt, ¼ tsp paprika, pinch of cardamom, nutmeg, and chilli."}], "tips": [{"h": "Bec’s Tips", "t": "This is a great recipe for the whole family to enjoy. Serve theirs with rice or noodles instead of cauliflower rice. For more ideas on how to add to this recipe to suit your family’s needs, please refer to the Adapt to your partner and kids guide for ideas on how to add to this recipe to suit your family’s. This is a fantastic freezer meal. Simply divide the remaining portions into individual servings and freeze for future meals."}], "sources": ["Plan 78 – August 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "satay chicken", "cats": ["Mains"], "tags": ["Chicken"]}, {"title": "Apple & Cinnamon Mug Cake", "serves": "1", "time": "4 min", "time_detail": "2 min prep + 2 min cook", "cal": "361", "fat": "30", "protein": "12", "netcarbs": "8", "fibre": "7", "ingredients": [{"h": "For The Mug Cake"}, {"t": "1 tbsp unsalted butter, melted"}, {"t": "¼ medium apple, grated"}, {"t": "2 tbsp almond meal"}, {"t": "1 tbsp almond butter*"}, {"t": "1 egg white"}, {"t": "¼ tsp baking powder"}, {"t": "Pinch salt"}, {"t": "¼ tsp vanilla extract"}, {"t": "½ tbsp coconut flour"}, {"t": "¼ tsp cinnamon"}, {"t": "1 tsp monk fruit blend*"}, {"h": "To Serve"}, {"t": "2 tbsp coconut yoghurt*"}], "steps": [{"t": "Add all of the mug cake ingredients into a microwave-safe bowl and stir until combined. The batter should be slightly thicker than pancake bat ter – add a splash of almond milk or water if needed."}, {"t": "Microwave for 90 seconds."}, {"t": "Serve warm with coconut yoghurt."}], "tips": [{"h": "Bec’s Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe)."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "apple cinnamon mug cake", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Tuscan Prawn Pasta", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "413", "fat": "21", "protein": "41", "netcarbs": "10", "fibre": "9", "ingredients": [{"t": "225 g prawns, raw and peeled"}, {"t": "1 tsp smoked paprika"}, {"t": "½ tsp dried Italian herbs"}, {"t": "¼ tsp garlic powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "½ tbsp extra virgin olive oil*"}, {"t": "¼ cup sun-dried tomato strips, well drained"}, {"t": "½ cup canned artichoke hearts, well drained, roughly chopped"}, {"t": "3 cloves garlic, minced"}, {"t": "¼ cup vegetable stock*"}, {"t": "120 ml canned coconut cream, light*"}, {"t": "2 tbsp Parmesan cheese, grated"}, {"t": "60 g baby spinach"}, {"t": "100 g Slendier Edamame Bean Fettuccine* (uncooked)"}, {"t": "1 tbsp fresh parsley, finely chopped"}, {"t": "½ lemon, cut into wedges"}], "steps": [{"t": "Toss the prawns with ¼ tsp of the smoked paprika, ¼ tsp of the dried Italian herbs, garlic powder, and season with salt and pepper."}, {"t": "Heat the olive oil in a large frying pan over medium-high heat. Add the prawns and cook for about 2 minutes per side, until cooked through. Remove the prawns and set aside."}, {"t": "Reduce the heat to medium and add the sun-dried tomatoes, artichokes, and garlic. Cook, stirring, for 1 minute until fragrant."}, {"t": "Pour the vegetable stock into the pan scraping up any stuck bits in the bottom. Add the coconut cream and Parmesan, and bring to a simmer. Reduce heat to medium-low for 4–5 minutes, until thickened to your liking."}, {"t": "Add the prawns back to the pan, along with the spinach, remaining ¼ tsp dried Italian herbs, ¾ tsp smoked paprika, salt, and pepper. Stir to combine and continue simmering for 2 minutes until the spinach is wilted and the prawns are warmed through."}, {"t": "Meanwhile, cook the Edamame Bean Fettuccine according to packet directions. Drain well, and add to the pan with the prawns. Toss well to coat."}, {"t": "Serve sprinkled with fresh parsley, and lemon wedges on the side."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe)."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "tuscan prawn pasta", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Bec's Bread Loaf", "serves": "16", "time": "1 hr 20 min", "time_detail": "20 min prep + 60 min cook", "cal": "135", "fat": "11", "protein": "5", "netcarbs": "1", "fibre": "6", "ingredients": [{"t": "2½ cups almond meal"}, {"t": "½ cup coconut flour"}, {"t": "¹∕ cup flaxseed meal"}, {"t": "6 tbsp psyllium husks"}, {"t": "1 heaped tbsp baking powder"}, {"t": "1 tsp salt"}, {"t": "2 cups warm water"}, {"t": "1 tsp apple cider vinegar"}, {"t": "2 tbsp extra virgin olive oil*"}], "steps": [{"t": "Preheat the oven to 200°C fan-forced / 390°F. Line a loaf tin (about 21 × 11 cm) with baking paper."}, {"t": "In a mixing bowl, combine almond meal, coconut flour, flaxseed meal, psyllium husks, baking powder, and salt."}, {"t": "Add the warm water, apple cider vinegar, and olive oil, and mix using a spoon."}, {"t": "Knead the dough gently with your hands until just combined. Don’t overmix, or it may not rise enough."}, {"t": "Set dough aside for 10 minutes to absorb the moisture."}, {"t": "Shape the dough and place into the loaf tin."}, {"t": "Bake for 60 minutes, or until a skewer comes out clean."}, {"t": "Remove from the pan and cool on a wire rack."}, {"t": "Allow to cool completely before slicing into 16 pieces."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: Feel free to add dried herbs to flavour your loaf. Oregano, Italian herbs, or anything you fancy!"}, {"h": "Bec’s Tips", "t": "Feel free to swap a slice of Bec's Bread Loaf to a slice of Venerdi Paleo Super Seeded Bread. Click here for a list of stockists. Store in an airtight container for 3–4 days, or freeze for up to 6 months."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)", "Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "bec s bread loaf", "cats": ["Snacks & sweets", "Sides & salads"], "tags": ["Vegetarian"]}, {"title": "Veal Saltimbocca with Spinach", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "408", "fat": "20", "protein": "39", "netcarbs": "1", "fibre": "7", "ingredients": [{"h": "For The Veal Saltimbocca"}, {"t": "300 g thin veal escalopes"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "2 slices prosciutto, sliced lengthways"}, {"t": "8 sage leaves"}, {"t": "1 tbsp extra virgin olive oil*"}, {"t": "1 tbsp unsalted butter"}, {"t": "½ cup white wine"}, {"h": "For The Spinach"}, {"t": "400 g frozen spinach"}, {"t": "2 tsp unsalted butter"}, {"t": "2 tsp garlic powder"}, {"t": "Pinch salt"}], "steps": [{"h": "For The Veal Saltimbocca"}, {"t": "Place each veal escalope between plastic wrap and pound with a meat mallet until about 5 millimetres thick. Halve each flattened veal piece widthways, then season with the salt and pepper."}, {"t": "Lay a piece of prosciutto on each veal piece and top with the sage leaves. Secure with a toothpick."}, {"t": "Heat the olive oil and half the butter in a large, shallow frying pan over high heat. When very hot, cook the veal, prosciutto-side down, for 1 minute (in batches if necessary). Turn and continue cooking for a further 30 seconds, then transfer to a plate and keep warm."}, {"t": "Pour the wine into the pan to deglaze. Bring to a boil and simmer over medium heat for 3–4 minutes until reduced, scraping up the bits on the bottom of the pan."}, {"t": "Add the remaining butter and stir to melt."}, {"h": "For The Spinach"}, {"t": "Defrost the spinach either in the microwave or a steamer, about 3–4 minutes."}, {"t": "Stir through the butter, garlic powder, and salt to season."}, {"h": "To Serve"}, {"t": "Add the veal to serving plates, serve with the spinach, and pour over the wine sauce."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: To make this dairy free, swap the butter for your favourite dairy-free butter alternative. Feel free to change the spinach to another green of your choice! Asparagus, broccoli, and bok choy work really well."}], "sources": ["Plan 78 – August 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "veal saltimbocca spinach", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Pumpkin Pie French Toast Bake", "serves": "4", "time": "1 hr 10 min", "time_detail": "15 min prep + 55 min cook", "cal": "353", "fat": "19", "protein": "27", "netcarbs": "14", "fibre": "6", "ingredients": [{"t": "Olive oil spray"}, {"t": "150 g butternut pumpkin, peeled and cubed"}, {"t": "250 g cottage cheese, reduced-fat"}, {"t": "2 eggs"}, {"t": "40 g vanilla protein powder*"}, {"t": "100 g almond meal"}, {"t": "2 tbsp golden monk fruit blend*"}, {"t": "1 tsp vanilla extract"}, {"t": "½ tsp ground cinnamon"}, {"t": "½ tsp ground ginger"}, {"t": "½ tsp allspice"}, {"t": "Pinch ground nutmeg"}, {"t": "Pinch ground cloves"}, {"t": "1 tsp baking powder"}, {"t": "Pinch salt"}, {"h": "To Serve"}, {"t": "½ cup Greek yoghurt, plain, non-fat*"}, {"t": "1 cup frozen blueberries, defrosted"}, {"t": "4 tbsp sugar-free maple syrup* (optional)"}], "steps": [{"t": "Preheat oven to 160°C fan-forced / 320°F. Lightly grease a medium baking dish with olive oil spray."}, {"t": "Boil or steam the pumpkin for 10–15 minutes until tender. Drain well and allow to steam dry for 5 minutes to ensure there is no residual moisture."}, {"t": "Transfer the pumpkin to a blender along with all remaining ingredients except for the Greek yoghurt, blueberries, and syrup. Blend until smooth."}, {"t": "Pour into the prepared baking dish and bake for 35–40 minutes, until set and golden brown on top."}, {"t": "Allow to cool slightly before cutting into four portions. Top each portion with 2 tbsp Greek yoghurt, ¼ cup blueberries, and 1 tbsp sugar-free maple syrup (if using)."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: Morlife Plantiful Vanilla protein powder was used in this recipe, but the Caramel Fudge flavour will be delicious too! (Get 15% off with code 'HEALTHWITHBEC' at checkout. Click here to shop). If you use a different brand, please note it might impact the consistency and macros."}, {"h": "Bec’s Tips", "t": "Store in the fridge and reheat in the microwave for breakfast on Sunday, then pop the remaining portions in the freezer for up to 3 months. Spraying oil over your baking dish helps to distribute a small amount of oil evenly. I recommend using a refillable oil sprayer bottle rather than an aerosol cooking oil."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "pumpkin pie french toast bake", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Cottage Cheese, Broccoli & Lemon Zest Pizza", "serves": "2", "time": "45 min", "time_detail": "20 min prep + 25 min cook", "cal": "399", "fat": "19", "protein": "27", "netcarbs": "0", "fibre": "34", "ingredients": [{"h": "For The Pizza Dough"}, {"t": "½ cup coconut flour"}, {"t": "¼ cup almond meal"}, {"t": "6 tbsp psyllium husks*"}, {"t": "2 tbsp flaxseed meal*"}, {"t": "½ tsp salt"}, {"t": "1 cup warm water"}, {"h": "For The Pizza Topping"}, {"t": "150 g cottage cheese, reduced fat"}, {"t": "1 tsp extra virgin olive oil*"}, {"t": "½ lemon, zested"}, {"t": "½ lemon, juiced"}, {"t": "¼ tsp dried basil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "Pinch chilli flakes (optional)"}, {"t": "1 cup broccoli, cut into small florets"}, {"t": "40 g mozzarella cheese, light, finely grated"}], "steps": [{"h": "For The Pizza Dough"}, {"t": "Preheat the oven to 200°C fan-forced / 390°F. Line a baking tray with baking paper."}, {"t": "In a bowl, add all the dough ingredients and mix to combine. If the mixture is too dry, gradually add water, 1 tbsp at a time, until a dough consistency is reached."}, {"t": "Using clean hands, knead the dough for a few minutes, either in the mixing bowl or on a chopping board."}, {"t": "Set the dough aside for 10 minutes to allow the fibres to absorb the moisture, then knead the dough again for 1 minute. (While you’re waiting, make the pizza topping.)"}, {"t": "Break the dough into two even pieces. Place one piece of dough between two sheets of baking paper and roll into a thin round pizza shape. If it breaks, pull a piece from the edge and press it into the gap, then smooth to bind. Repeat with the second piece of dough to make a second base."}, {"t": "Transfer the bases to the lined baking tray."}, {"t": "Bake for 8 minutes, flip, then bake for"}, {"h": "For The Pizza Topping"}, {"t": "In a food processor, blend the cottage cheese, olive oil, lemon zest, lemon juice, basil, and a pinch of salt and pepper until smooth."}, {"t": "Steam the broccoli in the microwave with 1 tbsp water, for 1–2 minutes until just tender."}, {"h": "Make The Pizzas"}, {"t": "Spread the cottage cheese mixture over each base. Sprinkle over the chilli flakes (if using) and top with the steamed broccoli and mozzarella."}, {"t": "Place in the oven and bake for 12 minutes, or until golden. Slice and serve."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password:"}, {"h": "Bec’s Tips", "t": "This recipe is really high in fibre! If you're new to a high-fibre diet, just be aware it might cause a bit of bloating as your gut adjusts. If you'd prefer something gentler, swap the pizza dough for half of one of the pizza bases in the product glossary. The dough can be prepared earlier and stored in the fridge for 1–2 days. Pizza bases can be baked ahead of time and stored in the freezer. I recommend wrapping in plastic once they are completely cool and then wrapping in foil before freezing (anything to help stop moisture from getting in). My preference is for quite a thin pizza base with a larger surface area. It's totally up to you how thick you’d like the base to be; however, I don't recommend making it too thick, as it can turn out quite doughy – especially in the centre."}], "sources": ["Plan 78 – August 2026", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "cottage cheese broccoli lemon zest pizza", "cats": ["Mains"], "tags": ["Vegetarian"]}, {"title": "Slow Cooked Chinese Five-Spice Beef Brisket", "serves": "4", "time": "4 hr (high)", "time_detail": "15 min prep + 4 hr cook", "cal": "464", "fat": "20", "protein": "54", "netcarbs": "15", "fibre": "7", "ingredients": [{"h": "For The Beef Brisket"}, {"t": "800 g beef brisket, lean, cut in half"}, {"t": "1 tbsp sesame oil"}, {"t": "½ tsp salt"}, {"t": "½ tsp pepper"}, {"t": "¼ tsp beef bone broth concentrate*"}, {"t": "¼ cup water"}, {"t": "¾ cup tamari"}, {"t": "1 tbsp monk fruit blend*"}, {"t": "2 tsp Chinese five spice powder"}, {"t": "4 garlic cloves, lightly crushed"}, {"t": "1 large fresh red chilli, finely chopped"}, {"t": "3 medium carrots, peeled and cut into 3 cm pieces"}, {"h": "For The Baby Bok Choy"}, {"t": "500 g pak choy or baby bok choy"}, {"t": "1 tsp garlic powder"}, {"h": "To Serve"}, {"t": "500 g cauliflower rice*"}, {"t": "30 g roasted cashews, unsalted"}, {"t": "1 fresh red chilli, sliced to garnish (optional)"}, {"t": "1 lime, cut into wedges"}], "steps": [{"h": "Slow Cooker Method"}, {"t": "Pat the brisket dry and rub all over with the sesame oil, salt, and pepper."}, {"t": "Heat a large frying pan over medium-high heat and sear the brisket pieces for 2–3 minutes per side until deeply browned. Transfer the brisket to the slow cooker."}, {"t": "In a jug, dissolve the bone broth concentrate in the water. Whisk together with the tamari, monk fruit, and Chinese five spice powder. Pour around the beef."}, {"t": "Scatter the garlic cloves, sliced chilli, and carrots around the brisket."}, {"t": "Cook on low for 7–8 hours or high for 4–5 hours, until the brisket is fork tender and the carrots are soft."}, {"t": "Carefully remove the brisket and carrots and set aside."}, {"t": "Pour the cooking liquid into a saucepan, and simmer for 10–15 minutes until thickened to your liking. 39"}, {"t": "Meanwhile, steam or blanch the baby bok choy until tender. Toss with the garlic powder. Steam or microwave the cauliflower rice until tender."}, {"t": "Slice or shred the brisket, and arrange on serving plates alongside the cauliflower rice, carrots, and baby bok choy."}, {"t": "Spoon over the reduced sauce and garnish with cashews and extra sliced chilli. Serve with lime wedges on the side."}, {"h": "Oven Method"}, {"t": "Preheat the oven to 130°C fan-forced / 270°F. Pat the brisket dry and rub all over with the sesame oil, salt, and pepper."}, {"t": "Heat a large frying pan over medium-high heat and sear the brisket pieces for 2–3 minutes per side until deeply browned. Transfer the brisket to a large casserole dish or Dutch oven."}, {"t": "In a jug, dissolve the bone broth concentrate in the water, whisk together the tamari, monk fruit, and Chinese five spice powder. Pour around the beef."}, {"t": "Scatter the garlic cloves, sliced chilli, and carrots around the brisket."}, {"t": "Cover tightly with a lid or foil. Cook for 3½–4 hours, or until the brisket is fork-tender."}, {"t": "Remove the lid and cook uncovered for a further 20–30 minutes, to allow the top to caramelise slightly."}, {"t": "Remove the brisket and carrots. If desired, simmer the sauce on the stovetop for 5–10 minutes until thickened to your liking."}, {"t": "Meanwhile, steam or blanch the baby bok choy until tender. Toss with the garlic powder. Steam or microwave the cauliflower rice until tender."}, {"t": "Slice or shred the brisket, and arrange on serving plates alongside the cauliflower rice, carrots, and baby bok choy."}, {"t": "Spoon over the reduced sauce and garnish with cashews and extra sliced chilli. Serve with lime wedges on the side."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe). If you prefer less spiciness, remove the seeds and membrane from the chilli. If you're not coeliac or sensitive to gluten, you can swap the stock to ¼ cup Shaoxing wine for a more traditional flavour."}, {"h": "Bec’s Tips", "t": "This is a great recipe for everyone in the family to enjoy. Serve theirs with rice instead of cauliflower rice. For more ideas on how to add to this recipe to suit your family’s needs, please refer to the ‘Adapt to your partner and kids guide’. Brisket freezes really well. Double or triple the recipe and freeze the remaining serves to enjoy next week or whenever you need a quick, easy meal!"}], "sources": ["Plan 78 – August 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner"], "id": "slow cooked chinese five spice beef brisket", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Slow cooker"]}, {"title": "Miso Tofu & Shiitake Soup", "serves": "2", "time": "30 min", "time_detail": "15 min prep + 15 min cook", "cal": "395", "fat": "20", "protein": "33", "netcarbs": "14", "fibre": "10", "ingredients": [{"t": "2 tsp sesame oil"}, {"t": "150 g shiitake mushrooms, sliced"}, {"t": "2 cloves garlic, crushed"}, {"t": "1 tbsp fresh grated ginger"}, {"t": "1 L vegetable stock*"}, {"t": "300 g firm organic tofu*, cut into small cubes"}, {"t": "2 eggs, lightly beaten"}, {"t": "2 cups baby spinach"}, {"t": "1 tbsp miso paste*, whisked with a little warm water"}, {"t": "2 spring onions, finely sliced for garnish"}], "steps": [{"t": "Heat the sesame oil in a large pot over medium heat. Add the mushrooms, garlic, and ginger, and sauté for 3–4 minutes, until the mushrooms have softened."}, {"t": "Pour in the vegetable stock and bring to a gentle boil."}, {"t": "Reduce the heat to a simmer, add the tofu, and cook gently for 5 minutes, until heated through."}, {"t": "Slowly drizzle in the eggs, stirring gently in a circular motion to create silky egg ribbons."}, {"t": "Turn off the heat completely. Stir in the spinach and miso paste."}, {"t": "Ladle into bowls and top with the spring onions."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe)."}], "sources": ["Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "miso tofu shiitake soup", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Baked Fish with Crispy Brussels Sprouts", "serves": "1", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "369", "fat": "17", "protein": "41", "netcarbs": "10", "fibre": "6", "ingredients": [{"t": "1 x 200 g cod fillet"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "100 g Brussels sprouts"}, {"t": "½ tbsp extra virgin olive oil*"}, {"t": "1 tbsp butter"}, {"t": "1 garlic clove, minced"}, {"t": "½ tbsp fresh lemon juice"}, {"t": "1 tsp lemon zest"}, {"t": "125 g cherry tomatoes"}, {"t": "1 tbsp fresh parsley, finely chopped (optional)"}], "steps": [{"t": "Preheat the oven to 200°C fan-forced / 390°F. Line a large baking tray with baking paper."}, {"t": "Pat the fish fillet dry, season both sides with the salt and pepper. Set aside."}, {"t": "Trim the base of the Brussels sprouts, cut in half, and remove the loose outer leaves. Place the Brussels sprouts in a single layer on the baking tray, then drizzle with the olive oil. Place in the oven and bake for 10 minutes."}, {"t": "Meanwhile, melt the butter in a small frying pan over medium heat. Add the garlic and cook for 1–2 minutes."}, {"t": "Add the lemon juice and zest to the garlic butter, then remove from the heat."}, {"t": "Remove the tray from the oven. Place the fish and the tomatoes between the Brussels sprouts on the baking tray."}, {"t": "Pour the garlic and lemon butter over the fish, making sure it’s completely covered."}, {"t": "Bake for 15 minutes, or until the fish is slightly golden on top and the Brussels sprouts are tender and golden brown around the edges."}, {"t": "Remove from the oven and sprinkle with the parsley, if using."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password: healthwithbectribe)."}], "sources": ["Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "baked fish crispy brussels sprouts", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Grilled Salmon with Pesto & Broccoli Salad", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "416", "fat": "28", "protein": "30", "netcarbs": "10", "fibre": "5", "ingredients": [{"h": "For The Pesto & Broccoli Salad"}, {"t": "1 small head broccoli, cut into small florets"}, {"t": "3 tbsp green pesto*"}, {"t": "1 tbsp lemon juice"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Salmon"}, {"t": "2 x 125 g salmon fillets, skin on"}, {"t": "1 lemon, thickly sliced"}, {"t": "1 tbsp extra virgin olive oil*"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"h": "For The Pesto & Broccoli Salad"}, {"t": "Bring a medium pot of water to a boil."}, {"t": "Add the broccoli to the boiling water to blanch quickly – don't leave it for too long, you still want some crunch!"}, {"t": "Drain broccoli and add to a salad bowl."}, {"t": "Stir through pesto and lemon juice to coat. Season with salt and pepper."}, {"h": "For The Salmon"}, {"t": "Heat a grill pan over medium-high heat."}, {"t": "Brush the salmon and lemon slices with the oil and season with salt and pepper."}, {"t": "Place the salmon and lemon slices into the grill pan. Cook for 5 minutes, flip, and cook for another 5 minutes, until salmon is cooked through and the lemons are charred."}, {"t": "Place the salmon fillets onto two serving plates. Serve with the broccoli salad and charred lemon slices."}], "tips": [{"h": "Ingredient Tips", "t": "*Check the product glossary for best options approved by Bec. Many products also have discount codes! (password:"}], "sources": ["Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "grilled salmon pesto broccoli salad", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Caramel Peanut Banana Pudding", "serves": "2", "time": "1 hr 5 min", "time_detail": "5 min prep + 1 hr chill", "cal": "346", "fat": "17", "protein": "24", "netcarbs": "18", "fibre": "12", "ingredients": [{"t": "1 small banana"}, {"t": "1½ tbsp peanut butter*"}, {"t": "200 ml almond milk, unsweetened*"}, {"t": "¼ cup chia seeds*"}, {"t": "50 g caramel protein powder*"}], "steps": [{"t": "In a bowl, mash the banana with the peanut butter until mostly smooth."}, {"t": "Add the almond milk and stir until well combined."}, {"t": "Add the chia seeds and protein powder. Mix until fully combined."}, {"t": "Cover and refrigerate for 1 hour to allow the chia seeds to swell and soften."}, {"t": "Stir again, then divide evenly between two glass containers."}], "tips": [{"h": "Ingredient Tips", "t": "Morlife Plantiful Caramel Fudge protein powder was used in this recipe, but feel free to use vanilla or any flavour you like! (Get 15% off with code ‘HEALTHWITHBEC’ at checkout.) Click here to shop. If you use a different brand, please note it might impact the consistency and macros. tips"}, {"h": "Bec’s Tips", "t": "You can finish with a tablespoon of coconut yoghurt and a couple of slices of banana if desired! I love buying bags of frozen banana chunks. They keep for ages and are so easy to use in recipes like this. Just defrost them in the microwave for a few seconds before mashing! This recipe keeps well in the fridge for up to 5 days."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "caramel peanut banana pudding", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Gut-Loving Rainbow Salad with Salmon", "serves": "2", "time": "25 min", "time_detail": "15 min prep + 10 min cook", "cal": "486", "fat": "27", "protein": "42", "netcarbs": "10", "fibre": "8", "ingredients": [{"h": "For The Salmon"}, {"t": "2 x 150 g salmon fillets, skinless"}, {"t": "1 tbsp extra virgin olive oil"}, {"h": "For The Sesame-Ginger Dressing"}, {"t": "1 tbsp hulled tahini*"}, {"t": "½ tbsp tamari"}, {"t": "1 tbsp lime juice"}, {"t": "1 tsp sesame oil"}, {"t": "1 tsp fresh grated ginger"}, {"t": "1–2 tbsp water"}, {"h": "For The Salad"}, {"t": "1 cup red cabbage, shredded"}, {"t": "1 medium carrot, grated"}, {"t": "½ red capsicum, thinly sliced"}, {"t": "60 g kale, shredded"}, {"t": "2 spring onions, sliced"}, {"t": "100 g frozen edamame beans, thawed"}, {"h": "To Serve"}, {"t": "½ cup kimchi"}, {"t": "1 tsp sesame seeds"}], "steps": [{"t": "Heat the olive oil in a non-stick frying pan over medium-high heat. Add the salmon fillets and cook for 3–4 minutes on each side, until cooked through and lightly golden."}, {"t": "While the salmon is cooking, in a small bowl whisk together the dressing ingredients. Gradually add the water, whisking until the dressing reaches a pourable consistency."}, {"t": "To make the salad: add the red cabbage, carrot, red capsicum, kale, spring onions, and edamame beans to a large bowl. Pour over the dressing and toss to combine."}, {"t": "Divide the salad between two bowls and top each with a salmon fillet and the kimchi. Sprinkle with the sesame seeds. Enjoy!"}], "tips": [{"h": "Bec’s Tips", "t": "You can also cook the salmon in the air fryer at 190°C fan-forced / 370°F for 12 minutes, turning halfway. I use the Crumble Air Fryer. I love it because it's made from toxin-free materials, unlike many others on the market. Click here to buy."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "gut loving rainbow salad salmon", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Carrot Cake Bliss Balls", "serves": "10", "time": "50 min", "time_detail": "20 min prep + 30 min chill", "cal": "203", "fat": "14", "protein": "14", "netcarbs": "3", "fibre": "4", "ingredients": [{"h": "For The Bliss Balls"}, {"t": "3 tbsp desiccated coconut, unsweetened"}, {"t": "150 g vanilla protein powder*"}, {"t": "100 g almond meal"}, {"t": "75 g almond butter*"}, {"t": "75 g carrot (1 small), grated"}, {"t": "2 tsp ground cinnamon"}, {"t": "½ tsp ground ginger"}, {"t": "¼ tsp nutmeg"}, {"t": "2–3 tbsp almond milk, unsweetened*"}, {"h": "For The Coating"}, {"t": "20 g walnuts, finely chopped"}, {"t": "2 tbsp desiccated coconut, unsweetened"}], "steps": [{"t": "Add the desiccated coconut, protein powder, almond meal, almond butter, carrot, cinnamon, ginger, and nutmeg to a food processor. Feel free to adjust the spices according to your taste preferences!"}, {"t": "Blitz, gradually adding the almond milk, until the mixture comes together."}, {"t": "Roll the mixture into a thick log and cut into 10 equal pieces before rolling into balls."}, {"t": "For the coating, combine the walnuts and desiccated coconut on a plate. Lightly roll and press each ball in the coating."}, {"t": "Refrigerate for at least 30 minutes, until firm. Enjoy one bliss ball per serve."}], "tips": [{"h": "Ingredient Tips", "t": "Morlife Plantiful Vanilla Fudge protein powder was used in this recipe. (Get 15% off with code 'HEALTHWITHBEC' at checkout. Click here to shop.) If you use a different brand, please note it might impact the consistency and macros. tips"}, {"h": "Bec’s Tips", "t": "Don’t have a food processor? Simply mix using a spoon and damp hands. If you prefer, you can also mix the finely chopped walnuts straight into the ball mixture, then roll in the coconut. These bliss balls freeze really well! Store them in an airtight container in the freezer for up to 3 months. Allow them to thaw for 15–20 minutes before eating."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "carrot cake bliss balls", "cats": ["Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Stuffed Tofu Eggplant Boats with Herb & Walnut Crumb", "serves": "2", "time": "50 min", "time_detail": "15 min prep + 35 min cook", "cal": "428", "fat": "30", "protein": "22", "netcarbs": "7", "fibre": "12", "ingredients": [{"h": "For The Eggplant Boats"}, {"t": "1 large eggplant"}, {"t": "1½ tbsp extra virgin olive oil*"}, {"t": "½ brown onion, finely diced"}, {"t": "2 cloves garlic, finely diced"}, {"t": "150 g firm organic tofu*, crumbled"}, {"t": "50 g baby spinach"}, {"t": "1 tbsp tomato paste"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Herb & Walnut Crumb"}, {"t": "¼ cup fresh basil, finely chopped"}, {"t": "¼ cup fresh parsley, finely chopped"}, {"t": "¼ cup walnuts, roughly chopped"}, {"t": "25 g Parmesan cheese, finely grated"}, {"t": "1 tbsp almond meal"}, {"t": "½ tbsp extra virgin olive oil*"}, {"h": "To Serve"}, {"t": "40 g rocket"}], "steps": [{"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a baking tray with baking paper."}, {"t": "Slice the eggplant in half lengthways. Scoop out the flesh, leaving a 1–2 cm border. Dice the flesh and set aside."}, {"t": "Heat the olive oil in a frying pan over medium-high heat. Add the diced eggplant flesh, onion, and garlic, and cook for 3–4 minutes, stirring occasionally, until softened."}, {"t": "Add the tofu and baby spinach, and cook, stirring, for 2–3 minutes until the spinach is wilted. Stir in the tomato paste, salt, and pepper."}, {"t": "Place the eggplant halves on the prepared tray. Fill with the tofu and eggplant mixture."}, {"t": "Make the crumb: in a bowl, mix the basil, parsley, walnuts, Parmesan, almond meal, and olive oil until combined. Sprinkle evenly over the stuffed eggplants."}, {"t": "Bake for 25–30 minutes, until golden."}, {"t": "Remove from the oven and serve the eggplant boats with the rocket on the side."}], "tips": [{"h": "Ingredient Tips", "t": "To make this dairy free, swap the Parmesan for nutritional yeast flakes or your favourite dairy-free cheese."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "stuffed tofu eggplant boats herb walnut crumb", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Caramelised Onion & Hummus Toastie", "serves": "1", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "492", "fat": "38", "protein": "17", "netcarbs": "6", "fibre": "17", "ingredients": [{"t": "½ tbsp extra virgin olive oil*"}, {"t": "½ medium brown onion, thinly sliced"}, {"t": "3 tbsp hummus*"}, {"t": "2 slices Bec’s Bread Loaf"}, {"t": "½ tomato, thinly sliced"}, {"t": "50 g baby spinach"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Heat the olive oil in a frying pan over medium- high heat. Add the onion and cook for 5–7 minutes, stirring occasionally, until golden and tender. Set aside."}, {"t": "Spread the hummus over one slice of bread, then top with the onion, tomato, and spinach. Season with salt and pepper, and top with the second slice of bread."}, {"t": "Cook in a sandwich press for 3–5 minutes, until golden and heated through."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to swap Bec’s Bread for Venerdi Bread. For a list of stockists click here."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "caramelised onion hummus toastie", "cats": ["Mains"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Tuna, Pesto & Veggie Pasta", "serves": "2", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "409", "fat": "22", "protein": "36", "netcarbs": "10", "fibre": "12", "ingredients": [{"t": "200 g Slendier legume pasta* (uncooked)"}, {"t": "1 tbsp extra virgin olive oil*"}, {"t": "1 medium red capsicum, diced"}, {"t": "1 clove garlic, crushed"}, {"t": "185 g can tuna in springwater, drained"}, {"t": "3 tbsp green pesto*"}, {"t": "4 cups baby spinach"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Bring a large saucepan of water to a boil over high heat. Add the pasta to the boiling water and cook according to packet instructions, then drain."}, {"t": "Meanwhile, heat the olive oil in a large frying pan over medium heat. Add the capsicum and garlic, and cook for 3–4 minutes, stirring constantly to prevent the garlic from burning, until fragrant."}, {"t": "Add the pasta, tuna, pesto, and baby spinach to the garlic and capsicum. Toss well to combine and cook until the baby spinach has just wilted."}, {"t": "Season with salt and pepper, and serve."}], "tips": [{"h": "Ingredient Tips", "t": "Choose canned tuna in springwater, and ensure the liquid is drained before adding to your pasta. You can use red or green pesto! Soybean, edamame, or black soybean Slendier spaghetti or fettuccine are all fine to use. tips"}, {"h": "Bec’s Tips", "t": "Great reheated or you can also enjoy it cold, like a tuna pesto pasta salad!"}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "tuna pesto veggie pasta", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Berry Breakfast Bowl", "serves": "1", "time": "3 min", "time_detail": "3 min prep + 0 min cook", "cal": "404", "fat": "29", "protein": "19", "netcarbs": "13", "fibre": "11", "ingredients": [{"t": "½ cup mixed berries (fresh or frozen)"}, {"t": "½ cup coconut yoghurt*"}, {"t": "8 almonds"}, {"t": "18 g vanilla protein powder*"}, {"t": "1 tbsp chia seeds*"}, {"t": "¼ tsp ground cinnamon (optional)"}], "steps": [{"t": "If using frozen berries, place them in a microwave-safe bowl and microwave for 30–60 seconds, until just thawed."}, {"t": "Add all the ingredients into a bowl and mix well. Add a dash of water if needed to bring the mixture together."}], "tips": [{"h": "Ingredient Tips", "t": "Plain raspberries or blueberries are also great instead of mixed berries if preferred. Morlife Plantiful Vanilla Fudge protein powder was used in this recipe. (Get 15% off with code ‘HEALTHWITHBEC’ at checkout. Click here to shop.) If you use a different brand, please note it might impact the consistency and macros. Coconut yoghurt can be swapped for Greek yoghurt if tolerated. If you’re nut free, swap the almonds for 1 tbsp pepitas. tips"}, {"h": "Bec’s Tips", "t": "This is one of my personal favourites! It’s a go-to recipe that I whip up all the time. I always make sure these ingredients are stocked in my pantry for a quick and easy meal."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "berry breakfast bowl", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Crispy Mozzarella Eggs with Avocado Toast", "serves": "1", "time": "25 min", "time_detail": "5 min prep + 20 min cook", "cal": "438", "fat": "32", "protein": "31", "netcarbs": "1", "fibre": "9", "ingredients": [{"t": "2 large eggs"}, {"t": "40 g mozzarella, light, shredded"}, {"t": "¼ medium avocado"}, {"t": "2 tsp lemon juice"}, {"t": "¼ tsp garlic powder"}, {"t": "Pinch ground cumin"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 slice Bec's Bread Loaf"}, {"t": "Pinch chilli flakes"}], "steps": [{"t": "Bring a saucepan of water to a boil over medium- high heat. Gently lower the eggs into the water and boil for 8–10 minutes until hard-boiled. Transfer the eggs to a bowl of iced water to cool. Once cool enough to handle, peel the eggs and cut them in half."}, {"t": "Divide the mozzarella into four equal portions. Heat a non-stick frying pan over medium heat and place each portion of mozzarella in the pan as a small mound, leaving plenty of space between them. (Cook in batches if needed so the pan isn't overcrowded.)"}, {"t": "Once the mozzarella has just melted, place an egg half, cut-side down, on top of each mound. Cook for 3–4 minutes until the cheese is golden underneath, then flip and cook for a further 2 minutes until golden."}, {"t": "Meanwhile, mash the avocado with the lemon juice, garlic powder, cumin, salt, and pepper."}, {"t": "Toast the bread and spread with the mashed avocado."}, {"t": "Top with the crispy mozzarella eggs and sprinkle with chilli flakes."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to swap Bec's Bread for a slice of Venerdi Paleo Super Seeded Bread. For a list of stockists click here."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "crispy mozzarella eggs avocado toast", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Spinach & Tofu Stir-Fry", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "409", "fat": "24", "protein": "32", "netcarbs": "10", "fibre": "14", "ingredients": [{"t": "1 tbsp coconut oil*"}, {"t": "300 g firm organic tofu*, drained and cut into 2 cm cubes"}, {"t": "1 tbsp tamari"}, {"t": "2 cloves garlic, finely chopped"}, {"t": "1 tbsp fresh grated ginger"}, {"t": "4 spring onions, finely chopped"}, {"t": "200 g baby spinach"}, {"t": "1 tsp sesame oil"}, {"t": "300 g frozen cauliflower rice*"}, {"t": "12 almonds, roughly chopped"}, {"t": "¼ tsp chilli flakes (optional)"}], "steps": [{"t": "Heat the coconut oil in a large wok over medium-high heat. Add the tofu and half the tamari. Sauté, stirring every minute, for about 8 minutes, until golden on all sides and most of the moisture has evaporated."}, {"t": "Add the garlic, ginger, remaining tamari, and most of the spring onions, reserving some of the dark green part for garnish. Cook for 1 minute, until fragrant."}, {"t": "Add the spinach one handful at a time, stirring until wilted before adding more. Keep adding until all the spinach is mixed through."}, {"t": "Stir in the sesame oil, then remove from the heat."}, {"t": "Heat the cauliflower rice in a microwave and divide between bowls. Top with the stir-fry and garnish with the almonds, reserved spring onions, and chilli flakes if using. tips"}], "tips": [{"h": "Ingredient Tips", "t": "To make this nut free, swap the almonds for pepitas or omit altogether."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "spinach tofu stir fry", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Lemon Mug Cake", "serves": "1", "time": "10 min", "time_detail": "Cook Time: 2 min", "cal": "300", "fat": "20", "protein": "20", "netcarbs": "3", "fibre": "5", "ingredients": [{"h": "Mug Cake Ingredients"}, {"t": "2 tbsp almond meal"}, {"t": "1 tbsp coconut flour"}, {"t": "1 tbsp vanilla protein powder"}, {"t": "1 tbsp stevia"}, {"t": "½ tsp baking powder"}, {"t": "1 tsp lemon zest"}, {"t": "1 tbsp fresh lemon juice"}, {"t": "1 tbsp almond milk"}, {"t": "1 egg"}, {"t": "¼ tsp vanilla extract"}, {"t": "1 tsp coconut oil or butter, melted"}, {"h": "Glaze Ingredients"}, {"t": "1 tbsp powdered stevia"}, {"t": "1 tsp lemon juice"}, {"t": "½ tbsp almond milk"}, {"t": "2 tbsp Greek or coconut yoghurt to serve"}], "steps": [{"t": "Combine almond meal, coconut flour, protein powder, stevia, and baking powder in a small mixing bowl."}, {"t": "Zest and juice the lemon."}, {"t": "Add lemon zest, lemon juice, almond milk, vanilla and egg. Whisk to combine."}, {"t": "Add melted butter or coconut oil and quickly whisk through the mix."}, {"t": "Transfer to a greased coffee mug and microwave for approximately 2 minutes. The centre will be cooked and spring back when touched."}, {"t": "Turn the mug upside down on a plate to remove the muffin."}, {"t": "Prepare lemon glaze by mixing powdered stevia with lemon juice and almond milk and pour over the muffin."}, {"t": "Serve with Greek or coconut yoghurt."}], "tips": [{"h": "Bec’s Tips", "t": "Protein powder can be replaced with almond meal if you prefer. Macros are calculated using Greek yoghurt to serve. Morlife plantiful protein is my favourite protein powder!"}, {"h": "Snack size option", "t": "For a snack or desert size you can split the batter into two smaller mugs. Macros for snack size — Calories: 150 kcal Protein: 10 g Fat: 10 g Net Carbs: 2 g Fibre: 3 g"}], "sources": ["Plan 81 – November 2026 (Pescatarian)", "Eat Cake, Lose Weight eBook (2022)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "lemon mug cake", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Grilled Snapper with Cauliflower 'Potato' Salad", "serves": "1", "time": "35 min", "time_detail": "15 min prep + 20 min cook", "cal": "522", "fat": "30", "protein": "46", "netcarbs": "12", "fibre": "7", "ingredients": [{"h": "For The Salad"}, {"t": "1 egg"}, {"t": "½ medium head cauliflower, roughly chopped"}, {"t": "1½ tbsp mayonnaise*"}, {"t": "1½ tbsp Greek yoghurt, plain, non-fat*"}, {"t": "½ tbsp apple cider vinegar"}, {"t": "½ tbsp Dijon mustard"}, {"t": "¼ tsp garlic powder"}, {"t": "¼ tsp paprika"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "¼ red onion, finely diced"}, {"t": "½ stalk celery, sliced"}, {"t": "½ tsp fresh chives, finely chopped (optional)"}, {"h": "For The Fish"}, {"t": "150 g snapper"}, {"t": "1 tsp extra virgin olive oil*"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Place the egg in a small saucepan and cover with cold water. Bring to a boil over medium-high heat, then reduce the heat and simmer for 8–10 minutes. Transfer the egg to a bowl of cold water to cool, then peel and dice."}, {"t": "Meanwhile, steam the cauliflower for about 5 minutes, until just tender (you don't want it too soft or it will become mushy). Set aside to cool slightly."}, {"t": "In a small bowl, whisk together the mayonnaise, Greek yoghurt, apple cider vinegar, Dijon mustard, garlic powder, paprika, salt, and pepper until smooth."}, {"t": "In a large bowl, combine the cauliflower, red onion, celery, and egg. Pour over the dressing and mix well. Top with the chives, if using."}, {"t": "Heat a grill pan over medium-high heat."}, {"t": "Brush the snapper with the olive oil and season with salt and pepper."}, {"t": "Add the snapper to the pan and cook for 3–4 minutes on each side, until golden and cooked through."}, {"t": "Plate the snapper and salad and enjoy!"}], "tips": [{"h": "Ingredient Tips", "t": "Red emperor or pink snapper are my fish of choice for this dish but you can use any firm white fish you like. To make this dairy free, swap the Greek yoghurt for coconut yoghurt."}], "sources": ["Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "grilled snapper cauliflower potato salad", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Low Carb Buddha Bowl", "serves": "2", "time": "25 min", "time_detail": "", "cal": "445", "fat": "29", "protein": "25", "netcarbs": "8", "fibre": "12", "ingredients": [{"t": "1 clove garlic"}, {"t": "1/2 small red capsicum"}, {"t": "2 small tomatoes"}, {"t": "100 g poached chicken breast"}, {"t": "1 tbsp olive oil"}, {"t": "300 g carrot, cauliflower & broccoli rice"}, {"t": "2 cups spinach, rocket or leaves of your choice"}, {"t": "1 avocado"}, {"t": "1 tbsp pumpkin seeds"}, {"t": "1/4 tsp salt"}, {"t": "2 tsp mayonnaise"}], "steps": [{"t": "Mince garli
