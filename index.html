const theme = lsGet('theme'); if (theme) document.documentElement.setAttribute('data-theme', theme);

  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); lsSet('theme', next);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = id => id.replace(/\s+/g, '-');
const unslug = s => s.replace(/-/g, ' ');

function renderTabs(){
  const counts = {};
  for (const c of CATS) counts[c] = c === 'All' ? R.length : c === 'Favourites' ? favs.size : c === 'Meal plans' ? PLANS.length : c === 'Selected meals' ? selEntries().length : R.filter(r => r.cats.includes(c)).length;
  document.getElementById('tabs').innerHTML = CATS.map(c => `<button class="tab${cat===c?' on':''}" data-c="${esc(c)}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cat = b.dataset.c; shopOpen = false; location.hash = cat === 'All' ? '' : '#' + slug(cat.toLowerCase().replace(/[^a-z0-9 ]/g,'')); render(); });
  const showChips = cat !== 'Meal plans' && cat !== 'Selected meals';
  document.getElementById('chips').innerHTML = showChips ? TAGS.map(t => `<button class="chip${tagOn.has(t)?' on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('') : '';
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { const t = b.dataset.t; tagOn.has(t) ? tagOn.delete(t) : tagOn.add(t); render(); });
}

function filtered(){
  const needle = q.trim().toLowerCase();
  return R.filter(r => {
    if (cat === 'Favourites' && !favs.has(r.id)) return false;
    if (cat !== 'All' && cat !== 'Favourites' && !r.cats.includes(cat)) return false;
    for (const t of tagOn) if (!r.tags.includes(t)) return false;
    if (needle) {
      const hay = (r.title + ' ' + r.ingredients.map(i => i.t || '').join(' ') + ' ' + r.tags.join(' ')).toLowerCase();
      if (!needle.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}

function cardHTML(r){
  return `<button class="card" data-id="${esc(r.id)}">
    <h3>${esc(r.title)}</h3>
    <div class="meta">${r.time ? `<span>⏱ <b>${esc(r.time)}</b></span>` : ''}${r.serves ? `<span>serves <b>${esc(r.serves)}</b></span>` : ''}${r.cal ? `<span><b>${esc(r.cal)}</b> kcal</span>` : ''}${r.protein ? `<span><b>${esc(r.protein)}g</b> protein</span>` : ''}</div>
    <span class="fav${favs.has(r.id)?' on':''}" data-fav="${esc(r.id)}" role="button" aria-label="Favourite">${favs.has(r.id) ? '★' : '☆'}</span>
  </button>`;
}

function render(){
  renderTabs();
  const list = document.getElementById('list');
  document.getElementById('clear').hidden = !q;
  if (cat === 'Meal plans') { renderPlans(list); return; }
  if (cat === 'Selected meals') { renderSelected(list); return; }
  const rs = filtered().sort((a,b) => a.title.localeCompare(b.title));
  document.getElementById('count').textContent = `${R.length} recipes — meal plans, Tribe cards, the Eat Cake eBook, and family & friends`;
  if (!rs.length) { list.innerHTML = `<div class="empty">${cat==='Favourites' && !favs.size ? 'Tap the star on any recipe to keep it here.' : 'Nothing matches. Try fewer filters or a different word.'}</div>`; return; }
  list.innerHTML = `<div class="grid">${rs.map(cardHTML).join('')}</div>`;
  list.querySelectorAll('.card').forEach(b => b.onclick = e => {
    const f = e.target.closest('[data-fav]');
    if (f) { toggleFav(f.dataset.fav); e.stopPropagation(); render(); return; }
    openRecipe(b.dataset.id);
  });
}

function toggleFav(id){ favs.has(id) ? favs.delete(id) : favs.add(id); lsSet('favs', JSON.stringify([...favs])); }

function renderPlans(list){
  document.getElementById('count').textContent = `${PLANS.length} seven-day meal plans`;
  if (planNo === null) planNo = PLANS[0].no + (PLANS[0].pescatarian ? 'p' : '');
  const key = p => p.no + (p.pescatarian ? 'p' : '');

  const p = PLANS.find(x => key(x) === planNo);
  const cell = c => {
    if (!c || !c.text) return '';
    if (c.id && byId[c.id]) {
      const t = byId[c.id].title; const rest = c.text.slice(0, 0);
      const words = c.text.split(/\s+/); const tw = t.split(/\s+/).length; const extra = words.slice(tw).join(' ').replace(/^[^+]*?(?=\+|$)/, '').trim();

  };
  html += `<h2 class="section-h">${esc(p.name)}</h2>`;
  html += `<div class="week"><table><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Snacks</th><th>Dinner</th></tr></thead><tbody>` +
    p.week.map(d => `<tr><td>${esc(d.day)}${d.total ? `<small>~${esc(d.total)} kcal</small>` : ''}</td><td>${cell(d.breakfast)}</td><td>${cell(d.lunch)}</td><td>${cell(d.snacks)}</td><td>${cell(d.dinner)}</td></tr>`).join('') +

  html += `<h2 class="section-h" style="margin-top:28px">All recipes in this plan</h2><div class="grid">${p.recipes.map(id => byId[id]).filter(Boolean).map(cardHTML).join('')}</div>`;

/* ---- quantity scaling ---- */
const FR = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function parseQty(s){
  // returns [value, matchedLength] or null
  const m = s.match(/^((\d+)?\s*([¼½¾⅓⅔⅛⅜⅝⅞])|(\d+)\s+(\d)\/(\d)|(\d+)\/(\d+)|(\d+(?:[.,]\d+)?))(?=\s|$|-|[a-zA-Z])/);
  if (!m) return null;
  let v;
  if (m[3]) v = (m[2] ? +m[2] : 0) + FR[m[3]];
  else if (m[5]) v = +m[4] + (+m[5] / +m[6]);
  else if (m[7]) v = +m[7] / +m[8];
  else v = parseFloat(m[9].replace(',', '.'));
  return [v, m[0].length];
}
function fmtQty(v){
  if (v >= 10) return String(Math.round(v));
  const whole = Math.floor(v), frac = v - whole;
  const near = [[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let best = near[0];
  for (const n of near) if (Math.abs(n[0]-frac) < Math.abs(best[0]-frac)) best = n;
  if (Math.abs(best[0]-frac) > .06) return String(Math.round(v*10)/10);
  let w = whole + (best[0] === 1 ? 1 : 0);
  const f = best[0] === 1 || best[0] === 0 ? '' : best[1];
  if (!w && !f) return '0';
  return (w ? w : '') + f;
}
function scaleIng(t, k){
  if (k === 1) return esc(t);
  // handle ranges like "2-3 tbsp" and leading quantities
  const r = t.match(/^(\S[^\s]*)\s*[-–]\s*(\S+)(?=\s)/);
  const a = parseQty(t);
  if (!a) return esc(t);
  let rest = t.slice(a[1]);
  let out = `<span class="q">${fmtQty(a[0]*k)}</span>`;
  const rm = rest.match(/^\s*[-–]\s*/);
  if (rm) {
    const b = parseQty(rest.slice(rm[0].length));
    if (b) { out += `–<span class="q">${fmtQty(b[0]*k)}</span>`; rest = rest.slice(rm[0].length + b[1]); }
  }
  return out + esc(rest);
}

/* ---- recipe view ---- */
let serves = 0;
function openRecipe(id, push = true){
  const r = byId[id]; if (!r) return;
  curId = id; serves = parseInt(r.serves) || 0;
  if (push) history.pushState(null, '', '#r-' + slug(id));
  drawRecipe();
  const v = document.getElementById('view'); v.classList.add('open'); v.scrollTop = 0;
}
function drawRecipe(){
  const r = byId[curId]; const base = parseInt(r.serves) || 0; const k = base && serves ? serves / base : 1;
  document.getElementById('favBtn').textContent = favs.has(r.id) ? '★' : '☆';
  document.getElementById('favBtn').classList.toggle('on', favs.has(r.id));
  const ing = r.ingredients.map((i, n) => i.h ? `<li class="h">${esc(i.h)}</li>` : `<li data-i="${n}"><span class="box">✓</span><span>${scaleIng(i.t, k)}</span></li>`).join('');
  let n = 0;
  const steps = r.steps.map((s, i) => s.h ? `<li class="h">${esc(s.h)}</li>` : `<li data-s="${i}"><span class="num">${++n}</span><span>${esc(s.t)}</span></li>`).join('');
  const tips = r.tips.length ? `<div class="tips">${r.tips.map(t => `<h4>${esc(t.h)}</h4><p>${esc(t.t)}</p>`).join('')}</div>` : '';
  document.getElementById('vbody').innerHTML = `
    <h1 class="vtitle">${esc(r.title)}</h1>
    <div class="vsrc">${esc(r.sources.join(' · '))}</div>
    <div class="strip">
      <div class="serves"><div class="k">Serves</div>${base ? `<div class="serves-ctl"><button id="sm" aria-label="Fewer serves">−</button><span class="v" id="sv">${serves}</span><button id="sp" aria-label="More serves">+</button></div>` : '<div class="v">—</div>'}</div>
      <div class="time"><div class="k">Time</div><div class="v">${esc(r.time || '—')}${r.time_detail ? `<br><small>${esc(r.time_detail)}</small>` : ''}</div></div>
      ${r.cal ? `<div><div class="k">Per serve</div><div class="v">${esc(r.cal)}<small> kcal</small></div></div>
      <div><div class="k">Protein</div><div class="v">${esc(r.protein || '—')}<small> g</small></div></div>
      <div><div class="k">Fat</div><div class="v">${esc(r.fat || '—')}<small> g</small></div></div>
      <div><div class="k">Net carbs</div><div class="v">${esc(r.netcarbs || '—')}<small> g</small></div></div>
      <div><div class="k">Fibre</div><div class="v">${esc(r.fibre || '—')}<small> g</small></div></div>` : ''}
    </div>
    <div class="tagrow">${[...r.cats, ...r.tags].map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="cols">
      <div><h2 class="colh">Ingredients <small>tap to tick off</small></h2><ul class="ing">${ing}</ul></div>
      <div><h2 class="colh">Method <small>tap a step when done</small></h2><ol class="steps">${steps}</ol>${tips}</div>
    </div>`;
  const sm = document.getElementById('sm'), sp = document.getElementById('sp');
  if (sm) { sm.onclick = () => { if (serves > 1) { serves--; drawRecipe(); } }; sp.onclick = () => { if (serves < 24) { serves++; drawRecipe(); } }; }
  document.querySelectorAll('.ing li[data-i], .steps li[data-s]').forEach(li => li.onclick = () => li.classList.toggle('done'));
}
document.getElementById('back').onclick = () => history.length > 1 ? history.back() : closeRecipe();
function closeRecipe(){ document.getElementById('view').classList.remove('open'); curId = null; releaseWake(); closeChooser(); render(); }
document.getElementById('favBtn').onclick = () => { if (!curId) return; toggleFav(curId); drawRecipe(); };

/* wake lock */
async function requestWake(){ try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; document.getElementById('wakeBtn').classList.remove('on'); }); document.getElementById('wakeBtn').classList.add('on'); } } catch(e){} }
function releaseWake(){ try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e){} document.getElementById('wakeBtn').classList.remove('on'); }
document.getElementById('wakeBtn').onclick = () => wakeLock ? releaseWake() : requestWake();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && document.getElementById('wakeBtn').classList.contains('on') && !wakeLock) requestWake(); });
if (!('wakeLock' in navigator)) document.getElementById('wakeBtn').hidden = true;

/* ---- selected meals ---- */
const SLOTS = [['breakfast','Breakfast'],['lunch','Lunch'],['snacks','Snacks'],['dinner','Dinner']];
const SLOT_CAT = { breakfast:'Breakfast', lunch:'Mains', dinner:'Mains', snacks:'Snacks & sweets' };
let sel = { days: 5, cells: {} }, prevSel = null, shopOpen = false;
try { const s = JSON.parse(lsGet('sel') || 'null'); if (s && s.cells && s.days) sel = s; } catch(e){}
let have = new Set(); try { have = new Set(JSON.parse(lsGet('have') || '[]')); } catch(e){}
const saveSel = () => lsSet('sel', JSON.stringify(sel));
const saveHave = () => lsSet('have', JSON.stringify([...have]));
function selEntries(){ const out = []; for (let d = 0; d < sel.days; d++) for (const [s] of SLOTS) (sel.cells[d + '-' + s] || []).forEach((id, i) => { if (byId[id]) out.push({ d, s, i, id }); }); return out; }
function addSel(d, s, id){ const k = d + '-' + s; (sel.cells[k] = sel.cells[k] || []).push(id); saveSel(); }
function rmSel(d, s, i){ sel.cells[d + '-' + s].splice(i, 1); saveSel(); }

let msgTimer = null;
function say(text, btnLabel, onBtn){
  const t = document.getElementById('msgToast'), b = document.getElementById('msgBtn');
  document.getElementById('msgText').textContent = text;
  b.hidden = !btnLabel; b.textContent = btnLabel || ''; b.onclick = () => { t.hidden = true; onBtn && onBtn(); };
  t.hidden = false; clearTimeout(msgTimer); msgTimer = setTimeout(() => { t.hidden = true; }, btnLabel ? 6000 : 2500);
}

function renderSelected(list){
  const entries = selEntries();
  document.getElementById('count').textContent = `${entries.length} meal${entries.length === 1 ? '' : 's'} selected over ${sel.days} days`;
  if (shopOpen) { renderShopping(list, entries); return; }
  const planKey = p => p.no + (p.pescatarian ? 'p' : '');
  let html = `<div class="selbar">
    <div class="seg"><span>Days</span>${[3,4,5,6,7].map(n => `<button class="${sel.days === n ? 'on' : ''}" data-days="${n}">${n}</button>`).join('')}</div>
    <select class="btn" id="planImport" aria-label="Load a meal plan"><option value="">Load a meal plan…</option>${PLANS.map(p => `<option value="${planKey(p)}">${esc(p.month)} ${p.year} · Plan ${p.no}${p.pescatarian ? ' (pesc.)' : ''}</option>`).join('')}</select>
    <span class="grow"></span>
    <button class="btn" id="clearSel" ${entries.length ? '' : 'disabled'}>Clear</button>
    <button class="btn primary" id="toShop" ${entries.length ? '' : 'disabled'}>Shopping list ›</button>
  </div>`;
  if (!entries.length) html += `<div class="sel-empty"><b>Plan a few days of meals.</b> Tap <b>+ Add</b> in any slot below to pick a recipe, use <b>+</b> on a recipe page, or load one of the seven-day meal plans. Then turn it into a shopping list.</div>`;
  html += `<div class="days">` + Array.from({ length: sel.days }, (_, d) => `<div class="day"><h3>Day ${d + 1}</h3>` +
    SLOTS.map(([s, label]) => {
      const ids = (sel.cells[d + '-' + s] || []).filter(id => byId[id]);
      return `<div class="slot"><div class="k">${label}</div>` +
        ids.map((id, i) => `<div class="item"><button class="t" data-open="${esc(id)}">${esc(byId[id].title)}</button><button class="rm" data-rm="${d}|${s}|${i}" aria-label="Remove">✕</button></div>`).join('') +
        `<button class="add" data-add="${d}|${s}"><b>+</b> Add</button></div>`;
    }).join('') + `</div>`).join('') + `</div>`;
  list.innerHTML = html;
  list.querySelectorAll('[data-days]').forEach(b => b.onclick = () => { sel.days = +b.dataset.days; saveSel(); render(); });
  list.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
  list.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const [d, s, i] = b.dataset.rm.split('|'); rmSel(+d, s, +i); render(); });
  list.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const [d, s] = b.dataset.add.split('|'); openPicker(+d, s); });
  document.getElementById('toShop').onclick = () => { location.hash = '#shopping-list'; };
  document.getElementById('clearSel').onclick = () => { prevSel = JSON.stringify(sel); sel = { days: sel.days, cells: {} }; saveSel(); render(); say('Selection cleared', 'Undo', () => { sel = JSON.parse(prevSel); saveSel(); render(); }); };
  document.getElementById('planImport').onchange = e => {
    const p = PLANS.find(x => planKey(x) === e.target.value); if (!p) return;
    prevSel = JSON.stringify(sel);
    const cells = {};
    p.week.forEach((day, d) => { for (const [s] of SLOTS) { const c = day[s]; if (c && c.id && byId[c.id]) cells[d + '-' + s] = [c.id]; } });
    sel = { days: 7, cells }; saveSel(); render();
    say(`Loaded ${p.name}`, 'Undo', () => { sel = JSON.parse(prevSel); saveSel(); render(); });
  };
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (!standalone && !installDismissed) installToast.hidden = false; });
document.getElementById('installBtn').onclick = async () => { if (!installPrompt) return; installToast.hidden = true; installPrompt.prompt(); try { await installPrompt.userChoice; } catch(e){} installPrompt = null; };
document.getElementById('installX').onclick = () => { installToast.hidden = true; try { sessionStorage.setItem('installDismissed', '1'); } catch(e){} };
window.addEventListener('appinstalled', () => { installToast.hidden = true; });

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS && !standalone && location.protocol !== 'file:' && lsGet('iosHintSeen') !== '1') {
  const h = document.getElementById('iosHint'); h.hidden = false;
  document.getElementById('iosHintX').onclick = () => { h.hidden = true; lsSet('iosHintSeen', '1'); };
}
</script>
</body>
</html>
