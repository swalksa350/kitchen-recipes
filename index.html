<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Recipes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --ink:#1B2620; --muted:#66736A; --line:#D8E0D4; --accent:#2E5A3A; --accent-ink:#FFFFFF; --soft:#E8EFE6; --done:#9AA89E;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Figtree",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#131915; --surface:#1C241F; --ink:#EDF2EC; --muted:#9AA79E; --line:#2E3A32; --accent:#8CC498; --accent-ink:#0F1A13; --soft:#243029; --done:#59685E; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#131915; --surface:#1C241F; --ink:#EDF2EC; --muted:#9AA79E; --line:#2E3A32; --accent:#8CC498; --accent-ink:#0F1A13; --soft:#243029; --done:#59685E; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:18px; line-height:1.45; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:12px 20px}
.top-row{display:flex; gap:12px; align-items:center; max-width:1200px; margin:0 auto}
.brand{font-family:var(--serif); font-size:24px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.brand small{display:block; font-family:var(--sans); font-weight:500; font-size:13px; color:var(--muted); letter-spacing:0}
.search{flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:48px}
.search input{flex:1; border:0; background:none; font:inherit; font-size:18px; color:var(--ink); min-width:0}
.search input::placeholder{color:var(--muted)}
.search button{color:var(--muted); padding:6px; font-size:16px}
.iconbtn{min-width:48px; min-height:48px; border-radius:14px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink)}
.iconbtn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0 2px; max-width:1200px; margin:0 auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap; padding:10px 18px; min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-weight:600; font-size:17px}
.tab.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tab .n{font-weight:500; opacity:.7; margin-left:6px}
.chips{display:flex; gap:8px; overflow-x:auto; padding:8px 0 4px; max-width:1200px; margin:0 auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap; padding:7px 14px; min-height:38px; border-radius:999px; border:1px solid var(--line); font-size:15px; font-weight:500; color:var(--muted)}
.chip.on{color:var(--ink); border-color:var(--accent); background:var(--soft)}

/* list */
.wrap{max-width:1200px; margin:0 auto; padding:18px 20px 60px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.card{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 18px 14px; display:flex; flex-direction:column; gap:8px; min-height:132px; position:relative}
.card:active{background:var(--soft)}
.card h3{margin:0; font-family:var(--serif); font-weight:600; font-size:23px; line-height:1.18; letter-spacing:-.01em; padding-right:30px}
.card .meta{display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--muted); font-size:15px; margin-top:auto}
.card .meta b{color:var(--ink); font-weight:600}
.card .fav{position:absolute; top:12px; right:12px; font-size:22px; line-height:1; color:var(--muted); min-width:36px; min-height:36px; display:flex; align-items:center; justify-content:center}
.card .fav.on{color:#D9A400}
.empty{color:var(--muted); padding:40px 0; text-align:center; font-size:18px}
.section-h{font-family:var(--serif); font-size:30px; font-weight:600; margin:6px 0 14px; letter-spacing:-.01em}

/* plans */
.planlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:24px}
.plan-btn{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; font-size:18px; font-weight:600; min-height:60px}
.plan-btn small{display:block; font-weight:500; color:var(--muted); font-size:14px; margin-top:4px}
.plan-btn.on{border-color:var(--accent); background:var(--soft)}
.week{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
.week table{border-collapse:collapse; width:100%; min-width:760px}
.week th,.week td{text-align:left; vertical-align:top; padding:12px 12px; border-bottom:1px solid var(--line); font-size:16px}
.week th{font-weight:600; color:var(--muted); font-size:14px}
.week td:first-child{font-weight:700; white-space:nowrap}
.week td:first-child small{display:block; font-weight:500; color:var(--muted)}
.week tr:last-child td{border-bottom:0}
.week .lnk{text-align:left; color:var(--accent); font-weight:600; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; padding:2px 0}
.week .lnk:active{opacity:.6}

/* recipe view */
.view{position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; display:none}
.view.open{display:block}
.vbar{position:sticky; top:0; z-index:3; background:var(--surface); border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px; display:flex; gap:10px; align-items:center}
.vbar .back{min-height:48px; padding:0 16px 0 8px; border-radius:14px; display:flex; align-items:center; gap:6px; font-weight:600; font-size:17px; background:var(--bg); border:1px solid var(--line)}
.vbar .spacer{flex:1}
.vbody{max-width:1200px; margin:0 auto; padding:24px 20px 80px}
.vtitle{font-family:var(--serif); font-weight:600; font-size:clamp(34px,5vw,54px); line-height:1.05; letter-spacing:-.02em; margin:0 0 14px}
.vsrc{color:var(--muted); font-size:15px; margin-bottom:18px}
.strip{display:flex; flex-wrap:wrap; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:26px}
.strip>div{background:var(--surface); padding:12px 14px; flex:1 1 120px; min-width:120px}
.strip>div.serves{flex:1 1 180px; min-width:180px}
.strip>div.time{flex:1 1 170px}
.strip .k{font-size:13px; color:var(--muted); font-weight:500}
.strip .v{font-family:var(--serif); font-size:26px; font-weight:600; line-height:1.1; margin-top:2px}
.strip .v small{font-family:var(--sans); font-size:14px; font-weight:500; color:var(--muted)}
.serves-ctl{display:flex; align-items:center; gap:4px; margin-top:2px}
.serves-ctl button{min-width:40px; min-height:40px; border-radius:10px; border:1px solid var(--line); font-size:22px; font-weight:600; background:var(--bg)}
.serves-ctl .v{margin:0 6px}
.cols{display:grid; grid-template-columns:1fr; gap:34px}
@media (min-width:860px){.cols{grid-template-columns:minmax(300px,2fr) 3fr; gap:48px}}
.colh{font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 12px; display:flex; align-items:baseline; gap:12px}
.colh small{font-family:var(--sans); font-size:14px; color:var(--muted); font-weight:500}
.ing{list-style:none; margin:0; padding:0}
.ing li{display:flex; gap:12px; align-items:flex-start; padding:10px 6px; border-bottom:1px solid var(--line); font-size:19px; line-height:1.35; cursor:pointer}
.ing li.h{font-weight:700; border-bottom:0; padding-top:18px; padding-bottom:4px; font-size:16px; color:var(--muted); cursor:default}
.ing li .box{flex:0 0 26px; height:26px; margin-top:2px; border:2px solid var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--accent-ink)}
.ing li.done .box{background:var(--accent); border-color:var(--accent)}
.ing li.done span{color:var(--done); text-decoration:line-through}
.ing li .q{font-weight:700}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{display:flex; gap:16px; padding:14px 6px; border-bottom:1px solid var(--line); font-size:20px; line-height:1.45; cursor:pointer}
.steps li.h{font-weight:700; border-bottom:0; padding:22px 6px 6px; font-size:16px; color:var(--muted); cursor:default}
.steps li .num{flex:0 0 42px; height:42px; border-radius:50%; background:var(--soft); font-family:var(--serif); font-weight:600; font-size:20px; display:flex; align-items:center; justify-content:center; margin-top:1px}
.steps li.done{color:var(--done)}
.steps li.done .num{background:var(--accent); color:var(--accent-ink)}
.tips{margin-top:30px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px}
.tips h4{margin:0 0 6px; font-size:15px; color:var(--muted); font-weight:600}
.tips p{margin:0 0 14px; font-size:17px; line-height:1.5}
.tips p:last-child{margin-bottom:0}
.tagrow{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 20px}
.tagrow span{font-size:14px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 11px}
.vactions{display:flex; gap:10px; margin:0 0 24px; flex-wrap:wrap}
.vactions button{min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:16px}
.vactions button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

/* install + updates */
.toast{position:fixed; left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); max-width:560px; margin:0 auto; z-index:30; display:flex; gap:10px; align-items:center; background:var(--ink); color:var(--bg); border-radius:16px; padding:12px 14px 12px 18px; font-size:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:var(--bg); color:var(--ink); border-radius:10px; padding:8px 14px; font-weight:600; min-height:40px; white-space:nowrap}
.toast .x{background:none; color:inherit; opacity:.75; padding:6px 8px}
.toast[hidden]{display:none}
.toast p{margin:0; line-height:1.35; flex:1; min-width:0}
.toast b{font-weight:700}
@media (max-width:600px){.brand small{display:none} .brand{font-size:20px} .top{padding:10px 16px}}

/* selected meals */
.selbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px}
.selbar .grow{flex:1}
.seg{display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface)}
.seg span{padding:0 10px 0 14px; display:flex; align-items:center; color:var(--muted); font-size:14px; font-weight:600}
.seg button{min-height:44px; min-width:44px; padding:0 12px; font-weight:600; font-size:16px; border-left:1px solid var(--line)}
.seg button.on{background:var(--accent); color:var(--accent-ink)}
.btn{min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:16px; display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default}
select.btn{appearance:none; -webkit-appearance:none; padding-right:36px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; max-width:100%}
.days{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.day{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px 6px}
.day h3{margin:0 0 6px; font-family:var(--serif); font-size:22px; font-weight:600}
.slot{border-top:1px solid var(--line); padding:8px 0}
.slot .k{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px}
.slot .item{display:flex; align-items:center; gap:6px}
.slot .item .t{flex:1; min-width:0; text-align:left; font-weight:600; font-size:17px; line-height:1.3; color:var(--accent); padding:4px 0}
.slot .item .rm{min-width:36px; min-height:36px; border-radius:10px; color:var(--muted); font-size:18px}
.slot .add{color:var(--muted); font-size:15px; font-weight:500; min-height:36px; padding:2px 0; display:flex; align-items:center; gap:6px}
.slot .add b{font-size:22px; line-height:1; font-weight:500}
.sel-empty{background:var(--surface); border:1px dashed var(--line); border-radius:18px; padding:22px 20px; color:var(--muted); font-size:17px; line-height:1.5; margin-bottom:16px}
.sel-empty b{color:var(--ink)}
.psearch{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:48px; flex:1; min-width:0}
.psearch input{flex:1; border:0; background:none; font:inherit; font-size:18px; color:var(--ink); min-width:0}
.ptitle{font-family:var(--serif); font-size:24px; font-weight:600; margin:0 0 12px}
.view .chips{padding:0 0 14px}
/* bottom sheet */
.scrim{position:fixed; inset:0; z-index:39; background:rgba(0,0,0,.35)}
.scrim[hidden]{display:none}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); border-radius:22px 22px 0 0; padding:16px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px)); max-height:80vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet[hidden]{display:none}
.sheet .hd{display:flex; align-items:center; gap:10px; margin-bottom:12px; max-width:720px; margin-left:auto; margin-right:auto}
.sheet .hd h3{margin:0; font-family:var(--serif); font-size:22px; font-weight:600; flex:1}
.sheet .hd small{display:block; font-family:var(--sans); font-size:14px; color:var(--muted); font-weight:500}
.chgrid{display:grid; grid-template-columns:auto repeat(4,1fr); gap:6px; max-width:720px; margin:0 auto; align-items:center}
.chgrid .dl{font-weight:700; font-size:15px; padding-right:6px; white-space:nowrap}
.chgrid .hl{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-align:center}
.chgrid button.c{min-height:44px; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:14px; font-weight:600}
.chgrid button.c.has{background:var(--soft); border-color:var(--accent)}
/* shopping list */
.shopwrap{display:grid; gap:0 40px; grid-template-columns:1fr}
@media (min-width:900px){.shopwrap{grid-template-columns:1fr 1fr}}
.aisle h3{font-family:var(--serif); font-size:22px; font-weight:600; margin:18px 0 4px; display:flex; align-items:baseline; gap:10px}
.aisle h3 small{font-family:var(--sans); font-size:14px; color:var(--muted); font-weight:500}
.shoplist{list-style:none; margin:0; padding:0}
.shoplist li{display:flex; gap:12px; align-items:flex-start; padding:10px 6px; border-bottom:1px solid var(--line); font-size:18px; line-height:1.35}
.shoplist li .box{flex:0 0 26px; height:26px; margin-top:3px; border:2px solid var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--accent-ink); cursor:pointer}
.shoplist li.have .box{background:var(--accent); border-color:var(--accent)}
.shoplist li .body{flex:1; min-width:0; cursor:pointer}
.shoplist li .name{font-weight:600}
.shoplist li.have .name{color:var(--done); text-decoration:line-through}
.shoplist li .qty{display:block; font-size:15px; color:var(--ink)}
.shoplist li .from{display:block; font-size:14px; color:var(--muted)}
.shoplist li .links{display:flex; gap:12px; margin-top:4px}
.shoplist li .links a{font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px}
.shoplist li.have .links{display:none}
.shopnote{color:var(--muted); font-size:15px; line-height:1.5; margin:22px 0 0; max-width:65ch}
.shopnote a{color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">Kitchen recipes<small id="count"></small></div>
    <div class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search recipes or ingredients" autocomplete="off" autocorrect="off" autocapitalize="none"><button id="clear" aria-label="Clear search" hidden>✕</button></div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle light or dark">◐</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
</header>

<main class="wrap">
  <div id="list"></div>
</main>

<section class="view" id="view" aria-live="polite">
  <div class="vbar">
    <button class="back" id="back">‹ Back</button>
    <div class="spacer"></div>
    <button class="iconbtn" id="addBtn" aria-label="Add to selected meals" title="Add to selected meals">＋</button>
    <button class="iconbtn" id="wakeBtn" aria-label="Keep screen awake" title="Keep screen awake">☀</button>
    <button class="iconbtn" id="favBtn" aria-label="Favourite">☆</button>
  </div>
  <div class="vbody" id="vbody"></div>
</section>

<section class="view" id="picker" aria-label="Choose a recipe">
  <div class="vbar">
    <button class="back" id="pickerBack">‹ Cancel</button>
    <div class="psearch"><span aria-hidden="true">⌕</span><input id="pq" type="search" placeholder="Search recipes" autocomplete="off" autocorrect="off" autocapitalize="none"></div>
  </div>
  <div class="vbody">
    <h2 class="ptitle" id="pickerTitle"></h2>
    <div class="chips" id="pchips"></div>
    <div id="plist"></div>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="chooser" hidden role="dialog" aria-label="Add to selected meals">
  <div class="hd"><h3>Add to selected meals<small id="chooserSub"></small></h3><button class="iconbtn" id="chooserX" aria-label="Close">✕</button></div>
  <div class="chgrid" id="chgrid"></div>
</div>

<div class="toast" id="msgToast" hidden role="status">
  <p id="msgText"></p>
  <button id="msgBtn" hidden></button>
</div>

<div class="toast" id="iosHint" hidden role="status">
  <p>To use this as an app: tap <b>Share</b> then <b>Add to Home Screen</b>.</p>
  <button class="x" id="iosHintX" aria-label="Dismiss">✕</button>
</div>
<div class="toast" id="installToast" hidden role="status">
  <p>Install this app to use it offline.</p>
  <button id="installBtn">Install</button>
  <button class="x" id="installX" aria-label="Not now">✕</button>
</div>
<div class="toast" id="updToast" hidden role="status">
  <p>A new version of the recipes is ready.</p>
  <button id="updBtn">Update</button>
</div>

<script id="data" type="application/json">{"recipes": [{"title": "BBQ’D Spiced Pumpkin & Haloumi Salad", "serves": "2", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "393", "fat": "28", "protein": "19", "netcarbs": "12", "fibre": "1", "ingredients": [{"t": "250g pumpkin"}, {"t": "1 tbsp dukkah"}, {"t": "1 tbsp olive oil"}, {"t": "125g pkt haloumi, thickly sliced"}, {"t": "1/2 tbsp white wine vinegar"}, {"t": "80g leafy greens"}, {"t": "Dash salt"}, {"t": "Dash pepper"}], "steps": [{"t": "Cut the pumpkin into thin wedges and halved crossways. Combine the pumpkin, dukkah and half the oil in a large bowl. Thickly slice the haloumi."}, {"t": "Heat a bbq grill or char grill pan on high. Cook pumpkin for 5 mins each side or until golden brown and tender."}, {"t": "Meanwhile, heat a barbecue flat plate or large frying pan on high. Cook the haloumi for 2 mins each side or until browned."}, {"t": "Combine the vinegar and remaining oil in a small bowl. Season."}, {"t": "Place the salad leaves, pumpkin and haloumi in a bowl. Drizzle with dressing and toss to combine."}, {"t": "Divide among serving plates and serve immediately."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "bbq d spiced pumpkin haloumi salad", "cats": ["Mains"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Lemon Blueberry Scones with Strawberry Jam", "serves": "12", "time": "30 min", "time_detail": "10 min prep + 20 min cook", "cal": "224", "fat": "9", "protein": "6", "netcarbs": "4", "fibre": "3", "ingredients": [{"t": "1/2 cup butter (125gms) cold chopped"}, {"t": "1/2 cup granulated monkfruit"}, {"t": "1tbsp baking powder"}, {"t": "1/4 tsp salt"}, {"t": "1 large egg"}, {"t": "2 tsp vanilla extract"}, {"t": "1.5 cup almond flour"}, {"t": "1/2 cup coconut flour"}, {"t": "1 tbsp psyllium husk"}, {"t": "1 cup frozen blueberries"}, {"t": "1 tbsp lemon zest"}, {"h": "For The Jam"}, {"t": "2 cups frozen strawberries"}, {"t": "2 tbsp chia seeds"}, {"t": "1 tbsp granulated monk fruit"}, {"t": "1 tbsp lemon juice"}], "steps": [{"t": "Preheat oven to 180 C / 350 F. Mix all dry ingredients. Whisk egg and vanilla together in a separate bowl. Chop cold butter into small pieces. Rub butter into dry ingredients and mix with fingers to make a dry crumbly texture. Doesn't have to be all evenly mixed. (do not over mix)."}, {"t": "Add egg mixture and mix just until roughly combined. Add frozen blueberries & lemon zest. Tip mixture onto a large piece of baking paper & press the mixture together gently to make 2 even balls (don't knead just press them together)."}, {"t": "Flatten each ball about 1 inch thick and cut each into 6 pieces using a pizza cutter or pastry cutter (to make 12 total portions)."}, {"t": "Line a baking tray with baking paper and space out the scones and place them in the oven. Bake for 20 minutes or until lightly golden brown."}, {"t": "To make the jam, add strawberries to a saucepan over low heat. Stir until the fruit begins to soften and becomes syrupy. Mash the berries with a fork or potato masher."}, {"t": "Add the chia seeds, 1 tbsp granulated monk fruit and 1 tbsp lemon juice and give another stir."}, {"t": "Remove from the heat and allow to cool slightly before transferring to an airtight container. It will continue to thicken as the chia seeds absorb the juices from the berries."}, {"t": "To serve, cut 1 scone in half and place 1/2 tbsp jam on each half."}, {"t": "› 1/4 medium brown onion Rub the fish with the turmeric, curry powder and salt. › 1/2 fresh chilli › 1/2 clove garlic clove STEP 3 In a frying pan, heat oil and cook onion, chilli, garlic and › 1/2 tsp fresh ginger ginger on low heat for about 5 minutes. Avoid browning. › 70 ml coconut cream › 1/2 lime STEP 4 Add the coconut cream, stir well, then add the fish › 1/4 cup fresh coriander and bring to a simmer. › 1 bunch bok choy › 1/4 medium head cauliflower STEP 5 Cook uncovered for 4 minutes."}, {"t": "Meanwhile, steam your cauli rice & veggies!"}, {"t": "Turn fish over and finish cooking (approximately another 3-4 minutes). Then, stir in some lime juice and coriander leaves and serve with the cauli rice & veg! Season with extra chilli, salt and pepper if desired!"}], "tips": [{"h": "Bec’s Tips", "t": "Scones can be frozen. Blueberries can be changed to strawberries or raspberries. I think it tastes better when cooled in the fridge and warmed up the next day! Next level delicious!! Jam can be any berry of choice. You can also add extra monk fruit if the jam tastes quite tart. These scones were submitted by the wonderful triber Sruti! Fragrant Coconut Fish with Coriander SERVES TOTAL COOKING TIME 1 20 MINS CALORIES FATS PROTEIN NET CARBS FIBRE 10 mins prep + 10 mins cook 480cal 30g 36g 14g 9g INGREDIENTS METHOD › 160 g snapper STEP 1 Finely dice the onion and chilli. Crush the garlic. › 1/4 tsp ground turmeric Grate the ginger. Blitz the cauliflower in a food › 1 tbsp curry powder processor to make cauliflower rice. Juice the lime. › Pinch salt Chop the coriander. › 1/3 tbsp olive oil"}, {"h": "Bec’s Tips", "t": "Red emperor or pink snapper are my fish of choice for this dish. Feel free to swap bok choy to any other greens, broccoli works really well! Optional: add a splash of coconut aminos or tamari to serve."}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast", "snacks"], "id": "lemon blueberry scones strawberry jam", "cats": ["Breakfast", "Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Mug Bread with Garlic & Thyme Mushrooms & Egg", "serves": "1", "time": "10 min", "time_detail": "", "cal": "434", "fat": "26", "protein": "19", "netcarbs": "11", "fibre": "3", "ingredients": [{"t": "1 egg"}, {"t": "1/2 tbsp olive oil"}, {"t": "1.5 cups button mushrooms"}, {"t": "1/4 lemon"}, {"t": "1/2 tsp butter"}, {"t": "1 tsp dried thyme"}, {"t": "1 clove garlic"}, {"t": "salt"}, {"t": "pepper"}, {"t": "1 tbsp lemon juice"}, {"h": "For The Mug Bread"}, {"t": "2 tbsp almond flour"}, {"t": "1 egg"}, {"t": "1/4 tsp baking powder"}, {"t": "pinch salt"}, {"t": "1 tsp butter"}, {"t": "1 tsp water"}], "steps": [{"t": "Slice the mushrooms, zest the lemon and finely chop the garlic. In a large frypan, heat the oil over medium / high heat."}, {"t": "Add the mushrooms and cook for 3-4 minutes until they have browned off nicely on one side. They will also start to shrink slightly and release some liquid. Flip them over and cook for 2 more minutes on the other side. At this stage, we don't want to stir them too much as we want to develop a nice, golden brown colour."}, {"t": "Once the mushrooms have browned off, add the lemon zest, butter, thyme, garlic and a pinch of salt and pepper."}, {"t": "Cook together for a minute or two, stirring a couple of times. Finally, drizzle with lemon juice and toss through one more time."}, {"t": "Crack your egg into gently simmering water and poach for 5 minutes, or, until cooked to your liking."}, {"t": "Meanwhile, make your keto mug bread by melting the butter then adding the rest of the ingredients to a microwave safe cup or ramekin."}, {"t": "Whisk all the ingredients together well."}, {"t": "Place in the microwave for 1 minute (or a little longer, until risen and cooked)."}, {"t": "Cut mug bread in half, spoon over the mushrooms and top with the poached egg."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "mug bread garlic thyme mushrooms egg", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Tuna Lettuce Cups", "serves": "1", "time": "5 min", "time_detail": "5 min prep + 0 min cook", "cal": "130", "fat": "2", "protein": "25", "netcarbs": "1", "fibre": "1", "ingredients": [{"t": "95 g tin tuna in springwater"}, {"t": "1 tbsp egg free mayo"}, {"t": "1/2 tsp dijon mustard"}, {"t": "pinch salt"}, {"t": "pinch pepper"}, {"t": "1 tsp lemon juice"}, {"t": "2 Romaine lettuce leaves"}], "steps": [{"t": "Drain the tuna and break up the tuna with a fork."}, {"t": "Add the mustard, mayo, lemon juice, salt & pepper and give everything a really good mix."}, {"t": "Divide the mixture between the two lettuce leaves and enjoy. Option to add chopped cherry tomatoes, spring onions, capers, chopped celery or pickles to make this even tastier without adding too many calories."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)", "Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "tuna lettuce cups", "cats": ["Snacks & sweets"], "tags": ["Fish & seafood", "15 min or less"]}, {"title": "Spinach & Tofu Stirfry", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "408", "fat": "23", "protein": "33", "netcarbs": "10", "fibre": "14", "ingredients": [{"t": "300 g firm organic tofu"}, {"t": "1 tbsp coconut oil"}, {"t": "4 tbsp tamari"}, {"t": "2 cloves garlic"}, {"t": "1 small knob fresh ginger"}, {"t": "200 g spinach"}, {"t": "¼ bunch spring onion"}, {"t": "1 tsp sesame oil"}, {"t": "½ medium head cauliflower"}, {"t": "¼ tsp chilli flakes"}, {"t": "12 almonds"}], "steps": [{"t": "Crush garlic, grate ginger, finely chop spring onion and chop almonds."}, {"t": "Drain the tofu. Wrap each block in a double layer of paper towel and pat dry, pressing down on the tofu lightly to squeeze out excess moisture. Cut the tofu into ¾ inch cubes."}, {"t": "Grate cauliflower with a handheld grater or blitz in food processor to make rice."}, {"t": "In a large wok, heat the coconut oil over medium- high heat. Once the oil is hot, add the tofu and drizzle with 2 tbsp tamari."}, {"t": "Sauté, stirring every minute or so until the tofu is nicely coloured on all sides and the moisture has cooked off, about 8 minutes."}, {"t": "Add the garlic, roughly 3/4s of the chopped spring onion, ginger and the remaining 2 tablespoons of tamari. Stir and cook until fragrant, about 1 minute."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "spinach tofu stirfry", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Snapper with Eggplant & Minted Walnut Salad", "serves": "2", "time": "65 min", "time_detail": "15 min prep + 50 min cook", "cal": "538", "fat": "37", "protein": "36", "netcarbs": "10", "fibre": "10", "ingredients": [{"t": "1 large eggplant"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "3 tbsp greek yoghurt"}, {"t": "1 tbsp tahini"}, {"t": "1/2 garlic clove"}, {"t": "1/2 lemon"}, {"t": "2.5 tbsp olive oil"}, {"t": "250 g snapper"}, {"t": "2 spring onions"}, {"t": "1/3 cup walnuts"}, {"t": "100 g frozen peas"}, {"t": "2 tbsp fresh mint"}, {"t": "100 g baby spinach"}, {"t": "Pinch dried chilli flakes (optional)"}, {"t": "1/2 tbsp red wine vinegar"}], "steps": [{"t": "Preheat the oven to 180 C / 350 F. Mince the garlic, zest & juice the lemon, thinly slice the spring onions and finely chop the mint leaves."}, {"t": "Prick the eggplant all over with a fork and place on an oven tray and roast for about 30 - 45 mins. Remove from the oven, cut the eggplant in half and scoop out the soft flesh."}, {"t": "Roughly chop and add to a bowl and season with salt and pepper. Add the yoghurt, tahini, garlic, lemon juice and 1 tbsp olive oil. Give it a good stir, taste and adjust seasonings if needed."}, {"t": "Place a frypan on high heat and add the walnuts. Dry toast for a minute or two, tossing regularly until slightly golden. Remove from the pan and roughly chop the walnuts."}, {"t": "To make the salad, quickly blanch the frozen peas in boiling water for 2 minutes, until bright green. Drain and add to a bowl. Add the spring onions, walnuts, mint, baby spinach, chilli flakes (optional), red wine vinegar, 1 tbsp lemon juice and 1 tbsp olive oil. Give everything a good mix. Taste and season with salt and pepper if desired."}, {"t": "Season snapper with salt, pepper and 1/2 tbsp olive oil. Place the frypan back over medium heat and cook the snapper for 2 minutes each side until golden & just cooked through to your liking."}, {"t": "Place the snapper on two plates, top with the eggplant and scatter over the pea & walnut salad. Enjoy."}], "tips": [{"h": "Bec’s Tips", "t": "You can grill the eggplant on your stovetop, over a high flame instead of placing it in the oven. Carefully rotate the eggplant with tongs until it’s charred all over, about 10 mins."}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "snapper eggplant minted walnut salad", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Vanilla & Peanut Butter Chia Pudding", "serves": "1", "time": "overnight", "time_detail": "5 min prep + 0 min cook", "cal": "362", "fat": "27", "protein": "13", "netcarbs": "12", "fibre": "10", "ingredients": [{"t": "2 tbsp chia seeds"}, {"t": "1 tsp granulated monk fruit"}, {"t": "2 tbsp peanut butter"}, {"t": "1 tsp vanilla extract"}, {"t": "1 cup almond milk, unsweetened"}], "steps": [{"t": "Melt the peanut butter in the microwave."}, {"t": "Pour the milk into a cup, jar or ramekin. Then ad d the melted peanut butter, vanilla and sweetener."}, {"t": "Now, add the chia seeds."}, {"t": "Mix together well with a whisk and refrigerate for at least 6 hours or overnight."}], "tips": [{"h": "Bec’s Tips", "t": "Monk fruit can be swapped to stevia if desired."}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "vanilla peanut butter chia pudding", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Fragrant Oven-Baked Pumpkin with Coconut Cauliflower Rice", "serves": "2", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "509", "fat": "33", "protein": "23", "netcarbs": "26", "fibre": "13", "ingredients": [{"t": "1/2 tbsp butter"}, {"t": "1/2 tbsp olive oil"}, {"t": "1/2 red onion"}, {"t": "500 g pumpkin"}, {"t": "150 g firm tofu"}, {"t": "1 tbsp pumpkin seeds"}, {"t": "3/4 tbsp nigella seeds"}, {"t": "1/4 tsp ground cumin"}, {"t": "1/4 tsp ground coriander"}, {"t": "Pinch ground turmeric"}, {"t": "2 cardamom pods"}, {"t": "1 stick cinnamon"}, {"t": "1 green chilli (optional)"}, {"t": "1/4 tsp granulated monk fruit"}, {"t": "Pinch salt"}, {"t": "100 mls vegetable stock"}, {"t": "1/3 cup greek yoghurt"}, {"t": "1/4 cup coriander"}, {"h": "For The Cauliflower Rice"}, {"t": "300 g cauliflower rice"}, {"t": "1 tsp coconut oil"}, {"t": "Pinch Salt"}, {"t": "1 tbsp butter"}, {"t": "2 tbsp coconut cream"}], "steps": [{"t": "Preheat the oven to 200 C fan-forced / 392 F"}, {"t": "Thinly slice the red onion and peel and cut the pumpkin into 3cm chunks. Chop the tofu into 3cm chunks as well."}, {"t": "Place the butter and oil in a large sauté pan on a medium heat. Add the onion and fry for about 8 minutes, until soft."}, {"t": "Add the pumpkin & tofu, ,increase the heat to medium-high and cook for a further 10 minutes, stirring occasionally, until everything starts to colour."}, {"t": "Remove from the heat and add the pumpkin seeds, nigella seeds, cumin, coriander, turmeric, cardamom, cinnamon, chilli, monk fruit and a good pinch of salt."}, {"t": "Mix well and transfer to a baking tray large enough to hold the vegetables in a single but snug layer."}, {"t": "Pour over the stock and bake in the oven for 20 minutes, until the pumpkin is tender."}, {"t": "Remove from the oven and set aside for about 10 minutes: the liquid in the tray will continue to be absorbed."}, {"t": "Meanwhile, for the rice, Heat a large pan over medium heat and add the coconut oil. Once hot, add the cauliflower rice and salt and cook for about 3-4 mins, stirring occasionally."}, {"t": "Add the butter to the pan, let it melt, then mix it all in. Then, add the coconut cream and half the coriander and stir together."}, {"t": "To serve, divide the rice & the pumpkin/ tofu between two bowls. Dollop with the yohgurt and sprinkle with the remaining coriander leaves."}], "tips": [{"h": "Bec’s Tips", "t": "Can't find nigella seeds? use 1/2 tsp more of cumin & coriander. You can remove the cinnamon stick and cardamom pods from the pumpkin before serving if you like. Don't 31 try to eat them!"}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "fragrant oven baked pumpkin coconut cauliflower rice", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Strawberry & Spinach Smoothie", "serves": "1", "time": "5 min", "time_detail": "5 min prep + 0 min cook", "cal": "244", "fat": "14", "protein": "20", "netcarbs": "5", "fibre": "10", "ingredients": [{"t": "¼ cup frozen strawberries"}, {"t": "½ cup frozen spinach"}, {"t": "1 tbsp chia seeds"}, {"t": "1 tbsp almond Butter"}, {"t": "¼ tsp granulated monk fruit (optional)"}, {"t": "14 g vanilla protein powder"}, {"t": "1 cup water"}], "steps": [{"t": "Place all ingredients into a blender and blend until combined and super creamy."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "strawberry spinach smoothie", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Pesto Prawn Pasta", "serves": "2", "time": "10 min", "time_detail": "5 min prep + 5 min cook", "cal": "406", "fat": "20", "protein": "40", "netcarbs": "11", "fibre": "12", "ingredients": [{"t": "200 g slendier legume pasta"}, {"t": "200 g green beans"}, {"t": "70 g button mushrooms"}, {"t": "200 g prawns"}, {"t": "3 tbsp red pesto"}, {"t": "60 g spinach"}, {"t": "1 clove garlic"}, {"t": "1 tbsp olive oil"}], "steps": [{"t": "Chop the green beans. Slice the mushrooms. Crush the garlic."}, {"t": "Bring water to the boil in a medium to large sized saucepan to cook the pasta."}, {"t": "Meanwhile, heat a fry pan over medium and add olive oil, beans, mushrooms, garlic and prawns. Cook, stirring constantly to prevent garlic burning."}, {"t": "When water boils, cook pasta for 3 minutes, drain and then add to the pan with the beans, prawns and mushrooms. Once cooked, add 3 tbsp pesto and spinach, and stir until combined and the spinach has wilted!"}, {"t": "Season with salt and pepper to your liking and serve!"}], "tips": [{"h": "Bec’s Tips", "t": "This recipe was tweaked from one of mine and inspired by Lemme, one of our Tribers! Swap the green beans for broccoli or any other green veggie if you wish. You can use red or green pesto!"}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "pesto prawn pasta", "cats": ["Mains"], "tags": ["Fish & seafood", "15 min or less"]}, {"title": "Chocolate Pancakes", "serves": "1", "time": "15 min", "time_detail": "makes 10 min prep + 5 min cook", "cal": "460", "fat": "34", "protein": "19", "netcarbs": "10", "fibre": "12", "ingredients": [{"t": "1 whole egg"}, {"t": "1 egg white"}, {"t": "1/4 cup unsweetened almond milk"}, {"t": "1/2 tsp cinnamon"}, {"t": "1/4 tsp baking powder"}, {"t": "1 tbsp coconut flour"}, {"t": "1/4 cup almond flour"}, {"t": "1 tbsp cacao powder"}, {"t": "1 tsp granulated monk fruit"}, {"t": "1 tsp coconut oil"}, {"t": "2 tbsp coconut yoghurt"}, {"t": "1/3 cup berries"}], "steps": [{"t": "Whisk all ingredients (except coconut oil, yoghurt & berries) together in a bowl. Alternatively, use a blender! This makes the pancakes turn out extra fluffy. Let it sit for at least 5 minutes, it should slightly thicken. The consistency should be a smooth, slightly runny batter - so if it's too thick, add a little more almond milk!"}, {"t": "Heat coconut oil in a large fry pan over medium heat."}, {"t": "Using the 1/4 cup measure, scoop batter onto the pan to make 3 round pancakes (you may need to make 2 first, then the last one after if your pan isn't big enough!). Cook for 3-4 minutes, until you see bubbles form. Then, using an egg flipper, lightly lift up one of the sides to see if it's cooked and golden underneath, then flip over and cook for about a further 30 seconds - 1 minute."}, {"t": "Transfer to a plate and top with 2 heaped tablespoons of coconut yogurt, berries and extra cinnamon if you like."}], "tips": [{"h": "Bec’s Tips", "t": "Pictured here are also cacao nibs, chopped hazelnuts and coconut flakes (but these aren't included in the calorie count). Add them if you desire, just take this into account! Monk fruit can be swapped to stevia if desired. Almond flour can be swapped to lupin flour if nut free. Almond milk can be swapped to unsweetened coconut or soy milk. Coconut yoghurt can be swapped for 1/4 cup plain greek yoghurt."}], "sources": ["Plan 55 – September 2024 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "chocolate pancakes", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Lemon Grilled Salmon with Cauliflower Mash & Asparagus", "serves": "1", "time": "25 min", "time_detail": "", "cal": "451", "fat": "24", "protein": "39", "netcarbs": "15", "fibre": "13", "ingredients": [{"h": "Salmon"}, {"t": "1 fillets salmon (125 g)"}, {"t": "1/2 tbsp olive oil"}, {"t": "1 pinch salt"}, {"t": "1 pinch pepper"}, {"t": "1 lemon, cut into thick slices"}, {"h": "Cauliflower Mash"}, {"t": "1/4 head cauliflower (approx. 150 g)"}, {"t": "1/2 tbsp butter"}, {"t": "1/2 garlic clove"}, {"t": "1 tbsp parmesan"}, {"t": "1 tbsp almond milk"}, {"t": "1 pinch salt"}, {"t": "1 bunch asparagus"}], "steps": [{"h": "Salmon"}, {"t": "Heat a grill pan on high."}, {"t": "Brush the salmon with oil and season with salt and pepper. Then, add the salmon and lemon slices to the grill and cook the salmon until it is cooked through and the lemons are charred (approx. 5 minutes per side)."}, {"h": "Cauliflower Mash"}, {"t": "Chop the cauliflower into small florets. In a pot of boiling water, a steamer or the microwave – steam the cauliflower until well cooked (approx. 2-3 minutes). You want a fork to easily go through it when inserted."}, {"t": "In a food processor add the cauliflower, milk, butter, garlic clove, salt and parmesan cheese and process. If it’s too thick, add a touch more milk and continue to process until creamy and smooth."}, {"t": "Steam asparagus however you like. Taste and add a little more salt if needed! Serve both alongside asparagus."}], "tips": [], "sources": ["Plan 55 – September 2024 (Pescatarian)", "Plan 75 – May 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "lemon grilled salmon cauliflower mash asparagus", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Chicken Waldorf Salad", "serves": "2", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "497", "fat": "31", "protein": "37", "netcarbs": "12", "fibre": "4", "ingredients": [{"t": "4 tbsp mayonnaise"}, {"t": "1 tbsp lemon juice"}, {"t": "Pinch salt"}, {"t": "Pinch ground pepper"}, {"t": "300 g chicken breast"}, {"t": "1 red apple"}, {"t": "1⁄3 cup celery"}, {"t": "1⁄4 cup walnuts"}, {"t": "2 cups rocket"}], "steps": [{"t": "Bring a small pot of water to a simmer. Add the chicken breast and gently poach, on low for about 10 minutes (or until the chicken is cooked all the way through)."}, {"t": "Turn off the heat and remove the chicken from the pot and let it cool."}, {"t": "Dice the apple, slice the celery and chop the chicken into small bites."}, {"t": "In a large bowl, combine the mayonnaise, lemon juice, salt and pepper. Taste & adjust seasoning if needed."}, {"t": "Add rocket, chicken, apples and celery."}, {"t": "Toss to coat everything evenly. Cover and chill. Just before you are ready to serve, chop the walnuts and sprinkle over the top."}], "tips": [], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["lunch"], "id": "chicken waldorf salad", "cats": ["Mains"], "tags": ["Chicken", "15 min or less"]}, {"title": "White Bean Dip", "serves": "4", "time": "10 min", "time_detail": "5 min prep + 5 min cook", "cal": "168", "fat": "6", "protein": "7", "netcarbs": "1", "fibre": "13", "ingredients": [{"t": "400 g can cannellini beans"}, {"t": "1.5 tbsp olive oil"}, {"t": "2 tbsp fresh lemon juice"}, {"t": "½ tsp lemon zest"}, {"t": "1 garlic clove"}, {"t": "1/4 tsp salt"}, {"t": "½ tsp black pepper"}, {"t": "2 tbsp psyllium husks"}, {"t": "4 tbsp water"}, {"t": "2 tbsp fresh basil leaves"}, {"t": "2 tsp fresh rosemary leaves"}], "steps": [{"t": "In a food processor, pulse the cannellini beans, olive oil, lemon juice and zest, garlic, salt, pepper & psyllium until combined. If the bean dip is too thick, slowly add the water with the food processor running. Process until smooth. Blend in the basil & rosemary. Taste and adjust seasoning if needed. Garlic Prawn Hotpot with Tomato & Chilli SERVES TOTAL COOKING TIME 1 20 MINS CALORIES FATS PROTEIN NET CARBS FIBRE 5 mins prep + 15 mins cook 438cal 24g 36g 14g 7g INGREDIENTS METHOD › 1 tbsp olive oil STEP 1 If using whole prawns, peel and devein leaving › 3 cloves garlic tails on. › 195 g tinned chopped tomatoes › ¼ tsp chilli flakes STEP 2 Finely chop garlic, chili & parsley leaves. › 150 g prawns › 1 tbsp fresh parsley"}, {"t": "› ¼ tsp paprika Drizzle the oil into a shallow heatproof dish or a small frying pan over a medium-high heat, › ¼ tsp salt add the garlic and chilli and fry for 30 seconds › ¼ tsp black pepper to flavour the oil, before stirring in tomatoes & › 1 slice Venerdi Paleo (Super paprika & cook for 10 minutes. Seeded) bread › 1 tsp salted butter STEP 4 Add the prawns and most of the parsley & cook › 2 wedges lemon for a further 5 minutes."}, {"t": "Squeeze in the juice of one lemon wedge into the dish. Remove from the heat and sprinkle over the remaining parsley and a pinch of salt."}, {"t": "Serve in a tapas bowl with a wedge of lemon and a slice of toasted & buttered Venerdi bread."}], "tips": [], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["snacks"], "id": "white bean dip", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Chocolate Banana Milkshake", "serves": "1", "time": "3 min", "time_detail": "", "cal": "334", "fat": "19", "protein": "18", "netcarbs": "17", "fibre": "13", "ingredients": [{"t": "2 tbsp chia seeds"}, {"t": "1 cup almond milk, unsweetened"}, {"t": "1/2 serve Morlife Chocolate Fudge protein powder"}, {"t": "1/2 tsp cinnamon"}, {"t": "1 tsp MCT oil"}, {"t": "Pinch salt"}, {"t": "½ banana"}], "steps": [{"t": "Add all ingredients into a blender and blend until smooth and creamy."}], "tips": [{"h": "Bec’s Tips", "t": "Place the leftover banana in the freezer. Your next smoothie / milkshake will be wonderfully thick and creamy!"}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["breakfast"], "id": "chocolate banana milkshake", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Meatballs with Cauliflower Mash & Broccoli", "serves": "2", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "413", "fat": "29", "protein": "32", "netcarbs": "4", "fibre": "1", "ingredients": [{"t": "½ small head cauliflower"}, {"t": "2 tbsp parmesan cheese"}, {"t": "2 tbsp butter"}, {"t": "1 tbsp almond milk, unsweetened"}, {"t": "½ tsp salt"}, {"t": "250 g beef mince"}, {"t": "½ tbsp olive oil"}, {"t": "1 egg white"}, {"t": "½ tsp tamari"}, {"t": "½ tsp onion powder"}, {"t": "1 tsp garlic powder"}, {"t": "½ tsp salt"}, {"t": "¼ tsp pepper"}, {"t": "½ tsp oregano"}, {"t": "¼ tsp chilli flakes"}, {"t": "½ cup beef stock"}, {"t": "40 mls light coconut cream"}], "steps": [{"t": "Chop cauliflower into florets."}, {"t": "Combine beef mince, egg white, tamari, ¼ tsp salt, pepper, chilli flakes, oregano, onion and 1/2 tsp garlic powder. Form mixture into 6 meatballs."}, {"t": "Steam cauliflower for 10-15 minutes until tender."}, {"t": "Heat olive oil on medium heat and cook meatballs for 8-10 minutes. Rotate the meatballs ensuring they are evenly cooked on all sides."}, {"t": "Remove cauliflower from heat and add to blender with 1 tbsp butter, parmesan, almond milk and ¼ tsp salt. Blend until smooth, adding slightly more milk if required."}, {"t": "Once meatballs are cooked, remove from the fry pan and place on a plate."}, {"t": "Add 1 tbsp butter to the same fry pan you cooked the meatballs in and allow to melt. Add beef stock, coconut cream and remaining garlic powder, bring to the boil then let simmer for approximately 10 minutes or until thickened."}, {"t": "Spread cauliflower mash onto a plate, add 3 meatballs to each plate and top with gravy. Serve straight away."}], "tips": [{"h": "Bec’s Tips", "t": "Dairy Free? Swap the parmesan cheese for nutritional yeast flakes and the butter to olive oil."}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "meatballs cauliflower mash broccoli", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "High Protein, Gut Loving Chocolate Mousse", "serves": "1", "time": "2 min", "time_detail": "2 min prep + 0 min cook", "cal": "333", "fat": "19", "protein": "17", "netcarbs": "15", "fibre": "12", "ingredients": [{"t": "1/2 cup blueberries"}, {"t": "1/2 serve Morlife chocolate protein powder"}, {"t": "1/4 cup coconut yogurt"}, {"t": "2 tbsp chia seeds"}], "steps": [{"t": "In a small bowl, defrost 1/2 cup frozen berries (if they're frozen)."}, {"t": "In another small bowl or glass, add the protein powder, yoghurt, chia seeds and a dash of water if you need it and stir to combine until it's a thick mousse."}, {"t": "Place mousse on top of berries (or visa versa)."}], "tips": [{"h": "Bec’s Tips", "t": "Enter code healthwithbec at checkout for 15% off Morlife protein! www.morlife.com Swap blueberries to any other type of berries if desired. Swap coconut yoghurt to greek yoghurt if you're not strict dairy free! You can have a little more if so, as it's lower in calories. Optional: add 1/2 tsp monk fruit to the mix (if you like things extra sweet!). Top with coconut flakes or chopped almonds for crunch!"}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["snacks"], "id": "high protein gut loving chocolate mousse", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Dan Dan ‘Noodles'", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "546", "fat": "37", "protein": "41", "netcarbs": "9", "fibre": "5", "ingredients": [{"h": "Ground Pork"}, {"t": "300 g pork mince"}, {"t": "3 cloves garlic"}, {"t": "1 tsp ginger"}, {"t": "1 tbsp white wine vinegar"}, {"t": "1 tbsp tamari"}, {"t": "1 tsp olive oil"}, {"h": "Dan Dan Sauce"}, {"t": "2 cloves garlic"}, {"t": "2 tbsp peanut butter"}, {"t": "2 tbsp tamari"}, {"t": "1 chilli (optional)"}, {"t": "2 tsp sesame oil"}, {"t": "1 tsp black pepper"}, {"h": "For Serving"}, {"t": "2 medium zucchini"}, {"t": "1 bunch bok choy"}, {"t": "2 spring onions"}, {"t": "2 tbsp roasted peanuts"}], "steps": [{"t": "Spiralise your zucchini to make ‘noodles’ You can also buy these pre-made from the shops for extra convenience."}, {"t": "Mince the garlic & ginger and finely dice the red chilli. Mix together just over half of the garlic, the ginger, vinegar & 1 tbsp tamari. Add the pork mince and mix everything together until thoroughly combined."}, {"t": "In a separate bowl, mix together the rest of the garlic, the peanut butter, the remaining tamari, chilli, sesame oil and pepper to taste. Taste and adjust the seasoning to your liking. If you are sensitive to heat, add in only a little chilli, taste and then adjust."}, {"t": "Preheat a wok or large frypan on medium, high heat. Add the pork and cook, stirring occasionally until brown and crisped, about 4-5 minutes. Remove from heat and set aside."}, {"t": "In a pot of boiling water, blanch the bok choy & zucchini noodles for just a minute until tender crisp and bright green. Quickly drain to stop them cooking further. Thinly slice the spring onions and roughly chop the peanuts."}, {"t": "In two serving bowls, divide the sauce. Add the zucchini noodles & bok choy. Divide the pork between the two bowls and then scatter over the spring onions and chopped peanuts. Just before you tuck in, give everything in your bowl a big mix. Enjoy!"}], "tips": [], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "dan dan noodles", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Tofu & Pumpkin Curry", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "439", "fat": "27", "protein": "21", "netcarbs": "20", "fibre": "8", "ingredients": [{"t": "230 g butternut pumpkin"}, {"t": "250 g firm organic tofu"}, {"t": "½ medium brown onion"}, {"t": "½ cup fresh basil"}, {"t": "110 g green beans"}, {"t": "1.5 tbsp olive oil"}, {"t": "200 mls canned coconut milk"}, {"t": "½ cup vegetable stock"}, {"t": "1 tsp fish sauce"}, {"t": "1.5 tbsp thai green curry paste"}, {"t": "½ medium head cauliflower"}, {"t": "½ tsp granulated monk fruit"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "¼ cup coriander (optional)"}], "steps": [{"t": "Firstly, ensure the pumpkin, tofu, onion and fresh basil is chopped up. Top & tail the beans and chop in half. The pumpkin will need to be in very small cubes, no larger than 1 inch."}, {"t": "Heat 1 tbsp olive oil in a medium-sized non-stick pan over medium heat."}, {"t": "Add tofu and cook for 3-4 minutes on each side until golden, then transfer to a plate."}, {"t": "Add remaining ½ tbsp oil to the pan, add the diced onions and cook for a few minutes. Then, add the coconut milk, stock, fish sauce and curry paste and stir to combine. Add the pumpkin and beans, reduce heat to medium-low and cook, covered for 5 minutes or until just tender."}, {"t": "Meanwhile, prepare your cauliflower rice if you haven't bought it pre-made by blitzing in a food processor or grating with a grater."}, {"t": "Add the monk fruit, salt, pepper and basil and taste! Adjust for flavour then stir through tofu!"}, {"t": "Serve on top of cauliflower rice and sprinkle with coriander (optional)"}], "tips": [{"h": "Ingredient Tips", "t": "You can use red or green thai curry paste. Feel free to up the amount to 2 tbsp for more flavour and spice. Swap monk fruit to stevia if preferred or leave it out out the monk fruit if you don’t want to use it. Feel free to change the beans to another green of your choice! Asparagus, broccoli and bok choy work really well."}, {"h": "Bec’s Tips", "t": "This is a fantastic freezer meal. So many women love to double or triple this recipe and freeze for future meals. For the family, serve theirs with regular rice instead of cauliflower rice."}], "sources": ["Plan 56 – October 2024", "Plan 78 – August 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "tofu pumpkin curry", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "One Minute Mug Bread with Avocado", "serves": "1", "time": "2 min", "time_detail": "1 min prep + 1 min cook", "cal": "254", "fat": "12", "protein": "10", "netcarbs": "4", "fibre": "3", "ingredients": [{"t": "2 tbsp almond flour"}, {"t": "1 egg"}, {"t": "1/4 tsp baking powder"}, {"t": "Pinch salt"}, {"t": "½ tsp butter"}, {"t": "1 tsp water"}, {"t": "1/4 avocado"}], "steps": [{"t": "Combine all the ingredients together in a mug or deep ramekin. Whisk together well to ensure the egg is thoroughly combined."}, {"t": "Place in the microwave for 1 minute (or a little longer, until risen and cooked)."}, {"t": "Remove, cut in half and top with avocado. Also, season with extra salt and pepper and a little chilli (optional)."}], "tips": [{"h": "Ingredient Tips", "t": "Butter can be swapped for coconut oil. If you’re nut free, swap almond flour to lupin flour. Sensitive or intolerant to eggs? Swap egg to a chia egg by using 1 tbsp chia seeds soaked in 2 tbsp water for 5 minutes until it thickens into a gel. Also, cook this in a lightly greased frypan or mini waffle machine as it won’t turn out in the microwave!"}, {"h": "Bec’s Tips", "t": "Don’t have a microwave? Try cooking the7 DAY MEAL PLAN 56 mixture on a pan like a pancake. Or, swap it to 1 piece super seeded, Venerdi bread or a slice of the keto bread loaf with an egg OR, cook in an oven preheated to 180 degrees C for approximately 20 minutes or until risen and cooked. Also amazing in a waffle maker too."}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["breakfast"], "id": "one minute mug bread avocado", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "One Pan Baked Eggs", "serves": "1", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "425", "fat": "22", "protein": "28", "netcarbs": "22", "fibre": "10", "ingredients": [{"t": "2 eggs"}, {"t": "50g baby spinach leaves"}, {"t": "25g sun-dried tomatoes"}, {"t": "1/4 red capsicum"}, {"t": "1/4 zucchini"}, {"t": "20g fetta cheese"}, {"t": "1 tbsp basil"}, {"t": "1 shallot"}, {"t": "1 tsp olive oil"}, {"t": "1 slice Venerdi Bread"}, {"t": "Pinch black pepper"}], "steps": [{"t": "Preheat oven to 160°C fan forced."}, {"t": "Roughly chop the capsicum, sun-dried tomatoes & basil. Thinly slice the shallot and zucchini. Crumble the fetta."}, {"t": "Place spinach in a small, non-stick ovenproof frypan over medium heat with the olive oil and allow to wilt slightly."}, {"t": "Add tomatoes, capsicum, zucchini, fetta, basil and shallots to the frypan and mix gently together."}, {"t": "Create 2 indentations in the mixture and gently crack an egg in each of the indents. Cover with an oven- proof lid (or carefully cover with alfoil) and pop it in the oven to bake for 15 minutes, or until the egg whites are set and the yolk is cooked to your liking."}, {"t": "Remove from the oven and season with black pepper to taste."}, {"t": "Serve with a piece of toasted Venerdi bread."}], "tips": [], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["breakfast"], "id": "one pan baked eggs", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Greek Chicken with Shaved Asparagus Salad", "serves": "2", "time": "40 min", "time_detail": "30 min prep + 10 min cook", "cal": "477", "fat": "29", "protein": "39", "netcarbs": "13", "fibre": "11", "ingredients": [{"h": "For The Chicken"}, {"t": "300 g chicken breast"}, {"t": "2 tbsp olive oil"}, {"t": "2 garlic cloves"}, {"t": "1 tsp dried thyme"}, {"t": "1/2 tsp dried oregano"}, {"t": "salt"}, {"t": "pepper"}, {"t": "zest of 1 lemon"}, {"h": "For The Salad"}, {"t": "2 bunches asparagus"}, {"t": "1 lemon"}, {"t": "1/3 cup parmesan cheese"}, {"t": "2 cups rocket leaves"}, {"t": "1 tbsp olive oil"}, {"t": "2 tbsp pepitas"}, {"t": "salt"}, {"t": "pepper"}], "steps": [{"t": "Place chicken breasts between 2 pieces of baking paper. Then, using a meat mallet, pound to an even ½-inch thickness. Crush the garlic cloves, zest the lemons & shave the parmesan cheese."}, {"t": "Mix together 2 tbsp olive oil, garlic, thyme, oregano, salt, pepper and zest of 1 lemon in a large zip-lock bag. Add chicken breasts and massage marinade into meat until evenly coated. Seal the bag and place in a bowl in the refrigerator (the bowl protects against leakage); let the chicken marinate for 30 minutes or up to 12 hours - the longer the better!"}, {"t": "Preheat the grill to a medium to high heat. Place chicken breasts on the grill (make sure they are well-coated with the marinade; the more garlic, lemon zest and herbs on the chicken, the better!). Grill, covered, for 2-3 minutes per side. Once the chicken is cooked, remove from the pan and cover with alfoil."}, {"t": "Snap the woody ends off the asparagus and, using a peeler, carefully peel the raw asparagus into thin ribbons. Once you have peeled as many ribbons as you safely can, roughly chop the remaining asparagus stalk into large chunks and blanch them quickly in boiling water for 30 seconds (until bright green and tender-crips) Remove from the water and add to a bowl with the raw ribbons, parmesan cheese and the rocket leaves."}, {"t": "Zest in 1/2 a lemon and then squeeze in 2 tbsp of the juice. Add 1 tbsp olive oil, salt, pepper and give everything a really good (but gentle) mix. Taste and adjust the seasoning if needed. Sprinkle over the pepita seeds."}, {"t": "To serve, divide the chicken breasts and salad between two plates. Enjoy."}], "tips": [{"h": "Bec's Tips", "t": "The macros for this recipe assume the meal is cooked. Therefore, the calorie & fat count assumes there is some marinade leftover that isn’t consumed. So, if you were 35 to add the ingredients up yourself (using your own calorie app) the total calories & fat would appear higher."}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "greek chicken shaved asparagus salad", "cats": ["Mains"], "tags": ["Chicken"]}, {"title": "Mocha Self-Saucing Pudding", "serves": "1", "time": "30 min", "time_detail": "5 min prep + 15 min cook & cool", "cal": "255", "fat": "17", "protein": "11", "netcarbs": "5", "fibre": "1", "ingredients": [{"t": "1 tbsp cacao powder, unsweetened"}, {"t": "½ tbsp powdered monk fruit"}, {"t": "½ tbsp almond flour"}, {"t": "¼ tsp baking powder"}, {"t": "Pinch salt"}, {"t": "10 g dark chocolate, 85%"}, {"t": "1 egg"}, {"t": "1 tbsp butter"}, {"t": "½ tsp vanilla extract"}, {"t": "½ sachet Beforeyouspeak Mocha coffee*"}], "steps": [{"t": "Preheat oven to 170ºC fan forced."}, {"t": "Let the egg come to room temperature."}, {"t": "Gently melt chocolate and butter together."}, {"t": "Add cacao, monk fruit, almond meal, baking powder, vanilla, salt & mocha sachet to the mixture, stir to combine."}, {"t": "Lightly whisk the egg then add to the chocolate mixture and give everything one final stir to combine."}, {"t": "Transfer batter to your greased ramekin and bake for 12-15 minutes. The edges should be slightly firm, but the centre will have a slight jiggle to it. Remove from the oven."}, {"t": "Allow to cool for a few minutes then dust with a little extra powdered monk fruit if you like and serve."}], "tips": [{"h": "Bec’s Tips", "t": "Be careful not to overcook as this will remove the \"lava\" centre of the cake. You can add fresh or frozen berries to serve. Monk fruit can be swapped to stevia if desired. Can use coconut oil instead of butter. *Any Beforeyouspeak coffee can be used and the best news is, one sachet will make two mug cakes! Don’t have any Beforeyouspeak coffee? No worries, add in 1 tsp instant coffee to your melted chocolate to allow it to dissolve easily before adding in the dry ingredients. If you try to add it with the dry ingredients, the coffee won’t dissolve and will leave an unpleasant, crunchy texture to your pudding!"}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["breakfast"], "id": "mocha self saucing pudding", "cats": ["Breakfast"], "tags": ["Vegetarian"]}, {"title": "Steak with Paleo Mushroom Sauce & Green Beans", "serves": "1", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "426", "fat": "22", "protein": "46", "netcarbs": "11", "fibre": "3", "ingredients": [{"t": "180 g lean beef steak"}, {"t": "1 tsp olive oil"}, {"t": "90 g button mushrooms"}, {"t": "50 g green beans"}, {"t": "1/2 tsp butter"}, {"t": "1/2 tbsp tapioca flour"}, {"t": "¼ cup beef stock"}, {"t": "50 mls canned coconut cream"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Bring a pot of water to the boil. Heat a grill pan on high & rub steak with 1 tsp olive oil and season with salt & pepper. Slice the mushrooms and top & tail the beans."}, {"t": "Grill steak for 5 minutes on each side (or until cooked to your liking). Remove steak from the pan and cover with foil and allow to rest."}, {"t": "Return the pan to the stove and reduce the heat to medium and add in butter and sliced mushrooms and cook for 2 - 3 minutes, stirring occasionally."}, {"t": "Sprinkle the tapioca flour into the pan over the mushrooms and mix well - make sure the mushrooms are coated."}, {"t": "Add a quarter of the beef stock into the pan and stir, add the remainder of the stock gradually, let it thicken before you add more in. Reduce the heat on the pan to low."}, {"t": "coconut cream to the pan in two lots. Season with salt and pepper and allow to simmer."}, {"t": "Whilst the sauce is simmering, add your beans to the boiling water and cook for a minute or two until tender but still crisp."}, {"t": "Serve steak with the beans and spoon over the mushroom sauce and enjoy!"}], "tips": [{"h": "Ingredient Tips", "t": "If you don't have tapioca flour, regular flour is ok (unless you're gluten free). It is such a small amount, and so this still fits into a low carb lifestyle! If strictly dairy free, swap the butter for olive oil. Green beans can be swapped for any other green vegetable of choice!"}, {"h": "Bec’s Tips", "t": "Enjoying this with the family? Add some boiled, mashed or roasted potatoes for them!"}], "sources": ["Plan 56 – October 2024"], "kind": "plan", "pesc_plan": false, "slots": ["dinner"], "id": "steak paleo mushroom sauce green beans", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Crispy Miso Salmon Bowl", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "447", "fat": "24", "protein": "40", "netcarbs": "15", "fibre": "9", "ingredients": [{"t": "250 g salmon fillets, skinless"}, {"t": "½ cucumber"}, {"t": "½ medium avocado"}, {"t": "2 tbsp rice wine vinegar"}, {"t": "4 tsp tamari"}, {"t": "2 tbsp white miso paste"}, {"t": "1 tbsp granulated monk fruit"}, {"t": "2 tsp sesame oil"}, {"t": "Pinch salt"}, {"t": "1 tsp garlic powder"}, {"t": "2 tsp arrowroot flour"}, {"t": "200 g cauliflower rice"}, {"t": "1 cup edamame beans"}], "steps": [{"t": "Cut the salmon into 3 cm cubes. Slice the cucumber and dice the avocado."}, {"t": "In a small bowl, whisk together the rice wine vinegar, tamari, miso paste, monk fruit, sesame oil, garlic powder, and salt. Reserve 3 tbsp of the mixture for the dressing."}, {"t": "Add the salmon cubes to the remaining marinade and toss gently to coat."}, {"t": "Place the arrowroot flour in a separate bowl. Add the salmon cubes and toss lightly to coat. Pan fry over medium-high for 10 minutes, flipping halfway until golden."}, {"t": "Cook the cauliflower rice in a microwave and defrost the edamame beans in a microwave."}, {"t": "To assemble, divide the cauliflower rice between bowls. Top with edamame beans, cucumber, and avocado. Add the salmon and drizzle with the reserved dressing."}], "tips": [{"h": "Ingredient Tips", "t": "I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater. Then, heat in the microwave."}, {"h": "Bec’s Tips", "t": "You can also cook the salmon in an air fryer at 190°C for 8–10 minutes, flipping halfway. Since you’ll be enjoying this for lunch both days, you can prep it ahead of time. Store the cooked salmon and cauliflower rice in a separate microwave-safe container, then reheat before adding them to the remaining bowl ingredients. Drizzle over the leftover dressing just before serving."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "crispy miso salmon bowl", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Lemon & Blueberry Protein Muffins", "serves": "6", "time": "50 min", "time_detail": "10 min prep + 40 min cook", "cal": "218", "fat": "11", "protein": "17", "netcarbs": "10", "fibre": "6", "ingredients": [{"t": "90 g vanilla protein powder"}, {"t": "¼ cup granulated monk fruit"}, {"t": "1∕ cup coconut flour"}, {"t": "1∕ cup almond meal"}, {"t": "3"}, {"t": "2 tsp baking powder"}, {"t": "Pinch salt"}, {"t": "½ cup egg whites"}, {"t": "¼ cup almond milk, unsweetened"}, {"t": "2 tbsp unsweetened apple sauce"}, {"t": "1½ tsp vanilla extract"}, {"t": "2 tbsp lemon juice"}, {"t": "½ tbsp lemon zest"}, {"t": "¼ cup almond butter"}, {"t": "1 cup blueberries (fresh or frozen)"}], "steps": [{"t": "Preheat oven to 180°C fan-forced / 360°F. Line a 6-hole muffin tin with muffin liners."}, {"t": "In a large mixing bowl, combine the protein powder, monk fruit, coconut flour, almond meal, baking powder, and salt."}, {"t": "In a separate bowl, whisk together the egg whites, almond milk, apple sauce, vanilla extract, lemon juice, and zest."}, {"t": "Add the almond butter to the dry ingredients, pour over the wet mixture, and stir until combined. Gently fold through the blueberries."}, {"t": "Divide the mixture evenly between the muffin tins."}, {"t": "Bake for 35–40 min or until slightly golden on top and a skewer inserted in the centre comes out clean."}, {"t": "Cool in the tray for 10 minutes, then transfer to a wire rack."}], "tips": [{"h": "Ingredient Tips", "t": "The Morlife Plantiful protein powders are my favourite. You can get 15% off at checkout by entering the code: HEALTHWITHBEC. Click here to buy Monk fruit can be swapped to stevia if desired. Apple puree can be used instead of sauce."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "lemon blueberry protein muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Cajun Fish Fillets with BBQ'd Herbed Vegetables", "serves": "1", "time": "30 min", "time_detail": "10 min prep + 20 min cook", "cal": "441", "fat": "24", "protein": "36", "netcarbs": "17", "fibre": "9", "ingredients": [{"h": "For The Fish"}, {"t": "150 g snapper fish fillet"}, {"t": "½ tbsp paprika"}, {"t": "½ tsp garlic powder"}, {"t": "½ tsp dried thyme"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 tsp olive oil"}, {"t": "½ lemon"}, {"t": "½ tbsp parsley (optional)"}, {"h": "For The Vegetables"}, {"t": "½ large red onion"}, {"t": "¼ medium eggplant"}, {"t": "½ small zucchini"}, {"t": "50 g button mushrooms"}, {"t": "1 tbsp olive oil"}, {"t": "¼ tsp garlic powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Pat fish dry with paper towels. In a small bowl, combine paprika, garlic powder, thyme, salt, pepper, and oil to make a paste."}, {"t": "Rub the paste evenly over the fish until evenly coated. Cover and refrigerate for 2 hours. Preheat BBQ grill to high."}, {"t": "Cut the vegetables into large chunks. Place in a large bowl or tray."}, {"t": "Drizzle or spray vegetables with oil and sprinkle with garlic powder, salt, pepper, and any other dried herbs you’d like to add. Toss with clean hands (there is no better way!)."}, {"t": "Place vegetables on the BBQ and cook until tender-crisp with charred edges."}, {"t": "When veggies are almost done, add the fish to the BBQ and cook for 3–5 minutes per side or until cooked through."}, {"t": "Cut lemon into wedges and roughly chop the parsley. Serve fish with vegetables, lemon and a sprinkle of parsley (if using)."}], "tips": [{"h": "Ingredient Tips", "t": "My favourite fish is pink snapper, red emperor, or dhufish but you can use any firm white fish you like."}, {"h": "Bec’s Tips", "t": "This is the easiest recipe to throw together on the BBQ on a hot summer night! You can also roast the veggies in the oven at 200°C fan- forced / 390°F for 30 min. Add the fish to the oven when there is 15 min left to go."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "cajun fish fillets bbq d herbed vegetables", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Tiramisu Chia Pudding", "serves": "2", "time": "10 min", "time_detail": "10 min prep + 0 min cook", "cal": "350", "fat": "17", "protein": "29", "netcarbs": "4", "fibre": "12", "ingredients": [{"t": "1 tsp instant coffee granules"}, {"t": "2 tbsp hot water"}, {"t": "3 tbsp chia seeds"}, {"t": "200 ml almond milk, unsweetened"}, {"t": "3 tsp cocoa powder"}, {"t": "1 tsp granulated monk fruit"}, {"t": "½ tsp vanilla extract"}, {"h": "To Serve"}, {"t": "1∕ cup coconut yoghurt"}, {"t": "72 g vanilla protein powder"}, {"t": "5 tbsp water"}, {"t": "1 tsp cocoa powder"}], "steps": [{"t": "Dissolve the instant coffee in hot water."}, {"t": "In a 1 litre dish, combine chia seeds, unsweetened almond milk, cocoa powder, monkfruit, vanilla extract, and the coffee mixture. Stir well."}, {"t": "Refrigerate overnight, stirring after 30 minutes to evenly distribute the chia seeds. TO SERVE"}, {"t": "Mix together the coconut yoghurt, vanilla protein powder, and water until smooth."}, {"t": "Spoon the yoghurt mixture over the chia pudding, smooth the top, and dust with cocoa powder."}, {"t": "Divide between bowls and serve."}], "tips": [{"h": "Ingredient Tips", "t": "If you don't like coffee or, prefer caffeine free, omit coffee granules or choose decaf instead. The Morlife Plantiful protein powders are my favourite. You can get 15% off at checkout by entering the code: here to buy. If you’re nut free, swap almond milk to unsweetened soy, hemp, or coconut milk. Monk fruit can be swapped to stevia if desired."}, {"h": "Bec’s Tips", "t": "The macros have been calculated using the Morlife Plantiful Vanilla Fudge protein powder. You can also make this recipe in individual jars for an easy grab-and-go breakfast or snack."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "tiramisu chia pudding", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Pasta Alla Norma", "serves": "2", "time": "45 min", "time_detail": "15 min prep + 30 min cook", "cal": "427", "fat": "21", "protein": "24", "netcarbs": "18", "fibre": "17", "ingredients": [{"t": "400 g eggplant"}, {"t": "1 clove garlic"}, {"t": "¼ medium brown onion"}, {"t": "2 tbsp olive oil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "2 tbsp dry white wine"}, {"t": "350 g tomato passata, sugar free"}, {"t": "2 tbsp water"}, {"t": "½ tsp dried Italian herbs"}, {"t": "¼ tsp red chilli flakes (optional)"}, {"t": "200 g Slendier Legume pasta"}, {"t": "¼ cup fresh basil"}, {"t": "20 g Parmesan cheese, grated"}], "steps": [{"t": "Preheat the oven to 220°C fan-forced / 430°F. Line a tray with baking paper."}, {"t": "Chop the eggplant into 2.5 cm pieces. Mince the garlic and finely chop the onion."}, {"t": "Drizzle or spray 1 tbsp of olive over the eggplant, season with salt and pepper, and toss to coat. Spread on the tray and roast for 20 minutes."}, {"t": "Flip the eggplant and roast for a further 5 minutes, then leave to cool slightly on the tray."}, {"t": "While the eggplant is cooking, heat the remaining olive oil in a large frying pan over medium heat. Add the garlic and cook for 20 seconds until golden. Add the onion and cook for 2–3 minutes until translucent."}, {"t": "Increase heat to medium-high and add the white wine. Simmer, scraping the pan base to deglaze, until mostly evaporated."}, {"t": "water, dried Italian herbs, chilli flakes (if using), salt and pepper. Stir and simmer for 5 minutes."}, {"t": "Meanwhile, cook the Slendier pasta according to packet instructions."}, {"t": "Add the roasted eggplant and drained pasta to the pan with the sauce. Toss gently to combine."}, {"t": "Divide between bowls and top with fresh basil and Parmesan cheese to serve."}], "tips": [{"h": "Ingredient Tips", "t": "Any type of Slendier pasta is fine (spaghetti or fettuccine). Any variety is also fine, it comes in black soybean, soybean, or edamame. If you can’t find Slendier pasta, Qetoe Low Carb Fettuccine or Spaghetti is a great alternative! Enter code: QTHEALTHBEC10 at checkout for 10% off To make this dairy free, swap the Parmesan for nutritional yeast or vegan Parmesan."}, {"h": "Bec's Tips", "t": "This is a great recipe to meal prep – it keeps well in the fridge for 3 days. Spraying oil over veggies helps to distribute a small 23 amount of oil evenly. I recommend using a refillable oil sprayer bottle rather"}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "pasta alla norma", "cats": ["Mains"], "tags": ["Vegetarian"]}, {"title": "Spicy Prawn & Paprika Stew", "serves": "2", "time": "35 min", "time_detail": "10 min prep + 25 min cook", "cal": "355", "fat": "7", "protein": "46", "netcarbs": "20", "fibre": "12", "ingredients": [{"t": "300 g prawns, raw and peeled"}, {"t": "½ lemon"}, {"t": "½ fennel bulb"}, {"t": "½ red capsicum"}, {"t": "¼ red chilli"}, {"t": "½ small red onion"}, {"t": "2 cloves garlic"}, {"t": "¼ cup fresh parsley"}, {"t": "1 tsp olive oil"}, {"t": "½ tbsp smoked paprika"}, {"t": "1 tsp ground coriander"}, {"t": "¼ tsp ground cumin"}, {"t": "Pinch salt"}, {"t": "½ tbsp tomato paste"}, {"t": "¾ cup vegetable stock"}, {"t": "200 g canned diced tomatoes"}, {"t": "400 g cauliflower rice"}, {"t": "50 g baby spinach leaves"}, {"t": "Pinch pepper"}], "steps": [{"t": "Remove the tails from the prawns. Zest and juice the lemon, then set aside."}, {"t": "Thinly slice the fennel (reserving some fennel fronds for garnish), capsicum, chilli, and red onion. Finely chop the garlic and parsley."}, {"t": "Heat the olive oil in a large saucepan over medium heat. Add onion and garlic, and cook for 3–4 minutes, stirring often, until beginning to brown."}, {"t": "Add the fennel and capsicum, followed by the smoked paprika, coriander, cumin, and salt. Stir to combine, then cook for another 5 minutes, stirring often, until the
