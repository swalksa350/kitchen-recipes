ose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "orange almond cake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Keto Chocolate Peanut Butter Cups", "serves": "8", "time": "30 min", "time_detail": "Set time: 20–30 minutes", "cal": "159", "fat": "12", "protein": "7", "netcarbs": "2", "fibre": "3", "ingredients": [{"t": "90 g natural peanut butter"}, {"t": "1 tbsp coconut oil"}, {"t": "5 tbsp coconut flour"}, {"t": "4 tbsp vegan vanilla protein powder"}, {"t": "3 tbsp stevia"}, {"t": "1⁄8 tsp salt (optional)"}, {"h": "Frosting"}, {"t": "60 g dark 85% chocolate"}, {"t": "½ tsp coconut oil"}], "steps": [{"t": "Melt peanut butter and 1 tbsp coconut oil together until smooth."}, {"t": "Add coconut flour, protein powder, stevia, and salt. Work into a thick dough. If the mixture is to dry, add 1 tsp water at a time until it comes together."}, {"t": "Divide the dough into 8 even portions, roll into balls and use the palm of your hand to press into flat discs to create biscuit shapes. Place on baking paper and freeze for 20 to 30 minutes."}, {"t": "Once the biscuits are ready, melt chocolate with ½ tsp coconut oil and combine well."}, {"t": "Place each biscuit face down into the chocolate and use two forks to flip the biscuit over and lift out, drip and place on baking paper inside a container. Repeat until all biscuits have been dipped in chocolate. Set in the fridge for 10 minutes."}, {"t": "Keep stored in the fridge."}], "tips": [{"h": "Bec’s Tips", "t": "Morlife plantiful protein is my favourite protein powder! If your peanut butter already contains salt, then omit salt from the recipe. Feel free to also use any nut butter you have on hand, almond also works well with this recipe. You can replace the vanilla protein powder with almond meal however I suggest adding in a dash of vanilla extract and a little extra stevia to make up for the vanilla and sweetness in the protein powder. Only one side of each biscuit should be coated in chocolate, there won't be enough chocolate to cover both sides of all biscuits."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "keto chocolate peanut butter cups", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Banana Bread", "serves": "10", "time": "55 min", "time_detail": "35–45 min cook, 10 min cool", "cal": "137", "fat": "11", "protein": "4", "netcarbs": "3", "fibre": "2", "ingredients": [{"t": "2 small overripe bananas (approx. 180g)"}, {"t": "3 room temperature eggs"}, {"t": "1 tsp vanilla"}, {"t": "100 g butter or coconut oil"}, {"t": "½ cup almond meal"}, {"t": "¼ cup + 1 tbsp coconut flour"}, {"t": "1/4 cup powdered stevia or monk fruit sweetener"}, {"t": "½ tsp baking powder"}, {"t": "½ tsp cinnamon"}, {"t": "¼ tsp salt"}], "steps": [{"t": "Preheat oven to 170 C fan forced and line a loaf tin with baking paper."}, {"t": "Melt the butter or coconut oil and set aside to cool."}, {"t": "In a mixing bowl, combine almond meal, coconut flour, monk fruit, baking powder, cinnamon, and salt."}, {"t": "In a separate bowl, use a fork to mash the bananas then add eggs, vanilla. Whisk to combine."}, {"t": "Pour the dry ingredients into the wet, then add melted coconut oil or butter and combine well."}, {"t": "Transfer the mixture to your lined loaf tin and use the back of a spoon to smooth the top."}, {"t": "Bake for 25–30 minutes or until cooked through."}, {"t": "Allow to cool for 10 minutes before transferring to a wire cooling rack."}, {"t": "Once completely cool, slice the loaf into 10 pieces and serve straight away or store in an airtight container for up to 5 days."}], "tips": [{"h": "Bec’s Tips", "t": "I like to use the 'golden' monk fruit as it is like brown sugar and really compliments the banana flavour. (cid:46)(cid:66)(cid:76)(cid:70)(cid:1)(cid:18)(cid:17)(cid:1)(cid:78)(cid:86)(cid:71)(cid:71)(cid:74)(cid:79)(cid:84)(cid:1)
