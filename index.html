I found low sugar dark chocolate chips online from Honest to Goodness but if you can pick up a block of Lindt Chocolate on sale at the supermarket, it is cheaper than the choc chips."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "keto cookie dough balls", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Mocha Almond Bites", "serves": "6", "time": "25 min", "time_detail": "Set Time: 15 min", "cal": "153", "fat": "14", "protein": "5", "netcarbs": "1", "fibre": "2", "ingredients": [{"t": "3 tbsp almond butter"}, {"t": "1 tbsp butter or coconut oil"}, {"t": "¼ cup stevia"}, {"t": "½ cup almond meal"}, {"t": "1 tbsp chocolate or vanilla protein powder"}, {"t": "1–2 tsp Before You Speak coffee"}, {"t": "¼ tsp ground cinnamon"}, {"t": "2 squares Lindt 85% or 90% chocolate"}], "steps": [{"t": "Combine almond meal, protein powder, stevia, coffee and cinnamon in a mixing bowl."}, {"t": "Add almond butter and softened butter to the bowl."}, {"t": "Use a spoon to combine the mix really well. If your almond butter is dry you may need to add a little more butter or coconut oil. The mix should stick together when squeezed between your hands."}, {"t": "Transfer the mixture to a small loaf tin lined with baking paper and press down. Alternatively, you can roll the mix into 6 evenly sized balls."}, {"t": "Melt dark chocolate and use a spoon to drizzle over the slice or top individual balls."}, {"t": "Place slice/balls in the freezer for 15 minutes to set and store in the fridge."}], "tips": [{"h": "Bec’s Tips", "t": "Feel free to add a full sachet of BYS coffee to the mix if you really love the coffee flavour. BYS coffee is completely optional but really enhances the chocolate flavour. You can use regular or decaf. Morlife plantiful protein is my favourite protein powder! Alternatively, you can use regular granulated coffee, however you will need to blend/grind it down to a fine powder."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "mocha almond bites", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Chocolate Protein Muffin", "serves": "1", "time": "15 min", "time_detail": "Cook Time: 2 min", "cal": "352", "fat": "20", "protein": "29", "netcarbs": "4", "fibre": "7", "ingredients": [{"t": "30 g chocolate protein powder"}, {"t": "1 tbsp cacao powder"}, {"t": "1 tbsp almond meal"}, {"t": "1 tbsp granulated stevia"}, {"t": "¼ tsp baking powder"}, {"t": "1 pinch salt"}, {"t": "1 egg"}, {"t": "¼ cup almond milk"}, {"h": "Topping Ingredients"}, {"t": "¼ cup berries of your choice"}, {"t": "2 tbsp Greek or coconut yoghurt"}], "steps": [{"t": "In a small mixing bowl, whisk the egg with the almond milk."}, {"t": "Add the protein powder, almond meal, stevia, baking powder and salt. Whisk until a smooth cake batter forms (if the mixture is too thick, add slightly more almond milk)."}, {"t": "Pour mixture into a large coffee mug and microwave for 90–100 seconds."}, {"t": "Remove from the microwave and allow to cook further for a couple more minutes before turning out onto a plate."}, {"t": "Spoon coconut yoghurt and berries on top of the muffin. Optional to sprinkle cinnamon on top."}, {"t": "Serve straight away or store in the fridge overnight for breakfast the following day."}], "tips": [{"h": "Bec’s Tips", "t": "Be sure to use a large coffee mug, as the batter may overflow while cooking if your mug is too small. You can split the muffin batter between two mugs to create two snack/dessert size servings. Vanilla protein powder may also be used in this recipe, it just won’t be as chocolaty. Morlife plantiful protein is my favourite protein powder!"}, {"h": "Snack size option", "t": "For a snack or desert size you can split the batter into two smaller mugs. Macros for snack size — Calories: 176 kcal Protein: 15 g Fat: 10 g Net Carbs: 2 g Fibre: 3 g"}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "chocolate protein muffin", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "15 min or less", "Eat Cake eBook"]}, {"title": "Choc Chip Cookies", "serves": "6", "time": "40 min", "time_detail": "Cook Time: 10–12 minutes", "cal": "172", "fat": "16", "protein": "3", "netcarbs": "1", "fibre": "2", "ingredients": [{"t": "4 tbsp coconut flour"}, {"t": "¼ cup stevia"}, {"t": "¼ tsp salt"}, {"t": "¼ tsp baking soda"}, {"t": "1 egg"}, {"t": "½ tsp vanilla extract"}, {"t": "75 g butter or coconut oil"}, {"t": "60 g Lindt dark 85% - 90% chocolate, chopped"}], "steps": [{"t": "Allow butter or coconut oil to soften naturally or microwave for 10-15 seconds until it is soft to touch but not fully melted."}, {"t": "Combine coconut flour, stevia, salt, and baking soda, ensuring there are no lumps."}, {"t": "Add butter, egg and vanilla extract. Combine well to form a dough. Add in chocolate pieces and set a few aside to top the cookies later."}, {"t": "Refrigerate the dough for 10 minutes while you preheat the oven to 170C and prepare a baking tray with baking paper."}, {"t": "Roll out the dough into 6 even size portions and flatten into round cookie shapes on the baking tray. Top with the remaining chocolate pieces."}, {"t": "Bake for 10–12 minutes, remove from the oven and allow to cool completely before serving or storing in an airtight container."}], "tips": [{"h": "Bec’s Tips", "t": "The cookies will be very soft when you remove them from the oven. They will continue cooking on the tray and will firm up once cool. Double the recipe to make 12 cookies."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "choc chip cookies", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Baked Raspberry and Vanilla Cheesecake", "serves": "10", "time": "55 min", "time_detail": "", "cal": "227", "fat": "19", "protein": "10", "netcarbs": "1", "fibre": "2", "ingredients": [{"h": "Base"}, {"t": "1 + ¼ cup almond meal"}, {"t": "¼ cup vegan vanilla protein powder"}, {"t": "¼ cup powdered stevia"}, {"t": "6 tbsp butter or coconut oil (85 g)"}, {"t": "¼ tsp salt"}, {"h": "Filling"}, {"t": "250 g cream cheese, softened"}, {"t": "200 g high protein Greek yoghurt"}, {"t": "2 eggs"}, {"t": "2 tsp vanilla extract"}, {"t": "½ cup powdered stevia"}, {"t": "1 tbsp lemon juice (optional)"}], "steps": [{"t": "Preheat oven to 170C and line a springform baking pan with paper."}, {"t": "Prepare the base by adding all ingredients to a mixing bowl with melted butter or coconut oil and combine well. Press into the lined baking pan and bake for 7-8 minutes until the edges are golden brown. Remove from the oven and allow to cool."}, {"t": "Prepare the cheesecake filling. Add cream cheese, yoghurt, vanilla extract, lemon juice and powdered stevia to a mixing bowl. Beat or whisk until smooth. Add eggs and mix again until just combined. Pour the mixture over the cooled cheesecake base and bake in the oven for 40 minutes. Remove from the oven once the top has just set and is no longer liquid."}, {"t": "Allow the cheesecake to cool completely at room temperature then set in the fridge for at least two hours."}, {"t": "Slice into 10 pieces and serve topped with fresh berries and a dusting of powdered stevia or monk fruit."}], "tips": [{"h": "Bec’s Tips", "t": "I used a 24cm springform pan and Yopro yoghurt. If you don't have a springform pan, you can try baking the cheesecake in a casserole dish or rectangle baking tray. The base can be baked the night before and left out on the bench to cool."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "baked raspberry vanilla cheesecake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Chocolate Peanut Butter Fudge", "serves": "12", "time": "120 min", "time_detail": "", "cal": "197", "fat": "17", "protein": "7", "netcarbs": "4", "fibre": "2", "ingredients": [{"t": "1 cup peanut butter"}, {"t": "1⁄³ cup coconut oil"}, {"t": "1 tsp vanilla extract"}, {"t": "1⁄³ cup powdered stevia or monk fruit"}, {"t": "¼ cup cacao or cocoa powder"}, {"t": "4 tbsp vegan protein powder"}, {"t": "¼ tsp salt"}], "steps": [{"t": "Line a loaf tin with baking paper and ensure there is room in your freezer for the tin."}, {"t": "Add peanut butter and coconut oil to a mixing bowl, microwave for 30 seconds to melt the oil. Combine well."}, {"t": "Add vanilla extract, cacao, protein powder, stevia and salt (if using). Combine well with a spatula or spoon."}, {"t": "Pour mixture into the lined loaf tin and transfer to the freezer to set for two to three hours."}, {"t": "Slice into twelve pieces and serve or return to the freezer for later. Option to sprinkle with a little extra salt."}], "tips": [{"h": "Bec’s Tips", "t": "Best stored in the freezer, you may wish to leave at room temperature for 5 minutes before eating. If your peanut butter already contains salt, omit salt from the recipe. Feel free to use any flavour of protein powder, they should all taste good (vanilla, chocolate, caramel) Optional add ins: 1 scoop of collagen, 1/4 tsp cinnamon, 1 sachet of BYS coffee Coconut oil in recipes always calls for solid coconut oil unless otherwise stated. You cannot use liquid coconut or MCT oil for this recipe."}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "chocolate peanut butter fudge", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Ooey Gooey Pumpkin Pie Slice", "serves": "9", "time": "60 min", "time_detail": "", "cal": "166", "fat": "13", "protein": "8", "netcarbs": "2", "fibre": "2", "ingredients": [{"h": "Base Ingredients"}, {"t": "½ cup + 1 tbsp almond meal"}, {"t": "¼ cup + 1 tbsp vanilla protein powder"}, {"t": "2 tbsp desiccated coconut"}, {"t": "2 tbsp stevia"}, {"t": "¼ tsp salt"}, {"t": "3 tbsp solid coconut oil, melted"}, {"h": "Filling Ingredients"}, {"t": "400 g pumpkin purée (canned or boiled/steamed and puréed)"}, {"t": "¼ cup vanilla protein powder"}, {"t": "2 eggs"}, {"t": "½ cup canned coconut milk"}, {"t": "¾ cup golden monk fruit or granulated stevia"}, {"t": "1 tsp vanilla extract"}, {"t": "1.5 tsp cinnamon"}, {"t": "½ tsp nutmeg"}, {"t": "½ tsp ginger"}, {"t": "¼ tsp cloves"}, {"t": "¼ tsp salt"}], "steps": [{"t": "Preheat oven to 180 degrees celsius."}, {"t": "Combine all base ingredients in mixing bowl. Use the back of a large spoon to press down on the mix and spread the coconut oil through the ingredients until it starts to stick together. If the mix is too dry add one tbsp almond milk. You can also combine the base ingredients in a food processor, if you wish."}, {"t": "Transfer the mixture to a lined baking tray (I used a brownie sized pan) and press down on the mix to form the base."}, {"t": "Bake for approximately 7 minutes until only slightly golden at the edges."}, {"t": "While the crust is baking, prepare the filling. In a large bowl combine the pumpkin purée with coconut milk, eggs, stevia, protein powder, vanilla, spices and salt. Whisk or beat until smooth."}, {"t": "Remove base from the oven and allow to cool for 10 minutes before adding the filling."}, {"t": "Return to the oven for 40 minutes or until set and no longer jiggling."}, {"t": "Allow to cool to room temperature, then chill in the fridge before serving."}, {"t": "Slice into 9 pieces and store in the fridge for up to 5 days."}, {"t": "Optional: sift powdered stevia on top prior to serving."}], "tips": [{"h": "Bec’s Tips", "t": "You can make the base the night before and leave overnight!"}], "sources": ["Eat Cake, Lose Weight eBook (2022)"], "kind": "ebook", "pesc_plan": false, "slots": [], "id": "ooey gooey pumpkin pie slice", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Eat Cake eBook"]}, {"title": "Lentil Dip", "serves": "6", "time": "17 min", "time_detail": "2 min prep + 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 cup red lentils"}, {"t": "1 1/2 cups water"}, {"t": "1/3cup olive oil"}, {"t": "¼ cup lemon juice"}, {"t": "1 clove of crushed garlic"}, {"t": "1tsp ground cumin"}, {"t": "Sprinkle of sea salt"}], "steps": [{"t": "Boil water, add lentils and cook for 2 minutes. Cover and set aside for 12 minutes."}, {"t": "Place lentils in a food processor, add olive oil and lemon juice, crushed garlic and ground cumin. Sprinkle with sea salt to taste. Blend until smooth."}], "tips": [{"h": "About this recipe", "t": "This versatile dish can be served with Turkish bread, naan or carrot sticks."}, {"h": "Tips", "t": "This nutritious recipe will keep in the refrigerator for a couple of days."}], "sources": ["Family cookbook – Starters, Soups & Salads – Maia Waterstrom-Walker"], "kind": "family", "pesc_plan": false, "slots": [], "id": "lentil dip", "cats": ["Soups & starters"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Herby Hummus", "serves": "4", "time": "15 min", "time_detail": "15 min prep", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 can of chickpeas (drained)"}, {"t": "2 cloves of garlic (crushed)"}, {"t": "1 tsp cumin"}, {"t": "Juice of one lemon"}, {"t": "70ml olive oil"}, {"t": "2 tsp honey"}, {"t": "Chopped coriander leaves (approximately half a bunch)"}], "steps": [{"t": "Whiz all ingredients except last three, then add oil, coriander and honey."}], "tips": [{"h": "About this recipe", "t": "An herby alternative to traditional hummus - a delicious accompaniment to crusty bread!"}], "sources": ["Family cookbook – Starters, Soups & Salads – The Musgrave Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "herby hummus", "cats": ["Soups & starters"], "tags": ["Vegetarian", "15 min or less", "Family & friends"]}, {"title": "Mushroom Pate (vegetarian)", "serves": "6", "time": "50 min", "time_detail": "20 min prep + 30 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "3 cups sliced exotic mushrooms or Portobello mushrooms, chopped"}, {"t": "1 heaped tablespoon finely chopped garlic"}, {"t": "2 tablespoons balsamic vinegar"}, {"t": "1 cup walnuts"}, {"t": "1 cup green/brown lentils"}, {"t": "¼ cup cold pressed virgin olive oil"}, {"t": "½ teaspoon of rock salt"}, {"t": "1 teaspoon of fresh thyme plus 4 sprigs of fresh thyme"}, {"t": "1 teaspoon fresh sage"}, {"t": "1 teaspoon fresh oregano"}, {"t": "Can add 1-2 tablespoons of Brandy or Port to give it an authentic Pate flavour"}], "steps": [{"t": "Preheat the oven to 180C."}, {"t": "Rinse the lentils under cold running water then place in a saucepan with 2 cups of water, 4 sprigs of fresh thyme and ½ teaspoon of rock salt, cover and bring to a boil for 5 minutes, then simmer for 20 minutes more, until tender. Rinse and drain."}, {"t": "Mix together the mushrooms, garlic and vinegar in a bowl."}, {"t": "Spread on a lightly oiled baking sheet and roast for 15 minutes, set aside."}, {"t": "Toast the walnuts in a dry skillet over medium heat for 5 minutes, or roast in the oven until light brown, set aside."}, {"t": "Place mushroom mixture, walnuts, lentils, oil and herbs in a blender or food processor and puree till smooth - add salt to taste."}, {"t": "Scrape into pate bowls, chill and then serve. YUM!"}], "tips": [{"h": "About this recipe", "t": "Adults love this for a dips platter and kids enjoy it spread on a pizza base or in sandwiches."}], "sources": ["Family cookbook – Starters, Soups & Salads – Maia Waterstrom-Walker"], "kind": "family", "pesc_plan": false, "slots": [], "id": "mushroom pate vegetarian", "cats": ["Soups & starters"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Pitta Bread", "serves": "5", "time": "30 min", "time_detail": "10 min prep + 20 min cook + rising 1 hour", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "200g whole-meal flour"}, {"t": "450g strong white bread flour (plus extra for rolling)"}, {"t": "15g instant dry yeast"}, {"t": "2 tsp salt"}, {"t": "1 tsp sugar"}, {"t": "300ml+ tepid water (quantity depends on how much flour you use)"}], "steps": [{"t": "Place all your dry ingredients in food processor (use your bread/kneading blade or your regular cutting blade). Blitz for a few seconds."}, {"t": "With the motor running, slowly add the water through the feed tube."}, {"t": "Once the mixture balls up around the blade - stop! The mixture should be moist and sticky but not wet. If dough is too sticky, add more white flour."}, {"t": "Leave dough in the food processor, with the lid on, until it doubles in size (time ranges from half to one hour depending on the weather)."}, {"t": "Preheat oven to its hottest setting (i.e. about 230oC) and remove shelf."}, {"t": "Once dough has doubled in size, empty it onto a well floured surface, and knead for a few seconds to knock the air out."}, {"t": "Divide dough into approximately 10 balls. Roll balls flat to form a circle or oval that is about ½ cm thick. Use lots of flour to prevent sticking and turn the bread 90 degrees every couple of rolls."}, {"t": "Dust any excess flour off and place your bread directly onto your oven shelf (I usually fit 3 on at a time)."}, {"t": "Slide your shelf into the top part of the oven, but be sure to leave a gap of at least 5 inches from the top of the oven (your oven MUST be very hot)."}, {"t": "Your pittas will cook in just a few minutes so watch them carefully."}, {"t": "As soon as they have puffed up they are ready. Remove them from the oven and repeat process until all dough has been used."}, {"t": "Once they have cooled for a few minutes cut in half with scissors and fill with your favourite filling, or eat as they are – delicious!"}], "tips": [{"h": "About this recipe", "t": "Keep away from the children otherwise they’ll be gone before lunch time!"}, {"h": "Tips", "t": "Try rolling your pitas to different thicknesses. If your pitta puffs up but is golden brown or hard they are overcooked. They freeze well! While a food processor is nice, you can mix and knead the dough by hand."}], "sources": ["Family cookbook – Starters, Soups & Salads – The Naylor Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "pitta bread", "cats": ["Soups & starters"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Vietnamese Style Pomelo Salad", "serves": "2", "time": "20 min", "time_detail": "15 – 20 min prep", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "Part 1"}, {"t": "1 whole pomelo (segmented)"}, {"t": "1 carrot (cut into matchsticks)"}, {"t": "1 cucumber (cut into matchsticks)"}, {"t": "150g diced crisp, crunchy apple (pink lady or granny smith)"}, {"t": "40g cashews (chopped)"}, {"h": "Part 2"}, {"t": "40g fresh or dried mint (to taste)"}, {"t": "60ml Shoyu glaze (see below for recipe)"}, {"t": "2 Tbs chopped cilantro"}, {"t": "2 tsp muscovado sugar"}, {"t": "2 Tbs rice vinegar"}, {"t": "2-4 red chilies (seeded and minced, to taste)"}, {"t": "150g of diced, crisp, crunchy apple (pink lady or granny smith)"}, {"h": "Shoyu Glaze"}, {"t": "120ml shoyu (or Tamari or soy sauce)"}, {"t": "50g dulse flakes (omit if you do not have them)"}, {"t": "60ml water"}, {"t": "1-3 tablespoons of fresh deseeded dates (chopped, increase sweetness with more dates)"}], "steps": [{"t": "Place all ingredients (IN PART 2?) in a food processor and blend"}, {"t": "Segment pomelo; arrange on the serving plate."}, {"t": "Combine all other Part 1 ingredients in another bowl and muddle up."}, {"t": "Place all Part 2 ingredients in yet another bowl and mix well."}, {"t": "Place the Part 2 with the Part 1, mix to coat the vegetables, then arrange in the centre of the plate. It’s that easy!"}], "tips": [], "sources": ["Family cookbook – Starters, Soups & Salads – Kylie Waterstrom (Courtesy of Geraldine Janola)"], "kind": "family", "pesc_plan": false, "slots": [], "id": "vietnamese style pomelo salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Beetroot and Feta Salad", "serves": "", "time": "1 hr 15 min", "time_detail": "15 min prep + 1 hr cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "400-500g fresh beetroot"}, {"t": "8-10 cloves of garlic, skin on and slightly squashed (should still be intact)"}, {"t": "120ml balsamic vinegar"}, {"t": "60ml good olive oil"}, {"t": "Salt and pepper"}, {"t": "Baby spinach or salad leaves"}, {"t": "Feta cheese"}], "steps": [{"t": "Gently scrub the beetroot to remove any dirt (do not peel)."}, {"t": "Cut into bite-sized cubes. Place in an oven bag with garlic, vinegar, oil, salt and pepper. Mix together and seal bag."}, {"t": "Cook in a pre-heated oven at 200C for about an hour until tender. Cut open the bag and leave to cool. Once cool, remove the skins of the garlic, transfer to a tub and put in the fridge. (FOR USE AT ANOTHER TIME?)"}, {"t": "When you’re ready to serve your salad place beetroot on a bed of spinach and sprinkle with chunks of feta."}, {"t": "Use the left over juice as a salad dressing as desired."}], "tips": [{"h": "Tips", "t": "Cook the beetroot the day before so its had time to chill. Use gloves when preparing to avoid stained hands. If you love beetroot and eat a lot, don’t be alarmed when you go to the toilet! Add some herbs or a dash of chili oil before cooking for added flavour. If you don’t have any oven bags you can make a tinfoil parcel."}], "sources": ["Family cookbook – Starters, Soups & Salads – The Vevroot Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "beetroot feta salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Mum's Butternut Squash Salad", "serves": "4", "time": "1 hr", "time_detail": "20 min prep + 40 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2kg butternut squash"}, {"t": "Olive oil"}, {"t": "6 stalks of fresh thyme (1/2 tsp dried thyme)"}, {"t": "Handful of mesclun/ mixed salad greens"}, {"t": "Feta, goat or blue cheese, cut into cubes or crumbled"}, {"t": "Optional: pecan nuts or any nuts"}], "steps": [{"t": "Preheat oven to 220C."}, {"t": "Halve the squash (you can leave the skin on or take off), scoop out the seeds. Cut squash into about 2.5cm cubes."}, {"t": "Put the squash pieces into a roasting pan with about 3 Tbs of olive oil. Strip the leaves off the thyme stalks (or use dried) and sprinkle over the squash."}, {"t": "Roast in the oven for about 35-40 minutes. Once the squash cools you can store it in the fridge until you are ready to eat it."}, {"t": "Base the plate with some mixed salad. Top with some squash (warm or chilled). Then add your choice of cubed or crumbled cheese."}, {"t": "Optional: scatter over some pecans or other nuts of your choice; you can also pour a little bit of quality olive oil over the salad if you wish."}], "tips": [{"h": "About this recipe", "t": "It's great to make this big batch of squash, as you can keep it in the fridge for a few days - making lunch quick and easy!"}], "sources": ["Family cookbook – Starters, Soups & Salads – The Sinnott Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "mum s butternut squash salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Tagliata", "serves": "2", "time": "30 min", "time_detail": "10 min prep + 20 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 steaks"}, {"t": "Fresh ground pepper"}, {"t": "Sea salt"}, {"t": "125g rocket leaves"}, {"t": "Extra virgin olive oil"}, {"t": "Juice 1 lemon or balsamic cream"}, {"t": "50g parmesan cheese (shaved with a potato peeler)"}], "steps": [{"t": "Here is one of my many favourites, based on one of my champions who loves healthy food!"}, {"t": "It’s a good idea to cook the steaks on the barbecue, especially if it’s a gas grill, to save washing up. If not, use a ridged griddle pan. Whichever you use, it needs to be really hot before you cook them."}, {"t": "Brush the steaks with a little oil and season well with freshly ground black pepper and sea salt. Cook them for 4 minutes on each side for medium rare. Allow to rest for 5 minutes."}, {"t": "Arrange the rocket (already tossed with balsamic cream and tiny bit of olive oil) on a serving plate. Thinly slice the beef and arrange on top. Drizzle with olive oil, squeeze with lemon and top with the parmesan shavings. Serve immediately."}], "tips": [], "sources": ["Family cookbook – Starters, Soups & Salads – Thelma Pesci"], "kind": "family", "pesc_plan": false, "slots": [], "id": "tagliata", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Family & friends"]}, {"title": "Kylie’s Green Bean and Almond Salad", "serves": "4 - 6", "time": "30 min", "time_detail": "30 min prep", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "200g blanched, topped and tailed green beans blanche for one minute, rinse and drain"}, {"t": "100g raw almonds"}, {"t": "2 Tbs Tamari (or soy sauce)"}, {"t": "1 clove of garlic, crushed"}, {"t": "2 Tbs oil"}, {"t": "1Tbs fresh ginger, finely grated"}, {"t": "1 large tomato, cut into thin wedges"}, {"t": "Half a medium onion, thinly sliced"}], "steps": [{"t": "Fry the almonds gently in a little oil, stirring frequently to prevent them burning."}, {"t": "When golden, add the garlic, ginger and tamari. Cool."}, {"t": "Mix the almonds with the veggies, toss well and serve"}, {"t": "Combine to make a simple, delicious, elegant salad."}], "tips": [{"h": "Note", "t": "This salad is fantastic, different from your every day mock-up, and so tasty and easy to do. Each time I have made it I have doubled the recipe to feed 6 pax."}], "sources": ["Family cookbook – Starters, Soups & Salads – Kylie Waterstrom"], "kind": "family", "pesc_plan": false, "slots": [], "id": "kylie s green bean almond salad", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Seared Tuna Salad", "serves": "4", "time": "25 min", "time_detail": "15 min prep + 10 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "Coarse salt and ground pepper"}, {"t": "4 6 ounce tuna steaks (each about 3/4 to 1 inch thick)"}, {"t": "226g green beans (topped and tailed)"}, {"t": "2 tsp dijon mustard"}, {"t": "4 tsp red-wine vinegar"}, {"t": "1 clove garlic (minced)"}, {"t": "2 Tbs purple onion"}, {"t": "60ml extra-virgin olive oil"}, {"t": "1 head romaine lettuce or mixed greens"}, {"t": "4 large hard-cooked eggs (quartered)"}, {"t": "8 chopped vine tomatoes"}, {"t": "50g Kalamata olives"}], "steps": [{"t": "In a large pan of boiling water, cook green beans until bright green and tender (3 minutes)."}, {"t": "Drain and rinse under cool water. In a small bowl, whisk together mustard, vinegar, minced garlic and chopped purple onion and oil and season with salt and pepper. Set aside."}, {"t": "Sprinkle tuna with salt and pepper. Heat a large non-stick skillet over medium-high heat. Add tuna to same skillet; cook to desired doneness (2 minutes per side for medium-rare)."}, {"t": "Divide chopped lettuce among four bowls. Slice tuna and arrange on the top of the lettuce. Top with green beans, eggs, tomatoes and olives; season with salt and pepper and drizzle with dressing."}, {"t": "Serve immediately."}], "tips": [], "sources": ["Family cookbook – Starters, Soups & Salads – Langley Allbritton"], "kind": "family", "pesc_plan": false, "slots": [], "id": "seared tuna salad", "cats": ["Sides & salads", "Mains"], "tags": ["Fish & seafood", "Family & friends"]}, {"title": "Pan Fried Haloumi with Asparagus and Cherry Tomatoes", "serves": "6", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 punnets cherry tomatoes, on the vine if possible"}, {"t": "1 bunch of fresh basil leaves"}, {"t": "100ml olive oil"}, {"t": "Salt and cracked black pepper to taste"}, {"t": "2 bunches of asparagus spears, trimmed, peeled, and snap off lower (woody) part"}, {"t": "360g haloumi, cut in triangle shape (you can coat it in some seasoned plain flour if you wish, chili flakes and sea salt is a good combo)"}, {"t": "2 lemons"}], "steps": [{"t": "Preheat oven to hot, 200C. Place tomatoes on a baking tray and brush with olive oil, salt and pepper, then bake until skins blister (approx 5-10 minutes). Be careful not to overcook."}, {"t": "Blanche asparagus in a pot of lightly salted boiling water for 1 minute and refresh in cold water to retain its vibrant green colour."}, {"t": "Arrange asparagus, basil and cherry tomatoes on a plate."}, {"t": "Heat a non-stick frying pan on medium heat and fry haloumi for 30 seconds each side until golden brown. Add to dish and serve immediately while still warm with a squeeze of lemon and cracked pepper to serve."}], "tips": [{"h": "Note", "t": "IMPORTANT Note: As fabulous as haloumi is, MAKE SURE it is SERVED warm IMMEDIATELY to fully appreciate its magic, or it becomes TOUGH and loses its pizzazz! If you are doing as an entrée for a dinner party, you can combine the asparagus, basil, tomato, olive oil and salt and set aside in the refrigerator until needed."}], "sources": ["Family cookbook – Starters, Soups & Salads – Kylie Waterstrom"], "kind": "family", "pesc_plan": false, "slots": [], "id": "pan fried haloumi asparagus cherry tomatoes", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Roasted Tomato and Lentil Soup", "serves": "4-6", "time": "1 hr", "time_detail": "30 min prep + 30 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "3 Tbsp olive oil"}, {"t": "600g vine tomatoes (halved)"}, {"t": "Sea salt and freshly ground black pepper"}, {"t": "1 large onion (chopped)"}, {"t": "2 small garlic cloves (finely chopped)"}, {"t": "Large knob butter"}, {"t": "2 tsp ground cumin"}, {"t": "¼ tsp cayenne pepper"}, {"t": "140g red lentils (rinsed)"}, {"t": "850ml vegetable or chicken stock (preferably home-made)"}], "steps": [{"t": "Preheat the oven to 220C."}, {"t": "Pour the oil into a roasting dish or tray and heat in oven until almost smoking hot."}, {"t": "Carefully tip tomatoes onto roasting dish and toss to coat in oil. Roast for around 20 minutes stirring halfway, until the tomatoes have softened."}, {"t": "Meanwhile, in a large saucepan, sweat onion, and garlic in the butter with seasoning until soft (up to 10 minutes or so)."}, {"t": "Sprinkle over cumin and cayenne pepper and sauté for a couple of minutes."}, {"t": "Remove tomatoes from the oven and tip them in the saucepan, along with any juices from the roasting dish."}, {"t": "Stir in the lentils, then pour in the stock and bring to the boil."}, {"t": "Cook over a high heat for 10 minutes, then lower to a gentle simmer for about 20 minutes until lentils are soft."}, {"t": "Remove pan from the heat, cool the soup slightly, then blend in batches until smooth. Return to heat to warm through before serving."}], "tips": [{"h": "About this recipe", "t": "The perfect Winter soup! The lentils provide added bulk and texture, while the cayenne gives it a kick. For a lighter soup you can omit the lentils. Serve with fresh basil and a dollop of Greek yoghurt or crème fraiche alongside freshly baked bread."}, {"h": "Tips", "t": "This soup freezes well – if desired freeze after blending. I have also made this without the cayenne pepper – for a milder flavour."}], "sources": ["Family cookbook – Starters, Soups & Salads – The Musgrave Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "roasted tomato lentil soup", "cats": ["Soups & starters"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Broccoli & Pine Nut Soup", "serves": "6", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 Tbs olive oil"}, {"t": "1 finely chopped brown onion"}, {"t": "2 crushed garlic cloves"}, {"t": "1kg broccoli, trimmed, cut into small florets (leave about 3cm of stem intact)"}, {"t": "4 cups vegetable or chicken stock"}, {"t": "1/3 cup pine nuts"}, {"t": "Salt and pepper"}], "steps": [{"t": "Heat oil in a large saucepan over medium-low heat, then add onion and garlic. Cook and stir, for 8 to 10 minutes or until soft."}, {"t": "Add broccoli, stock and 475ml water to pan. Cover and bring to the boil. Reduce heat to low and simmer, covered, for 15 to 20 minutes or until tender. Remove from heat."}, {"t": "Meanwhile, heat a small frying pan over medium heat. Dry-fry the pine nuts, for approximately 3 minutes, until they become golden brown. Add to soup."}, {"t": "Using a food processor or blender, blend the soup in batches, until smooth."}, {"t": "Season the soup with salt and pepper. Return the soup to the pan. Stir over low heat for 8 minutes or until warm. Ladle into bowls and serve."}], "tips": [{"h": "Tips", "t": "This soup is so quick and simple to make, the kids love it and it freezes well. This is also satisfying as a main meal, as it is quite filling and wholesome. Great for dinner parties!"}], "sources": ["Family cookbook – Starters, Soups & Salads – Kylie Waterstrom"], "kind": "family", "pesc_plan": false, "slots": [], "id": "broccoli pine nut soup", "cats": ["Soups & starters"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Chinese Wonton Soup", "serves": "Makes approximately 30 wontons", "time": "38 min", "time_detail": "30 min prep + 8 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "260g minced, boneless pork loin"}, {"t": "120g peeled shrimp"}, {"t": "30 pieces (3.5 inch square) wonton wrappers"}, {"t": "700ml chicken broth"}, {"t": "Assorted vegetables"}, {"h": "Marinade for pork loin"}, {"t": "2 tsp soy sauce"}, {"t": "1/2 tsp of sugar"}, {"t": "2 tsp cornstarch"}, {"t": "1/2 tsp chicken powder"}, {"t": "1/4 tsp white pepper"}, {"h": "Marinade for shrimp"}, {"t": "1 Tbs egg white"}, {"t": "1/2 tsp salt"}, {"t": "1/4 tsp white pepper"}], "steps": [{"t": "Dry the minced pork, marinate with the seasonings and let stand for 20 minutes."}, {"t": "Wash the peeled shrimp and dry with paper towels. Cut into 3-4 pieces and marinate with seasoning, then place in refrigerator for 20 minutes."}, {"t": "In a large bowl, combine pork and shrimp. Mix and stir in one direction until the mixture is well combined and spongy. Place approximately one teaspoon of the filling at the centre of each wonton wrapper."}, {"t": "Moisten edges of wonton wrapper with water, then pull the top corner down to the bottom, fold the wrapper over the filling to make a triangle. Press edges firmly to make a seal. Bring left and right corners together above the filling. Overlap the tips of these corners, moisten with water and press together."}, {"t": "Continue until all wrappers and pork/shrimps mixture are used."}, {"t": "Bring a large pan of water to the boil, gently place wontons in and stir lightly so that they do not stick together. After the water boils again, cook the wontons for approximately 3-4 minutes until they float. Remove all wontons from water."}, {"t": "For soup: Bring the chicken broth to the boil. Put wontons and soup in a bowl, add your favourite vegetables and ready to serve."}], "tips": [{"h": "Tips", "t": "Uncooked wontons can be kept in freezer for approximately 2 weeks if well wrapped. They can be boiled straight from frozen and cooked in a couple minutes."}], "sources": ["Family cookbook – Starters, Soups & Salads – Charleen’s Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "chinese wonton soup", "cats": ["Soups & starters", "Mains"], "tags": ["Beef, pork & lamb", "Fish & seafood", "Family & friends"]}, {"title": "Mama’s German Chicken Soup", "serves": "6 or more", "time": "2 hr 15 min", "time_detail": "15 min prep + 2 hr, 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "Soup"}, {"t": "1 chicken"}, {"t": "Coarse salt"}, {"t": "1 cauliflower"}, {"t": "Chicken powder"}, {"t": "Tiny noodles for soup"}, {"t": "2 leeks"}, {"t": "Parsley"}, {"h": "Dumplings"}, {"t": "German “Brandt Zwieback” (breadcrumbs)"}, {"t": "3 eggs"}, {"t": "Melted butter (HOW MUCH?)"}, {"t": "Salt"}, {"t": "Nutmeg"}], "steps": [{"t": "For the dumplings: mix the eggs with salt and nutmeg and add the melted butter. If you use the original German Zwieback, smash it to small crumbs. Mix crumbs into the egg mixture until it makes sticky dough. Form small balls and set aside."}, {"t": "For the soup, bring about 4 to 5 litres of water to a boil and add the chicken."}, {"t": "After 1 hour add salt to taste (about 1 handful)."}, {"t": "Cut the leek into small pieces and add to the soup. Cook over low heat for 1 more hour. Season with chicken powder (to taste), add two handfuls of noodles and the dumplings."}, {"t": "Cook for 10 more minutes. Then cut cauliflower into florets, add to soup and cook for 5 more minutes."}, {"t": "Remove whole chicken before serving. Cut good meat into small cubes and add back to the soup."}, {"t": "Pull from the stove, sprinkle with parsley and serve hot."}], "tips": [], "sources": ["Family cookbook – Starters, Soups & Salads – The Huber Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "mama s german chicken soup", "cats": ["Soups & starters", "Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "My Family’s Favourite Chicken and Vegetable Soup", "serves": "", "time": "1 hr 25 min", "time_detail": "30 min prep + 55 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 carrots (peeled and chopped)"}, {"t": "1 small onion (chopped)"}, {"t": "2 Tbs olive oil"}, {"t": "¼ cup short-grain, white rice (also delicious with brown rice)"}, {"t": "2 skinless chicken breasts"}, {"t": "1 quart water"}, {"t": "1 quart organic chicken broth"}, {"t": "1 cup cauliflower (steam and puree)"}, {"t": "½ cup carrot (steam and puree)"}, {"t": "1 Tbs cornstarch"}, {"t": "2 Tbs cream cheese at room temperature"}, {"t": "Juice from 1 lemon"}, {"h": "Pepper and salt to taste"}], "steps": [{"t": "Finely chop carrots and onion, or blitz in food processor."}, {"t": "Heat olive oil in large stock pot. Add chopped onion and carrot. Cook until they are soft (not brown). Add rice and cook for until ends are translucent."}, {"t": "Add water and broth and bring to a boil. Add chicken and cover. Turn off heat and let chicken cook in the pot until it’s no longer pink (25-30 minutes). Once chicken has cooked, remove it, shred it and return to the pot."}, {"t": "Stir in purees."}, {"t": "In a small bowl, combine cornstarch and cream cheese. Remove several spoonfuls of soup from the pot and whisk into cream cheese mixture until lumps are gone. Stir soup and cream cheese mixture back into the pot and warm if necessary. Stir in lemon juice to taste, just before serving. Season with salt and pepper."}], "tips": [{"h": "About this recipe", "t": "It’s hard to find a meal that pleases my husband and my two girls; especially one that is both tasty and nutritious! I love serving up this soup because everyone at the table becomes suddenly quiet and doesn’t speak again until their bowl is empty. It’s that good."}, {"h": "Tips", "t": "We usually make the soup without actually cooking the chicken in it. That way, we can make a big batch, freeze the soup, and then reheat the soup and add chicken, depending on how many kids we have over for dinner."}], "sources": ["Family cookbook – Starters, Soups & Salads – Langley Allbritton"], "kind": "family", "pesc_plan": false, "slots": [], "id": "my family s favourite chicken vegetable soup", "cats": ["Soups & starters", "Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "Marmitako Fresh Tuna and Potato Stew", "serves": "6 (as a main course)", "time": "1 hr 15 min", "time_detail": "15 min prep + 1 hr cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 dried choricero peppers (if not available, use 1Tbs tomato puree instead)"}, {"t": "1/2 kg fresh tuna fillet or salmon"}, {"t": "Coarse salt"}, {"t": "4 russet potatoes (about 1 Kg total weight)"}, {"t": "1/3 cup Spanish extra virgin olive oil"}, {"t": "1 yellow onion (finely chopped)"}, {"t": "1 clove garlic (minced)"}, {"t": "1/2 green bell pepper (seeded and cut lengthwise into narrow strips)"}, {"t": "1 tablespoon sweet pimentón or paprika"}, {"t": "Parley to garnish"}], "steps": [{"t": "In a heatproof bowl, combine the dried pepper with boiling water to cover and let stand for 30 minutes, or until soft. Drain the peppers, slit them open, and scrape off the flesh with the edge of a knife, discarding the seeds, skins and stems. Set the flesh aside."}, {"t": "Cut the tuna or salmon into small pieces. Sprinkle the pieces with coarse salt and set aside."}, {"t": "Peel the potatoes. To 'crack' the potatoes into chestnut-sized pieces, make a small cut in each potato and then break it open the rest of the way. Set the potato pieces aside."}, {"t": "In a stockpot, heat the extra virgin olive oil over medium-high heat. Add the onion, garlic, and bell pepper and the flesh from the choricero peppers, stir well and cook, stirring occasionally, for 5 minutes - or until the onion and bell pepper have begun to soften and all the ingredients are well blended."}, {"t": "Add the potatoes and pimentón and mix well. Season with a little coarse salt and add water to cover well. Bring to a boil, cover, decrease the heat to medium-low, and cook for about 30 minutes, or until the potatoes are fork-tender."}, {"t": "Add the tuna or salmon pieces to the pot and simmer for 5 minutes or until the tuna or salmon is cooked. Remove from the heat and let stand for 30 minutes before serving. If the soup is very clear because the potatoes didn't release enough starch, mash a piece or two against the side of the pot with the back of a spoon and shake the pot a little."}, {"t": "Sprinkle with chopped parsley and serve with fresh crusty bread."}], "tips": [], "sources": ["Family cookbook – Starters, Soups & Salads – By Marisa Flores"], "kind": "family", "pesc_plan": false, "slots": [], "id": "marmitako fresh tuna potato stew", "cats": ["Mains"], "tags": ["Fish & seafood", "Family & friends"]}, {"title": "Malaysian Indian Rogan Josh", "serves": "", "time": "1 hr 30 min", "time_detail": "Overnight plus prep + 1.5 hr cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "For the marinade (3 hours minimum, overnight preferably)"}, {"t": "2 pounds lamb (boneless shoulder/leg)"}, {"t": "3 Tbsp lemon juice"}, {"t": "1 cup natural yoghurt"}, {"t": "1 tsp salt"}, {"t": "3 garlic cloves (crushed)"}, {"t": "1 inch piece root ginger (grated)"}, {"h": "To cook"}, {"t": "4 Tbs oil"}, {"t": "½ tsp cumin seeds"}, {"t": "2 bay leaves"}, {"t": "4 green cardamom pods"}, {"t": "1 onion (finely chopped)"}, {"t": "3 tsp ground coriander"}, {"t": "3 tsp ground cumin"}, {"t": "1 tsp chili powder"}, {"t": "14 oz can chopped tomatoes"}, {"t": "2 Tbs tomato puree"}, {"t": "2/3 cup water"}, {"h": "Optional garnish"}, {"t": "Mango chutney"}], "steps": [{"t": "Toasted cumin seeds and fresh coriander to garnish."}, {"t": "Trim away any excess fat from meat and cut into 1 in cubes."}, {"t": "In a bowl, mix together the lemon juice, yoghurt, salt, garlic clove and the ginger. Add the lamb and leave in the marinade for 3 hours at least or overnight."}, {"t": "Heat the oil in a large frying pan and fry the cumin seeds for 2 minutes or until they begin to splutter. Add the bay leaves and cardamom pods and fry for a further 2 minutes. Add the onion and remaining garlic and fry for 5 minutes. Stir in the ground coriander, cumin and chili powder and fry for 2 minutes."}, {"t": "Add the marinated lamb and cook for 5 minutes, stirring occasionally. Add the tomatoes, tomato puree and water. Bring to the boil and reduce the heat. Cover and let simmer for about 1-1 ½ hours or until the meat is tender. Serve with plain rice and garnish with the toasted cumin seeds, fresh coriander and mango chutney."}], "tips": [{"h": "About this recipe", "t": "This recipe has been adapted from the 50 Classic Curries by Manisha Kanani for our family and friends since 1999. The children have had this since they were 4! Being Malay I missed the flavors of home and this certainly made it feel as if I was there. The lamb is traditionally marinated in yoghurt then cooked with spices and tomatoes which give this dish its rich, red appearance. For a spicier version add more chili powder. We have it at dinner but it tastes extra better the next day for lunch as well!"}], "sources": ["Family cookbook – Main Meals – Juliana Nasir Pratt"], "kind": "family", "pesc_plan": false, "slots": [], "id": "malaysian indian rogan josh", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Family & friends"]}, {"title": "Lamb Chops with Dried Cherries and Port", "serves": "2", "time": "1 hr", "time_detail": "30 min prep + 30 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 teaspoons olive oil"}, {"t": "4 4-to 5-ounce loin lamb chops"}, {"t": "1/3 cup chopped shallots"}, {"t": "3/4 cup ruby Port"}, {"t": "1/2 cup low-salt chicken broth"}, {"t": "1/2 cup dried tart cherries"}, {"t": "3 Tbs cherry jam"}, {"t": "1 Tbs balsamic vinegar"}, {"t": "1/2 tsp ground cardamom"}], "steps": [{"t": "Heat oil in heavy medium nonstick skillet over medium-high heat. Add lamb to skillet; cook to desired doneness, turning often, about 10 minutes for medium-rare. Transfer lamb to plate. Pour off drippings from skillet."}, {"t": "Add shallots to same skillet; sauté 1 minute. Add Port, broth, cherries, jam, vinegar, and cardamom; boil until cherries plump and liquid is syrupy, about 6 minutes. Season with salt and pepper."}, {"t": "Spoon sauce over lamb. Enjoy!"}], "tips": [], "sources": ["Family cookbook – Main Meals – The Hart Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "lamb chops dried cherries port", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Family & friends"]}, {"title": "Spaghetti and Meatballs", "serves": "", "time": "30 min", "time_detail": "15 min (depends how many hands are involved in forming the meatballs!) prep + 15 min (for meatballs and spaghetti) cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "For sauce"}, {"t": "4-6 garlic cloves, finely chopped (I usually use more, as I love garlic)"}, {"t": "1 Tbs olive oil"}, {"t": "1500g of chopped tomatoes (I use 3 cans or tetra packs)"}, {"t": "2 tsp salt"}, {"t": "1 Tbs dried oregano"}, {"t": "4 Tbs tomato paste"}, {"t": "1/2 cup water"}, {"h": "For meatballs"}, {"t": "400g ground pork"}, {"t": "600g ground beef"}, {"t": "2 eggs"}, {"t": "12 saltine crackers (crushed)"}, {"t": "1-2 tsp salt"}, {"t": "3 tsp dried oregano"}, {"t": "2 Tbs tomato paste"}, {"t": "Ground black pepper"}, {"h": "Make the sauce"}], "steps": [{"t": "Heat olive oil in large sauté pan, and add garlic; sauté for about 30 seconds. Add tomatoes, salt, oregano, tomato paste and water. Stir until the sauce simmers. Reduce heat to low and cover. Let the sauce simmer gently while you make the meatballs."}, {"h": "Make the meatballs"}, {"t": "In a large bowl, combine the pork, beef, egg, saltine crackers, salt, oregano, pepper and tomato paste (and grated parmesan if using). Form meatballs with your hands and place them on a plate or cutting board."}, {"t": "Turn up the heat on the sauce, and carefully place the meatballs in the sauce and cook until they are cooked through (about 10 minutes)"}, {"t": "Cook the spaghetti while the meatballs are cooking. When spaghetti is ready, drain it and shake out any extra water. Add the drained spaghetti to the sauce in the sauté pan and toss it all together."}, {"t": "Serve by placing spaghetti in bowl, with meatballs on top. Add a little extra sauce on top of spaghetti and serve with additional grated parmesan."}], "tips": [{"h": "Note", "t": "I usually add in grated parmesan for extra flavor"}, {"h": "Tips", "t": "I sometimes also add in 1-2 Tbs of pesto or some chopped sundried tomatoes for extra tomato flavor. The recipe uses quite a lot of meat and tomatoes, but we do it this way so we have leftovers for school lunches or meatball subs. The kids love to make it and eat it."}], "sources": ["Family cookbook – Main Meals – Lotta"], "kind": "family", "pesc_plan": false, "slots": [], "id": "spaghetti meatballs", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Family & friends"]}, {"title": "Penne pasta with fresh Genovese basil pesto and green beans", "serves": "4", "time": "52 min", "time_detail": "40 min prep + 12 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "50 g fresh basil leaves"}, {"t": "6 Tbs freshly grated Parmesan cheese"}, {"t": "2 Tbs freshly grated Pecorino cheese"}, {"t": "1 Tbs spoon of pine nuts"}, {"t": "1 medium sized garlic clove (minced)"}, {"t": "2 pinches of salt"}, {"t": "200g of green beans"}, {"t": "240g of Penne pasta"}, {"t": "½ cup olive oil"}], "steps": [{"t": "Clean and prepare the basil leaves. Combine the garlic and pine nuts, pulse a few times in a food processor. Add the basil and blend."}, {"t": "Add the olive oil in a constant stream while the food processor is on. Stop to scrape down the sides of the food processor with a plastic spatula. Add grated cheese and mix again until blended. Add a pinch of salt to taste."}, {"t": "Clean and boil the green beans. Boil and cook the penne pasta about 12 minutes."}, {"t": "Combine green beans and pasta with pesto. Sprinkle the Parmesan cheese on top and serve."}], "tips": [{"h": "About this recipe", "t": "In our tradition is a “Hot” dish you should eat it immediately after cooking, not cold!"}, {"h": "Tips", "t": "The noodles must be AL DENTE (not overcooked)!"}], "sources": ["Family cookbook – Main Meals – The Brassesco Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "penne pasta fresh genovese basil pesto green beans", "cats": ["Mains"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Pasta with Broccoli, Pesto and Cherry Tomatoes", "serves": "4 (generously)", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "175g pesto"}, {"t": "350g dried pasta such as penne"}, {"t": "350g cherry tomatoes, halved"}, {"t": "225g broccoli, divided into florets"}, {"t": "Grated parmesan to serve (optional)"}], "steps": [{"t": "Put plenty of water in a large pan to boil (don't worry about salting it, commercial pesto is usually quite salty)."}, {"t": "Two minutes before the pasta is ready (look at the packet for cooking times - they are usually pretty accurate), add the broccoli florets. Continue cooking for two minutes."}, {"t": "As soon as the pasta is al dente, drain the pasta and broccoli and immediately return the pan to the heat. Add the pesto and tomatoes to the pan and heat through (alternatively you can gently warm the pesto and tomatoes in a separate pan whilst the pasta is cooking), about 1 minute."}, {"t": "Add the pasta and broccoli and mix well. Serve immediately in bowls (preferably warm) scattered with parmesan if using."}], "tips": [], "sources": ["Family cookbook – Main Meals – Sarah Britton"], "kind": "family", "pesc_plan": false, "slots": [], "id": "pasta broccoli pesto cherry tomatoes", "cats": ["Mains"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Mediterranean Chicken Casserole", "serves": "", "time": "1 hr 15 min", "time_detail": "15 min prep + 1 hr cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 onion (peeled and sliced)"}, {"t": "2 cloves of garlic (peeled and crushed)."}, {"t": "1 red pepper (deseeded and sliced into strips)"}, {"t": "1 yellow pepper (deseeded and sliced into strips)"}, {"t": "2 Tbs of extra-virgin olive oil."}, {"t": "1 whole fresh chicken (washed and patted dry)"}, {"t": "20 fresh cherry tomatoes"}, {"h": "A sprig of Thyme"}, {"t": "150 ml (1/4 pint of stock, made from vegetable or chicken bouillion powder/stock cube)"}], "steps": [{"t": "A handful of black pitted olives (optional – in case your children do not like olives, they will be disguised in the blended gravy and they add extra flavour!)"}, {"h": "A sprig of Thyme"}, {"t": "Preheat oven to 220C. In a heavy casserole pan, cook the onion, garlic and peppers in the olive oil until the onion is transparent."}, {"t": "Add the chicken whole and surround it with the olives, cherry tomatoes, thyme and stock. Put the lid on the casserole tightly and bake in the oven for approximately 1 hour, until the chicken is cooked through."}, {"t": "Transfer the chicken to a high sided serving dish, skim any fat off the surface off the sauce and transfer the remainder to a blender/food processor, or use a hand held blender and whiz it up."}, {"t": "Pour over the chicken or serve as separate gravy with the sliced chicken."}, {"t": "Serve with green vegetable and either potatoes, rice or crusty bread – Yum !!"}], "tips": [{"h": "About this recipe", "t": "The sauce is delicious if blended and served as gravy. We have found this to be a hassle-free meal for the whole family."}], "sources": ["Family cookbook – Main Meals – Allison Maddren"], "kind": "family", "pesc_plan": false, "slots": [], "id": "mediterranean chicken casserole", "cats": ["Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "Spicy Chicken Masala Recipe", "serves": "4-5", "time": "35 min", "time_detail": "30-35 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "Marinate"}, {"t": "½ kg chicken, washed and cut into medium sized pieces"}, {"t": "1 tsp red chili powder (adjust to suit your spice level)"}, {"t": "¼ tsp turmeric powder"}, {"t": "Salt to taste"}, {"h": "Make a paste"}, {"t": "6-7 cashew nuts"}, {"t": "4-5 Tbs milk"}, {"h": "Dry roast and make a fine powder"}, {"t": "1” cinnamon"}, {"t": "10-12 curry leaves"}, {"t": "3 cloves"}, {"h": "Remaining ingredients"}, {"t": "3-4 Tbs oil"}, {"t": "2 big onions finely chopped"}, {"t": "1 large tomato finely chopped"}, {"t": "1 tsp ginger-garlic paste"}, {"t": "1 tsp coriander powder"}, {"t": "¾ tsp black pepper powder (adjust to suit your spice level)"}, {"t": "¼ tsp cumin powder"}, {"t": "Coriander leaves for garnish"}], "steps": [{"t": "Marinate chicken pieces in chili powder, turmeric powder and salt for 20 minutes."}, {"t": "While the chicken pieces are marinating, make a paste of cashew nuts and milk. Set aside. Dry roast cinnamon, cloves and curry leaves for 1 minute and make a powder of them. Set aside."}, {"t": "Heat 1 1/2 Tbs of oil in a cooking vessel. Add the onions and sauté till pink. Add ginger-garlic paste and sauté further for another 3-4 minutes on medium heat."}, {"t": "Add coriander powder, cumin powder, pepper powder and combine well and fry for another minute."}, {"t": "Add the tomatoes and let it cook for 3-4 minutes. Combine well and cook until the oil separates."}, {"t": "Turn off heat. Cool and grind the cooked masala. Set aside this masala paste."}, {"t": "Heat 1 1/2 Tbs oil in a cooking vessel and add the marinated chicken and cook on high flame for 4-5 minutes, reduce heat and cook covered for another 4-5 minutes."}, {"t": "Add the ground masala paste, cashew nut paste and ground powder of cinnamon, cloves and curry leaves and combine well. (Add a cup of water for more gravy consistency)."}, {"t": "Cook till chicken pieces are soft and you get the desired curry consistency. Adjust salt."}, {"t": "Garnish with fresh coriander leaves."}], "tips": [{"h": "About this recipe", "t": "This spicy South Indian cuisine is delicious."}], "sources": ["Family cookbook – Main Meals – Wieneke, Tara Dasgupta's mum"], "kind": "family", "pesc_plan": false, "slots": [], "id": "spicy chicken masala recipe", "cats": ["Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "Moroccan Chicken Tagine with Couscous", "serves": "4-6", "time": "", "time_detail": "", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "4 medium chicken breasts on the bone"}, {"t": "6 winglets"}, {"t": "3 tsp of cumin"}, {"t": "2 tsp of ground ginger"}, {"t": "1 tsp turmeric"}, {"t": "1 tsp paprika"}, {"t": "1 tsp of cinnamon"}, {"t": "1 tsp of ground black pepper"}, {"t": "1 bay leaf"}, {"t": "1/2 salted lemon"}, {"t": "2 cloves of garlic"}, {"t": "2 leeks / or Chinese onions (slightly stronger than leeks)"}, {"t": "2 small courgettes"}, {"t": "2 large tomatoes"}, {"t": "1 handful of raisins"}, {"t": "1 handful of pitted olives"}, {"t": "Coriander to garnish"}, {"t": "200g couscous"}, {"t": "125gm of hard crumbled feta cheese"}, {"t": "Loose handful of coriander"}], "steps": [{"t": "Mix all the dry spices in a bowl and leave to one side."}, {"t": "Take the chicken breasts and de-bone, cutting the chicken into cubes WITH THE SKIN ON - it tastes so much better this way."}, {"t": "Score the winglets a couple of times, and place all the chicken into a bowl. Put 1/2 the dry spices into the bowl with the chicken and mix very well; then add the remaining half and mix again ensuring an even coating. Place in the fridge for 1-2 hours to marinate. Remove the chicken for about 30mins before you start to cook."}, {"t": "Take the chicken bones and place in a saucepan with a bay leaf and cover with boiling water. Turn on the heat, bring to the boil, and then allow them to simmer for 1 hour. During this time, you should scoop off any white foam that forms, ensuring you leave chicken pieces in the stock."}, {"t": "Slice the leeks and courgettes, and crush the garlic. Chop the tomatoes into quarters."}, {"t": "For the cooking you can use a large saucepan or a tagine. If you are using a saucepan you should brown the chicken first before continuing."}, {"t": "Place your tagine on to your hob (you will need a heat diffuser to avoid cracking if it is a clay tagine), and turn on the heat. Allow it to warm through. Add a little olive oil and then the garlic (do not wait for the oil to heat as we do not want to burn the garlic), then add all the chicken and spread across the bottom of the pan / tagine evenly. Let it gently fry for about 30 seconds and then mix it all up and lay flat again. Then add the leeks evenly around the tagine, followed by the courgettes. Then add the tomatoes on top of this followed by the salted lemon cut into pieces. Finally add your chicken stock to about 2-3cm below the level of all your ingredients. Put on the lid and allow to simmer for 20 minutes or until chicken is cooked through and beautifully moist. Be careful not to overcook otherwise the chicken can become dry. As soon as chicken is cooked, turn off the heat."}, {"t": "While the chicken is simmering away in the tagine, take a bowl and add your couscous. Pour in enough boiling water to cover the couscous completely. I recommend about 1-2cm above the level of the couscous. Pour in a little olive oil, and cover with a tea towel for 10-15 minutes. Once all the moisture is absorbed take a fork and fluff up the couscous; then add the feta cheese and coriander."}, {"t": "Once all is ready, add the olives and raisins to the tagine and stir in with some coriander. Finally garnish with coriander."}, {"t": "Serve the chicken on a bed of couscous with yoghurt on the side. Enjoy!"}], "tips": [], "sources": ["Family cookbook – Main Meals – By Dominic Powers"], "kind": "family", "pesc_plan": false, "slots": [], "id": "moroccan chicken tagine couscous", "cats": ["Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "Smyth Chicken Tagine", "serves": "4", "time": "1 hr", "time_detail": "30 min prep + 30 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 onion (finely chopped)"}, {"t": "2 garlic cloves (finely chopped, minced)"}, {"t": "1 inch ginger (peeled and grated)"}, {"t": "4 portions of chicken (can use thigh or breast)"}, {"t": "1 tbsp oil (vegetable / rice bran / olive)"}, {"t": "150ml chicken stock"}, {"t": "50g pitted prunes or dried apricots"}, {"t": "1 orange (grate the rind and squeeze the juice)"}, {"t": "100ml orange juice"}, {"t": "1 cinnamon stick"}, {"t": "1 bay leaf"}, {"t": "2 or 3 Tbs natural yoghurt"}], "steps": [{"t": "Gently fry the onion, garlic and ginger in the oil in a heavy casserole dish. Seal the chicken pieces in the same dish. Add the chicken stock, the grated rind of the orange and both orange juices – stir. Add the cinnamon stick and the bay leaf."}, {"t": "Leave to simmer very gently until the chicken is cooked through – at least 30 mins, longer cooking time will tenderise the chicken and give more intense flavours."}, {"t": "You can place it in the oven to cook through or leave on a low flame on the hob top. Remove lid half way through cooking to allow the sauce to thicken. Check the flavour and remove the cinnamon stick during cooking if the flavour becomes overpowering."}], "tips": [{"h": "About this recipe", "t": "This dish is as child friendly as it is sweet and wholesome. The grown-up version would have chili and coriander in it."}, {"h": "Tips", "t": "Root vegetables could be added with the chicken, including pumpkin, carrots, parsnip, even sweet potato. Chopped cashews or sliced almonds can also be used - this would go in with the pitted prunes. Stir through the natural yoghurt just before serving, with couscous or rice, whichever your children prefer."}], "sources": ["Family cookbook – Main Meals – By Megan Smyth and Anna Smyth"], "kind": "family", "pesc_plan": false, "slots": [], "id": "smyth chicken tagine", "cats": ["Mains"], "tags": ["Chicken", "Family & friends"]}, {"title": "Fish, Chips and Mushy Peas", "serves": "4", "time": "45 min", "time_detail": "30 min prep + 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "Sunflower oil"}, {"t": "Olive oil"}, {"t": "Salt and pepper"}, {"t": "225g white fish fillets"}, {"t": "225g flour"}, {"t": "285ml beer"}, {"t": "3 teaspoons baking powder"}, {"t": "900g potatoes"}, {"t": "1 knob of butter"}, {"t": "5 handfuls of frozen peas"}, {"t": "Fresh chopped mint leaves"}, {"t": "Lemon"}], "steps": [{"t": "For the Mushy Peas: Cook the peas, drain off the water, add the butter and chopped mint and simmer for a few minutes. Add a squeeze of lemon juice and salt and pepper. Mash them until mushy!"}, {"t": "For the Fish: Season the fish with salt and pepper on both sides. Whisk together the flour, beer and baking powder to make the batter. Dust each fillet with flour, dip into the batter."}, {"t": "Fry in hot oil for about 4 minutes."}, {"t": "For the Chips: Peel and slice potatoes. Parboil and allow them to dry. Drizzle over olive oil and cook in hot oven until golden."}, {"t": "Serve with salt, vinegar, ketchup, pickled onions or wedge of lemon."}], "tips": [], "sources": ["Family cookbook – Main Meals – The Brown Family"], "kind": "family", "pesc_plan": false, "slots": [], "id": "fish chips mushy peas", "cats": ["Mains"], "tags": ["Fish & seafood", "Family & friends"]}, {"title": "Sole fillet in Lemon-Butter Sauce with Cucumber Yoghurt Salad", "serves": "4", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "4 big pieces of sole fillet"}, {"t": "Juice of 1 freshly squeezed lemon"}, {"t": "1 Tbsp spoon of flour"}, {"t": "6 tsp capers"}, {"t": "50 g butter"}, {"t": "1 fresh bunch of parsley"}, {"h": "Cucumber Salad in Yogurt Sauce"}, {"t": "1 large cucumber"}, {"t": "2 Tbs spoons of freshly squeezed lemon"}, {"t": "1/2 cup natural yoghurt (avoid low fat)"}, {"t": "1 tsp of honey"}, {"t": "2 Tbs olive oil"}, {"t": "1 bunch of dill, freshly chopped"}, {"t": "Salt to taste"}, {"t": "Salt and pepper to taste"}], "steps": [{"t": "Turn the sole fillet in flour until all covered. Fry the fish in a big pan filled with hot melted butter. Turn until they have a nice golden color."}, {"t": "Add the lemon juice and capers and let it simmer for 1 or 2 minutes."}, {"t": "Serve with lots of freshly chopped parsley and cucumber salad in yoghurt sauce. If you wish, add mashed potatoes as a side dish."}, {"h": "Cucumber Salad in Yogurt Sauce"}, {"t": "Peel the cucumber and cut into thin slices. Set the cucumber aside and let it dry out a bit."}, {"t": "For the sauce: put the yoghurt in a bowl and add the honey, olive oil, dill and season with salt and paper. Lastly, add the cucumber and mix gently."}, {"t": "Serve the sole fillet on a plate and the cucumber salad in a small bowl beside the plate."}, {"t": "Enjoy this light and healthy summer dish."}], "tips": [], "sources": ["Family cookbook – Main Meals – Franka Larson"], "kind": "family", "pesc_plan": false, "slots": [], "id": "sole fillet in lemon butter sauce cucumber yoghurt salad", "cats": ["Sides & salads", "Mains"], "tags": ["Fish & seafood", "Family & friends"]}, {"title": "Kylie’s Wicked Chili Mussels", "serves": "4", "time": "30 min", "time_detail": "15 min prep + 15 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 celery sticks"}, {"t": "50ml of white wine"}, {"t": "1 tablespoon of sea salt"}, {"t": "50ml of olive oil"}, {"t": "2 Tbs of minced garlic"}, {"t": "½ tsp of chopped small red chilies (MORE if you like it HOT)"}, {"t": "1L of Napolitana Sauce (you can also puree a couple of tins of tomatoes, add a table spoon of dried basil)"}, {"t": "100ml of mussel stock (you make this in the cooking process)"}, {"t": "¼ bunch of fresh parsley"}, {"t": "1 lemon, slices into wedges"}, {"t": "Crusty bread to serve"}], "steps": [{"t": "Debeard mussels."}, {"t": "Place the celery, wine, salt and mussels in a large pot over medium to high heat and cover with lid. Steam mussels until they start to open, tossing them in the pot occasionally. Remove from heat immediately; strain stock and set mussels and celery aside."}, {"t": "In a wok or the same deep pot, heat oil and add garlic and chili and sauté until golden. Add Napolitana sauce and mussel stock, heat until it boils. Add mussels and toss till all mussels are swimming in sauce and they are all open."}, {"t": "Serve in the biggest chunky bowls you can find, garnish with parsley and a good wedge of lemon, and make sure you have plenty of fresh crusty bread to mop up the sauce as well."}], "tips": [{"h": "About this recipe", "t": "2 kg of medium sized black mussels or NZ green lip mussels (call Candy from Anthony’s Catch, she can clean and de-beard them and you just pick them up, very easy and very affordable)"}, {"h": "Tips", "t": "Double the sauce recipe and it is great to make a pasta dish with the left overs or just more crusty bread, you can NEVER have enough sauce!"}], "sources": ["Family cookbook – Main Meals – Kylie Waterstrom"], "kind": "family", "pesc_plan": false, "slots": [], "id": "kylie s wicked chili mussels", "cats": ["Mains"], "tags": ["Fish & seafood", "Family & friends"]}, {"title": "Shrimp & Prosciutto Polenta", "serves": "Makes 4 servings", "time": "50 min", "time_detail": "25 min prep + 25 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "½ cup instant polenta (polenta can be made with cornmeal and water; it takes 30 minutes)"}, {"t": "1 package of Prosciutto (chop each slice into bite size portions)"}, {"t": "2 garlic cloves (minced)"}, {"t": "Chopped red chilies (to taste)"}, {"t": "3 Tbs extra-virgin olive oil, divided"}, {"t": "1 (14 ounces) can crushed tomatoes in juice (or whiz 14 ounces of tomatoes in blender)"}, {"t": "1 pound cleaned large shrimp"}], "steps": [{"t": "Cook polenta according to package instructions in a heavy medium saucepan until thickened and creamy, about 5 minutes. Remove from heat and season with salt, then cover. If you want to pour the polenta into a mold, this would be the time to do it."}, {"t": "Cook garlic, and add chilies to your liking and sauté in 2 tablespoon oil in a 12-inch heavy skillet over medium heat, stirring, until garlic is pale golden (2 to 3 minutes)."}, {"t": "Add tomatoes with their juice and simmer until liquid is reduced to about 1/4 cup, 6 to 8 minutes. Add prosciutto and shrimp, stirring occasionally, until shrimp are just cooked through, about 3 minutes. Season with salt."}, {"t": "Spoon polenta into shallow bowls and top with shrimp mixture. Drizzle with remaining tablespoon oil, and season with pepper."}], "tips": [{"h": "Tips", "t": "If you choose to make polenta from scratch, be prepared to stir cornmeal and water constantly for ½ hour. If you are feeling creative, polenta can be poured into a mold while warm and as it cools it will thicken and hold its shape. Otherwise, you can just plop it onto the plate and give your dish a rustic look."}], "sources": ["Family cookbook – Main Meals"], "kind": "family", "pesc_plan": false, "slots": [], "id": "shrimp prosciutto polenta", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Fish & seafood", "Family & friends"]}, {"title": "Kylie’s BBQ Beetroot Burgers", "serves": "4", "time": "35 min", "time_detail": "25 min prep + 10 min cook", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "½ cup grated beetroot"}, {"t": "½ cup finely chopped capsicum"}, {"t": "½ cup chopped onion"}, {"t": "½ cup finely chopped parsley"}, {"t": "3 Tbs chopped garlic"}, {"t": "1 beaten egg"}, {"t": "1 tsp salt"}, {"t": "2 tsp chopped basil or sage"}], "steps": [{"t": "Place 2 cups of pepitas (pumpkin seed kernels) into a grinder/blender and make into rough flour."}, {"h": "Chop, grate and mix the following vegetables and herbs"}, {"t": "Combine all vegetables and herbs together, then mix in pepita flour."}, {"h": "Add to this mixture"}, {"t": "Half fill a soup bowl with breadcrumbs or flour of your choice. If burger mix is too sloppy, may have to add a wee bit of flour to the mix. Scoop burger mix with an ice cream scoop, press/ shape burgers into firm, compact flat patties, toss into breadcrumbs / flour, turn gently and place onto a tray."}, {"t": "Heat BBQ plate or fry pan, add olive oil and cook burgers for 5 minutes on each side. Serve with fresh garden salad vegetables."}, {"t": "Fresh natural yoghurt or mango chutney is nice as a topping for the burgers."}], "tips": [{"h": "Tips", "t": "Best made fresh, just before you cook, it only takes about 5 minutes to roll them…. Enjoy… Change the spice base for different flavours. Indian 2 Tbs cumin seeds, 2 Tbs fennel seeds, 2 Tbs Coriander seeds, 2 Tbs fresh finely chopped ginger, ½ cup of fresh coriander leaves (Replace the parsley and or chopped basil/sage with the coriander) Thai 2 Tbs lemongrass, 2 Tbs fresh chopped ginger, 2 Tbs red or green Thai curry paste, ½ cup fresh coriander"}, {"h": "Note", "t": "Serves 4 — I typically double the recipe as there is never enough"}], "sources": ["Kylie’s recipes (also in the family cookbook – Main Meals)"], "kind": "family", "pesc_plan": false, "slots": [], "id": "kylie s bbq beetroot burgers", "cats": ["Mains"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Kylie’s Rich Chocolate Cake", "serves": "12", "time": "1 hr 20 min", "time_detail": "20 min prep + 1 hr bake", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "250g butter"}, {"t": "250g dark chocolate"}, {"t": "375ml (1½ cups) strong coffee (or half coffee, half alcohol of your choice)"}, {"t": "450g (2 cups) caster sugar"}, {"t": "175g (1½ cups) plain wholemeal flour"}, {"t": "1 tsp baking powder"}, {"t": "3 tbsp cocoa powder"}, {"t": "2 eggs"}, {"t": "2 tsp natural vanilla extract"}], "steps": [{"t": "Preheat oven to 180°C. Grease and line a 25cm spring-form cake tin."}, {"t": "Put the butter, chocolate and coffee in a saucepan over LOW heat and cook until the chocolate has melted."}, {"t": "Add the sugar and stir to dissolve. Remove from the heat and pour into a bowl."}, {"t": "Whisk eggs until frothy. Whisk the dry ingredients into the chocolate mixture, then add the eggs and vanilla. Whisk to combine."}, {"t": "Pour the batter into the prepared tin and bake for 1 hour (may take a bit longer)."}, {"t": "Allow the cake to cool in the tin before removing it. Once cool, top with your favourite ganache icing."}], "tips": [{"h": "Note", "t": "This is the “Mike & Georgie” wedding cake."}], "sources": ["Kylie’s recipes"], "kind": "family", "pesc_plan": false, "slots": [], "id": "kylie s rich chocolate cake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Kylie’s Carrot Cake", "serves": "12", "time": "1 hr 50 min", "time_detail": "20 min prep + 1½ hr bake", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "2 cups wholemeal flour"}, {"t": "2 tsp baking powder"}, {"t": "2 tsp bi-carbonate soda"}, {"t": "2 tsp cinnamon"}, {"t": "1 tsp salt"}, {"t": "2 cups raw brown sugar"}, {"t": "4 eggs"}, {"t": "1½ cups quality olive oil or grapeseed oil"}, {"t": "3 cups grated carrot"}, {"t": "¾ cup chopped walnuts"}, {"t": "½ cup sultanas"}, {"t": "½ cup pitted dates (optional)"}, {"t": "½ cup fresh chopped pineapple, drained (optional)"}, {"h": "Topping"}, {"t": "1 block (250g) Philadelphia cream cheese"}, {"t": "Juice of ½ lemon"}, {"t": "Icing sugar to taste (approx. 2–4 tbsp)"}, {"t": "2 tbsp butter"}, {"t": "½ cup chopped walnuts"}], "steps": [{"t": "Preheat oven to 180°C (350°F). Grease a cake tin (cheesecake tins work well) and line with greaseproof paper."}, {"t": "Mix all dry ingredients together, then stir through the grated carrot (and dates, sultanas, pineapple and walnuts)."}, {"t": "Beat eggs and oil together, add to the dry ingredients and mix with a spoon. Pour into the tin."}, {"t": "Place the cake tin on a pizza tray — it tends to leak a little oil while cooking. Bake for 1½ hours. Let stand until cool."}, {"h": "Topping"}, {"t": "Beat the cream cheese, lemon juice, icing sugar and butter together until smooth, adding more icing sugar if needed."}, {"t": "Ice the cooled cake and top with the chopped walnuts. Store in the fridge."}], "tips": [], "sources": ["Kylie’s recipes"], "kind": "family", "pesc_plan": false, "slots": [], "id": "kylie s carrot cake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Hot Mustard Pickle", "serves": "Makes approx. 10 jam jars", "time": "overnight +", "time_detail": "salt overnight, then ~30 min", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"h": "Vegetables"}, {"t": "1 lb (450g) green tomatoes"}, {"t": "2 cucumbers"}, {"t": "3 large onions"}, {"t": "½ cauliflower"}, {"t": "2 red capsicums"}, {"t": "2 green capsicums"}, {"t": "4–8 chillies, depending on taste"}, {"t": "3 tbsp salt"}, {"h": "Pickle"}, {"t": "3 cups malt vinegar"}, {"t": "2 cups sugar"}, {"t": "1 tsp nutmeg"}, {"t": "1 tbsp mustard powder"}, {"t": "2 tbsp curry powder"}, {"t": "½ tsp turmeric"}, {"t": "⅓ cup plain flour"}], "steps": [{"t": "Peel the cucumbers and chop finely. Remove stalks and seeds from the capsicums and chop finely. Separate the cauliflower into small florets. Peel and finely chop the onions. Chop the tomatoes finely. Remove stalks from the chillies and chop finely, seeds and all."}, {"t": "Put the vegetables into a large bowl, sprinkle with the salt, cover with plastic wrap and leave overnight."}, {"t": "Next day, drain in a colander."}, {"t": "Combine the mustard powder, turmeric and flour in a bowl and blend with enough vinegar to make a paste."}, {"t": "Place the vegetables in a saucepan with the remaining vinegar, cover and bring to the boil. Boil for 5–10 minutes depending on whether you like the vegetables crisp or softer."}, {"t": "Add the sugar, nutmeg, curry powder and the mustard paste. Stir until the mixture boils and thickens."}, {"t": "Reduce heat and simmer for 5 minutes. Remove from heat and pour into sterilised jars while still hot."}], "tips": [], "sources": ["Family recipes"], "kind": "family", "pesc_plan": false, "slots": [], "id": "hot mustard pickle", "cats": ["Sides & salads"], "tags": ["Vegetarian", "Family & friends"]}, {"title": "Chocolate Risotto (Bridget’s version)", "serves": "4", "time": "", "time_detail": "", "cal": "", "fat": "", "protein": "", "netcarbs": "", "fibre": "", "ingredients": [{"t": "1 banana"}, {"t": "40g raw honey (in place of 40g sugar)"}, {"t": "50g 70% cacao dark chocolate"}, {"t": "½ cup cacao nibs"}, {"t": "2 heaped tbsp organic cacao powder"}, {"t": "5 drops wild orange essential oil (food grade)"}, {"t": "Zest of 2 oranges (reserve a few strands for the top)"}, {"t": "Goat’s cheese, to serve on top"}, {"h": "Prepared in advance"}, {"t": "100ml olive oil infused for 1 week with the seeds of 3 vanilla pods"}, {"t": "4 vanilla pods infused in 4 L piping hot filtered water for 4 days (vanilla stock)"}], "steps": [{"h": "In advance"}, {"t": "Infuse 100ml olive oil with the seeds from 3 vanilla pods for a week."}, {"t": "Infuse 4 vanilla pods in 4 litres of piping hot filtered water and leave for 4 days to make a vanilla stock. The used pods can be roasted, kept in a jar and sprinkled over apple slices with nut butter or over coconut yoghurt and berries."}, {"h": "Risotto"}, {"t": "Cook the risotto as for a standard chocolate risotto, using the vanil  skewer inserted in the centre comes out clean. Cool in pan for 1 hour, then invert onto a wire rack to cool completely."}, {"t": "For syrup, combine sugar and juice of 1½ lemons in a small saucepan over medium-low heat, stirring to dissolve the sugar. Bring to a simmer and cook for 6-8 minutes, until thickened and starting to caramelise. Cool syrup, then mix in remaining juice of ½ lemon until combined. Cool completely to room temperature."}, {"t": "Top cake with cream and drizzle with syrup to serve."}], "tips": [{"h": "Note", "t": "The whole lemon, skin and all, goes into the batter. Whole-lemon cakes keep well for 3 days in an airtight container; add the cream and syrup just before serving."}], "sources": ["delicious. – Phoebe Wood (via Herald Sun)"], "kind": "family", "pesc_plan": false, "slots": [], "id": "amalfi lemon cake", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "Family & friends"]}], "plans": [{"name": "Plan 81 – November 2026 (Pescatarian)", "no": 81, "month": "November", "year": 2026, "pescatarian": true, "week": [{"day": "Monday", "total": "1505", "breakfast": {"text": "Caramel Peanut Banana Pudding", "id": "caramel peanut banana pudding"}, "lunch": {"text": "Gut-Loving Rainbow Salad with Salmon", "id": "gut loving rainbow salad salmon"}, "snacks": {"text": "Carrot Cake Bliss Ball + ½ cup Blueberries", "id": "carrot cake bliss balls"}, "dinner": {"text": "Stuffed Tofu Eggplant Boats with Herb & Walnut Crumb", "id": "stuffed tofu eggplant boats herb walnut crumb"}}, {"day": "Tuesday", "total": "1422", "breakfast": {"text": "Caramel Peanut Banana Pudding", "id": "caramel peanut banana pudding"}, "lunch": {"text": "Gut-Loving Rainbow Salad with Salmon", "id": "gut loving rainbow salad salmon"}, "snacks": {"text": "2 squares Dark Chocolate + ½ cup Blueberries", "id": null}, "dinner": {"text": "Stuffed Tofu Eggplant Boats with Herb & Walnut Crumb", "id": "stuffed tofu eggplant boats herb walnut crumb"}}, {"day": "Wednesday", "total": "1426", "bre
