vegetables begin to soften and the mixture is fragrant."}, {"t": "Add tomato paste and stir through, then add vegetable stock, tomatoes, and chilli. Cover with a lid, reduce heat to medium-low and simmer for 15 minutes until thickened."}, {"t": "While the mixture simmers, cook your cauliflower rice according to package instructions."}, {"t": "When the sauce has thickened, add the prawns, spinach, lemon juice and zest, and season with pepper. Simmer for a further 3–5 minutes until the prawns have turned white and the spinach is wilted."}, {"t": "Remove from heat and serve with the cauliflower rice. Garnish with the parsley and a few fennel fronds."}], "tips": [{"h": "Ingredient Tips", "t": "This is a great fridge clear out recipe! Use any leftover vegetables you have instead of the capsicum and fennel. Eggplant, zucchini, and green beans are also great options! Don’t have smoked paprika? Normal paprika works just as well."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "spicy prawn paprika stew", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Grilled Salmon with Salsa Verde", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "463", "fat": "27", "protein": "42", "netcarbs": "3", "fibre": "7", "ingredients": [{"t": "1 lemon"}, {"t": "12 asparagus spears"}, {"t": "2 bunches broccolini"}, {"t": "2 x 175 g salmon fillets, skin on"}, {"t": "1 tbsp olive oil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Salsa Verde"}, {"t": "1 cup fresh parsley leaves"}, {"t": "½ cup fresh mint leaves"}, {"t": "2 tsp Dijon mustard"}, {"t": "2 tsp capers"}, {"t": "1 tbsp olive oil"}, {"t": "1 tbsp water"}, {"t": "3 tbsp lemon juice"}], "steps": [{"t": "Slice the lemon into rounds and chop the ends off the asparagus and broccolini."}, {"t": "Brush the salmon fillets with olive oil and season with salt and pepper."}, {"t": "Heat a grill pan over high heat then add the salmon and lemon slices to the hot grill pan. Cook for 4–5 minutes per side, or until the salmon is cooked through and the lemons are lightly charred."}, {"t": "Bring a saucepan of water to the boil, then add the asparagus and broccolini and cook for 2 minutes, until bright green and tender-crisp. Drain well."}, {"t": "While the salmon is cooking, make the salsa verde by blending all ingredients together until smooth. Taste and adjust seasoning if needed."}, {"t": "Divide the salmon and greens between plates and spoon over the salsa verde to serve."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to change the broccolini and asparagus to another green veggie of your choice! Green beans and broccoli work really well."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "grilled salmon salsa verde", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Green Goodness Smoothie", "serves": "1", "time": "3 min", "time_detail": "3 min prep + 0 min cook", "cal": "296", "fat": "13", "protein": "28", "netcarbs": "12", "fibre": "13", "ingredients": [{"t": "1 cup baby spinach"}, {"t": "¼ avocado"}, {"t": "¼ medium zucchini"}, {"t": "¼ medium banana"}, {"t": "36 g vanilla protein powder"}, {"t": "1 tbsp chia seeds"}, {"t": "½ cup water"}], "steps": [{"t": "Add all the ingredients into a blender and blend until smooth. Add extra water or ice for desired consistency."}], "tips": [{"h": "Ingredient Tips", "t": "The Morlife Plantiful protein powders are my favourite. You can get 15% off at checkout by entering the code: For a really cold and creamy texture, freeze the avocado, zucchini, and banana before blending!"}, {"h": "Bec's Tips", "t": "The macros have been calculated using the Morlife Plantiful Vanilla Fudge protein powder."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "green goodness smoothie", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Curried Vegetable Fritters", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "188", "fat": "10", "protein": "9", "netcarbs": "13", "fibre": "6", "ingredients": [{"t": "1 medium zucchini"}, {"t": "1 carrot"}, {"t": "½ red capsicum"}, {"t": "15 g baby spinach"}, {"t": "2 eggs"}, {"t": "2 tbsp coconut flour"}, {"t": "1 tbsp arrowroot flour"}, {"t": "1 tsp curry powder"}, {"t": "½ tsp garlic powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "2 tsp olive oil"}, {"t": "½ tbsp mint (optional)"}], "steps": [{"t": "Grate the zucchini and wrap it in a clean tea towel. Twist to squeeze out as much moisture as possible."}, {"t": "Grate the carrot, finely dice the capsicum, shred the spinach and chop the mint (if using)."}, {"t": "In a large bowl, combine the zucchini, carrot, capsicum, spinach, eggs, coconut flour, arrowroot flour, curry powder, garlic powder, salt, and pepper. Mix well to combine."}, {"t": "Heat olive oil in a large frying pan over medium heat."}, {"t": "Drop a quarter of the mixture into the pan and flatten slightly to form a fritter. Repeat with the remaining mixture to make 4 fritters, cooking in batches if necessary. Cook each fritter for 2–3 min per side, or until golden and firm."}, {"t": "Serve warm with a side salad, or enjoy as a snack."}], "tips": [{"h": "Ingredient Tips", "t": "Sensitive or intolerant to eggs? Swap the egg to a gluten-free egg replacer and follow the preparation instructions on the product label."}, {"h": "Bec’s Tips", "t": "These fritters can be made ahead and stored in the fridge for up to 3 days."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast", "snacks"], "id": "curried vegetable fritters", "cats": ["Breakfast", "Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Tofu, Mushroom & Bean Stir-fry", "serves": "2", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "457", "fat": "26", "protein": "34", "netcarbs": "17", "fibre": "14", "ingredients": [{"t": "200 g button mushrooms"}, {"t": "2 cloves garlic"}, {"t": "½ red chilli"}, {"t": "300 g firm organic tofu"}, {"t": "¼ cup fresh coriander"}, {"t": "1 tbsp olive oil"}, {"t": "1 tsp minced ginger"}, {"t": "2 tbsp tamari"}, {"t": "2 tbsp oyster sauce, gluten-free"}, {"t": "1 tbsp water"}, {"t": "200 g frozen green beans"}, {"t": "300 g cauliflower rice"}], "steps": [{"t": "Slice the mushrooms, mince the garlic, and finely chop the chilli. Dice tofu into small cubes and chop the coriander."}, {"t": "Heat a large frying pan over high heat and add the olive oil. Add the mushrooms and tofu, cook for 5 minutes, stirring, until the mushrooms release their water and the tofu turns lightly golden."}, {"t": "Add the garlic, ginger, tamari, oyster sauce, chilli, water, and green beans. Stir to combine and cook for 2 minutes, allowing the liquid to reduce, the beans to warm through, and the sauce to thicken slightly."}, {"t": "Meanwhile, heat the cauliflower rice in the microwave."}, {"t": "Divide the cauliflower rice between bowls, top with the stir-fry, and sprinkle with coriander to serve."}], "tips": [{"h": "Ingredient Tips", "t": "I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater. Then, heat in the microwave. Make sure you choose a gluten-free oyster sauce. It can be slightly higher in sugar, but since this recipe only uses 2 tablespoons, it shouldn’t be of any concern when living a sugar free life!"}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "tofu mushroom bean stir fry", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Asparagus & Cheddar Omelette", "serves": "1", "time": "7 min", "time_detail": "2 min prep + 5 min cook", "cal": "211", "fat": "14", "protein": "17", "netcarbs": "1", "fibre": "1", "ingredients": [{"t": "4 asparagus spears"}, {"t": "1 egg"}, {"t": "2 egg whites"}, {"t": "1 tbsp water"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 tsp olive oil"}, {"t": "15 g cheddar cheese"}], "steps": [{"t": "Snap the tough bottom part of the asparagus off and discard."}, {"t": "In a medium bowl, whisk together the egg, egg whites, and water. Season with salt and pepper."}, {"t": "Heat a frying pan over medium heat and cook asparagus stems for 2–3 minutes (until bright green and tender-crisp), then remove from the pan set aside."}, {"t": "Place the pan back on the heat, add the olive oil, pour in the egg mixture, and cook for 1 minute. Using a spatula, gently lift the edges of the omelette and tilt the pan to let any uncooked egg whites run underneath."}, {"t": "Add the cheese and asparagus to one side of the omelette, allow to cook for a further minute, then gently fold the omelette over."}, {"t": "Transfer to a plate and serve."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to change the asparagus to another green vegetable of your choice! Broccolini works really well."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "asparagus cheddar omelette", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Miso Ginger Fish Parcels", "serves": "1", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "310", "fat": "9", "protein": "40", "netcarbs": "10", "fibre": "8", "ingredients": [{"t": "1 tbsp miso paste"}, {"t": "½ tsp rice wine vinegar"}, {"t": "¼ tsp granulated monk fruit"}, {"t": "½ tbsp tamari"}, {"t": "1 tsp sesame oil"}, {"t": "½ carrot"}, {"t": "½ small knob fresh ginger"}, {"t": "¼ medium head broccoli"}, {"t": "2 spring onions"}, {"t": "150 g white fish, skinless"}, {"t": "100 g bok choy"}], "steps": [{"t": "Preheat the oven to 200°C fan-forced / 390°F."}, {"t": "In a small bowl, combine miso paste, rice wine vinegar, monk fruit, tamari, and sesame oil. Taste and adjust if needed."}, {"t": "Cut the carrot and ginger into thin matchsticks. Chop the broccoli into small florets and thinly slice the spring onions."}, {"t": "In a bowl, combine the carrot, ginger, and three- quarters of the spring onion."}, {"t": "Cut a 30 cm square of baking paper and place on a clean surface. Spoon half the carrot mixture into the centre of the paper. Top with the fish and remaining carrot mixture. Drizzle over the miso sauce."}, {"t": "Bring two sides of the paper to the centre and fold twice to seal. Roll up the remaining two sides to enclose. Place the parcel on a baking tray and bake for 12–15 minutes, until the fish is just cooked through. Set aside for 2 minutes to rest."}, {"t": "While the fish is cooking, bring a pot of water to the boil, add the broccoli and bok choy, and cook for 1–2 minutes, until bright green and tender- crisp. Drain well."}, {"t": "Serve the fish parcel with the broccoli and bok choy, sprinkled with the remaining spring onion."}], "tips": [{"h": "Ingredient Tips", "t": "Monk fruit can be swapped to stevia if desired. Red emperor or pink snapper are my fish of choice for this dish, but you can use any firm white fish you like."}], "sources": ["Plan 69 – November 2025 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "miso ginger fish parcels", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Air-Fryer Spiced Chicken Tenders with Zesty Slaw", "serves": "2", "time": "22 min", "time_detail": "10 min prep + 12 min cook", "cal": "402", "fat": "19", "protein": "43", "netcarbs": "7", "fibre": "4", "ingredients": [{"t": "¼ head white cabbage"}, {"t": "1 carrot"}, {"t": "2 tbsp fresh coriander"}, {"t": "1 tbsp sesame seeds"}, {"t": "350 g chicken tenderloins"}, {"t": "1 tbsp olive oil"}, {"t": "1 tsp smoked paprika"}, {"t": "1 tsp onion powder"}, {"t": "½ tsp garlic powder"}, {"t": "½ tsp ground cumin"}, {"t": "¼ tsp ground cayenne pepper"}, {"t": "Pinch salt"}, {"t": "1 tbsp sesame oil"}, {"t": "1 tbsp lime juice"}, {"t": "1 tsp tamari"}, {"t": "1 tsp lime juice"}], "steps": [{"t": "Shred the cabbage, grate the carrot, and chop the coriander. Add to a bowl and toss together."}, {"t": "Into a bowl, add the chicken tenders, olive oil, spices, and salt. Use your hands to rub all over the chicken."}, {"t": "Lightly spray the air-fryer tray and chicken tenders, and air fry at 190°C / 370°F for 10–12 minutes, until cooked through."}, {"t": "In a small bowl, whisk together sesame oil, 1 tbsp lime juice, and tamari. Pour the dressing over the slaw, add the sesame seeds and toss until evenly coated."}, {"t": "Drizzle 1 tsp lime juice over the chicken and serve with the salad on the side."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to add any extra herbs you have on hand from the other recipes in your meal plan — parsley is also a great addition."}, {"h": "Bec’s Tips", "t": "You can also cook the chicken in the oven at 180°C fan- forced / 360°F for 25–30 minutes, or until cooked through."}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["lunch"], "id": "air fryer spiced chicken tenders zesty slaw", "cats": ["Mains"], "tags": ["Chicken", "Air fryer"]}, {"title": "Lemon Muffins", "serves": "12", "time": "45 min", "time_detail": "15 min prep + 30 min cook", "cal": "217", "fat": "17", "protein": "11", "netcarbs": "3", "fibre": "4", "ingredients": [{"t": "3 eggs"}, {"t": "½ cup coconut oil"}, {"t": "½ cup egg whites"}, {"t": "½ cup almond milk, unsweetened"}, {"t": "4 tbsp lemon juice"}, {"t": "1 tbsp lemon zest"}, {"t": "11∕ 3 cup almond meal"}, {"t": "¼ cup coconut flour"}, {"t": "108 g vanilla protein powder"}, {"t": "2 tbsp chia seeds"}, {"t": "¼ cup monk fruit blend"}, {"t": "1 tsp baking powder"}], "steps": [{"t": "Bring the eggs to room temperature. Melt the coconut oil and let it cool to room temperature (this is very important – the coconut oil will cook the eggs if it’s too hot)."}, {"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a 12-hole muffin tin with muffin liners."}, {"t": "Whisk the eggs, egg whites, almond milk, lemon juice, and lemon zest in a large bowl. Set aside."}, {"t": "In a mixing bowl, combine the almond meal, coconut flour, protein powder, chia seeds, monk fruit, and baking powder."}, {"t": "Whisk the cooled coconut oil into the egg mixture."}, {"t": "Pour the dry mixture into the wet mixture and stir to combine."}, {"t": "Divide the mixture evenly between the muffin tins and smooth the top with the back of a spoon."}, {"t": "Bake for 30 minutes or until"}, {"t": "Cool in the tray for 10 minutes, then transfer to a wire rack to cool completely."}], "tips": [{"h": "Ingredient Tips", "t": "The Morlife Plantiful protein powders are my favourite. You can get 15% off by entering the code: checkout. Click here to buy. The monk fruit blend that I use and recommend is the Morlife Monk Fruit + Fibre Sugar Replacer. You can get 15% off at checkout by entering the code: here to buy. Whole Earth and Lakanto are other good options and are available from all major supermarkets. If you’re nut free, swap almond meal to lupin flour."}, {"h": "Bec’s Tips", "t": "Store in an airtight container in the fridge for up to one week or in the freezer for six months. The macros here have been calculated using the Morlife Plantiful Vanilla Fudge protein powder. You could also make this as a cake. Line a 24 cm x 12 cm loaf tin with baking paper and cook for 35-40 minutes, or until a skewer comes out clean."}], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "lemon muffins", "cats": ["Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "Mediterranean Fish Tray Bake", "serves": "1", "time": "30 min", "time_detail": "10 min prep + 20 min cook", "cal": "458", "fat": "25", "protein": "41", "netcarbs": "13", "fibre": "6", "ingredients": [{"t": "1 tbsp olive oil"}, {"t": "½ lemon"}, {"t": "6 cherry tomatoes"}, {"t": "6 Kalamata olives"}, {"t": "¼ red onion"}, {"t": "1 clove garlic"}, {"t": "1 tbsp fresh thyme leaves"}, {"t": "¼ red capsicum"}, {"t": "½ medium zucchini"}, {"t": "½ tsp dried oregano"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "175 g snapper"}, {"t": "30 g baby spinach"}], "steps": [{"t": "Preheat the oven to 200°C fan-forced / 390°F. Line a tray with baking paper."}, {"t": "Cut the lemon into wedges. Halve the cherry tomatoes and olives. Finely chop the red onion, garlic, and thyme. Slice the capsicum into thin strips. Cut the zucchini into half-moons."}, {"t": "In a medium mixing bowl, combine the tomatoes, olives, onion, garlic, thyme, capsicum, zucchini, and dried oregano. Add a small pinch of salt and pepper and the olive oil. Mix well to coat."}, {"t": "Using paper towel, pat the snapper dry and season both sides with salt and pepper. Transfer the snapper to the baking dish and squeeze over half the lemon. Spoon the vegetable mixture over the fish."}, {"t": "Bake for 15–18 minutes, depending on the thickness of the fish, or until cooked through and flaky."}, {"t": "To serve, place the baby spinach on a plate and top with the fish and the baked vegetables. Add a squeeze of extra lemon juice, if desired."}], "tips": [], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "mediterranean fish tray bake", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Bruschetta", "serves": "1", "time": "5 min", "time_detail": "5 min prep + 0 min cook", "cal": "388", "fat": "25", "protein": "18", "netcarbs": "10", "fibre": "13", "ingredients": [{"t": "1 tomato"}, {"t": "1 tbsp fresh basil"}, {"t": "1 clove garlic"}, {"t": "1 tbsp olive oil"}, {"t": "2 tsp balsamic vinegar"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "2 slices Venerdi paleo (super seeded) bread"}, {"t": "20 g feta cheese, reduced-fat"}], "steps": [{"t": "Finely dice the tomato and shred the basil leaves. Cut the garlic clove in half (no need to peel)."}, {"t": "In a bowl, mix the chopped tomato with basil, olive oil, and balsamic vinegar. Season to taste."}, {"t": "Toast the bread. While still hot, rub one side of the toast lightly with the garlic."}, {"t": "Place toast on a serving plate and top with the tomato mixture."}, {"t": "Crumble the feta over the top, and enjoy."}], "tips": [{"h": "Ingredient Tips", "t": "Can't find Venerdi Bread? You can make my bread recipe (Bec’s Bread). Feel free to add a sprinkle of dried chilli flakes. To make this dairy free, swap feta for ¼ medium avocado."}], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "bruschetta", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Moroccan Stuffed Eggplants", "serves": "2", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "506", "fat": "34", "protein": "31", "netcarbs": "16", "fibre": "9", "ingredients": [{"h": "For The Stuffed Eggplants"}, {"t": "2 small eggplants"}, {"t": "¾ tsp salt"}, {"t": "1½ tbsp olive oil"}, {"t": "½ medium brown onion"}, {"t": "1 clove garlic"}, {"t": "1 tbsp mint"}, {"t": "½ tsp ground coriander"}, {"t": "½ tsp ground cumin"}, {"t": "½ tsp allspice"}, {"t": "250 g beef mince, lean (10% fat)"}, {"t": "1 tbsp lemon zest"}, {"h": "For The Yoghurt Sauce"}, {"t": "1 clove garlic"}, {"t": "¼ cup plain Greek yoghurt"}, {"t": "2 tbsp lemon juice"}, {"t": "¼ tsp ground cumin"}, {"t": "¼ tsp ground coriander"}, {"t": "Pinch salt"}, {"h": "To Serve"}, {"t": "1½ tbsp pistachios"}, {"t": "1½ tbsp pine nuts"}, {"t": "¼ cup pomegranate arils"}], "steps": [{"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a tray with baking paper."}, {"t": "Slice the eggplants in half lengthways. Gently scoop out the flesh, leaving a 4 cm border around the edge and base. Roughly dice the scooped out flesh."}, {"t": "Sprinkle the eggplant halves with salt and brush with 1 tbsp of the olive oil. Place on a baking tray and roast for 30 minutes, or until cooked."}, {"t": "Finely dice the brown onion and garlic. Chop the mint."}, {"t": "Heat a large frying pan over medium-high heat. Add the remaining olive oil, then add the diced onion and diced eggplant flesh. Cook for 3 minutes. Add the garlic, ground coriander, ground cumin, and allspice. Cook for a further 2 minutes."}, {"t": "Add the beef mince. Break it up with a spatula and cook for about 5 minutes or until cooked through. Season with salt, then stir in the lemon zest and mint. Set aside."}, {"t": "To make yoghurt sauce, mince the garlic and add to a small bowl with the remaining ingredients. Mix well to combine and set aside."}, {"t": "Once the eggplants are cooked, remove from the oven and transfer to serving plates. Fill each eggplant with the warm mince mixture."}, {"t": "Spoon the yoghurt sauce over the stuffed eggplants. Garnish with pistachios, pine nuts, and pomegranate arils."}], "tips": [{"h": "Ingredients Tips", "t": "The cooking time of your eggplants may vary depending on the size. Make sure they are well cooked before adding your filling."}, {"h": "Bec's Tips", "t": "The pomegranate arils are a delicious addition, however if you can’t find them, feel free to leave them out!"}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "moroccan stuffed eggplants", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Green Goddess Salad with BBQ Pork", "serves": "2", "time": "25 min", "time_detail": "15 min prep + 10 min cook", "cal": "471", "fat": "27", "protein": "43", "netcarbs": "5", "fibre": "9", "ingredients": [{"h": "For The Bbq Pork"}, {"t": "1 tbsp olive oil"}, {"t": "1 tbsp tamari"}, {"t": "1 tsp smoked paprika"}, {"t": "½ tsp ground cumin"}, {"t": "½ tsp garlic powder"}, {"t": "¼ tsp chilli powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "300 g lean pork tenderloin"}, {"h": "For The Green Goddess Dressing"}, {"t": "½ cup loosely packed fresh herbs (mix of parsley, mint, and basil)"}, {"t": "¼ medium avocado"}, {"t": "2 tbsp lemon juice"}, {"t": "2 tbsp plain Greek yoghurt"}, {"t": "1 tbsp olive oil"}, {"t": "1 tbsp mayonnaise*"}, {"t": "½ tsp garlic powder"}, {"t": "Pinch salt"}, {"h": "For The Salad"}, {"t": "½ head white cabbage"}, {"t": "½ continental cucumber"}, {"t": "½ small red onion"}, {"t": "½ cup fresh mint leaves"}, {"t": "1 tbsp pumpkin seeds"}], "steps": [{"t": "Preheat BBQ or grill pan to medium-high heat."}, {"t": "Make the marinade: In a small bowl, combine the olive oil, tamari, smoked paprika, cumin, garlic powder, chilli powder, salt, and a generous season of pepper. Brush all over the pork."}, {"t": "Grill for 4–5 minutes per side, or until cooked through. Remove from heat, allow to rest 5 minutes, then slice thinly."}, {"t": "To make the Green Goddess dressing, blend all ingredients together until smooth and creamy."}, {"t": "Finely shred the cabbage, slice the cucumber into ribbons, and slice the red onion and mint leaves. Add to a large bowl and top with the pumpkin seeds. Toss to combine."}, {"t": "Add half of the Green Goddess dressing and toss again."}, {"t": "Divide the salad between serving bowls, top with sliced BBQ pork, and spoon extra dressing over the top."}], "tips": [{"h": "Ingredient Tips", "t": "If you are egg free, be sure to use an egg-free mayonnaise."}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "green goddess salad bbq pork", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Fragrant Coconut Fish with Coriander", "serves": "2", "time": "20 min", "time_detail": "5 min prep + 15 min cook", "cal": "415", "fat": "22", "protein": "36", "netcarbs": "14", "fibre": "8", "ingredients": [{"t": "½ medium brown onion"}, {"t": "1 fresh chilli"}, {"t": "2 cloves garlic"}, {"t": "1 small knob fresh ginger"}, {"t": "½ cup fresh coriander"}, {"t": "1 bunch bok choy"}, {"t": "400 g snapper"}, {"t": "½ tsp ground turmeric"}, {"t": "2 tbsp curry powder"}, {"t": "Pinch salt"}, {"t": "2 tsp olive oil"}, {"t": "135 ml canned coconut cream, light"}, {"t": "2 tbsp lime juice"}, {"t": "300 g cauliflower rice"}], "steps": [{"t": "Finely dice the onion, chilli, and garlic. Grate the ginger and chop the coriander. Trim the base of the bok choy."}, {"t": "Pat the fish dry, then rub with the turmeric, curry powder, and salt."}, {"t": "Heat the olive oil in a frying pan over low heat. Add the onion, chilli, garlic, and ginger. Cook gently for about 5 minutes, avoiding browning."}, {"t": "Stir in the coconut cream, then add the fish. Bring to a gentle simmer."}, {"t": "Cook uncovered for 4 minutes."}, {"t": "While the fish is simmering, heat the cauliflower rice and steam the bok choy."}, {"t": "Turn the fish over and cook for another 3–4 minutes or until just cooked through. Stir in lime juice and coriander."}, {"t": "Divide the fish between bowls and serve with the cauliflower rice and bok choy. Season with extra chilli, salt, and pepper, if desired."}], "tips": [{"h": "Ingredient Tips", "t": "I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater. Then, heat in the microwave. Red emperor or pink snapper are my fish of choice for this dish. For extra flavour, add a splash of coconut aminos or tamari. Feel free to swap bok choy to any other green veggie, broccoli works really well! Feel free to add any extra herbs you have on hand from the other recipes in your meal plan — basil or mint are also great additions."}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "fragrant coconut fish coriander", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Chocolate Banana Mug Cake", "serves": "1", "time": "3 min", "time_detail": "1 min prep + 2 min cook", "cal": "276", "fat": "18", "protein": "11", "netcarbs": "13", "fibre": "5", "ingredients": [{"t": "1 tsp butter"}, {"t": "1∕ 3 medium banana"}, {"t": "2 tbsp almond meal"}, {"t": "1 tsp almond butter"}, {"t": "1 egg white"}, {"t": "¼ tsp baking powder"}, {"t": "Pinch salt"}, {"t": "¼ tsp vanilla extract"}, {"t": "½ tbsp coconut flour"}, {"t": "¼ tsp cinnamon"}, {"t": "1 tbsp cacao powder"}, {"t": "1 tsp monk fruit blend"}, {"h": "To Serve"}, {"t": "2 tbsp coconut yoghurt"}], "steps": [{"t": "Melt the butter in a large microwave-safe mug."}, {"t": "Cut 2 thin slices from the banana and set aside for serving. Mash the remaining banana and mix into the melted butter."}, {"t": "Add the remaining ingredients to the mug and mix well. The batter should be thicker than pancake batter, closer to a dough-like consistency."}, {"t": "Microwave for 90 seconds."}, {"t": "Serve warm with coconut yoghurt and garnish with the 2 slices of banana."}], "tips": [{"h": "Ingredient Tips", "t": "To make this dairy free, swap the butter for equal amounts of coconut oil. Sensitive or intolerant to eggs? Swap the egg white to a gluten-free egg replacer and follow the preparation instructions on the product label. The monk fruit blend that I use and recommend is the Morlife Monk Fruit + Fibre Sugar Replacer. You can get 15% off at checkout by entering the code: here to buy. Whole Earth and Lakanto are other good options and are available from all major supermarkets."}, {"h": "Bec's Tips", "t": "Notice how we are using a banana? This recipe is still a moderately low-carb dish as it is only 1/3 of a banana! Don’t have a microwave? Try cooking the mixture on a pan like a pancake. It’s amazing in a waffle maker too."}], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "chocolate banana mug cake", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Turkish Eggs", "serves": "1", "time": "10 min", "time_detail": "5 min prep + 5 min cook", "cal": "460", "fat": "35", "protein": "22", "netcarbs": "6", "fibre": "9", "ingredients": [{"t": "1 tbsp fresh dill"}, {"t": "1 tbsp fresh mint"}, {"t": "¼ clove garlic"}, {"t": "½ cup plain Greek yoghurt"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "2 eggs"}, {"t": "1 tbsp butter"}, {"t": "¼ tsp smoked paprika"}, {"t": "¼ tsp chilli flakes"}, {"t": "1 slice Venerdi paleo (super seeded) bread"}], "steps": [{"t": "Finely chop the dill and mint. Mince the garlic. Combine the Greek yoghurt, dill, mint, and garlic in a bowl. Season with salt and pepper and set aside."}, {"t": "Fill a pot with water and bring to a boil. Reduce to a gentle simmer, create a vortex and crack in the eggs to poach for 3–5 minutes, or until cooked to your liking. Remove with a slotted spoon and set aside."}, {"t": "Melt the butter in a small saucepan over medium heat. Once bubbling, add the smoked paprika and chilli flakes. Stir, then remove from the heat."}, {"t": "Spread the Greek yoghurt onto a serving plate. Place the eggs on top and drizzle with the spiced butter."}, {"t": "Toast the bread and serve it alongside the poached eggs and spiced yoghurt."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to boil the eggs instead of poaching them, if that’s easier! Can't find Venerdi Bread? You can make my bread recipe (Bec’s Bread Loaf)."}, {"h": "Bec’s Tips", "t": "You only need a touch of garlic to add flavour, so we suggest adding just a small amount and adjusting to taste. Using a microplane makes it easy to incorporate."}], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "turkish eggs", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Bunless Beef Burgers", "serves": "2", "time": "15 min", "time_detail": "10 min prep + 5 min cook", "cal": "479", "fat": "35", "protein": "33", "netcarbs": "4", "fibre": "2", "ingredients": [{"h": "For The Burger Sauce"}, {"t": "3 tbsp mayonnaise"}, {"t": "1½ tbsp Dijon mustard"}, {"t": "2 tsp tomato sauce, sugar-free"}, {"t": "1 tsp apple cider vinegar"}, {"t": "2 tbsp fresh chives"}, {"t": "1 tbsp fresh parsley"}, {"t": "½ tsp garlic powder"}, {"t": "¼ tsp salt"}, {"h": "For The Burger"}, {"t": "½ tomato"}, {"t": "¼ small red onion"}, {"t": "300 g lean beef mince (10% fat)"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "1 tsp olive oil"}, {"t": "2 tsp Dijon mustard"}, {"t": "6 large lettuce leaves"}, {"t": "½ cup alfalfa sprouts"}, {"t": "2 tbsp pickle slices"}], "steps": [{"h": "For The Burger Sauce"}, {"t": "In a bowl, combine the burger sauce ingredients and mix well. Set aside."}, {"h": "For The Burger"}, {"t": "Thinly slice the tomato and red onion."}, {"t": "Season the mince well with salt and pepper. Mix to combine and then shape into 2 patties. Lightly drizzle or spray each patty all over with oil."}, {"t": "Place a non-stick pan over high heat. Add the patties and press them down with a spatula. Flip after one minute, then brush the top of each patty with ½ tsp Dijon mustard. After one more minute, flip again and brush the top of each with another ½ tsp Dijon. Cook for an additional 2 minutes until cooked through."}, {"t": "To wrap the burgers, lay out a sheet of baking paper. Arrange a row of 3 lettuce leaves on the parchment paper, slightly overlapping. Place a burger patty near one edge. Add half of the tomato slices, alfalfa sprouts, red onion, pickles, and a dollop of burger sauce. Starting on one end, wrap the lettuce around the burger as tightly as possible, moving the paper to keep it around the outside. Fold the tops of the paper down to form a “case” for the burger. Repeat with the remaining patty and enjoy immediately."}], "tips": [{"h": "Ingredient Tips", "t": "If you are egg free, be sure to use an egg-free mayonnaise."}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "bunless beef burgers", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "15 min or less"]}, {"title": "Lemon Raspberry Smoothie", "serves": "1", "time": "3 min", "time_detail": "3 min prep + 0 min cook", "cal": "202", "fat": "9", "protein": "6", "netcarbs": "18", "fibre": "11", "ingredients": [{"t": "½ medium banana"}, {"t": "2 tbsp lemon juice"}, {"t": "½ cup raspberries (fresh or frozen)"}, {"t": "1 cup water"}, {"t": "1 tbsp chia seeds"}, {"t": "15 g spinach"}, {"t": "½ tbsp almond butter"}], "steps": [{"t": "Add all the ingredients into a blender and blend until smooth. Add extra water or ice for desired consistency."}], "tips": [{"h": "Ingredient Tips", "t": "For a really cold and creamy texture, freeze the banana before blending! If the berries and banana aren’t frozen, add 5 ice cubes."}], "sources": ["Plan 71 – January 2026", "Plan 71 – January 2026 (Pescatarian)", "Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "lemon raspberry smoothie", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Chicken Parmigiana with Garden Salad", "serves": "1", "time": "50 min", "time_detail": "40 min prep (30 min in fridge)", "cal": "463", "fat": "27", "protein": "41", "netcarbs": "8", "fibre": "6", "ingredients": [{"t": "125 g chicken breast, skinless"}, {"t": "¼ lemon"}, {"t": "½ tbsp fresh rosemary"}, {"t": "½ clove garlic"}, {"t": "2 tbsp mozzarella cheese, reduced fat"}, {"t": "1 egg"}, {"t": "3 tbsp almond meal"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "½ tbsp butter"}, {"t": "¼ cup tomato pasta sauce, sugar free"}, {"t": "3 cherry tomatoes"}, {"t": "½ Lebanese cucumber"}, {"t": "50 g leafy greens"}, {"t": "1 tsp olive oil"}], "steps": [{"t": "Place the chicken between two sheets of baking paper and gently pound to an even thickness."}, {"t": "Zest the lemon then set aside for serving. Chop the rosemary and mince the garlic. Grate the mozzarella cheese."}, {"t": "Crack the egg into a bowl and whisk."}, {"t": "In a second bowl, combine the almond meal, chopped rosemary, lemon zest, half the minced garlic and a generous pinch of salt and pepper."}, {"t": "Dip chicken into the egg, letting the excess drip off. Press the chicken into the almond meal mixture to coat well. If time allows, refrigerate the crumbed chicken for 30 minutes to help it firm up."}, {"t": "Preheat the oven to grill and line a tray with baking paper."}, {"t": "Heat the butter in a large frying pan over medium heat. Cook the chicken for 5–6 minutes per side or until golden and cooked through. Transfer to a plate and cover to keep warm."}, {"t": "Using the same pan, add the remaining garlic and sauté for 1 minute. Add the tomato passata, salt and pepper. Simmer for a few minutes."}, {"t": "Place the cooked chicken on the lined tray, spoon over a generous amount of the tomato sauce and sprinkle with the mozzarella cheese."}, {"t": "Place under the grill for a few minutes or until the cheese is golden and bubbly."}, {"t": "While the chicken is grilling, halve the cherry tomatoes and slice the cucumber into half- moons. Add to a bowl with the leafy greens. Drizzle with the olive oil, a squeeze of lemon juice, and a pinch of salt and pepper."}, {"t": "Serve the chicken alongside the garden salad."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to use any other fresh herbs you have, such as oregano or basil. You can also use dried herbs if preferred."}], "sources": ["Plan 71 – January 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner"], "id": "chicken parmigiana garden salad", "cats": ["Mains"], "tags": ["Chicken"]}, {"title": "Tuna Nicoise Salad", "serves": "2", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "409", "fat": "29", "protein": "27", "netcarbs": "8", "fibre": "6", "ingredients": [{"h": "For The Dressing"}, {"t": "½ clove garlic"}, {"t": "2 tbsp fresh parsley"}, {"t": "½ tbsp Dijon mustard"}, {"t": "1 tbsp lemon juice"}, {"t": "1½ tbsp olive oil"}, {"t": "1 tbsp mayonnaise*"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Salad"}, {"t": "2 eggs"}, {"t": "60 g green beans"}, {"t": "4 cups lettuce"}, {"t": "½ tbsp olive oil"}, {"t": "2 small radishes"}, {"t": "12 cherry tomatoes"}, {"t": "8 black olives"}, {"t": "190 g tuna in spring water"}], "steps": [{"h": "For The Dressing"}, {"t": "In a food processor or Nutribullet, add garlic, parsley, Dijon mustard, lemon juice, and olive oil. Blitz briefly, then add mayo and blitz again until creamy. Season with salt and pepper."}, {"h": "For The Salad"}, {"t": "Gently boil eggs until yolks are just set (about 5–8 minutes), or until cooked to your liking."}, {"t": "Remove the eggs from the boiling water and cool them in cold water. Peel, cut into quarters, and set aside."}, {"t": "Trim the green beans and add to a pot of boiling water. Cook for about 2 minutes, until bright green and tender-crisp. Remove and run under cold water to stop the cooking process."}, {"t": "Tear lettuce into bite-sized pieces into a large bowl and drizzle with olive oil."}, {"t": "Thinly slice radishes, halve cherry tomatoes, and roughly chop the beans and olives."}, {"t": "Add vegetables to the bowl along with the lettuce, and top with the egg quarters."}, {"t": "Drain tuna, break apart with a fork, and scatter into the bowl."}, {"t": "Drizzle over the dressing and gently toss to combine."}, {"t": "Divide between serving bowls and enjoy."}], "tips": [{"h": "Ingredient Tips", "t": "Choose a can of tuna in springwater, and ensure the liquid is drained before adding to your salad."}], "sources": ["Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "tuna nicoise salad", "cats": ["Mains"], "tags": ["Fish & seafood", "15 min or less"]}, {"title": "Vegetarian Moroccan Stuffed Eggplants", "serves": "2", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "443", "fat": "29", "protein": "24", "netcarbs": "17", "fibre": "14", "ingredients": [{"h": "For The Stuffed Eggplants"}, {"t": "2 small eggplants"}, {"t": "¾ tsp salt"}, {"t": "1½ tbsp olive oil"}, {"t": "½ medium brown onion"}, {"t": "1 clove garlic"}, {"t": "1 tbsp fresh mint"}, {"t": "200 g firm organic tofu*"}, {"t": "140 g mushrooms"}, {"t": "½ tsp ground coriander"}, {"t": "½ tsp ground cumin"}, {"t": "½ tsp allspice"}, {"t": "1 tbsp lemon zest"}, {"h": "For The Yoghurt Sauce"}, {"t": "1 clove garlic"}, {"t": "¼ cup plain Greek yoghurt*"}, {"t": "2 tbsp lemon juice"}, {"t": "½ tsp ground cumin"}, {"t": "½ tsp ground coriander"}, {"t": "Pinch salt"}, {"h": "To Serve"}, {"t": "1½ tbsp pistachios"}, {"t": "1½ tbsp pine nuts"}, {"t": "¼ cup pomegranate arils"}], "steps": [{"h": "For The Stuffed Eggplants"}, {"t": "Preheat the oven to 180°C fan-forced / 360°F. Line a tray with baking paper."}, {"t": "Slice the eggplants in half lengthways. Gently scoop out the flesh, leaving a 4 cm border around the edge and base. Roughly dice the scooped out flesh."}, {"t": "Sprinkle the eggplant halves with salt and brush with 1 tbsp of the olive oil. Place on a baking tray and roast for 30 minutes, or until cooked."}, {"t": "Finely dice the onion and garlic. Chop the mint. Dice the tofu and mushrooms."}, {"t": "Heat a large frying pan over medium-high heat. Add the remaining olive oil, then add the diced onion, tofu, mushroom, and eggplant flesh. Cook for 3 minutes. Add the garlic, coriander, cumin, and allspice. Cook for a further 5–8 minutes, or until the liquid has reduced. Season with salt, then stir in the lemon zest and mint. Set aside."}, {"t": "Once the eggplants are cooked, remove from the oven and transfer to serving plates. Fill each eggplant with the warm tofu mixture."}, {"h": "For The Yoghurt Sauce"}, {"t": "Mince the garlic and add to a small bowl with the remaining ingredients. Mix well to combine."}, {"h": "To Serve"}, {"t": "Spoon the yoghurt sauce over the stuffed eggplants. Garnish with pistachios, pine nuts, and pomegranate arils."}], "tips": [{"h": "Ingredients Tips", "t": "The cooking time of your eggplants may vary depending on the size. Make sure they are well cooked before adding your filling."}, {"h": "Bec's Tips", "t": "The pomegranate arils are a delicious addition, however if you can’t find them, feel free to leave them out!"}], "sources": ["Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "vegetarian moroccan stuffed eggplants", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "Salmon & Zucchini Fish Cakes", "serves": "2", "time": "45 min", "time_detail": "25 min prep (including 15 min", "cal": "452", "fat": "27", "protein": "39", "netcarbs": "6", "fibre": "5", "ingredients": [{"h": "For The Salmon & Zucchini Cakes"}, {"t": "300 g salmon fillets, skinless"}, {"t": "2 small zucchini (225 g)"}, {"t": "2 tbsp fresh dill"}, {"t": "1 tbsp fresh parsley"}, {"t": "1 spring onion"}, {"t": "1 egg"}, {"t": "3 tbsp almond meal"}, {"t": "2 tsp Dijon mustard"}, {"t": "1 tsp lemon zest"}, {"t": "2 tsp lemon juice"}, {"t": "Pinch salt"}, {"t": "2 tsp olive oil"}, {"h": "For The Salad"}, {"t": "1 small beetroot"}, {"t": "8 cherry tomatoes"}, {"t": "40 g rocket"}, {"t": "30 g baby spinach"}, {"t": "½ tsp sesame seeds"}, {"t": "1½ tbsp lemon juice"}, {"t": "2 tsp olive oil"}], "steps": [{"h": "For The Salmon & Zucchini Cakes"}, {"t": "Preheat the oven to 160°C fan-forced / 320°F. Line a baking tray with baking paper."}, {"t": "Add the salmon to the baking tray and bake for about 8–10 minutes, or until just cooked through. Alternatively, cook in an air fryer at the same temperature for 8 minutes."}, {"t": "Cool slightly, then flake the salmon into chunks with a fork."}, {"t": "Grate the zucchini and wrap it in a clean tea towel. Twist to squeeze out as much moisture as possible. (This will help ensure the cakes stick together!)"}, {"t": "Finely chop the dill and parsley, and thinly slice the spring onion."}, {"t": "In a large bowl, combine the flaked salmon, zucchini, dill, parsley, and spring onion. Add the egg, almond meal, mustard, lemon zest, lemon juice, and salt. Mix gently until just combined."}, {"t": "Divide into 4 portions, and press each into a firm patty. Chill for 15–20 minutes in the fridge, to help them firm up."}, {"t": "Heat the olive oil in a frying pan over medium heat."}, {"t": "Cook the patties for 3–4 minutes per side, until golden brown and heated through."}, {"h": "For The Salad"}, {"t": "Grate the beetroot and halve the cherry tomatoes."}, {"t": "Add the rocket, spinach, beetroot, cherry tomatoes, and sesame seeds to a bowl."}, {"t": "Whisk together the olive oil and lemon juice in a small bowl and pour over the salad. Toss well to combine."}, {"t": "Divide the salad between plates and serve with two patties each."}], "tips": [{"h": "Ingredient Tips", "t": "Sensitive or intolerant to eggs? Swap the egg to a gluten-free egg replacer and follow the preparation instructions on the product label. Feel free to swap the fresh salmon to canned salmon. Choose one in springwater, and ensure the liquid is very well drained before adding to the mixture."}, {"h": "Bec's Tips", "t": "Don’t want to make fritters? Double the recipe and turn it into a slice! Bake at 180°C fan- forced / 360°F in a casserole or baking dish for 40–60 minutes (checking after 40 minutes) then freeze in portions."}], "sources": ["Plan 71 – January 2026 (Pescatarian)", "Plan 81 – November 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "salmon zucchini fish cakes", "cats": ["Mains"], "tags": ["Fish & seafood", "Air fryer"]}, {"title": "Red Curry Cauliflower Fried Rice", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "313", "fat": "19", "protein": "11", "netcarbs": "21", "fibre": "10", "ingredients": [{"t": "1 knob fresh ginger"}, {"t": "1½ cloves garlic"}, {"t": "½ bunch spring onions"}, {"t": "½ cup fresh coriander"}, {"t": "¼ medium head broccoli"}, {"t": "200 g firm organic tofu"}, {"t": "½ medium carrot"}, {"t": "½ red capsicum"}, {"t": "2 tsp coconut oil"}, {"t": "2 tbsp Thai red curry paste"}, {"t": "140 ml canned coconut cream, light"}, {"t": "2 tbsp tamari"}, {"t": "1½ tbsp white wine vinegar"}, {"t": "400 g cauliflower rice"}], "steps": [{"t": "Grate the ginger and crush the garlic. Chop the spring onions and coriander. Cut the broccoli into small florets."}, {"t": "Dice the tofu, carrot, and red capsicum into evenly sized cubes."}, {"t": "Heat a frying pan over medium heat and add the coconut oil."}, {"t": "Add the tofu and cook for a few minutes, stirring so it browns evenly on all sides."}, {"t": "Add the curry paste, garlic, ginger, and carrot and cook for 1 minute, stirring."}, {"t": "Add the capsicum and broccoli and cook, stirring continuously, until the vegetables begin to soften."}, {"t": "Stir in the coconut cream, tamari, vinegar, and cauliflower rice (defrosted, if you’re using frozen) and cook until heated through."}, {"t": "Divide between bowls and serve topped with spring onions and coriander."}], "tips": [{"h": "Ingredient Tips", "t": "I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater. Then, heat in the microwave."}], "sources": ["Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "red curry cauliflower fried rice", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian"]}, {"title": "BBQ Prawn & Veggie Skewers and Garden Salad", "serves": "2", "time": "45 min", "time_detail": "35 min prep + 10 min cook", "cal": "486", "fat": "27", "protein": "41", "netcarbs": "14", "fibre": "8", "ingredients": [{"h": "For The Skewers"}, {"t": "6 x Bamboo skewers"}, {"t": "300 g prawns, raw and peeled"}, {"t": "1 red onion"}, {"t": "1 zucchini"}, {"t": "250 g cherry tomatoes"}, {"h": "For The Marinade"}, {"t": "1 lime"}, {"t": "2 cloves garlic"}, {"t": "1 tbsp fresh coriander"}, {"t": "1 tsp pure honey"}, {"t": "2 tbsp olive oil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Garden Salad"}, {"t": "150 g leafy greens"}, {"t": "10 cherry tomatoes"}, {"t": "½ cucumber"}, {"t": "1½ tsp olive oil"}, {"t": "1 tsp dijon mustard"}, {"t": "1 tsp white wine vinegar"}], "steps": [{"t": "Soak the bamboo skewers in water while you prepare everything to prevent them from burning on the BBQ."}, {"t": "Zest and juice the lime, crush the garlic, and chop the coriander. Whisk all marinade ingredients in a bowl and set aside ¼ for glazing."}, {"t": "Add prawns to the remaining marinade and marinate for at least 30 minutes."}, {"t": "Cut onion and zucchini into pieces similar in size to the prawns to ensure even cooking."}, {"t": "Thread skewers with zucchini, prawn, onion, and a cherry tomato. Place on a flat plate or dish."}, {"t": "Heat BBQ to medium-high. Cook skewers for 2–4 minutes per side (watch closely to avoid overcooking), brushing with reserved marinade."}, {"t": "Chop the cherry tomatoes and cucumber, and add to a bowl with the leafy greens."}, {"t": "Whisk together the salad dressing ingredients and toss through the salad."}, {"t": "To serve, squeeze fresh lime juice over prawn skewers and sprinkle with coriander."}], "tips": [{"h": "Bec’s Tips", "t": "This is a fantastic recipe to bring to any get together with family or friends. A perfect meal to cook outside on the BBQ during the hot summer nights. This recipe reheats really well so you can double the recipe for lunch the next day."}], "sources": ["Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "bbq prawn veggie skewers garden salad", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Thai Spiced Baked Snapper and Coconut Cauli Rice", "serves": "1", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "333", "fat": "15", "protein": "37", "netcarbs": "9", "fibre": "6", "ingredients": [{"t": "1 tsp Thai red curry paste"}, {"t": "¾ tbsp tamari"}, {"t": "1 tsp fish sauce"}, {"t": "½ tbsp lime juice"}, {"t": "150 g snapper"}, {"t": "2 tbsp fresh coriander"}, {"t": "1 tbsp mint leaves"}, {"t": "1 lime wedge"}, {"t": "¼ medium head broccoli"}, {"t": "½ tsp coconut oil"}, {"t": "150 g cauliflower rice"}, {"t": "Pinch salt"}, {"t": "½ tbsp butter"}, {"t": "1 tbsp canned coconut cream"}], "steps": [{"t": "Preheat the oven to 200°C fan-forced / 390°F and line a baking tray with baking paper."}, {"t": "In a small bowl, mix together the Thai red curry paste, tamari, fish sauce, and lime juice until smooth. Taste and adjust to your preference."}, {"t": "Place the snapper fillet onto the prepared tray and spread the marinade evenly over both sides."}, {"t": "Bake in the oven for 8–10 minutes, depending on the thickness of the fillet."}, {"t": "While the fish is cooking, finely chop the fresh coriander and mint leaves, cut the lime into wedges and broccoli into florets."}, {"t": "Heat a large pan over medium heat. Add the coconut oil and melt, then add the cauliflower rice and salt. Cook for 3–4 minutes, stirring occasionally. Stir in the butter until melted, then add the coconut cream and 1 tbsp coriander and mix to combine."}, {"t": "Steam the broccoli under just tender."}, {"t": "Remove the fish from the oven and serve with the cauliflower rice and broccoli. Top with the remaining coriander and a wedge of lime."}], "tips": [{"h": "Ingredient Tips", "t": "Red emperor or pink snapper are my fish of choice for this dish but you can use any firm white fish you like. I use pre-made bags of frozen cauliflower rice, but you can make your own if you like! Chop a cauliflower into pieces, throw it into a food processor, and blend until it resembles rice. Be careful not to over-process. Or you can simply grate it with a regular grater. Then, heat in the microwave."}], "sources": ["Plan 71 – January 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "thai spiced baked snapper coconut cauli rice", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Vietnamese Chicken Salad", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "465", "fat": "25", "protein": "43", "netcarbs": "4", "fibre": "7", "ingredients": [{"h": "For The Dressing"}, {"t": "2 tbsp lime juice"}, {"t": "2 tbsp fish sauce"}, {"t": "1 fresh red chilli"}, {"t": "½ tbsp golden monk fruit blend"}, {"h": "For The Chicken Salad"}, {"t": "300 g chicken breast, skinless"}, {"t": "2 tbsp olive oil"}, {"t": "½ head wombok"}, {"t": "1 medium carrot"}, {"t": "½ cup fresh mint"}, {"t": "½ cup fresh coriander"}, {"t": "¼ cup roasted peanuts"}], "steps": [{"h": "For The Dressing"}, {"t": "Finely chop the chilli and then whisk together all of the dressing ingredients. Set aside."}, {"h": "For The Chicken Salad"}, {"t": "Heat a frying pan over medium-high heat. Rub the chicken with olive oil and cook for 5–8 minutes each side, until cooked through. Remove from the pan, shred, and set aside."}, {"t": "While the chicken is cooking, finely shred the wombok cabbage and cut the carrot into matchsticks. Roughly chop the mint, coriander, and peanuts."}, {"t": "To serve, place the shredded chicken, vegetables, and herbs into a bowl and toss to combine. Drizzle over the dressing and toss again. Divide between bowls and top with chopped peanuts."}], "tips": [{"h": "Ingredient Tips", "t": "The red chilli is optional, so if you aren’t keen on some heat, leave it out. To make this nut free, leave out the peanuts."}, {"h": "Bec’s Tips", "t": "I like to use golden monk fruit in this recipe as it tastes similar to brown sugar and helps balance the flavours."}], "sources": ["Plan 72 – February 2026"], "kind": "plan", "pesc_plan": false, "slots": ["lunch"], "id": "vietnamese chicken salad", "cats": ["Mains"], "tags": ["Chicken"]}, {"title": "Raspberry & Chia Slice", "serves": "9", "time": "180 min", "time_detail": "12 min prep + 48 min cook", "cal": "218", "fat": "18", "protein": "4", "netcarbs": "2", "fibre": "8", "ingredients": [{"h": "For The Base"}, {"t": "3 tbsp coconut oil"}, {"t": "½ cup coconut flour"}, {"t": "½ cup almond meal"}, {"t": "¼ cup monk fruit blend"}, {"t": "Pinch salt (optional)"}, {"h": "For The Raspberry Filling"}, {"t": "400 g frozen raspberries"}, {"t": "¼ cup monk fruit blend"}, {"t": "1 tbsp lemon juice"}, {"t": "2 tbsp coconut oil"}, {"t": "2 tsp arrowroot flour"}, {"t": "2 tbsp water"}, {"t": "2 tbsp chia seeds"}, {"h": "For The Topping"}, {"t": "½ cup desiccated coconut, unsweetened"}, {"t": "2 tbsp almond meal"}, {"t": "1 tbsp monk fruit blend"}, {"t": "½ tbsp coconut oil"}, {"t": "1 tbsp freeze-dried raspberries (optional)"}], "steps": [{"h": "For The Base"}, {"t": "Preheat oven to 175°C fan-forced / 350°F and line a 20 x 20 cm baking tin with baking paper."}, {"t": "Melt the coconut oil in a small microwave-safe bowl."}, {"t": "In a bowl, combine the coconut flour, almond meal, monk fruit and salt. Add the melted coconut oil and mix to form a dough."}, {"t": "Press the dough into the prepared tin and bake for 8–10 minutes, or until the edges are slightly golden. Remove from the oven and set aside."}, {"h": "For The Raspberry Filling"}, {"t": "Add the frozen raspberries, monk fruit, lemon juice, and coconut oil to a saucepan over medium heat."}, {"t": "Cook for 5–7 minutes, until the berries break down."}, {"t": "In a separate bowl, mix the arrowroot flour with 1 tsp water to create a slurry. Add the slurry to the saucepan along with 2 tbsp water, and stir it in. Cook for 1 minute to thicken."}, {"t": "Remove from heat and stir in the chia seeds."}, {"t": "Let the mixture stand for 5–10 minutes, it should thicken into a jam-like consistency. Spread the warm filling evenly over the baked base."}, {"h": "For The Topping"}, {"t": "Combine the desiccated coconut, almond meal, and monk fruit in a bowl. Add coconut oil and mix well using the back of a spoon."}, {"t": "Sprinkle the topping over the raspberry filling and return to the oven for 15–20 minutes, until lightly golden and the filling looks set around the edges to lightly brown (keep a close eye on it so the top doesn’t burn)."}, {"t": "Remove from the oven and allow to cool completely in the tin, before refrigerating for 2–3 hours (or overnight). Sprinkle with freeze- dried raspberries and slice into 9 pieces."}], "tips": [{"h": "Ingredient Tips", "t": "Whole Earth and Lakanto make good monk fruit blends and are available from all major supermarkets. If you are looking to boost your fibre intake even more, I love using the Morlife Monk Fruit + Fibre Sugar Replacer. You can get 15% off at checkout by entering the code: HEALTHWITHBEC Click here to buy. Butter can replace coconut oil in each layer."}, {"h": "Bec’s Tips", "t": "Store in the fridge for up to 5 days or in the freezer for up to 3 months."}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "raspberry chia slice", "cats": ["Snacks & sweets"], "tags": ["Vegetarian"]}, {"title": "One-Pot Garlic & Lemon Prawns with Spinach", "serves": "1", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "418", "fat": "26", "protein": "44", "netcarbs": "1", "fibre": "4", "ingredients": [{"t": "150 g prawns, raw and peeled"}, {"t": "½ tbsp fresh parsley"}, {"t": "2 cloves garlic"}, {"t": "1½ tbsp olive oil"}, {"t": "300 g baby spinach"}, {"t": "Pinch salt"}, {"t": "½ tbsp lemon juice"}, {"t": "¼ tsp chilli flakes (optional)"}, {"t": "1 tsp lemon zest"}], "steps": [{"t": "Devein the prawns. Finely chop the parsley and slice the garlic."}, {"t": "Heat ½ tbsp of olive oil in a large pot over medium heat. Add half the garlic and cook for 1 min or until slightly browned."}, {"t": "Add the spinach and salt, toss to coat. Cook, stirring occasionally, for 3–5 min until mostly wilted. Remove from the heat, stir through the lemon juice, then transfer to a bowl and keep warm."}, {"t": "Increase the heat to medium-high. Add the remaining olive oil and garlic to the pot, cook for 1–2 min until starting to brown."}, {"t": "Add the prawns, chilli flakes (if using) and a pinch of salt. Cook, stirring, for 3–5 min or until the prawns are just cooked through."}, {"t": "Spoon the spinach into a bowl, top with the prawns, and sprinkle with lemon zest and parsley."}], "tips": [{"h": "Ingredient Tips", "t": "Feel free to add extra chilli flakes if you like!"}, {"h": "Bec’s Tips", "t": "This is a dinner party show stopper! You could double or triple the recipe and serve half portions as an entrée."}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "one pot garlic lemon prawns spinach", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Mango Chia Parfait", "serves": "2", "time": "10 min", "time_detail": "10 min prep + overnight", "cal": "301", "fat": "17", "protein": "16", "netcarbs": "11", "fibre": "9", "ingredients": [{"h": "For The Chia Parfait"}, {"t": "150ml canned coconut milk, light"}, {"t": "36 g vanilla protein powder"}, {"t": "3 tbsp chia seeds"}, {"t": "2 tsp monk fruit blend"}, {"t": "¼ cup water"}, {"h": "For The Mango Layer"}, {"t": "1½ cups frozen mango"}, {"t": "2 tsp monk fruit blend"}, {"t": "1 tsp lime juice"}, {"h": "To Serve"}, {"t": "¼ cup coconut yoghurt"}, {"t": "10 blueberries"}, {"t": "1 tbsp toasted coconut flakes"}, {"t": "Mint leaves"}], "steps": [{"h": "For The Chia Parfait"}, {"t": "In a jar or bowl, whisk all the ingredients together. Rest for a few minutes then whisk or stir to break up any clumps that may have formed."}, {"t": "Refrigerate for at least 2–3 hours (or overnight), until thick and a pudding-like consistency."}, {"h": "For The Mango Layer"}, {"t": "Defrost the mango, then mash with a fork, keeping some chunky texture. Stir in the monk fruit and lime juice."}, {"t": "Spoon the chia mixture into the bottom of two glasses or jars. Add a thick layer of the mango mixture on top."}, {"h": "To Serve"}, {"t": "Top with the coconut yoghurt, blueberries, toasted coconut flakes, and garnish with mint. Enjoy chilled."}], "tips": [{"h": "Ingredient Tips", "t": "The Morlife Plantiful protein powders are my favourite. You can get 15% off at checkout by entering the code:"}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "mango chia parfait", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Hummus & Veggie Sticks", "serves": "3", "time": "5 min", "time_detail": "5 min prep + 0 min cook", "cal": "202", "fat": "12", "protein": "7", "netcarbs": "9", "fibre": "6", "ingredients": [{"t": "3 medium carrots"}, {"t": "3 Lebanese cucumber"}, {"t": "¾ cup hummus"}], "steps": [{"t": "Peel the carrots. Cut both the carrots and cucumbers into sticks."}, {"t": "Serve with hummus."}], "tips": [], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["snacks"], "id": "hummus veggie sticks", "cats": ["Snacks & sweets"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Pork & Zucchini Fritters", "serves": "2", "time": "20 min", "time_detail": "10 min prep + 10 min cook", "cal": "460", "fat": "24", "protein": "47", "netcarbs": "10", "fibre": "6", "ingredients": [{"h": "For The Fritters"}, {"t": "2 tbsp fresh parsley"}, {"t": "1 tbsp fresh dill"}, {"t": "1 small zucchini"}, {"t": "1 egg"}, {"t": "1 tsp onion powder"}, {"t": "1 tsp garlic powder"}, {"t": "350 g pork mince, lean (5% fat)"}, {"t": "½ tsp ground paprika"}, {"t": "3 tbsp almond meal"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "Olive oil spray"}, {"h": "For The Salad"}, {"t": "½ medium lebanese cucumber"}, {"t": "75 g cherry tomatoes"}, {"t": "¼ red onion"}, {"t": "1 tbsp fresh dill"}, {"t": "¼ cup Greek yoghurt"}, {"t": "½ tsp garlic powder"}, {"t": "¼ tsp onion powder"}, {"t": "1 tbsp lemon juice"}, {"t": "½ tsp lemon zest"}, {"t": "½ tsp Dijon mustard"}, {"t": "1 tsp olive oil"}, {"t": "80 g rocket leaves"}], "steps": [{"h": "For The Fritters"}, {"t": "Finely chop the parsley and dill and grate the zucchini. Wrap the grated zucchini in a clean tea towel, and twist to squeeze out as much moisture as possible."}, {"t": "In a large bowl, add all the fritter ingredients (except the olive oil) and mix thoroughly."}, {"t": "Form the mixture into 6–8 fritters, pressing firmly to flatten."}, {"t": "Lightly spray the air-fry basket and each fritter with olive oil. Place the fritters into the basket and cook at 190°C fan-forced / 370°F for 8–10 minutes, flipping halfway, until golden and crisp on the edges."}, {"h": "For The Salad"}, {"t": "Slice the cucumber into half moons, halve the tomatoes, very finely slice the red onion, and chop the dill."}, {"t": "In a large bowl, add the yoghurt, garlic powder, onion powder, lemon juice and lemon zest, mustard, dill, and olive oil. Taste and season with salt and pepper, if needed. Add in the rocket, cucumber, tomatoes, and red onion to the bowl and mix."}, {"t": "To serve, divide the fritters and salad between plates."}], "tips": [{"h": "Ingredient Tips", "t": "Sensitive or intolerant to eggs? Swap the egg to a gluten-free egg replacer and follow the preparation instructions on the product label. Don’t like pork? Feel free to use chicken mince instead."}, {"h": "Bec’s Tips", "t": "You can also cook the fritters in a frying pan. Heat 1 tablespoon of olive oil over medium heat, add the fritters and fry for 6 minutes, per side, until crispy and golden and cooked through. I use the Crumble Air Fryer. I love it because it’s made from toxin-free materials, unlike many others on the market. Click here to buy. Spraying oil over your fritters helps to distribute a small amount of oil evenly. I recommend using a refillable oil sprayer bottle rather than an aerosol cooking oil."}], "sources": ["Plan 72 – February 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "pork zucchini fritters", "cats": ["Mains"], "tags": ["Beef, pork & lamb", "Air fryer"]}, {"title": "Mediterranean Lemon & Herb Air-Fried Tofu Salad", "serves": "2", "time": "50 min", "time_detail": "15 min prep + 15 min cook", "cal": "506", "fat": "32", "protein": "35", "netcarbs": "2", "fibre": "17", "ingredients": [{"h": "For The Marinated Tofu"}, {"t": "400 g firm organic tofu"}, {"t": "1 tbsp olive oil"}, {"t": "1 tbsp lemon juice"}, {"t": "1 tsp lemon zest"}, {"t": "1 tsp dried oregano"}, {"t": "½ tsp garlic powder"}, {"t": "½ tsp onion powder"}, {"t": "½ tsp ground paprika"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"h": "For The Salad"}, {"t": "75 g cherry tomatoes"}, {"t": "30 g kalamata olives"}, {"t": "1 Lebanese cucumber"}, {"t": "½ small red onion"}, {"t": "½ cup fresh parsley"}, {"t": "½ cup fresh mint"}, {"t": "2 cups leafy greens"}, {"h": "For The Dressing"}, {"t": "1½ tbsp olive oil"}, {"t": "1 tbsp lemon juice"}, {"t": "½ tsp Dijon mustard"}, {"t": "¼ tsp dried oregano"}], "steps": [{"h": "For The Marinated Tofu"}, {"t": "Pat the tofu dry with paper towel and cut into bite- sized cubes."}, {"t": "In a bowl, whisk together the olive oil, lemon juice, lemon zest, oregano, garlic powder, onion powder, paprika, salt, and pepper."}, {"t": "Add the tofu to the marinade and gently toss to coat. Cover and marinate in the fridge for at least 20 minutes, or up to a few hours for best flavour."}, {"t": "Arrange the tofu in a single layer on an air-fryer rack or basket."}, {"t": "Air fry at 180°C fan-forced / 360°F for 10–14 minutes, shaking halfway, until golden and lightly crisp."}, {"h": "For The Salad"}, {"t": "Halve the cherry tomatoes and olives. Slice the cucumber and thinly slice the red onion. Finely chop the parsley and mint."}, {"t": "Add the leafy greens, cucumber, tomatoes, onion, and olives to a large bowl and toss gently."}, {"h": "For The Dressing"}, {"t": "In a small bowl, whisk together the olive oil, lemon juice, Dijon mustard, and oregano."}, {"t": "Drizzle the dressing over the salad and toss to coat."}, {"t": "Divide the salad between two bowls, top with the air-fried tofu, and sprinkle with the parsley and mint to serve."}], "tips": [{"h": "Bec’s Tips", "t": "I use the Crumble Air Fryer. I love it because it’s made from toxin-free materials, unlike many others on the market. Click here to buy."}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner", "lunch"], "id": "mediterranean lemon herb air fried tofu salad", "cats": ["Mains"], "tags": ["Tofu", "Vegetarian", "Air fryer"]}, {"title": "Chicken Nourish Bowl", "serves": "2", "time": "40 min", "time_detail": "10 min prep + 30 min cook", "cal": "485", "fat": "21", "protein": "45", "netcarbs": "17", "fibre": "10", "ingredients": [{"t": "½ medium head broccoli"}, {"t": "2 medium carrots"}, {"t": "300 g butternut pumpkin"}, {"t": "350 g chicken tenderloins"}, {"t": "1 tsp fresh rosemary"}, {"t": "1 tsp garlic powder"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "Olive oil spray"}, {"t": "200 g leafy greens"}, {"t": "2 tbsp hummus"}, {"t": "1 tsp Mingle Everything but the Bagel Seasoning"}, {"t": "2 lemon wedges"}], "steps": [{"t": "Preheat the air fryer to 190°C fan-forced / 370°F."}, {"t": "Cut broccoli into florets and carrots into sticks. Cut pumpkin and chicken into bite-sized chunks. Remove the rosemary leaves from the stems, and chop."}, {"t": "Add the pumpkin and carrot into a large bowl. Add half of the garlic powder, season with salt and pepper. Lightly spray with olive oil and toss to coat."}, {"t": "Into a separate bowl, add the chicken and season with the rosemary, remaining garlic powder, salt, and pepper. Lightly spray with olive oil and toss to coat."}, {"t": "Lightly spray the air-fryer basket with olive oil, add the pumpkin and carrot, and cook for 12–15 min."}, {"t": "Remove the basket, give it a shake, add the chicken to the pumpkin and carrot, and cook for a further 3–5 min."}, {"t": "Lightly spray the broccoli with olive oil. Remove the basket, give it another good shake, and then add in the broccoli. Cook everything for a further 10 min, or until the chicken is just cooked through and the vegetables are tender and lightly caramelised."}, {"t": "To serve, divide the leafy greens, chicken, and veggies between bowls. Top with the hummus, sprinkle over the Mingle seasoning, and squeeze over the lemon juice."}], "tips": [{"h": "Ingredient Tips", "t": "You can find Mingle Everything but the Bagel Seasoning at most Coles and Woolworths. If you’re shopping on the Mingle website, you can get 20% off all products by entering the code: HEALTHWITHBEC Click here to buy."}, {"h": "Bec's Tips", "t": "You can also cook the vegetables in the oven at 190°C fan-forced / 370°F for 35 minutes, adding the chicken halfway through. I use the Crumble Air Fryer. I love it because it’s made from toxin-free materials, unlike many other air fryers. Click here to buy. I recommend using a refillable oil sprayer bottle to evenly distribute the olive oil rather than an aerosol cooking oil."}], "sources": ["Plan 72 – February 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "chicken nourish bowl", "cats": ["Mains"], "tags": ["Chicken", "Air fryer"]}, {"title": "Coconut Muffin with Cottage Cheese & Tomato", "serves": "1", "time": "4 min", "time_detail": "2 min prep + 2 min cook", "cal": "258", "fat": "19", "protein": "15", "netcarbs": "6", "fibre": "3", "ingredients": [{"t": "1 tbsp butter"}, {"t": "1 tbsp coconut flour"}, {"t": "1 egg"}, {"t": "¼ tsp baking powder"}, {"t": "Pinch salt"}, {"t": "2 slices tomato"}, {"t": "60 g cottage cheese, reduced fat"}], "steps": [{"t": "Melt the butter in a large microwave-safe mug."}, {"t": "Allow the melted butter to cool slightly, then add th e coconut flour, egg, baking powder, and salt. Mix well."}, {"t": "Microwave on high for 90 seconds, it should rise and puff up while cooking, then slightly deflate."}, {"t": "Let the muffin cool slightly, then gently loosen the edges with a knife and turn out onto a plate."}, {"t": "Slice in half horizontally and top with the tomato and cottage cheese."}], "tips": [{"h": "Ingredient Tips", "t": "Sensitive or intolerant to eggs? Swap the egg to a gluten-free egg replacer and follow the preparation instructions on the product label."}, {"h": "Bec’s Tips", "t": "Don’t have a microwave? Try cooking the mixture in a pan like a pancake. It’s also amazing cooked in a waffle maker!"}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "coconut muffin cottage cheese tomato", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Bacon & Eggs on Toast", "serves": "1", "time": "10 min", "time_detail": "3 min prep + 7 min cook", "cal": "431", "fat": "32", "protein": "22", "netcarbs": "6", "fibre": "8", "ingredients": [{"t": "2 eggs"}, {"t": "26 g bacon, trimmed"}, {"t": "1 slice Venerdi paleo, super seeded bread"}, {"t": "¼ medium avocado"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Heat a pan over medium heat and cook the bacon until crisp."}, {"t": "While the bacon is cooking, bring a saucepan of water to a simmer over medium heat. Crack one egg into a small bowl. Gently create a whirlpool in the water, and then add the egg to the water. Repeat with the second egg. Poach for 3–4 minutes, until cooked to your liking. Gently remove the eggs."}, {"t": "Toast the bread and slice the avocado."}, {"t": "Serve the toast with bacon, poached eggs and avocado, then season with salt and pepper."}], "tips": [], "sources": ["Plan 72 – February 2026"], "kind": "plan", "pesc_plan": false, "slots": ["breakfast"], "id": "bacon eggs on toast", "cats": ["Breakfast"], "tags": ["Beef, pork & lamb", "15 min or less"]}, {"title": "Cheesy Stuffed Capsicums", "serves": "2", "time": "45 min", "time_detail": "10 min prep + 35 min cook", "cal": "492", "fat": "30", "protein": "37", "netcarbs": "15", "fibre": "8", "ingredients": [{"t": "½ small red onion"}, {"t": "2 cloves garlic"}, {"t": "70 g button mushrooms"}, {"t": "110 g green beans"}, {"t": "2 red capsicums"}, {"t": "1 tbsp olive oil"}, {"t": "250 g beef mince, lean (10% fat)"}, {"t": "1 tsp dried thyme"}, {"t": "1 tsp dried oregano"}, {"t": "½ cup canned crushed tomatoes"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "56 g cheddar cheese, grated"}], "steps": [{"t": "Preheat oven to 180°C fan-forced / 360°F. Line a baking dish with baking paper."}, {"t": "Finely dice the onion and crush the garlic. Slice the mushrooms, top and tail the beans."}, {"t": "Cut the tops off the capsicums, slice in half lengthways and remove the seeds. Set aside."}, {"t": "Heat the oil in a medium frying pan over medium heat. Add the onion and garlic and cook for 3–4 minutes until soft and translucent."}, {"t": "Add the beef mince and cook, breaking it up with a spoon, until browned."}, {"t": "Add the mushrooms, dried herbs, and canned tomatoes. Stir well, reduce heat to low and simmer for 15 minutes, stirring occasionally, until thickened."}, {"t": "Spoon the beef mixture into the capsicum halves, pressing it in firmly. Arrange in the prepared baking dish."}, {"t": "Season lightly with salt and pepper, then sprinkle with the cheddar cheese."}, {"t": "Bake for 20 minutes, or until the capsicums are tender and the cheese is melted and golden."}, {"t": "Meanwhile, steam the green beans for 7 minutes until just tender."}, {"t": "Serve the stuffed capsicums with the green beans."}], "tips": [{"h": "Ingredient Tips", "t": "You can easily change up the flavours – add chilli, cumin, and coriander for a Mexican- style filling, or curry powder for an Indian-inspired version. Feel free to use fresh oregano and thyme instead or add other herbs you have on hand – basil would also be a great addition."}, {"h": "Bec’s Tips", "t": "This is a great recipe for the whole family to enjoy. For ideas on how to add to this recipe to suit your family’s needs, please refer to the ‘Adapt to your partner and kids guide’. You can also cook these in the air-fryer at 160°C fan-forced / 320°F for 14-16 minutes. I use the Crumble Air Fryer. I love it because it’s made from toxin-free materials, unlike many other air fryers. Click 34 here to buy."}], "sources": ["Plan 72 – February 2026"], "kind": "plan", "pesc_plan": false, "slots": ["dinner", "lunch"], "id": "cheesy stuffed capsicums", "cats": ["Mains"], "tags": ["Beef, pork & lamb"]}, {"title": "Orange & Cardamon Pancakes", "serves": "1", "time": "15 min", "time_detail": "5 min prep + 10 min cook", "cal": "372", "fat": "29", "protein": "17", "netcarbs": "8", "fibre": "7", "ingredients": [{"h": "For The Pancakes"}, {"t": "1 tsp orange zest"}, {"t": "1 egg"}, {"t": "1 egg white"}, {"t": "¼ cup almond milk, unsweetened"}, {"t": "½ tsp ground cinnamon"}, {"t": "¼ tsp baking powder"}, {"t": "1 tbsp coconut flour"}, {"t": "¼ cup almond meal"}, {"t": "1 tsp monk fruit blend"}, {"t": "Pinch ground cardamom"}, {"t": "1 tsp coconut oil"}, {"h": "For The Orange Syrup"}, {"t": "2 tbsp orange juice"}, {"t": "¼ tsp monk fruit blend"}, {"t": "¼ tsp ground cinnamon"}, {"h": "To Serve"}, {"t": "2 tbsp coconut yoghurt"}], "steps": [{"t": "In a bowl or blender, add all the pancake ingredients (except for the coconut oil) and blend or whisk until smooth."}, {"t": "Set the batter aside for 5 minutes to thicken slightly. The batter should be smooth and slightly runny – if it feels too thick, add a splash more almond milk."}, {"t": "Heat the coconut oil in a large frying pan over medium heat, pour the batter into the pan to form four pancakes. Cook until bubbles form, then flip and cook for a further minute."}, {"t": "Transfer to a plate and cover to keep warm."}, {"t": "To make the orange syrup: Add all the ingredients into a small saucepan, bring to a gentle simmer, and cook for 1–2 minutes, until slightly reduced."}, {"t": "Serve the pancakes topped with the coconut yoghurt, drizzled with the warm orange syrup, and finished with extra orange zest, if desired."}], "tips": [{"h": "Ingredient Tips", "t": "Don’t have cardamom? Use cinnamon instead. Whole Earth and Lakanto make good monk fruit blends and are available from all major supermarkets. If you are looking to boost your fibre intake even more, I love using the Morlife Monk Fruit + Fibre Sugar Replacer. You can get 15% off at checkout by entering the code: HEALTHWITHBEC Click here to buy. Sensitive or intolerant to eggs? Swap the egg and egg white to a gluten-free egg replacer and follow the preparation instructions on the product label. Coconut yoghurt can be swapped to ¼ cup plain Greek yoghurt if tolerated."}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["breakfast"], "id": "orange cardamon pancakes", "cats": ["Breakfast"], "tags": ["Vegetarian", "15 min or less"]}, {"title": "Lemon Salmon Pocket with Asparagus", "serves": "1", "time": "25 min", "time_detail": "10 min prep + 15 min cook", "cal": "389", "fat": "23", "protein": "38", "netcarbs": "5", "fibre": "4", "ingredients": [{"t": "5 asparagus spears"}, {"t": "1 clove garlic"}, {"t": "½ tbsp fresh dill"}, {"t": "½ lemon"}, {"t": "½ tbsp butter"}, {"t": "½ tbsp olive oil"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "175 g salmon fillet, skinless"}], "steps": [{"t": "Preheat the oven 180°C fan-forced / 360°F."}, {"t": "Snap the woody ends from the bottom of the asparagus spears. Finely chop the garlic and dill, slice the lemon, and melt the butter."}, {"t": "Place the asparagus in a bowl, drizzle with the olive oil and season with salt and pepper. Toss to coat evenly."}, {"t": "Cut a 30 cm square of baking paper and place it on a clean surface. Sprinkle ½ tsp of the dill down the centre of the paper, then arrange half of the lemon slices on top."}, {"t": "Place the salmon on the lemon, arrange the asparagus alongside, then season with salt and pepper. Drizzle over the melted butter and scatter over the garlic. Top with another ½ teaspoon of dill and the remaining lemon slices."}, {"t": "Bring two opposite sides of the paper to the centre and fold twice to seal. Fold the remaining two sides to enclose. Place the parcel on a baking tray and bake for 12–15 minutes, or until the salmon is just opaque and easily flaked with a fork."}, {"t": "Serve the salmon and asparagus pocket sprinkled with the remaining dill and an extra squeeze of lemon if desired."}], "tips": [{"h": "Ingredient Tips", "t": "Don't like dill? Feel free to use other fresh herbs such as rosemary, parsley, or coriander."}, {"h": "Bec’s Tips", "t": "You can also cook these pockets on the BBQ for the same amount of time."}], "sources": ["Plan 72 – February 2026", "Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["dinner"], "id": "lemon salmon pocket asparagus", "cats": ["Mains"], "tags": ["Fish & seafood"]}, {"title": "Herby Frittata & Simple Rocket Salad", "serves": "2", "time": "16 min", "time_detail": "10 min prep + 6 min cook", "cal": "428", "fat": "35", "protein": "17", "netcarbs": "7", "fibre": "5", "ingredients": [{"h": "For The Frittata"}, {"t": "¼ cup fresh parsley"}, {"t": "¼ cup fresh coriander"}, {"t": "¼ cup fresh dill"}, {"t": "½ medium leek"}, {"t": "2 tbsp pistachios"}, {"t": "4 eggs"}, {"t": "1 tsp turmeric"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}, {"t": "½ tsp baking powder"}, {"t": "1 tbsp whole linseeds"}, {"t": "1½ tbsp olive oil"}, {"t": "4 tbsp coconut yoghurt"}, {"h": "For The Salad"}, {"t": "2 cup rocket"}, {"t": "2 tsp olive oil"}, {"t": "2 tsp white wine vinegar"}, {"t": "Pinch salt"}, {"t": "Pinch pepper"}], "steps": [{"t": "Finely chop the parsley, coriander, and dill, and thinly slice the leek. Combine into a large bowl."}, {"t": "Roughly chop the pistachios."}, {"t": "In a separate bowl, whisk the eggs. Add to the herb mixture along with half of the pistachios. Add the turmeric, salt, pepper, baking powder, and linseeds. Stir until well combined."}, {"t": "Heat the oil in a non-stick frying pan over low heat. Pour in the egg mixture and spread evenly."}, {"t": "Cover with a lid and cook for 3–5 min, until mostly set. Carefully flip the frittata and cook for a further 2 min, or until cooked through. Remove from the heat."}, {"t": "To prepare the salad, place the rocket, olive oil, white wine vinegar, salt, and pepper into a bowl and toss to combine."}, {"t": "Divide the frittata and salad between two plates. Top the frittata with the coconut yoghurt and remaining pistachios."}], "tips": [{"h": "Ingredient Tips", "t": "Coconut yoghurt can be swapped to ¼ cup plain Greek yoghurt if tolerated. To make this nut free, swap the pistachios for 1 tbsp pumpkin seeds."}, {"h": "Bec’s Tips", "t": "This frittata is great served warm or cold."}], "sources": ["Plan 72 – February 2026 (Pescatarian)"], "kind": "plan", "pesc_plan": true, "slots": ["lunch"], "id": "herby frittata simple rocket salad", "cats": ["Mains"], "tags": ["Vegetarian"]}, {"title": "Mustard Cruste
